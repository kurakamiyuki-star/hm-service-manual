。屋上では、北の丸公園の景色を前にした挙式もできます。長く受け継がれてきた場所で新しい日を迎える、という意味を大切にしていただける会場です。"},{"label":"②建築・見どころから","text":"こちらの建物は、洋風の外観に和風の瓦屋根をのせた、「帝冠様式」というつくりです。国の登録有形文化財にもなっています。中には、創建当時の姿を復元したパーティ会場があり、やわらかい自然光が入ります。屋上庭園からは、北の丸公園の景色も眺められます。趣のあるエントランスも含めて、建物そのものをお楽しみいただけます。"},{"label":"③お客様の場面から","text":"結婚式の日を思い浮かべてみてください。北の丸公園の四季の景色を正面に、屋上で挙式ができます。公式サイトでは、都内でも希少な屋上挙式とご案内しています。そのあとは、レトロとモダンを組み合わせた会場でパーティです。屋上庭園に面したカフェもあります。景色のなかで始まる一日を、ご家族やご友人と過ごしていただけます。"}],"talk":"こちらは昭和9年に、昭和天皇の即位の礼を記念する事業の一環として建てられた、もとの軍人会館です。洋風の外観に和風の瓦屋根をのせた「帝冠様式」で、国の登録有形文化財にもなっています。昭和の歴史の舞台になり、多くの方が訪れた建物の姿を残しながら、いまは婚礼やパーティ、カフェとして使われています。パーティ会場には、創建時の姿を復元した空間があります。屋上では、北の丸公園の景色を前にした挙式もできます。長く受け継がれてきた場所で新しい日を迎える、という意味を大切にしていただける会場です。","sources":[{"title":"東京 九段会館テラス（公式トップ）","url":"https://www.tokyokudan.com/"},{"title":"東京 九段会館テラス（公式 ABOUT）","url":"https://www.tokyokudan.com/about/"},{"title":"東京 九段会館テラス（公式 ウエディング）","url":"https://www.tokyokudan.com/wedding/"},{"title":"文化遺産オンライン「旧九段会館」","url":"https://online.bunka.go.jp/heritages/detail/457999"},{"title":"VMG HOTELS & UNIQUE VENUES 会場一覧","url":"https://www.vmg.co.jp/venues/"}],"note":"設計者の氏名（競技設計の当選者・実施設計者・監修者）は、取得した公式サイト・文化遺産オンラインの解説には載っておらず、確認できなかったため書いていません。\n文化遺産オンラインの登録年月日は2019年9月10日ですが、Wikipediaには9月11日と書かれており、食い違っています。本文は文化遺産オンラインに従いました。\n戦後の経緯（進駐軍による接収、日本遺族会への貸与）、2011年の東日本大震災での被害と閉館、2022年10月の再開業は、公式サイト・文化遺産オンラインでは確認できず、Wikipedia・報道の要約でのみ見えたため、本文には使っていません。\n公式トップページの所在表記は「九段南1丁目6番5号」、文化遺産オンラインの旧九段会館の所在地は「千代田区九段南一丁目5-1」で、番地が異なります（建て替え後の施設と旧建物の違いと思われますが推測です）。\n保存棟の範囲（北側と東側の2面）や新築棟の規模は、取得できた一次資料では確認できていません。\n公式ページには文化財指定の年月日・登録番号の記載がありません（文化遺産オンラインで確認）。\nルーフトップバルなどの季節営業の期間やプラン内容は変わるため、本文では詳細を書いていません。"},{"id":"kulpe","name":"北野異人館 旧クルペ邸","abbr":"KSG","region":"神戸","district":"北野","group":"レストラン＆パーティ","url":"https://www.vmg.co.jp/venues/kulpe.html","ready":false,"draft":true,"area":"兵庫県神戸市中央区北野町（山本通を東に抜けた先）","summary":"ドイツ人貿易商の私邸だった、一棟貸しの北野の異人館です。","history":"旧クルペ邸は、明治時代に、ドイツ人の貿易商クルペ氏の私邸として建てられた異人館です。神戸では明治の開港後に外国人の住まいが広がり、山手の北野エリアが開かれていきました。神戸市によると、北野町・山本通一帯は、1887年以降から第二次世界大戦前にかけて、200棟以上の洋風・和風の建物が並ぶ雑居地になりました。のちに旧クルペ邸は、「セントジョージジャパン」という格式高い会員制クラブとなり、当時2000名もの会員に親しまれ、多くの賓客をもてなしたと公式サイトに書かれています。築造から100年以上がたち、当時からのアンティークな調度品が残っています。現在は、一棟貸しのゲストハウスとして使われています。","usage":"公式ページでは、一棟貸しのゲストハウスとして、婚礼、パーティ・会議（MICE）、レストランの3つの使い方が紹介されています。婚礼は邸宅を貸し切りにした結婚式で、挙式会場と披露宴会場があります。パーティでは、忘新年会、謝恩会（平日限定）、サマーパーティ、歓送迎会などのプランが案内されています。レストランは完全予約制で、神戸流フレンチを提供しています。木目を基調にした重厚でクラシカルな空間が、いずれの場面でも使われます。","value":"明治時代にドイツ人貿易商の私邸として建てられた異人館です。神戸の北野は、明治の開港後に外国人の住まいが広がり、200棟以上の洋風・和風の建物が並ぶ「雑居地」になりました（神戸市）。のちに会員制クラブ「セントジョージジャパン」となり、築100年以上の建物には当時からの調度品が残ります。所在する北野町山本通は、1980年4月10日に国の重要伝統的建造物群保存地区に選定された、異人館の街並みです。","designation":["重要伝統的建造物群保存地区「北野町山本通」に位置（公式サイトの記述。国選定1980年4月10日）"],"highlights":["木目の壁と深紅のファブリックが重厚","1階大広間に当時特注の椅子とテーブルが残る","サンルームを改修した、光あふれるセレモニースペース","重要伝統的建造物群保存地区・北野にある"],"talks":[{"label":"①歴史・物語から","text":"こちらは明治時代に、ドイツ人の貿易商の私邸として建てられた異人館です。のちに会員制の社交クラブになり、多くのお客様をお迎えしてきました。築100年以上の建物には、当時からの調度品が残っていて、1階の大広間では、特注の椅子とテーブルをご覧いただけます。北野は、国の重要伝統的建造物群保存地区に選ばれている街並みです。一棟まるごと貸し切りで、おふたりとご家族、ご友人だけの時間をお過ごしいただけます。長く人を迎えてきた建物で、大切な日を迎える意味を感じていただけると思います。"},{"label":"②建築・見どころから","text":"入ってまず目に入るのは、木目を基調にした壁と、深紅のファブリックです。重厚で落ち着いた雰囲気の空間です。1階の大広間には、当時特注の椅子とテーブルが残っています。サンルームを改修したセレモニースペースは、光があふれる明るい場所です。アンティークな調度品も残っていて、お部屋ごとに違った表情をご覧いただける建物です。"},{"label":"③お客様の場面から","text":"邸宅をまるごと貸し切って過ごす一日を思い浮かべてみてください。結婚式なら、挙式会場と披露宴会場があります。忘新年会や歓送迎会、サマーパーティなどのパーティにも使えます。レストランは完全予約制で、神戸流のフレンチをお出ししています。一棟貸しなので、周りを気にせず、集まった皆さまだけで過ごしていただけます。"}],"talk":"こちらは明治時代に、ドイツ人の貿易商の私邸として建てられた異人館です。のちに会員制の社交クラブになり、多くのお客様をお迎えしてきました。築100年以上の建物には、当時からの調度品が残っていて、1階の大広間では、特注の椅子とテーブルをご覧いただけます。北野は、国の重要伝統的建造物群保存地区に選ばれている街並みです。一棟まるごと貸し切りで、おふたりとご家族、ご友人だけの時間をお過ごしいただけます。長く人を迎えてきた建物で、大切な日を迎える意味を感じていただけると思います。","sources":[{"title":"北野異人館 旧クルペ邸（VMG 会場ページ）","url":"https://www.vmg.co.jp/venues/kulpe.html"},{"title":"北野異人館 旧クルペ邸（VMG 会場ページ・別URL）","url":"https://www.vmg.co.jp/venues/kulpe/"},{"title":"北野異人館 旧クルペ邸（公式サイト）","url":"https://www.kulpehaus.com/"},{"title":"VMG コラム 北野異人館 旧クルペ邸 セントジョージジャパン","url":"https://www.vmg.co.jp/column/vmguniquevenues/kitanokulpe/"},{"title":"神戸市：北野町・山本通にゆかりの歴史的な建物の魅力","url":"https://www.city.kobe.lg.jp/a21651/kanko/bunka/bunkashisetsu/foreigner/sub1.html"},{"title":"神戸市：重要伝統的建造物群保存地区（北野町山本通）関連ページ","url":"https://www.city.kobe.lg.jp/a21651/kanko/bunka/bunkashisetsu/foreigner/sub5/index.html"}],"note":"築造年が確認できませんでした。公式ページは「明治時代」「築造から100年以上」とのみ書いており、具体的な年や設計者・施工者は載っていません。\nクルペ氏がどんな人物か（名前、経歴、いつ住んだか）は、取得したページに記載がなく確認できませんでした。\n会員制クラブ「セントジョージジャパン」として使われた時期は公式サイトに記載がありません（別の紹介文に「1970年代から」とする記述が検索結果の要約にありましたが、原文を取得できておらず、使っていません）。\n旧クルペ邸そのものの文化財指定（登録有形文化財・神戸市の伝統的建造物の認定など）は、神戸市のページ・公式ページでは確認できませんでした。文化遺産オンラインでの直接検索はできていません。「指定がない」とは断定できません。\n重伝建地区内にあるという点は会社の公式コラムの記載によるもので、神戸市のページでは旧クルペ邸への言及がなく、市側の資料では裏づけられていません。\n公式サイトの『約100年』と、会場ページの『100年以上』で、築年数の言い方がそろっていません。"},{"id":"funatsuru","name":"鮒鶴京都鴨川リゾート","abbr":"FUN","region":"京都","district":"河原町","group":"レストラン＆パーティ","url":"https://www.vmg.co.jp/venues/funatsuru.html","ready":false,"draft":true,"area":"京都府京都市下京区（木屋町通松原上ル美濃屋町）","summary":"鴨川沿いに建つ昭和初期の木造大料亭。登録有形文化財の建物で食事や宴が楽しめます。","history":"鮒鶴は、明治3年（1870年）に川魚業者の田中鶴三郎が仕出し屋を始めたのが起こりです。鮒をよく扱い、「鮒屋の鶴さん」と呼ばれたことが「鮒鶴」の名の由来とされています。のちに現在の木屋町松原に移り、宮大工の上田喜三郎や山本米蔵らの手で大きな建物が建てられました。旧館は昭和2年（1927年）に完成し、昭和8年（1933年）には新館が増築されています。公式サイトでは、当時、京都で随一の規模を誇った料理旅館だったと紹介されています。建物には、日本画家の小村大雲が描いた鯉の天井絵も残っています。その後、平成24年（2012年）に登録有形文化財（建造物）に登録されました。","usage":"現在は「鮒鶴京都鴨川リゾート」として、レストラン＆バンケットを運営しています。バンケットスペースは、GRAND BALL ROOM、GALLERY ROOM、VIP ROOMの3つです。ルーフトップテラスとセレモニースペースもあります。鴨川沿いには、5月から9月末まで鴨川納涼床が設けられます。公式サイトにはウエディングの案内ページもありますが、くわしい内容は施設ページでは確認できていません。","value":"鮒鶴は、明治3年（1870年）に川魚業者が始めた仕出し屋を起こりとする老舗です。現在の建物は昭和初期の木造の大料亭で、文化遺産オンラインは「近代の大規模和風料亭」と説明しています。地下にはアール・デコ意匠のダンスホールがあります。","designation":["鮒鶴本館：登録有形文化財（建造物）（2012年登録）"],"highlights":["鴨川沿いに南北へ連なる、純和風の木造五層楼閣","地下にアールデコ意匠のダンスホールがある","宮大工の折上格天井と、小村大雲の天井絵"],"talks":[{"label":"①歴史・物語から","text":"ここ鮒鶴は、明治3年に川魚業者の田中鶴三郎という方が始めた仕出し屋がはじまりなんです。「鮒屋の鶴さん」と呼ばれたことが、お店の名前の由来だそうですよ。今の建物は昭和の初めに建てられたもので、国の登録有形文化財になっています。鴨川沿いに建つ木造の楼閣で、地下にはアールデコの意匠のダンスホールまであるんです。日本画家の小村大雲が描いた鯉の天井絵も残っています。そうした背景を知ったうえで会場を選んでいただくと、お式やお食事の時間が、より思い出深いものになるのではないでしょうか。"},{"label":"②建築・見どころから","text":"まず天井をご覧ください。宮大工の技が光る格子状の天井があり、日本画家・小村大雲が描いた鯉の天井絵も残っています。鴨川沿いに連なる純和風の木造の楼閣で、地下にはアールデコの意匠のダンスホールがあります。和と洋の見どころを、一つの建物のなかで味わっていただけます。ルーフトップテラスや、セレモニースペースもあります。"},{"label":"③お客様の場面から","text":"初夏の夕方、鴨川を眺めながらお食事をする場面を思い浮かべてみてください。鴨川沿いには、5月から9月末まで納涼床が設けられます。バンケットスペースは、GRAND BALL ROOM、GALLERY ROOM、VIP ROOMの3つで、ルーフトップテラスもあります。お食事やパーティなど、お集まりの規模に合わせて場を選んでいただけます。"}],"talk":"ここ鮒鶴は、明治3年に川魚業者の田中鶴三郎という方が始めた仕出し屋がはじまりなんです。「鮒屋の鶴さん」と呼ばれたことが、お店の名前の由来だそうですよ。今の建物は昭和の初めに建てられたもので、国の登録有形文化財になっています。鴨川沿いに建つ木造の楼閣で、地下にはアールデコの意匠のダンスホールまであるんです。日本画家の小村大雲が描いた鯉の天井絵も残っています。そうした背景を知ったうえで会場を選んでいただくと、お式やお食事の時間が、より思い出深いものになるのではないでしょうか。","sources":[{"title":"鮒鶴京都鴨川リゾート（VMG公式 施設ページ）","url":"https://www.vmg.co.jp/venues/funatsuru.html"},{"title":"鮒鶴本館 - 文化遺産オンライン（文化庁）","url":"https://online.bunka.go.jp/heritages/detail/273043"},{"title":"鮒鶴について 鮒鶴の歴史【鮒鶴 登録有形文化財】","url":"https://www.funatsuru.org/about/history.html"},{"title":"鮒鶴について【鮒鶴 登録有形文化財】","url":"https://www.funatsuru.org/about/"},{"title":"鮒鶴の歴史 【公式】鮒鶴京都鴨川リゾート","url":"https://www.funatsuru.com/wedding/history/"}],"note":"社内資料の「大正11年築」は、取得した公的資料・公式資料のどれでも確認できなかった。文化遺産オンラインは年代を「昭和前／1927頃」、運営側のページは旧館を昭和2年（1927年）竣工としているため、「大正11年築」は採用しなかった。\n鮒鶴公式サイト（funatsuru.com/wedding/history/）の歴史ページは「1920年（昭和2年）頃」と書いており、1920年と昭和2年（1927年）が食い違っている。年号は採用していない。\n登録の年月日が出典で食い違う。文化遺産オンラインは2012年8月13日、運営側の歴史ページは2012年4月21日。本文では「2012年」までとし、日付は書いていない（官報告示日と登録日の違いかは未確認）。\n建物の階数の説明が出典で異なる。文化遺産オンラインは「木造3階一部4階地下1階建」、運営側の歴史ページは「五層四階建て」、運営側のaboutページは「旧館は3階建て、新館は鉄骨造4階建てで実質5階」、VMG公式ページは「木造五層楼閣」。本文では階数を断定していない（highlightsの「五層楼閣」はVMG公式ページの表現）。\n文化遺産オンラインで内容を取得できたのは「鮒鶴本館」のみ。検索一覧に「鮒鶴新館」「鮒鶴南門」の名は出るが詳細は未取得で、新館・南門の指定範囲や登録年は公的資料では確認できていない。新館も登録とする記述は運営側のサイトのみ。\n新館の設計者（柴田四郎）や、旧館の宮大工名（上田喜三郎・山本米蔵）は運営側サイトの記述のみで、公的資料での裏づけは取れていない（設計者名は本文に使っていない。宮大工名は運営側サイトの記述として使用）。\n現在地への移転の時期は、取得した出典に書かれておらず不明。増築の回数も運営側ページ間で「2度」と「3度」に分かれるため、本文には書いていない。\n京都市の国登録有形文化財一覧（city.kyoto.lg.jp の別表PDF）は、PDFを文字として読み取れず、内容を確認できなかった。\n「小村大雲の鯉の天井絵」はVMG公式ページの記述のみで、公的資料での裏づけは取れていない。\n施設ページ上のウエディングの詳細（プラン・内容）は、取得できた範囲では記載がなかったため書いていない。"},{"id":"hillside","name":"ザ・ヒルサイド神戸","abbr":"HRY","region":"神戸","district":"六甲","group":"レストラン＆パーティ","url":"https://www.vmg.co.jp/venues/hillside.html","ready":false,"draft":true,"area":"兵庫県神戸市灘区六甲台町（六甲山のふもとの文教地区）","summary":"安藤忠雄が1986年に設計した、六甲のふもとに建つ光と緑のコンクリート建築です。","history":"ザ・ヒルサイド神戸は、世界的な建築家の安藤忠雄が1986年に設計した建物です。安藤が建築界のノーベル賞といわれるプリツカー賞を受賞する前に手がけた、初期の作品として紹介されています。場所は、六甲山のふもとにある文教地区の神戸市灘区六甲台町です。コンセプトは「光と自然との調和」で、大きなガラスで光を取り込み、外壁には地元で産出される本御影石が使われています。建物の中心にはシンボルツリーの欅の木があり、安藤がその枝ぶりに惚れ込んだといわれています。2024年5月には、この建物でフレンチレストランが開業しました。","usage":"ウエディングの会場として使われています。建物を一棟貸し切りにできるのが特徴です。レストランではモダンフレンチを楽しめます。パーティやMICEにも使われ、展示会や研修会にも対応しています。待合室（ラウンジ）やセレモニースペースもあり、映画上映や演奏の会場になったこともあります。2025年2月には、安藤忠雄の特別講演会とディナーも開かれました。","value":"","designation":[],"highlights":["ガラスとコンクリートで光と緑を取り込む建築","御影石の石垣と、天井が開いたセンターコート","ガラス張りのフライングコリドーを通る動線"],"talks":[{"label":"①歴史・物語から","text":"ここは、世界的な建築家の安藤忠雄さんが1986年に設計した建物なんです。プリツカー賞を受賞する前の、初期の作品として知られています。コンセプトは「光と自然との調和」で、大きなガラスから光が入り、外壁には地元の御影石が使われています。建物の中央には天井が開いたセンターコートがあって、シンボルツリーの欅が、訪れた方を見守るように枝を広げているんですよ。ガラス張りのコリドーを通ってセレモニースペースへ向かう流れも、この建築ならではです。そうした背景を知ったうえで選んでいただくと、お二人の大切な一日が、より特別なものになると思います。"},{"label":"②建築・見どころから","text":"この建物の見どころは、光と緑の取り込み方です。大きなガラスで光を入れ、外壁には地元で産出される本御影石を使っています。中央には、天井が開いたセンターコートがあり、その真ん中にシンボルツリーの木が立っています。ガラス張りの通路を歩いてセレモニースペースへ向かう動線も、この建築ならではです。歩くだけで景色が変わります。"},{"label":"③お客様の場面から","text":"結婚式の日を思い浮かべてみてください。建物を一棟まるごと貸し切れるので、おふたりとゲストの皆さまだけで一日を過ごせます。待合室のラウンジで待ち、セレモニースペースで式を行い、レストランでは、モダンフレンチも楽しめます。式から食事まで、ひとつの建物のなかで過ごせます。パーティや展示会、研修会にも使われています。"}],"talk":"ここは、世界的な建築家の安藤忠雄さんが1986年に設計した建物なんです。プリツカー賞を受賞する前の、初期の作品として知られています。コンセプトは「光と自然との調和」で、大きなガラスから光が入り、外壁には地元の御影石が使われています。建物の中央には天井が開いたセンターコートがあって、シンボルツリーの欅が、訪れた方を見守るように枝を広げているんですよ。ガラス張りのコリドーを通ってセレモニースペースへ向かう流れも、この建築ならではです。そうした背景を知ったうえで選んでいただくと、お二人の大切な一日が、より特別なものになると思います。","sources":[{"title":"ザ・ヒルサイド神戸（VMG公式 施設ページ）","url":"https://www.vmg.co.jp/venues/hillside.html"},{"title":"【安藤忠雄氏 ディナー付き特別講演 2025.2.11】ザ・ヒルサイド神戸にて開催（VMG公式ニュース）","url":"https://www.vmg.co.jp/news/20250211_tadaoando_dinner/"},{"title":"ザ・ヒルサイド神戸（VMG公式コラム）","url":"https://www.vmg.co.jp/column/vmguniquevenues/hillsidekobe/"},{"title":"安藤忠雄氏建築のフレンチレストラン『ザ・ヒルサイド神戸』が5月23日にオープン（kisspress）","url":"https://kisspress.jp/articles/48808/"},{"title":"ザ・ヒルサイド神戸（建築パース）","url":"https://kenchiku-pers.com/photo/the-hillside-kobe/"}],"note":"文化財の指定・登録は、公式ページ・VMG公式記事・報道・予約サイトの検索結果では確認できなかった。文化庁の「国指定文化財等データベース」や文化遺産オンライン、神戸市・兵庫県の一覧での直接の照会は行っていない（要確認）。\nシンボルツリーの種類と樹齢が出典で食い違う。公式施設ページはコンセプト欄で「樹齢120年の欅」、ABOUT欄で「樹齢200年を越える楠」、公式ニュースは「樹齢約130年の欅」。本文では樹齢・樹種の数字を使わず「シンボルツリーの欅の木」とだけ書いたが、樹種も食い違いがあるため要確認。\n1986年が設計の年か、竣工・開業の年かは出典で違う書き方（公式ニュース「デザインした」、kisspress「誕生」、建築パース「施工年」）で、特定できなかった。本文では「1986年に設計した」とした（公式ニュースの表現）。\n建物が建てられた当初の用途、施主、竣工月、その後の変遷は、取得した公開情報に書かれておらず確認できなかった。「何のために建てたか」は書いていない。\n「六甲山のふもとの文教地区」は公式施設ページのみの記述で、公的資料での裏づけは取れていない。\n2024年5月のレストラン開業は報道記事（kisspress）の記述のみ。現在の営業日・提供内容は変わりやすいため書いていない。"},{"id":"akagane","name":"アカガネリゾート京都東山1925","abbr":"AKG","region":"京都","district":"東山","group":"レストラン＆パーティ","url":"https://www.vmg.co.jp/venues/akagane.html","ready":false,"draft":true,"area":"京都府京都市東山区（下河原通高台寺塔之前上る 金園町400-1）","summary":"大正14年に建てられた旧邸宅を受け継ぐ、東山の森の隠れ家です。","history":"アカガネリゾート京都東山1925の前身は、大正14年（1925年）に建てられた旧邸宅です。公式サイトによると、もとは銅加工メーカーのオーナーの私邸で、銅がいたるところに使われていたことから、かつては「アカガネ邸」と呼ばれていました。公式サイトの別の説明では、江戸時代から約250年続く京都の老舗企業の創業者が建てた旧邸宅とされています。京都市の「京を彩る建物や庭園」の一覧でも、大正14年（1925）に建てられた伸銅会社の社長の旧邸宅として紹介されています。昭和初期には洋館が増築され、もとは応接間として使われていました。東山の傾斜をいかした約700坪の敷地に、いくつもの建物が点在しています。設計した人や、持ち主がどのように移り変わったかは、確認できた公開情報には書かれていません。","usage":"公式サイトには、フレンチダイニング「LE UN」、11席限定のシェフズテーブル「高台寺 極 -KIWAMI-」、上林春松本店と組んだカフェ「Salon de KANBAYASHI」が紹介されています。蔵を改修した日本茶カフェラウンジや、望楼棟を開放したアフタヌーンティーもあります。パーティやMICEでは、AKAGANE、HISUI、KIWAMI、望楼棟、貴賓室、蔵、CEREMONY SPACEなどを組み合わせて使えるとされています。挙式は、独立型のセレモニースペースで行えます。","value":"","designation":["京都市「京を彩る建物や庭園」に掲載"],"highlights":["銅（アカガネ）を屋根や雨どいに使った意匠","約700坪の庭園と、東山の森を望む眺め","孔雀の西陣織が天井を飾るシェフズテーブル"],"talks":[{"label":"①歴史・物語から","text":"こちらは、大正14年、1925年に建てられた旧邸宅を受け継いだ会場です。もとは銅加工メーカーのオーナーの私邸で、屋根や雨どいなどに銅がたくさん使われていたため、かつては「アカガネ邸」と呼ばれていました。約700坪の敷地には庭園や蔵、昭和初期に増築された洋館があり、いまはレストランやパーティ、挙式の場として使われています。ただ新しくおしゃれな場所というだけでなく、人の暮らしの記憶が残る建物で大切な日を過ごせるのが、ここを選ぶ意味だと思います。建物の背景を知っていただくと、お料理やお庭の見え方も少し変わるかもしれません。"},{"label":"②建築・見どころから","text":"こちらの見どころは、銅を使った意匠です。屋根や雨どいなどに銅がたくさん使われていたことから、かつては「アカガネ邸」と呼ばれていました。約700坪の敷地には庭園があり、東山の森を望めます。シェフズテーブルは、孔雀の西陣織が天井を飾る空間です。昭和初期に増築された洋館もあり、見て歩くだけでも楽しめます。"},{"label":"③お客様の場面から","text":"お食事の日を思い浮かべてみてください。フレンチダイニングや、11席限定のシェフズテーブルがあります。日本茶のカフェラウンジや、望楼棟でのアフタヌーンティーもあります。パーティや会議では、いくつもの建物を組み合わせて使えます。挙式は、独立した専用のセレモニースペースで行えます。広い敷地のなかで、ゆったりと一日を過ごしていただけます。"}],"talk":"こちらは、大正14年、1925年に建てられた旧邸宅を受け継いだ会場です。もとは銅加工メーカーのオーナーの私邸で、屋根や雨どいなどに銅がたくさん使われていたため、かつては「アカガネ邸」と呼ばれていました。約700坪の敷地には庭園や蔵、昭和初期に増築された洋館があり、いまはレストランやパーティ、挙式の場として使われています。ただ新しくおしゃれな場所というだけでなく、人の暮らしの記憶が残る建物で大切な日を過ごせるのが、ここを選ぶ意味だと思います。建物の背景を知っていただくと、お料理やお庭の見え方も少し変わるかもしれません。","sources":[{"title":"アカガネリゾート京都東山1925（VMG 公式）","url":"https://www.vmg.co.jp/venues/akagane.html"},{"title":"アカガネリゾート京都東山1925（VMG 公式・施設一覧内ページ）","url":"https://www.vmg.co.jp/venues/akagane/"},{"title":"アカガネリゾート京都東山1925（VMG 公式コラム）","url":"https://www.vmg.co.jp/column/vmguniquevenues/akagane/"},{"title":"アカガネリゾート京都東山1925 京都観光Navi（京都市観光協会）","url":"https://ja.kyoto.travel/tourism/single01.php?category_id=4&tourism_id=3083"},{"title":"京都を彩る建物や庭園 東山区（京都市）","url":"https://kyoto-irodoru.city.kyoto.lg.jp/list3.html"},{"title":"国指定文化財等データベース（参考：高台寺表門のページ。アカガネとは無関係と確認）","url":"https://kunishitei.bunka.go.jp/heritage/detail/102/1786"}],"note":"文化財の個別指定・登録は、公的データベースや自治体ページで確認できませんでした（調べた範囲：文化庁データベースの検索結果、京都市「京を彩る建物や庭園」）。\n公式サイトは蔵を「重要伝統建造物にも指定された蔵」と書いていますが、どの制度の何という指定かは確認できませんでした。国の重要伝統的建造物群保存地区（産寧坂など）の範囲に金園町400-1が入るかも確認できていません。\n元の持ち主の呼び方が資料で異なります：公式は「銅加工メーカーのオーナー」「江戸から約250年続く京の老舗企業の創業者」、京都市の一覧は「伸銅会社の社長」。同じ人物か、会社名は何かは確認できませんでした。\n設計者・施工者、洋館の増築の正確な年、現在の運営に至るまでの所有の経緯は、確認できた公開情報にありませんでした。"},{"id":"moore","name":"北野異人館 旧ムーア邸","abbr":"MOO","region":"神戸","district":"北野","group":"レストラン＆パーティ","url":"https://www.vmg.co.jp/venues/kitanomoore.html","ready":false,"draft":true,"area":"兵庫県神戸市中央区北野町（北野異人館街）","summary":"明治31年築の木造洋館で、青いタイルの暖炉が目を引く異人館です。","history":"公式サイトによると、旧ムーア邸は明治31年（1898年）に、同じ北野の異人館「ラインの館」の建築主であるドレウェル夫人によって建てられました。その後、ムーア氏の一族が100年以上にわたり代々住まいとして使い、長いあいだ一般には公開されませんでした。庭には、以前の持ち主が植えたとされるハーブが今も受け継がれています。今も残るサンルームからは、創建当時、神戸港が一望できたと言われています。ほかの公開情報では、北野・山本地区の異人館の中でも早い時期に建てられた館のひとつとされています。2020年には、ウエディングやカフェの場として新しく開かれました。なお、名前に「ムーア」が付いた経緯や、建てられてから100年のあいだの細かな出来事は、確認できた公開情報には書かれていません。","usage":"公式サイトによると、レストラン・カフェラウンジとしてティータイムを楽しめます。老舗フランス料理店「銀座マキシム・ド・パリ」のレシピをもとにした苺のミルフィーユが看板メニューで、2025年4月には8種のスイーツの盛り合わせ「カフェ・グルマン」が登場しました。ハーブに囲まれたテラスのガーデン席もあります。パーティやウエディングでは、家族婚や少人数の食事会、親しい方だけを招く邸宅ウエディングに対応しています。","value":"","designation":["重要伝統的建造物群保存地区「北野町山本通」に位置（公式サイトの記述。国選定1980年4月10日）","伝統的建造物として5番目に登録（公式サイトの記述）"],"highlights":["鮮やかな青タイル張りの暖炉とシャンデリア","創建当時は神戸港が見えたサンルーム","庭に受け継がれるハーブと、苺のミルフィーユ"],"talks":[{"label":"①歴史・物語から","text":"こちらは、明治31年、1898年に建てられた北野の異人館です。ムーア氏の一族が100年以上にわたって住まわれ、長いあいだ一般には公開されていませんでした。下見板張りの白い外観、青いタイルの暖炉、サンルームなど、異人館らしい特徴がそろっています。庭には、以前の持ち主が植えたとされるハーブが今も咲いています。いまはカフェとしてお茶を楽しめるほか、家族や親しい方だけを招く邸宅ウエディングもできます。建物がたどってきた時間を知ったうえで選ぶと、その日の思い出に、この場所の物語が重なると思います。"},{"label":"②建築・見どころから","text":"まず目を引くのは、鮮やかな青いタイルを張った暖炉と、シャンデリアです。サンルームは、創建当時は神戸港が一望できたと言われています。お庭には、以前の持ち主が植えたとされるハーブが、今も受け継がれています。お庭を眺めながら、看板メニューの苺のミルフィーユもいただけます。建物と庭、そしてお菓子まで、ひとつの場所で楽しんでいただけます。"},{"label":"③お客様の場面から","text":"午後のティータイムを思い浮かべてみてください。ハーブに囲まれたテラスのガーデン席で、看板メニューの苺のミルフィーユをいただけます。ご家族や少人数でのお食事会にも合います。親しい方だけをお招きする邸宅ウエディングにも対応しています。大勢で騒ぐのではなく、大切な人たちと静かに過ごす。そんな時間にふさわしい場所です。"}],"talk":"こちらは、明治31年、1898年に建てられた北野の異人館です。ムーア氏の一族が100年以上にわたって住まわれ、長いあいだ一般には公開されていませんでした。下見板張りの白い外観、青いタイルの暖炉、サンルームなど、異人館らしい特徴がそろっています。庭には、以前の持ち主が植えたとされるハーブが今も咲いています。いまはカフェとしてお茶を楽しめるほか、家族や親しい方だけを招く邸宅ウエディングもできます。建物がたどってきた時間を知ったうえで選ぶと、その日の思い出に、この場所の物語が重なると思います。","sources":[{"title":"北野異人館 旧ムーア邸（VMG 公式）","url":"https://www.vmg.co.jp/venues/kitanomoore.html"},{"title":"北野異人館 旧ムーア邸（VMG 公式・施設一覧内ページ）","url":"https://www.vmg.co.jp/venues/kitanomoore/"},{"title":"VMG 運営ベニュー一覧","url":"https://www.vmg.co.jp/venues/"},{"title":"Concept 北野異人館 旧ムーア邸（結婚式場サイト）","url":"https://www.kitanomoore.com/wedding/concept-history/"},{"title":"旧ムーア邸（異人館ネット）","url":"https://www.ijinkan.net/ijinkan/3110"},{"title":"神戸市 北野町山本通 重要伝統的建造物群保存地区（神戸市）","url":"https://www.city.kobe.lg.jp/a21651/kanko/bunka/bunkashisetsu/foreigner/sub5/index.html"},{"title":"神戸市認定伝統的建造物「旧ドレウェル邸（ラインの館）」（神戸市）","url":"https://www.city.kobe.lg.jp/a21651/kanko/bunka/bunkashisetsu/foreigner/sub4.html"},{"title":"邸宅レストラン レイン邸（4travel）","url":"https://4travel.jp/dm_shisetsu/11342447"}],"note":"所在地の番地が資料で異なります：VMG公式は「北野町1-2-17」、異人館ネットは「北野町2丁目9-3」。そのため area は町名までにしました。\n「伝統的建造物として5番目に登録」は、VMG公式と結婚式場サイトの記述です。神戸市のページ（ラインの館のページ、保存地区のページ）や文化庁のデータベースでは、旧ムーア邸の個別の認定を確認できませんでした。登録の年も確認できていません。\n建築年（明治31年）と建築主（ドレウェル夫人）は、VMG公式と結婚式場サイトの記述です。神戸市のページでは、ラインの館（旧ドレウェル邸）は1915年築・北野町2-10-24、建築主はJ.R.ドレウェルで、別の建物です。「ドレウェル」「ドレヴェル」と表記が分かれ、同じ人物かは公的資料で確認できませんでした。設計者も確認できませんでした。\n「旧レイン邸（明治33年築）」との関係は確認できませんでした。VMG公式の旧ムーア邸ページと施設一覧には「レイン邸」の記載がなく（一覧に載るのは旧クルペ邸・旧ムーア邸・旧ハンター邸など）、旧クルペ邸は別施設として載っています。口コミサイト4travelに「邸宅レストラン レイン邸」（北野町2-12-12、明治33年築、閉鎖と記載）があり、旧ムーア邸とは別の場所ですが、VMGとの関係は確認できていません。同じ施設か旧称かは判断できません。\n2020年の開業時期は、異人館ネットが2020年3月、結婚式場サイトは2020年としか書いていません。検索結果の要約には7月とする記述もありましたが、そのページ自体は取得していません。そのため月は書きませんでした。\n「34棟」「200棟以上」という数字は公式サイトの記述で、神戸市のページでは33件の洋風建築と7件の和風建築が認定されているとあり、数え方が異なります。本文には使っていません。"},{"id":"osakacastle","name":"大阪城西の丸庭園 大阪迎賓館","abbr":"OCG","region":"大阪","district":"大阪城","group":"レストラン＆パーティ","url":"https://www.vmg.co.jp/venues/osakacastle.html","ready":false,"draft":true,"area":"大阪府大阪市中央区（大阪城公園内・西の丸庭園）","summary":"大阪城の西の丸庭園にある、二条城の白書院を手本にした純和風の迎賓館です。","history":"大阪城は、1583年に豊臣秀吉が築いた城です。その跡は「大坂城跡」として、国の特別史跡になっています。大阪迎賓館は、この大阪城公園の西の丸庭園の中にあります。西の丸庭園は、1965年（昭和40年）に約6.5haの芝生庭園として開園した庭で、かつて秀吉の正室・北政所の屋敷があった場所とされています。大阪迎賓館は、1995年に大阪で開かれたAPEC首脳会議のために、海外の要人をおもてなしする場として新しく建てられました。京都の二条城にある二の丸御殿の白書院をモデルにした純和風の建築で、APEC大阪の会場になりました。2019年のG20大阪サミットでは、晩餐会の会場にもなっています。","usage":"大阪迎賓館では、大阪近郊の食材を使った正統派のフレンチを楽しめます。なにわの伝統野菜や、近郊のA5ランクの和牛を使った料理が特徴です。空間を貸し切ってのパーティや、会議・イベントにも使われています。婚礼では、ガーデンでのアペリティフや挙式ができます。宴内人前式では、武将の甲冑による「出陣」の演出も行われています。","value":"","designation":["国の特別史跡「大坂城跡」のある大阪城公園内（西の丸庭園）"],"highlights":["二条城の白書院をモデルにした純和風建築","生漆の古色塗りと、銅板の柿葺風の屋根","全席から西の丸庭園の芝生を見わたせる宴会場"],"talks":[{"label":"①歴史・物語から","text":"こちらは、大阪城の西の丸庭園にある大阪迎賓館です。1995年に大阪で開かれたAPECの首脳会議のために、海外の大切なお客様をおもてなしする場所として建てられました。モデルは、京都の二条城にある二の丸御殿の白書院です。木の部分は漆で古びた味わいを出し、天井も二条城の造りを再現しています。大阪城は、豊臣秀吉が築いた城の跡で、国の特別史跡です。そんな場所で結婚式やお食事をすることは、この土地の物語を、ご自身の大切な一日に重ねることでもあります。"},{"label":"②建築・見どころから","text":"まず建物をご覧ください。京都の二条城にある白書院を手本にした、純和風の造りです。木の部分は生漆で古びた味わいを出し、屋根は銅板を使って、木の板で葺いたような雰囲気に仕上げています。天井も二条城の内部の造りを再現しています。宴会場は、どの席からも西の丸庭園の芝生を見わたせます。大阪城公園の中の、静かな和の空間です。"},{"label":"③お客様の場面から","text":"大切な一日を、海外の要人をおもてなしするために建てられた場所で過ごす。それがここで過ごす意味です。結婚式では、ガーデンで食前のお飲み物を楽しんだり、挙式をしたりできます。宴内人前式では、武将の甲冑による「出陣」の演出もあります。お料理は、なにわの伝統野菜や近郊のA5ランクの和牛を使ったフレンチです。"}],"talk":"こちらは、大阪城の西の丸庭園にある大阪迎賓館です。1995年に大阪で開かれたAPECの首脳会議のために、海外の大切なお客様をおもてなしする場所として建てられました。モデルは、京都の二条城にある二の丸御殿の白書院です。木の部分は漆で古びた味わいを出し、天井も二条城の造りを再現しています。大阪城は、豊臣秀吉が築いた城の跡で、国の特別史跡です。そんな場所で結婚式やお食事をすることは、この土地の物語を、ご自身の大切な一日に重ねることでもあります。","sources":[{"title":"大阪城西の丸庭園 大阪迎賓館（VMG公式）","url":"https://www.vmg.co.jp/venues/osakacastle.html"},{"title":"大阪迎賓館 公式サイト（由来紹介ページ）","url":"https://osakacastle.jp/?p=488"},{"title":"大阪城西の丸庭園 大阪迎賓館 公式サイト（トップ）","url":"https://www.osakacastle.jp/?p=2947"},{"title":"大阪城西の丸庭園（大阪観光局 OSAKA-INFO）","url":"https://osaka-info.jp/spot/osaka-castle-nishinomaru-garden/"},{"title":"国指定文化財等データベース：大坂城跡","url":"https://kunishitei.bunka.go.jp/bsys/maindetails/401/1792"},{"title":"大阪府：府内の史跡公園等の紹介【大坂城跡（大阪城公園）】","url":"https://www.pref.osaka.lg.jp/bunkazaihogo/bunkazai/oosakajoukouen.html"},{"title":"大阪迎賓館（Wikipedia・手がかりとして参照）","url":"https://ja.wikipedia.org/wiki/大阪迎賓館"}],"note":"迎賓館の建物の前身：Wikipediaには「取り壊された休憩所の跡地に建てた」とあるが、出典不備の注記つきで、公的資料では確認できなかった。前身は書いていない。\n迎賓館・西の丸庭園の文化財指定：確認できなかった。OSAKA-INFOと公式サイトには指定の記載がない。西の丸庭園・迎賓館が特別史跡「大坂城跡」の指定範囲に入るかは、国指定文化財等データベースの解説文の要旨では判断できなかった。\n完成日・事業費・施工者・施主：大阪府公文書館の広報誌PDFに記載があるとの検索結果があったが、PDF本文を文字として読めず不採用。数字は書いていない。\n桜の本数：VMG公式ページとOSAKA-INFOは約300本、大阪迎賓館公式サイト（?p=2947）は約600本と、食い違う。本文には本数を書いていない。\n北政所の屋敷があった点：VMG公式ページとOSAKA-INFOはどちらも「とされています」という書き方で、公的資料での裏づけは確認できていない。本文でも「とされています」にとどめた。\n2019年のG20大阪サミット晩餐会：VMG公式ページの記述で、公的資料では確認できていない（Wikipediaは出典不備）。\n茶室（豊松庵）の1969年寄贈などの来歴：VMG公式ページのみで裏づけがなく、本文では扱っていない。"},{"id":"kobe","name":"神戸迎賓館 旧西尾邸","abbr":"VIZ","region":"神戸","district":"須磨","group":"レストラン＆パーティ","url":"https://www.vmg.co.jp/venues/kobe.html","ready":false,"draft":true,"area":"兵庫県神戸市須磨区離宮西町（須磨海岸の近く）","summary":"須磨に建つ、大正8年築の洋館と日本庭園をもつ、文化財の邸宅です。","history":"神戸迎賓館 旧西尾邸の建物は、西尾家住宅（旧西尾類蔵邸）です。神戸で活躍した貿易商の西尾類蔵氏の自邸として、1919年（大正8年）に建てられました。設計は、初代通天閣を手がけた建築家の設楽貞雄氏です。大正から昭和初期にかけて、須磨では別荘建築が流行しました。西尾邸も、その時代に建てられた邸宅の一つです。終戦後の1945年（昭和20年）には、GHQに接収されました。阪神・淡路大震災では、周辺の邸宅の多くが倒壊・解体されたと伝えられています。2007年（平成19年）からは、結婚式場・レストランとして活用されています。","usage":"現在は、フランス料理のレストランとして使われています。公式ページでは、VMGの「LE UN」のフラッグシップ店と紹介されています。庭園を望むサロンスペースでは、アフタヌーンティーを楽しめます。婚礼では、大正ロマンをテーマにした「大正ロマンウエディング」ができます。そのほか、バンケットや企業イベントなど、パーティ・MICEにも使われています。敷地には、独立型バンケット「THE VIZCAYA GARDEN」の新館もあります。","value":"","designation":["西尾家住宅：兵庫県指定重要有形文化財（2010年・主屋ほか5棟）","庭園：神戸市指定名勝"],"highlights":["洋館のステンドグラスと、和洋折衷の意匠","書院造の大広間「鳳凰の間」と鳳凰の欄間","池泉回遊式の日本庭園（神戸市指定名勝）"],"talks":[{"label":"①歴史・物語から","text":"こちらは、貿易商の西尾類蔵氏が、1919年、大正8年に建てた邸宅です。設計は、初代通天閣を手がけた設楽貞雄氏です。建物は兵庫県の重要有形文化財、お庭は神戸市の名勝に指定されています。洋館のステンドグラスや、書院造の「鳳凰の間」など、和と洋が出会う意匠が見どころです。終戦後にはGHQの接収も経験し、時代を越えて受け継がれてきました。そんな歴史のある場所で結婚式やお食事をすることは、建物が重ねてきた物語を、ご自身の大切な日に重ねることでもあります。"},{"label":"②建築・見どころから","text":"こちらの見どころは、和と洋が出会う意匠です。洋館にはステンドグラスがあり、書院造の大広間「鳳凰の間」には、鳳凰の欄間があります。そしてお庭は、池のまわりを歩いて楽しめる日本庭園で、神戸市指定の名勝です。窓から庭を眺めるだけでなく、建物と庭を行き来しながら、文化財の邸宅をじっくり味わっていただけます。"},{"label":"③お客様の場面から","text":"大正ロマンの雰囲気の中で、大切な一日を過ごしていただけます。婚礼では「大正ロマンウエディング」ができます。お食事はフランス料理で、公式には「LE UN」のフラッグシップ店と紹介されています。庭園を望むサロンでは、アフタヌーンティーも楽しめます。バンケットや企業イベントなど、パーティにもお使いいただけます。"}],"talk":"こちらは、貿易商の西尾類蔵氏が、1919年、大正8年に建てた邸宅です。設計は、初代通天閣を手がけた設楽貞雄氏です。建物は兵庫県の重要有形文化財、お庭は神戸市の名勝に指定されています。洋館のステンドグラスや、書院造の「鳳凰の間」など、和と洋が出会う意匠が見どころです。終戦後にはGHQの接収も経験し、時代を越えて受け継がれてきました。そんな歴史のある場所で結婚式やお食事をすることは、建物が重ねてきた物語を、ご自身の大切な日に重ねることでもあります。","sources":[{"title":"神戸迎賓館 旧西尾邸（VMG公式）","url":"https://www.vmg.co.jp/venues/kobe.html"},{"title":"西尾家住宅（旧西尾類蔵邸）について（西尾家住宅の公式サイト）","url":"https://www.nishiotei.org/about/"},{"title":"神戸新聞NEXT 連載「わが町の文化財」＜108＞ 県指定・西尾家住宅（神戸市須磨区）","url":"https://www.kobe-np.co.jp/rentoku/bunkazai/201803/0011028509.shtml"},{"title":"神戸歴史遺産：近代建築を訪れる（神戸市）","url":"https://kobe-rekishiisan.city.kobe.lg.jp/visit-architecture/"},{"title":"兵庫県指定文化財（建造物）一覧PDF（兵庫県教育委員会）","url":"https://www.hyogo-c.ed.jp/~shabun-bo/gyouseisituhp/top/23kenshitei.pdf"},{"title":"西尾家住宅（Wikipedia・手がかりとして参照）","url":"https://ja.wikipedia.org/wiki/西尾家住宅"}],"note":"「明治期の邸宅」という社内資料の記述：公的資料では確認できず、各出典は1919年（大正8年）築としている。明治期とは書いていない。社内資料の訂正を要確認。\n県指定の種別の呼び方：VMG公式ページと西尾家住宅公式サイトは「兵庫県指定重要有形文化財」、神戸新聞は「県指定」、Wikipediaは「兵庫県指定有形文化財」と表記が分かれる。兵庫県の一覧PDFは文字が読めず、種別の見出しまでは確認できなかった。指定年月日は、PDFの行から平成22年3月19日と読めるが、名称欄は判読できていない。\n神戸市指定の年：西尾家住宅公式サイトに、神戸市指定有形文化財（1999年）と神戸市名勝庭園（2006年）とあるが、神戸市の公式ページでは確認できなかった。本文には年を書かず、「神戸市指定名勝」（VMG公式ページの表記）のみ書いた。\n敷地面積：VMG公式ページに「1万坪」と「約1万㎡」の両方があり大きく食い違う。本文には書いていない。\n所在地の表記：VMG公式ページは須磨区離宮西町2-4-1、Wikipediaは離宮西町2-4-9と、序文では離宮前町としていて揺れがある。本文は「須磨区離宮西町」までにした。\n建築様式：セセッション様式はVMG公式ページの記述のみ。神戸新聞は「大正モダニズム」に触れるだけで様式名の分類はしていない。本文では『公式ページでは』と断って書いた。\n阪神・淡路大震災：VMG公式ページは「震災も経験した」とするが、この邸宅自体の被害状況はどの出典にも書かれていない。本文は周辺邸宅の状況（西尾家住宅公式サイト）のみ。\nGHQ接収：VMG公式ページと西尾家住宅公式サイトの記述で、公的資料では確認できていない。\n構造（煉瓦造など）はWikipediaのみの記述のため、本文では扱っていない。"},{"id":"higaki","name":"京都御苑 中立売御門 檜垣","abbr":"KYG","region":"京都","district":"京都御苑","group":"レストラン＆パーティ","url":"https://nakadachiuri.jp/restaurant/","ready":false,"draft":true,"area":"京都府京都市上京区 京都御苑内（中立売御門の北側、中立売休憩所内）","summary":"京都御苑の中立売休憩所にある、和食とお茶のレストランです。","history":"檜垣がある京都御苑は、江戸時代には140以上の宮家や公家の屋敷が並ぶ「公家町」でした。1869年（明治2年）の東京遷幸のあと公家町は荒れましたが、1877年（明治10年）に京都府へ御所の保存が命じられ、屋敷の撤去や石垣の工事、植樹などの「大内保存事業」が進み、1883年（明治16年）に完了しました。1947年（昭和22年）には閣議決定で「国民公園」となり、現在は環境省が管理しています。檜垣が入る中立売休憩所は、中立売地区の再整備のなかで古い休憩所が2018年10月に閉店し、新しい休憩所として2019年1月9日に営業を始めました。檜垣の名前での営業は、運営会社の発表で、2026年5月1日の和食ランチ開始が確認できます。","usage":"檜垣は、無料で使える中立売休憩所の中にあるレストランです。運営会社の発表では、2026年5月1日に和食ランチで始まり、7月1日から朝食、7月18日から夜のビアテラスが加わり、8月1日からは土日限定・完全予約制の会席コースが始まるとされています。コンセプトは「御苑にひらく、日本文化のショーケース」です。メニューの考え方は「御苑リトリート」で、近隣の方や観光客が心身を整える「第三の居場所」と位置づけ、京都の伝統食材を使った和食の御膳や、洋の技法を取り入れたプレート、スイーツを用意しています。宇治茶と珈琲の老舗・株式会社放香堂と協業し、抹茶や珈琲の喫茶メニューもあります。","value":"檜垣が入る中立売休憩所は2019年に開店した新しい施設で、古い建物そのものを使っているという記載は見つかりません。歴史的価値は、場所の歴史にあります。京都御苑は、かつて140以上の宮家・公家の屋敷が並んだ「公家町」のあとで、明治の「大内保存事業」を経て整えられ、1947年に国民公園となりました。","designation":["京都御苑：国民公園（1947年・環境省管理）"],"highlights":["京都御苑の木々に囲まれた「森の休憩所」の中にあります","東側のテラス席から京都御所を眺められます","宇治茶と珈琲の老舗・放香堂と協業した喫茶メニュー"],"talks":[{"label":"①歴史・物語から","text":"こちらは京都御苑の中にある「檜垣」です。御苑は、江戸時代には140以上の宮家や公家のお屋敷が並ぶ公家町でした。明治になってお屋敷が取り除かれ、公園として整えられて、戦後の1947年に国民公園になっています。檜垣は、その御苑の中立売休憩所に入っているレストランです。コンセプトは「御苑にひらく、日本文化のショーケース」。京都の食材を使った和食の御膳や、宇治茶と珈琲の老舗・放香堂さんと一緒につくる抹茶や珈琲のメニューがあります。休憩所の東側のテラス席からは、京都御所が見えます。木々に囲まれた静かな場所で、ひと息ついていただければうれしいです。"},{"label":"②建築・見どころから","text":"見どころは、まず場所そのものです。檜垣は、京都御苑の木々に囲まれた「森の休憩所」の中にあります。東側のテラス席からは、京都御所を眺められます。お茶は、宇治茶と珈琲の老舗・放香堂さんと一緒につくる、抹茶や珈琲のメニューです。京都の中心にいながら、緑の中で景色を楽しめるのが魅力です。ぜひ、テラスからの眺めもお楽しみください。"},{"label":"③お客様の場面から","text":"檜垣は、近くの方も観光の方も、心と体を整えるための「第三の居場所」として使っていただくことを考えています。ランチや朝食でひと息ついたり、夜はビアテラスで過ごしたりできます。土日限定・完全予約制の会席コースもあります。無料で使える休憩所の中なので、散策の途中にふらりと立ち寄れます。京都の伝統食材を使った和食の御膳や、スイーツもあります。"}],"talk":"こちらは京都御苑の中にある「檜垣」です。御苑は、江戸時代には140以上の宮家や公家のお屋敷が並ぶ公家町でした。明治になってお屋敷が取り除かれ、公園として整えられて、戦後の1947年に国民公園になっています。檜垣は、その御苑の中立売休憩所に入っているレストランです。コンセプトは「御苑にひらく、日本文化のショーケース」。京都の食材を使った和食の御膳や、宇治茶と珈琲の老舗・放香堂さんと一緒につくる抹茶や珈琲のメニューがあります。休憩所の東側のテラス席からは、京都御所が見えます。木々に囲まれた静かな場所で、ひと息ついていただければうれしいです。","sources":[{"title":"【京都御苑】土・日の夜限定…8月1日より「京都御苑 中立売御門 檜垣」で完全予約制レストラン開始（PR TIMES・2026年7月29日発表）","url":"https://prtimes.jp/main/html/rd/p/000000658.000018871.html"},{"title":"VMG HOTELS & UNIQUE VENUES トップページ","url":"https://www.vmg.co.jp/"},{"title":"京都御苑 中立売休憩所（公式サイト）レストランのページ","url":"https://nakadachiuri.jp/restaurant/"},{"title":"京都御苑 中立売休憩所（公式サイト）コンセプトのページ","url":"https://nakadachiuri.jp/concept/"},{"title":"京都御苑 中立売休憩所（公式サイト）トップ","url":"https://nakadachiuri.jp/"},{"title":"京都御苑 中立売休憩所（公式サイト）お知らせ一覧","url":"https://nakadachiuri.jp/info/"},{"title":"TableCheck「京都御苑 中立売御門 桧垣」","url":"https://www.tablecheck.com/ja/kyotogyoen-nakadachiuri-higaki"},{"title":"環境省 京都御苑 歴史","url":"https://www.env.go.jp/garden/kyotogyoen/1_intro/history.html"},{"title":"環境省 京都御苑 トップページ","url":"https://www.env.go.jp/garden/kyotogyoen/"},{"title":"環境省 京都御苑 お知らせ（中立売地区の再整備・2018年10月）","url":"https://www.env.go.jp/garden/kyotogyoen/topics/post_98.html"},{"title":"環境省 京都御苑 お知らせ（中立売休憩所の開店）","url":"https://www.env.go.jp/garden/kyotogyoen/topics/post_113.html"},{"title":"環境省 京都御苑 お知らせ（2007年7月31日）","url":"https://www.env.go.jp/garden/kyotogyoen/topics/070731.html"}],"note":"檜垣とVM（現・風のヘリテージ）の運営関係は、PR TIMESの発表（2026年7月29日）で「バリューマネジメント株式会社が運営し、株式会社放香堂と業務提携」と確認できた。ただし発表の社名は旧社名の表記。VMGの公式サイト（vmg.co.jp）の施設一覧には、取得したページでは檜垣の掲載を確認できなかった。\n中立売休憩所の公式サイト（nakadachiuri.jp）の著作表示は「The National Gardens Association」（国民公園協会）で、檜垣の運営会社は明記されていない。休憩所全体の管理者と、レストラン檜垣の運営者の役割分担は公開情報では確認できなかった。そのため official_url は空にした（参考ページは nakadachiuri.jp/restaurant/）。\nVMGの公式サイトでの区分（RESTAURANTS & PARTIES など）に檜垣の記載が見当たらず、category_hint は空にした。\n檜垣の名称の由来、建物の設計・構造・延べ面積・完成年は、取得できたページでは確認できなかった。建築年は新しい休憩所の開店（2019年1月9日）までで、完成年そのものは未確認。\n文化財の指定（国・京都府・京都市）は、文化庁の国指定文化財等データベース等で檜垣・中立売休憩所・京都御苑の項目を確認できなかった。京都御所など周辺の指定は今回は調べきれていない。\n2022年の大学資料に「檜垣茶寮（中立売休憩所内）」の名称があるとの検索結果があったが、そのページ自体は取得できていない。2026年5月以前の運営者や名称の変遷は、確認できなかった。\n檜垣の立つ場所が、公家町のどの屋敷の跡にあたるかは、取得したページでは確認できなかった。\n運営会社の発表では8月1日からの会席コースの予約締切が「3日前」とされる一方、検索結果の要約では「前日」とされていた。変わりやすい情報なので草稿には載せていない。\n環境省の別ページに『京都御苑は…公家町の大半を明治期に解体し…』という説明があるが、本ファイルでは取得できたページの記述のみを使っている。"},{"id":"visitorsdock","name":"VISITORS DOCK | Brew&Blend","abbr":"YKD","region":"横浜","district":"山下町","group":"カフェ","url":"https://www.vmg.co.jp/venues/visitorsdock/","ready":false,"draft":true,"area":"神奈川県横浜市中区山下町","summary":"山下公園通りにある、トレーラーハウスのカフェです。","history":"山下町は、1859年（安政6年）に横浜が開港したあと、運上所（税関）の東側が外国人居留地とされた場所です。1899年（明治32年）7月24日に居留地の町名がすべて廃止され、「山下町」という町が新しくできました。近くの山下公園は、1923年（大正12年）の関東大震災のがれきで海を埋め立ててつくられ、1930年（昭和5年）に開園しました。戦中は海軍が接収し、戦後は米軍の住宅用地となり、1954年に返還、1960年に全域が市民に開放されました。この場所にはメルパルク横浜がありました。その跡地の一部に、日本郵政不動産が整備する交流拠点「JP BAYSIDE HUB」ができ、カフェはその一角にあります。カフェ自体は新しい施設で、長い歴史はありません。","usage":"2台のトレーラーハウスとウッドデッキでできたカフェです。港の埠頭や貨物の積み下ろし、ターミナルを行き交う人々など、海と都市が交わる横浜の風景からデザインされています。観光や仕事、愛犬の散歩の合間に立ち寄れる場所として案内されています。デッキは、イベントやマルシェなど、地域の人々が自然に集まる場としても想定されています。コーヒーやオーガニックティー、瀬戸内レモンのレモネード、ビール、オリジナルカクテルなどが楽しめます。「港町・横浜らしさ」を体験できる場を目指しています。","value":"カフェはトレーラーハウスでできた新しい施設で、建物自体に歴史はありません。歴史的価値は、場所の歴史にあります。横浜は1859年に開港し、この一帯は外国人居留地をもとに1899年に「山下町」となった、開港の歴史をうけつぐ町です。近くの山下公園は、関東大震災のがれきで海を埋め立てて1930年に開園した公園です。","designation":["周辺（別の文化財）：山下公園＝登録記念物（名勝）（2007年2月6日登録）","周辺（別の文化財）：氷川丸＝重要文化財（2016年8月17日指定）"],"highlights":["トレーラーハウス2台とウッドデッキの港町らしい造り","メルパルク横浜跡地の交流拠点「JP BAYSIDE HUB」の一角","山下公園通りにあり、マリンタワーを望める"],"talks":[{"label":"①歴史・物語から","text":"こちらは、トレーラーハウスでできたカフェ、ビジターズドックです。山下公園通りにあり、マリンタワーを望めます。2台のトレーラーハウスとウッドデッキで、港の埠頭や貨物の積み下ろしなど、横浜の海と街の風景からデザインされています。もとはメルパルク横浜があった場所で、その跡地の一部にできた交流拠点「JP BAYSIDE HUB」の一角にあります。建物は新しいので、長い歴史があるわけではありません。ただ、すぐ近くの山下公園は登録記念物に登録されていて、氷川丸も係留されています。散歩の合間に、ぜひ立ち寄ってみてください。"},{"label":"②建築・見どころから","text":"見どころは、港町らしい造りです。2台のトレーラーハウスとウッドデッキでできたカフェで、港の埠頭や貨物の積み下ろし、ターミナルを行き交う人々など、横浜の海と街の風景からデザインされています。山下公園通りにあり、マリンタワーを望めます。まるで港の一角にいるような気分で、お過ごしいただけます。ぜひ、デッキに腰かけて、海と街の気配を感じてみてください。"},{"label":"③お客様の場面から","text":"観光の合間、お仕事の合間、愛犬のお散歩の途中。そんな場面で、ふらりと立ち寄っていただける場所です。コーヒーやオーガニックティー、瀬戸内レモンのレモネード、ビール、オリジナルカクテルなどが楽しめます。デッキは、マルシェなど地域の方が集まる場にも想定されています。港町・横浜らしさを体験できる場を目指しています。"}],"talk":"こちらは、トレーラーハウスでできたカフェ、ビジターズドックです。山下公園通りにあり、マリンタワーを望めます。2台のトレーラーハウスとウッドデッキで、港の埠頭や貨物の積み下ろしなど、横浜の海と街の風景からデザインされています。もとはメルパルク横浜があった場所で、その跡地の一部にできた交流拠点「JP BAYSIDE HUB」の一角にあります。建物は新しいので、長い歴史があるわけではありません。ただ、すぐ近くの山下公園は登録記念物に登録されていて、氷川丸も係留されています。散歩の合間に、ぜひ立ち寄ってみてください。","sources":[{"title":"VISITORS DOCK   Brew&Blend（VMG公式）","url":"https://www.vmg.co.jp/venues/visitorsdock/"},{"title":"日本郵政不動産のプレスリリース（PR TIMES配信、Excite転載）2025年10月3日","url":"https://www.excite.co.jp/news/article/Prtimes_2025-10-03-83972-48/"},{"title":"Impress Watch ニュース記事","url":"https://www.watch.impress.co.jp/docs/news/2052466.html"},{"title":"横浜市中区「山下町」町名のあゆみ","url":"https://www.city.yokohama.lg.jp/naka/shokai/gaiyo/chonai_ayumi/chomei08.html"},{"title":"横浜市 横浜港の歴史（開港の経緯）","url":"https://www.city.yokohama.lg.jp/kanko-bunka/minato/taikan/manabu/rekishi/history1.html"},{"title":"文化遺産オンライン 山下公園","url":"https://online.bunka.go.jp/heritages/detail/164701"},{"title":"文化遺産オンライン 氷川丸","url":"https://online.bunka.go.jp/heritages/detail/389361"},{"title":"横浜市 山下公園通り周辺地区のまちづくり","url":"https://www.city.yokohama.lg.jp/kurashi/machizukuri-kankyo/toshiseibi/toshin/kannaikangai/yamashitakoendori.html"}],"note":"メルパルク横浜の開業年・閉館時期・建物の歴史は、取得できたページで確認できませんでした（検索結果の要約には「2023年12月閉館」とありましたが、原文は未確認のため本文には使っていません）。\n開設日：日本郵政不動産の発表では2025年11月1日を予定（一部は10月11日に先行予定）ですが、検索結果には「11/29オープン」とする情報もあり、原文は未確認です。本文には日付を書いていません。\n運営：公式ページはVMG運営、プレスリリースは「バリューマネジメント株式会社（運営予定）」とあり、会社名の表記が異なります（社名変更の影響の可能性。推測）。\nこの施設自体の文化財指定は、公的データベースで確認できませんでした（指定がないと断定はしていません）。\n日本郵政不動産のプレスリリース原本PDFと横浜市ビジョンのPDFは文字を読み取れず、Exciteの転載記事で代用しました。\n住所表記：公式ページ・Impress Watchは山下町16-16、プレスリリースは山下町16（JP BAYSIDE HUB全体）です。\n氷川丸の係留場所は文化遺産オンラインで「山下公園前」程度の記載で、このカフェからの距離は確認していません。山下公園の種別は文化遺産オンラインで「登録記念物（分類は名勝）」と表示されています。"},{"id":"soma","name":"旧相馬家 Kazeno Heritage","abbr":"SOU","region":"北海道","district":"元町","group":"ホテル＆レストラン","url":"https://www.kazenoheritage.jp/hotels/old-soma-residence/","ready":false,"draft":true,"area":"北海道函館市元町","summary":"国指定重要文化財「旧相馬家住宅」に泊まる、3室のホテルです。","history":"旧相馬家住宅は、1908年（明治41年）に、北海道屈指の豪商だった相馬哲平の私邸として建てられました（公式ページ）。相馬哲平（1833〜1921）は、米や水産物の取引と銀行の設立で成功した函館の有力商人で、同じ1908年に旧函館区公会堂の再建にも資金を出しています（国土交通省の資料）。建物は、函館山を背にして海を見わたせる高台にあります（秋田魁新報）。その後、受け継ぐ人がいなくなって取り壊しの危機になりましたが、残すことを求めた市民が2009年に買い取り、翌2010年から一般公開されました。そして2018年に国の重要文化財に指定されました（秋田魁新報）。2026年3月1日に、ホテルとして開業しました（北海道新聞、秋田魁新報）。","usage":"全3室のヘリテージホテルで、1日に泊まれるのは最大3組です。一般公開の時間が終わると、宿泊者だけで建物を使えます。客室は、当時の蔵をまるごと使った部屋などがあり、実際に使われていたダイニングテーブルや、大火から家財を守った重い扉は、できるだけ手を加えずに使われています（秋田魁新報）。函館の文化を次の世代に伝える「つなぎ手」に出会える特別なプログラムもあります。食事は、近くの直営レストランを利用できます。ラウンジやWi-Fi、荷物預かりもあります。建物を活用した収益を保存の費用に充てる取り組みでもあります（秋田魁新報）。","value":"和風と洋風が合わさった意匠で、当時の最高水準の建築技術で仕上げられた建物です（公式ページ）。国土交通省の資料では、玄関に北海道では珍しい湾曲した瓦屋根があり、洋間は緑色の外観、精緻な彫刻の窓枠、天井の飾り、シャンデリアで整えられています。一方、居間は畳敷きで、囲炉裏と神棚があります。隣の土蔵には、江戸時代の北海道やアイヌの人々を描いた屏風などの美術品が収められていたと書かれています。豪商の暮らしと、開港後の函館の和洋の文化が、1つの住まいに表れた建物です。公式ページは、北前船交易や開港の歴史を背景にした港町の雰囲気も、見どころに挙げています。","designation":["建物：国指定重要文化財「旧相馬家住宅」の主屋と土蔵（文化庁 国指定文化財等データベースに両方が重要文化財として掲載。指定年月日はデータベースの一覧に記載なし）","2018年に国の重要文化財に指定（秋田魁新報の記事による）","重要伝統的建造物群保存地区内に位置：公式ページに「重要伝統的建造物群保存地区の高台にあり」「所在地は国選定の重要伝統的建造物群保存地区」との記述あり（地区名は公式ページに明記なし）"],"highlights":["1908年築、豪商・相馬哲平の私邸","和洋折衷の意匠と、湾曲した瓦屋根の玄関","土蔵をまるごと使った客室。1日3組限定"],"talks":[{"label":"①歴史・物語から","text":"こちらは、1908年に、函館屈指の豪商だった相馬哲平さんが私邸として建てた、国指定の重要文化財です。和風と洋風が合わさった建物で、玄関の湾曲した瓦屋根は北海道では珍しいそうです。一度は取り壊しの危機がありましたが、残したいという市民の力で守られ、2018年に重要文化財になりました。今は全3室のホテルで、1日3組だけ。当時の蔵をそのまま使った客室もあります。一般公開が終わったあとは、宿泊の方だけで建物を使えます。泊まることが、建物を守ることにもつながっています。"},{"label":"②建築・見どころから","text":"見どころは、和洋折衷の意匠と、湾曲した瓦屋根の玄関です。国指定重要文化財の建物で、客室には当時の蔵をまるごと使った部屋があります。実際に使われていたダイニングテーブルや、大火から家財を守った重い扉は、できるだけ手を加えずに使われています。文化財の中で、本物の空気を感じていただけます。ぜひ、建物のひとつひとつの細部もご覧ください。"},{"label":"③お客様の場面から","text":"一般公開の時間が終わると、宿泊の方だけで建物を使えます。全3室で、1日に泊まれるのは最大3組です。ここで過ごすことは、函館の文化を伝える「つなぎ手」に出会うプログラムを通じて、まちの物語に触れることでもあります。お食事は近くの直営レストランが使えます。建物を活用した収益は、保存の費用に充てられています。"}],"talk":"こちらは、1908年に、函館屈指の豪商だった相馬哲平さんが私邸として建てた、国指定の重要文化財です。和風と洋風が合わさった建物で、玄関の湾曲した瓦屋根は北海道では珍しいそうです。一度は取り壊しの危機がありましたが、残したいという市民の力で守られ、2018年に重要文化財になりました。今は全3室のホテルで、1日3組だけ。当時の蔵をそのまま使った客室もあります。一般公開が終わったあとは、宿泊の方だけで建物を使えます。泊まることが、建物を守ることにもつながっています。","sources":[{"title":"旧相馬家 Kazeno Heritage（kazenoheritage.jp 公式ページ）","url":"https://www.kazenoheritage.jp/hotels/old-soma-residence/"},{"title":"旧相馬家住宅 概要（国土交通省 多言語解説文DB）","url":"https://www.mlit.go.jp/tagengo-db/R1-00909.html"},{"title":"文化庁 国指定文化財等データベース（函館市）","url":"https://online.bunka.go.jp/heritages/region/1/1202"},{"title":"百年前の豪商邸がホテルに、函館 国の重文「宿泊し継承を」（秋田魁新報）","url":"https://www.sakigake.jp/news/article/20260224CO0111/"},{"title":"函館「旧相馬家住宅」ホテルに（北海道新聞）","url":"https://www.hokkaido-np.co.jp/article/1279268/"},{"title":"函館市元町末広町伝統的建造物群保存地区（国土交通省 多言語解説文DB）","url":"https://www.mlit.go.jp/tagengo-db/R1-00879.html"}],"note":"「重要文化財」であることは公的資料（文化庁データベース）で確認できました。社内資料の「2026年3月開業」も、北海道新聞（3月1日開業・2月24日内覧会）で確認できました。\n指定年の2018年は秋田魁新報の記事によるもので、文化庁データベースの一覧ページには指定年月日の記載がなく、公的資料では確認できていません。\n所在地の番地が出典で異なります。文化庁データベースは「元町33番地1」、公式ページと国土交通省の資料は「元町33-2」です。本文には番地を入れていません。\n公式ページは文化財指定について「一部」と記載しています。一方、文化庁データベースは主屋と土蔵の2件を重要文化財として掲載しています。ホテルの客室や増築部分のうち、指定の対象がどこまでかは確認できていません。\n重要伝統的建造物群保存地区内であることは公式ページの記述だけで、地区名の明記や範囲図は確認できていません。国土交通省の資料にある函館の地区は「元町末広町」（1989年国選定）ですが、そのページには旧相馬家の記載がありません。\n国土交通省の資料は「土蔵に美術品を収蔵」と書いていますが、現在も収蔵されているかは確認できていません。\n北海道新聞の記事は有料部分があり、冒頭しか読めていません。\n旧函館区公会堂の再建に資金を出した年が1908年という点は、国土交通省の資料の1件のみです。"},{"id":"kurayoshi","name":"風の 倉吉","abbr":"KRY","region":"鳥取","district":"河原町","group":"ホテル＆レストラン","url":"https://www.kazenoheritage.jp/hotels/kurayoshi/","ready":false,"draft":true,"area":"鳥取県倉吉市河原町（河原町1969）","summary":"文化財の小川家と髙多家を宿にした、河原町の分散型ヘリテージ・リトリートです。","history":"風の 倉吉がある河原町は、鳥取県中部の倉吉市で、小鴨川の右岸に位置します。県の文化財ナビによると、打吹山のふもとに東西に広がる町の西端にあたり、東の端には重要伝統的建造物群保存地区「倉吉市打吹玉川」があります。宿の一棟「小川家」の小川家住宅は、主屋のほかに洋館、新座敷、茶室「清和軒」、蔵などが増築された、近代の実業家の屋敷構えを伝える建物です（県指定保護文化財、2015年指定）。もう一棟「髙多家」の旧髙多家住宅主屋は、打吹山の西方にある商家で、平屋建て切妻造りの古式な造りと説明されています（国登録有形文化財、2021年登録）。小川家については、江戸時代後期以降に醸造業を営み、1885年（明治18年）に製糸会社を創業したと紹介するサイトもあります。","usage":"小川家と髙多家の2棟に、11室の客室を設けた分散型ヘリテージ・リトリート宿です。小川家の棟にフロントと専用駐車場があり、客室は定員1〜5名です。食事は里山の食材を使うリトリートダイニングで、五行の考え方を取り入れた「調律食」と位置づけられています。指定名勝「環翠園」の庭園ガイドと呈茶体験、竹林の旧国鉄倉吉線廃線跡を歩く瞑想とウォーキング、民藝・工芸体験、三徳山三佛寺への参拝登山など、鳥取県中部を巡る滞在を提案しています。","value":"小川家住宅について、鳥取県は、湾曲した絵様腕木や虹梁状の差鴨居など、県中部の近代の商家建築の特徴をよく示すとしています。洋館、新座敷、茶室などが増築され、各時代の好みを含めた建築の移り変わりがうかがえるとも説明しています。鉢屋川や本通り周辺に伝統的建造物が多く残る地区の中で、核となる貴重な建造物とされています。旧髙多家住宅主屋は、たちの低い古式なつくりで、旧商家町の様相を伝える建物と文化遺産オンラインに解説されています。","designation":["建物（小川家）：鳥取県指定保護文化財「小川家住宅」（建造物、2015年4月7日指定）（とっとり文化財ナビ）","建物（髙多家）：登録有形文化財（建造物）「旧髙多家住宅主屋」（2021年6月24日登録、倉吉市河原町1879-1）（文化遺産オンライン）","庭園：「小川氏庭園」は国登録記念物（2010年8月5日登録）（とっとり文化財ナビ）。倉吉市ページは「国登録記念物・県指定名勝」と表記","参考：重要伝統的建造物群保存地区「倉吉市打吹玉川」は1998年（平成10年）選定（鳥取県ページ）。小川家住宅のある河原町は、その地区の西にある町並みとされています（地区内とは確認できていません）","公式ホテル一覧で「重伝建地区」のタグ（公式の分類。小川家住宅のある河原町が、重要伝統的建造物群保存地区「倉吉打吹玉川」の範囲内かは、範囲図で未確認）"],"highlights":["文化財の座敷で過ごす、2棟11室の宿","指定名勝「環翠園」の庭園ガイドと呈茶","竹林の旧国鉄倉吉線廃線跡を歩く瞑想"],"talks":[{"label":"①歴史・物語から","text":"風の 倉吉は、倉吉市の河原町にある宿です。小川家と髙多家という2つの建物に、客室が11室あります。小川家の建物は鳥取県の指定保護文化財、髙多家の建物は国の登録有形文化財になっています。河原町は、打吹山のふもとに広がる町の西の端にあたり、東の端には、白壁土蔵群で知られる重要伝統的建造物群保存地区の打吹玉川があります。ご滞在では、指定名勝の庭園「環翠園」の庭園ガイドと呈茶体験や、竹林の廃線跡を歩く瞑想などが用意されています。"},{"label":"②建築・見どころから","text":"まず建物の見どころです。小川家は、主屋のほかに洋館、新座敷、茶室の「清和軒」、蔵などが増築された屋敷で、時代ごとの好みがうかがえると県が説明しています。鳥取県の指定保護文化財です。髙多家は、平屋建てで屋根が切妻の、古い形式の商家で、国の登録有形文化財です。この2棟に、11室の客室を設けています。ひとつの宿の中で、建物の違いを見比べていただけます。"},{"label":"③お客様の場面から","text":"こちらでは、鳥取県中部をめぐる滞在をご提案しています。指定名勝の庭園「環翠園」では、庭園ガイドと呈茶体験があります。竹林の旧国鉄倉吉線の廃線跡を歩く瞑想やウォーキング、民藝・工芸の体験、三徳山三佛寺への参拝登山も案内されています。お食事は里山の食材を使った、五行の考え方を取り入れた「調律食」です。ゆっくり整える旅としてお楽しみください。"}],"talk":"風の 倉吉は、倉吉市の河原町にある宿です。小川家と髙多家という2つの建物に、客室が11室あります。小川家の建物は鳥取県の指定保護文化財、髙多家の建物は国の登録有形文化財になっています。河原町は、打吹山のふもとに広がる町の西の端にあたり、東の端には、白壁土蔵群で知られる重要伝統的建造物群保存地区の打吹玉川があります。ご滞在では、指定名勝の庭園「環翠園」の庭園ガイドと呈茶体験や、竹林の廃線跡を歩く瞑想などが用意されています。","sources":[{"title":"風の 倉吉（Kazeno Heritage公式）","url":"https://www.kazenoheritage.jp/hotels/kurayoshi/"},{"title":"PR TIMES 風のヘリテージ発表（風の 倉吉 グランドオープン）","url":"https://prtimes.jp/main/html/rd/p/000000654.000018871.html"},{"title":"PR TIMES 風のヘリテージ発表（風の 倉吉）","url":"https://prtimes.jp/main/html/rd/p/000000647.000018871.html"},{"title":"小川家住宅 とっとり文化財ナビ（鳥取県）","url":"http://db.pref.tottori.jp/bunkazainavi.nsf/bunkazai_web_view/81801E062D55083349257E200010AB92"},{"title":"小川氏庭園 とっとり文化財ナビ（鳥取県）","url":"http://db.pref.tottori.jp/bunkazainavi.nsf/bunkazai_web_view/DC7C56B7331F56D74925796F00080091"},{"title":"旧髙多家住宅主屋 文化遺産オンライン","url":"https://online.bunka.go.jp/heritages/detail/572162"},{"title":"国指定文化財・国選定文化財 倉吉市公式ウェブサイト","url":"https://www.city.kurayoshi.lg.jp/4252.htm"},{"title":"鳥取県 文化財・歴史ページ（倉吉市打吹玉川）","url":"https://www.pref.tottori.lg.jp/item/1261793.htm"},{"title":"小川氏庭園「環翠園」一般公開しています 倉吉市公式ウェブサイト","url":"https://www.city.kurayoshi.lg.jp/4183.htm"},{"title":"小川家住宅（倉吉民泊 KURAYOSHI STAY）","url":"https://kurayoshi-stay.jp/history/ogawake/"},{"title":"地域の見どころリレー：小川氏庭園・小川家住宅 鳥取県立美術館","url":"https://tottori-moa.jp/uncategorized/1038/"}],"note":"vmg.co.jp配下の倉吉ページ（/venues/kurayoshi.html）は取得できず（404）。公式URLはブランドサイトkazenoheritage.jpのページを使用\n宿が保存地区内にあるか：県の文化財ナビは、河原町を打吹山麓の町の西端、東端が重伝建「倉吉市打吹玉川」と書き、倉吉市が公表する保存地区の町名（研屋町・魚町・東仲町・西仲町・西町の全域と堺町一丁目・新町一丁目〜三丁目の各一部）に河原町は含まれません。このため地区の外と読めますが、範囲図では未確認です。公式ブランドページの「まちは重伝建に指定」は、宿の所在が地区内とまでは書いていません。PR TIMESでは来賓コメントが、宿と打吹玉川を並べて観光拠点に挙げています\nなお、県ページと市ページで範囲の町名に食い違い：県の文化財ナビは「幸ヶ町2丁目・幸町3丁目」、市ページは「新町二丁目・新町三丁目」（検索結果の要約で確認。県ナビの原文は未取得）\n旧髙多家住宅の建築年代・来歴・所有の経緯は、取得したページに記載がありません。登録は主屋のみで（文化遺産オンライン）、公式ブランドページは「登録有形文化財（一部）」としています\n小川家の沿革（江戸時代後期以降の醸造業、1885年の製糸会社創業、建築年代「明治後期から昭和初期」）は、運営者の不明な紹介サイト1件のみ。「6棟」と書きながら列挙は5件で、県の文化財ナビには建築年代の記載がありません\n環翠園の作庭時期：県の文化財ナビは「昭和5年ごろ、神戸の庭師・巽武之助」、県立美術館ページは「大正15年から昭和4年、施主は小川貞一氏、庭師は植武（巽武之助氏）」。県指定名勝の指定年月日も未確認\n開業は2026年7月17日グランドオープン予定とPR TIMESが発表。現在の営業状況・体験の提供状況は未確認"},{"id":"ryoi","name":"Hotel VMG Kyoto 鴨川","abbr":"了以","region":"京都","district":"木屋町","group":"ホテル＆レストラン","url":"https://www.kazenoheritage.jp/hotels/kamogawa/","ready":false,"draft":true,"area":"京都府京都市下京区和泉屋町（木屋町通沿い）","summary":"木屋町通に立つ、旧料理旅館を受け継いだ宿。高瀬川と鴨川にはさまれた場所です。","history":"公式ページによると、この建物は1907年に置屋として建てられ、1925年の創業以来、長いあいだ旅館として人々を迎えてきました。公式ページは、この宿を「元老舗料理旅館を受け継いだ」宿とも紹介しています。場所は京都市下京区の木屋町通沿いで、西に高瀬川、東に鴨川が流れています。高瀬川は、氾濫をくり返した鴨川のそばに安定した水路を確保するため、江戸時代初期に開かれた川です。京都市の資料では、角倉了以とその子の素庵が1611年に工事を始め、1614年に完成させたとされています。公式ページによると、この川に材木問屋や材木商が軒を連ね、川沿いの通りは「木屋町」と呼ばれて、料理屋や酒屋、旅館でにぎわう町になりました。2023年2月の運営会社のリリースでは、旅館だった建物を改装した客室棟「了以」を、同年3月25日に開く予定と発表されました。2026年4月15日に、名称は「Hotel VMG Kyoto 鴨川」へ変わりました。","usage":"公式ページによると、旅館として歴史を刻んだかつての趣を生かしながら、全部屋に和室があります。すべての客室には、日本の伝統建築で最も格式の高い特別な部屋に設けられてきた「折上格天井」があり、職人の高度な技術を要する設えです。客室は、鴨川を望む部屋と、高瀬川沿いの部屋に分かれています。春には、ライトアップされる高瀬川沿いの桜が窓から眺められます。館内の各所には、京都出身の作家の作品が展示されています。ラウンジは有料で、レストランはありません。","value":"この場所の価値は、高瀬川と木屋町の歴史の中にあります。高瀬川は、角倉了以と素庵が1614年に完成させた運河で、舟で市内中心部へ物資を運べるようになりました（京都市）。木屋町という町名は、この川沿いに並んだ材木屋に由来するとされています（京都観光Navi）。高瀬川は1920年に廃止されましたが、川沿いの通りは、料理屋や酒屋、旅館でにぎわう町として続いてきました。建物は、1907年に置屋として建ち、1925年から旅館として使われてきたと公式ページにあります。宿の名前は、高瀬川を開いた角倉了以に由来すると公式ページは説明しています。全客室には、格式の高い意匠とされる折上格天井が設けられています。","designation":["周辺（別の文化財）：高瀬川一之船入は、国の史跡（1934年1月22日指定、京都市中京区木屋町通二条下ル西側一之船入町）。同じ高瀬川沿いにある別の場所で、この宿そのものの指定ではありません。"],"highlights":["西に高瀬川、東に鴨川。二つの川にはさまれた立地","1907年に置屋として建ち、1925年から旅館として続く建物","全客室に、格式ある意匠「折上格天井」"],"talks":[{"label":"①歴史・物語から","text":"こちらは、京都の木屋町通にある宿です。西には高瀬川、東には鴨川が流れていて、二つの川にはさまれた場所にあります。建物は1907年に置屋として建てられて、1925年からは旅館として、長くお客様を迎えてきたそうです。宿の名前は、江戸時代の初めに高瀬川を開いた角倉了以に由来すると、公式ページで紹介されています。お部屋には、日本の伝統建築の中でも、とくに格式の高い部屋に使われてきた折上格天井があります。春には高瀬川沿いの桜が窓から見られますし、夏には鴨川の納涼床が出ます。納涼床の歴史は、秀吉の時代までさかのぼるといわれているそうです。"},{"label":"②建築・見どころから","text":"お部屋の見どころは、天井です。すべての客室に「折上格天井」があります。日本の伝統建築のなかで、最も格式の高い特別な部屋に設けられてきた天井で、職人さんの高い技術が必要な造りです。全部屋に和室があり、客室は鴨川を望むお部屋と、高瀬川沿いのお部屋に分かれています。館内には、京都出身の作家の作品も展示されています。旅館として長く続いてきた趣を、建物の中で感じていただけます。"},{"label":"③お客様の場面から","text":"窓の外を思い浮かべてみてください。春には、ライトアップされた高瀬川沿いの桜を、お部屋の窓から眺めていただけます。和室で、鴨川や高瀬川の流れを近くに感じながら過ごす時間が、この宿の魅力です。館内の作品を見て歩くのも、ひとつの楽しみです。なお、ラウンジは有料で、レストランはございませんので、お食事はご予定に合わせてお考えください。"}],"talk":"こちらは、京都の木屋町通にある宿です。西には高瀬川、東には鴨川が流れていて、二つの川にはさまれた場所にあります。建物は1907年に置屋として建てられて、1925年からは旅館として、長くお客様を迎えてきたそうです。宿の名前は、江戸時代の初めに高瀬川を開いた角倉了以に由来すると、公式ページで紹介されています。お部屋には、日本の伝統建築の中でも、とくに格式の高い部屋に使われてきた折上格天井があります。春には高瀬川沿いの桜が窓から見られますし、夏には鴨川の納涼床が出ます。納涼床の歴史は、秀吉の時代までさかのぼるといわれているそうです。","sources":[{"title":"Hotel VMG Kyoto 鴨川（旧HOTEL VMG RESORT KYOTO 了以）公式トップ","url":"https://www.kazenoheritage.jp/hotels/kamogawa/"},{"title":"歴史と物語 - Hotel VMG Kyoto 鴨川（公式）","url":"https://www.kazenoheritage.jp/hotels/kamogawa/story/"},{"title":"お部屋 - Hotel VMG Kyoto 鴨川（公式）","url":"https://www.kazenoheritage.jp/hotels/kamogawa/rooms/"},{"title":"施設名変更のお知らせおよびご予約に関するご案内（公式・2026年4月15日）","url":"https://www.kazenoheritage.jp/hotels/kamogawa/2026/04/15/hotel-vmg-kyoto-kamogawa-notice/"},{"title":"Hotel VMG Kyoto Kamogawa（公式・英語ページ）","url":"https://www.kazenoheritage.jp/en/hotels/kamogawa/"},{"title":"History and Stories（公式・英語ページ）","url":"https://www.kazenoheritage.jp/en/hotels/kamogawa/story/"},{"title":"【HOTEL VMG VILLA KYOTO・HOTEL VMG RESORT KYOTO】運営形態・施設名称変更のお知らせ（VMG）","url":"https://www.vmg.co.jp/news/kyoto_rename/"},{"title":"新客室棟「了以」予約スタートのリリース（VMG・2023年2月17日）","url":"https://www.vmg.co.jp/news/ryoui_open/"},{"title":"京都市：高瀬川再生プロジェクト","url":"https://www.city.kyoto.lg.jp/kensetu/page/0000272260.html"},{"title":"高瀬川一之船入 京都市公式 京都観光Navi","url":"https://ja.kyoto.travel/tourism/single02.php?category_id=9&tourism_id=184"},{"title":"高瀬川一之船入 国指定文化財等データベース（文化庁）","url":"https://kunishitei.bunka.go.jp/heritage/detail/401/1684"},{"title":"伝統的建造物群保存地区 - 京都市","url":"https://www.city.kyoto.lg.jp/tokei/page/0000281305.html"}],"note":"1907年に置屋として建てられ1925年に旅館として創業した、という来歴は運営会社の公式ページ（歴史と物語）だけの記述です。公的資料・第三者資料では確認できていません。公式の英語版は「置屋」を lodging house と訳しています。\n2023年2月のVMGリリースは、建物が料理旅館だったと述べるだけで築年を書いていません。旧旅館の名称、設計者・施工者、現在の建物が当時のままか、改装の範囲は確認できていません。\n公式ページは「Hotel VMG Kyoto 鴨川の名は角倉了以に由来する」と書いていますが、2023年のリリースでは旧名の「了以」が角倉了以にちなむとされています。社内の呼び名「了以」が旧「HOTEL VMG RESORT KYOTO 了以棟（201〜207号室）」を指すことは、2026年4月15日の公式お知らせで確認できました。新しい名称そのものが了以に由来するかどうかの説明は、公式ページには直接ありません。\n高瀬川の開削の書き方は資料で少し違います。京都市は1611年着工・1614年完成、京都観光Naviは「1611年頃角倉了以が開いた」としています。開削の目的について、VMGリリースは「方広寺創建のため」としますが、京都市のページには目的の記載がないため、本文では目的を書いていません。\n木屋町という町名の由来（材木屋）は京都観光Naviの記述です。公式ページは「材木問屋や材木商が軒を連ね、高瀬川沿いの通りが木屋町と呼ばれた」と書いています。\n伝統的建造物群保存地区：京都市のページが挙げる4地区（産寧坂・祇園新橋・嵯峨鳥居本・上賀茂）に木屋町・高瀬川は含まれず、この宿が保存地区内だと読める公式・自治体の記述は見つかりませんでした。保存地区の外とみられますが、断定はしていません。\n文化財指定：公式ページ、VMGのリリースに、この建物が指定・登録文化財だという記述はありません。文化遺産オンラインと文化庁データベースを検索しましたが、下京区和泉屋町の該当建造物は見つかりませんでした（検索語での確認のみで、データベースの全件確認ではありません）。京都市の「京を彩る建物や庭園」の一覧は、この宿について確認できていません。\n高瀬川一之船入は中京区の木屋町通二条下ルにある別の場所で、この宿の指定ではありません。周辺の文化財として参考に載せたもので、宿からの距離は確認していません。\n住所の表記：公式日本語ページは「下京区和泉屋町166」。公式英語ページは、案内文では Wazumiya-cho、概要では Izumiya-cho と表記が揺れています。宿泊サイトの一部には「泉屋町」の表記もあります。本文では公式日本語ページに合わせました。\n2023年3月25日の開業は、リリース時点の「予定」です。実際の開業日は確認していません。\nTECTURE MAG の記事（HOTEL VMG VILLA KYOTO、数寄屋建築の天井を遺した旅館）は、この施設の記事かどうかを公式情報で確認できなかったため使っていません。\n公式ページが「鴨川の納涼床の歴史は秀吉の時代まで遡るとされています」と述べる点は、公式の言い方のままです。別の出典での裏づけは取っていません。"},{"id":"ozucastle","name":"大洲城キャッスルステイ","abbr":"","region":"愛媛","district":"大洲城","group":"キャッスルステイ","url":"https://castlestay.ozucastle.com/","ready":false,"draft":true,"area":"愛媛県大洲市大洲（大洲城）","summary":"木造復元天守に泊まる、日本初をうたう城泊体験。舞台は櫓が残る大洲城です。","history":"大洲城は、愛媛県大洲市の肱川と久米川が合流するあたりの丘に築かれた平山城です。中世には宇都宮氏の居城で、戸田氏、藤堂氏、脇坂氏の時代に近世の城へ整えられたと考えられています。1617年に加藤貞泰が6万石で入城し、1869年の廃藩まで加藤氏が治めました。明治に入ると、1874年に入札で民間へ払い下げられ、1888年に天守が解体されました。ただし、櫓は残りました。1906年には本丸と二の丸の一部が大洲町の所有となり、城山公園として管理が始まりました。2004年には、市制施行50周年の記念事業として、古写真や江戸時代の絵図、木組みの模型などを手がかりに、木造で天守が復元されました。","usage":"公式ページでは、大洲城キャッスルステイを、木造復元天守に泊まる城泊の体験として紹介しています。天守の1階で布団に休み、夕食は櫓でいただく流れです。1日1組限定で、滞在中は、バトラーとシェフ以外の城山一帯への立ち入りが制限されます。城を望むキャッスルラウンジには、宿泊者だけが使える浴場があります。翌朝は、国の重要文化財の臥龍山荘を貸し切って、朝食とお茶を楽しみます。公式ページは、売上の一部が文化財の維持保全に充てられると説明しています。","value":"現存する4つの櫓は、江戸時代の終わり近くに建て直されたものが中心です。大洲市の資料では、台所櫓が1859年、高欄櫓が1861年、苧綿櫓が1843年に再建され、三の丸南隅櫓は1766年に再建されたとあります。三の丸南隅櫓は、4つの櫓のうち最も古いと紹介されています。高欄櫓は、天守に付けることが多い高欄（手すり）を櫓に付けた珍しい例で、「天守に次ぐ高い格式」の櫓と考えられています。台所櫓は、籠城のときに台所になるよう、1階の約3分の1が土間になっています。天守の復元では、必要な史料が多く残っていたことが、とても珍しいと大洲市は紹介しています。","designation":["城の文化財：大洲城 台所櫓・高欄櫓・苧綿櫓・三の丸南隅櫓の4棟は、国の重要文化財（1957年（昭和32年）6月18日指定）","城の文化財：大洲城跡（本丸と二の丸の一部）は、愛媛県指定の史跡（指定年は出典により食い違いあり。uncertainを参照）"],"highlights":["2004年に復元された木造の天守に泊まれます","国の重要文化財の櫓が4棟、城内に残っています","夕食は櫓で、朝食は重要文化財の臥龍山荘で"],"talks":[{"label":"①歴史・物語から","text":"大洲城は、愛媛県大洲市にあるお城です。江戸時代には、1617年から明治の初めまで加藤氏が治めました。天守は明治に取り壊されましたが、2004年に古写真や木組みの模型などをもとに、木造で復元されました。城には、国の重要文化財の櫓が4棟、今も残っています。公式ページでは、この復元天守に泊まる日本初の城泊体験とご紹介しています。夕食は櫓でいただき、翌朝は、国の重要文化財の臥龍山荘で朝食とお茶をお楽しみいただきます。売上の一部は、文化財の維持保全に充てられています。城主になったつもりで、ごゆっくりお過ごしください。"},{"label":"②建築・見どころから","text":"大洲城の見どころは、今も残る4つの櫓です。台所櫓、高欄櫓、苧綿櫓、三の丸南隅櫓で、いずれも国の重要文化財です。高欄櫓は、天守に付けることの多い手すりを付けた珍しい櫓です。台所櫓は、籠城のときに台所になるよう、1階の約3分の1が土間になっています。そして2004年に木造で復元された天守があります。この城山の天守と櫓が、宿泊の舞台です。"},{"label":"③お客様の場面から","text":"1日1組だけの、貸切の滞在です。天守の1階で布団に休み、夕食は櫓でいただきます。滞在中は、バトラーとシェフ以外、城山一帯への立ち入りが制限されますので、お城を独り占めするようなひとときになります。城を望むラウンジには、宿泊者だけが使える浴場があります。翌朝は、国の重要文化財の臥龍山荘を貸し切って、朝食とお茶を楽しんでいただきます。"}],"talk":"大洲城は、愛媛県大洲市にあるお城です。江戸時代には、1617年から明治の初めまで加藤氏が治めました。天守は明治に取り壊されましたが、2004年に古写真や木組みの模型などをもとに、木造で復元されました。城には、国の重要文化財の櫓が4棟、今も残っています。公式ページでは、この復元天守に泊まる日本初の城泊体験とご紹介しています。夕食は櫓でいただき、翌朝は、国の重要文化財の臥龍山荘で朝食とお茶をお楽しみいただきます。売上の一部は、文化財の維持保全に充てられています。城主になったつもりで、ごゆっくりお過ごしください。","sources":[{"title":"大洲城キャッスルステイ 公式トップ","url":"https://castlestay.ozucastle.com/"},{"title":"大洲城キャッスルステイ 魅力（about）","url":"https://castlestay.ozucastle.com/about"},{"title":"大洲城キャッスルステイ 歴史（history）","url":"https://castlestay.ozucastle.com/history"},{"title":"大洲城キャッスルステイ 滞在空間（stay）","url":"https://castlestay.ozucastle.com/stay"},{"title":"大洲城キャッスルステイ よくあるご質問（faq）","url":"https://castlestay.ozucastle.com/faq"},{"title":"大洲城キャッスルステイ 体験プログラム","url":"https://castlestay.ozucastle.com/experience"},{"title":"大洲市 現地説明会参考資料（大洲城の沿革）PDF","url":"https://www.city.ozu.ehime.jp/uploaded/attachment/17239.pdf"},{"title":"大洲市 わがまちの文化財「大洲城跡」","url":"https://www.city.ozu.ehime.jp/site/bunkazai/0205.html"},{"title":"大洲市 わがまちの文化財 史跡（県指定）一覧","url":"https://www.city.ozu.ehime.jp/site/bunkazai/11509.html"},{"title":"大洲市 大洲城台所櫓","url":"https://www.city.ozu.ehime.jp/site/bunkazai/0259.html"},{"title":"大洲市 大洲城高欄櫓","url":"https://www.city.ozu.ehime.jp/site/bunkazai/0262.html"},{"title":"大洲市 大洲城苧綿櫓","url":"https://www.city.ozu.ehime.jp/site/bunkazai/0270.html"},{"title":"大洲市 大洲城三の丸南隅櫓","url":"https://www.city.ozu.ehime.jp/site/bunkazai/0271.html"},{"title":"国指定文化財等データベース（文化庁）大洲城三の丸南隅櫓","url":"https://kunishitei.bunka.go.jp/heritage/detail/102/3379"},{"title":"文化遺産オンライン 大洲城 台所櫓","url":"https://online.bunka.go.jp/heritages/detail/191213"},{"title":"文化遺産オンライン 大洲城 高欄櫓","url":"https://online.bunka.go.jp/heritages/detail/124184"},{"title":"文化遺産オンライン 大洲城 苧綿櫓","url":"https://online.bunka.go.jp/heritages/detail/157915/3"},{"title":"えひめの文化財（たから）大洲城（愛媛県）","url":"https://www.pref.ehime.jp/ehimenotakara/18.html"},{"title":"大洲市観光情報 大洲城","url":"https://www.city.ozu.ehime.jp/site/kanko/1223.html"}],"note":"【日本初】公式トップには「木造復元天守に泊まる 日本初の城泊体験」とあるが、公的資料での裏づけは取得できなかった。社内資料の「日本初の木造天守貸切」という言い方は、公式の文言とは違う（公式は「日本初の城泊体験」）。公式のaboutページには「日本初」の語はない。大洲市観光ページにも「日本初」はあるが、これは「戦後に復元された木造天守として四層四階は日本初」という別の意味。\n【文化財への還元】公式aboutページにあるのは「売上の一部は文化財の維持保全に充てられます」のみ。「売上の10%」「市へ還元」は確認できなかった。キタ・マネジメント資料の「最終利益6%、収入の3割は文化財の保全に」も、今回は原典を取得できていない。\n【県指定史跡の指定年】大洲城跡（県指定史跡）の指定年月日が、出典で食い違う。大洲市の県指定史跡一覧は昭和28年2月13日、大洲市「大洲城跡」ページは昭和32年6月18日（国の重要文化財の櫓の指定日と同じ日）、大洲市の年表PDFは昭和28年と読める。愛媛県の史跡ページは取得できなかったため、designationには年を入れていない。\n【藤堂高虎の入城年】大洲市の沿革PDFの中で、年表は文禄4（1595）年、歴代城主の欄は文禄3（1593）年と、食い違っている。本文には年を書いていない。\n【櫓の数】加藤氏の時代の櫓の数が、大洲市PDFでは「天守を含めて18」、大洲市「大洲城跡」ページでは「20棟近い櫓」と違っている。本文には数を書いていない。\n【高欄櫓の再建年】大洲市・文化遺産オンラインは1861年（文久元年）。愛媛県「えひめの文化財」ページには1860年とも読める記述があった（取得結果の翻訳による。要確認）。本文は大洲市・文化遺産オンラインに合わせた。同ページは指定名称を「大洲城3棟」とし、櫓は4棟現存とも書いており、数え方が違う（要確認）。\n【築城年】築城は1331年ごろ、宇都宮氏とする資料があるが、大洲市PDFでは年に「？」が付いている。本文には築城年を書いていない。\n【公式の「全国に5城の木造復元天守」】公式aboutページの記述。公的資料での裏づけは取得できなかったため使っていない。\n【天守の指定】大洲市「大洲城跡」ページに、現存する遺構として石垣・重要文化財の櫓4棟・内堀の一部とあり、天守は復元であることから、天守そのものは国・県の指定対象ではないと読める。ただし指定一覧で天守が含まれないことまでは確認していない（要確認）。\n【文化庁データベースの確認範囲】文化庁の国指定文化財等データベース（kunishitei）で直接確認できたのは三の丸南隅櫓のみ。台所櫓・高欄櫓・苧綿櫓は、文化遺産オンライン（文化庁）と大洲市のページで確認した。\n【運営者】公式トップ・historyの表記から、運営はVMGと読めるが、公式に運営会社名の明記は見つけていない。本文には書いていない。\n【加藤氏の代数】大洲市は13代としている。出典によって数え方が違う可能性があるため、本文には書いていない。"},{"id":"marugame","name":"丸亀城キャッスルエクスペリエンス","abbr":"","region":"香川","district":"丸亀城","group":"キャッスルステイ","url":"https://marugame-castle.com/","ready":false,"draft":true,"area":"香川県丸亀市一番丁（丸亀城内）","summary":"現存天守のある丸亀城で過ごす、宿泊と文化体験を組み合わせた城泊です。","history":"丸亀城は、香川県丸亀市の亀山（標高約66m）に築かれた城で、築城から400年以上の歴史があります。文化遺産オンラインの解説では、1587年に生駒親正が讃岐に入り、1597年にこの地で築城しました。生駒氏の後、山崎氏が廃城となっていた古い城を修築して、現在の城を整えました。その後は京極氏が治め、明治維新まで続きました。公式ページによると、京極氏は初代の京極高和から約210年、7代にわたって西讃岐一帯を治めました。天守は三重三階で、1643年から1660年ごろの建造とされています。大手一の門と大手二の門は、1670年に再建されました。三の丸の延寿閣別館は1933年に建てられた建物で、東京の京極家屋敷の部材が使われています。","usage":"公式ページでは、丸亀城キャッスルエクスペリエンスを、城を貸し切って過ごす「城泊」の宿泊プランとして紹介しています。体験プログラムも組み合わせた内容です。宿泊の拠点は三の丸の延寿閣別館で、木造平屋、延べ床面積120平方メートルの宿泊者専用の空間です。1日目は、人力車でJR丸亀駅から城へ向かい、大手門で和太鼓の演奏に迎えられます。夜は天守を貸し切ってガイドの案内を受け、天守内のナイトラウンジで過ごします。2日目は中津万象園で朝食をとり、丸亀うちわ作りや煎茶道を体験します。","value":"丸亀城は「石垣の名城」と呼ばれ、内堀から天守へ向けて4層に重ねられた石垣は、高さの合計が約60mで日本一とされています（公式ページと香川県の資料）。天守は現存する十二天守のひとつです。三重三階で「日本一小さい天守」といわれますが、唐破風と千鳥破風を備えると公式ページは紹介しています。大手一の門は櫓門、大手二の門は高麗門で、大手口の堂々とした姿を伝え、枡形を保存するうえでも重要な建物とされています。天守と大手門の両方が現存する城は、丸亀城、高知城、弘前城の3城だけと公式ページは説明しています。","designation":["城の文化財：丸亀城天守（附：板札1枚）は、国の重要文化財（1943年（昭和18年）6月9日指定）","城の文化財：丸亀城 大手一の門・大手二の門（附：東西土塀）は、国の重要文化財（1957年（昭和32年）6月18日指定）","城の文化財：丸亀城跡は、国指定の史跡（1953年（昭和28年）3月31日指定）","城の文化財：丸亀城 玄関先御門・番所・長屋（附：土塀）は、香川県指定の有形文化財（1963年（昭和38年）4月9日指定）","宿泊棟の文化財：延寿閣別館は、国の登録有形文化財（2026年7月9日登録）"],"highlights":["現存十二天守のひとつ。夜は天守を貸切で案内します","4層に重なる高石垣。合計約60mで日本一とされます","1933年建築の延寿閣別館に泊まれます"],"talks":[{"label":"①歴史・物語から","text":"丸亀城は、香川県丸亀市の亀山にあるお城です。天守は、全国に12しか残っていない現存天守のひとつで、国の重要文化財です。三重三階の小さな天守ですが、唐破風と千鳥破風がとても美しいんですよ。石垣も見どころで、4層に重なった石垣は、高さの合計が約60mで日本一とされています。泊まっていただく延寿閣別館は1933年に建てられ、京極家の東京の屋敷の部材が使われています。夜には天守を貸し切って、ガイドの案内を受けられます。かつての城主になった気分で、お楽しみください。"},{"label":"②建築・見どころから","text":"丸亀城は「石垣の名城」と呼ばれています。内堀から天守に向けて、石垣が4層に重なっていて、高さを合計すると約60mで、日本一とされています。その上に建つ天守は、三重三階で、現存する十二天守のひとつです。小さな天守ですが、唐破風と千鳥破風という、屋根の飾りを備えていると公式ページで紹介されています。大手門も、櫓門と高麗門の2つが残っています。"},{"label":"③お客様の場面から","text":"1日目は、人力車でJR丸亀駅からお城へ向かいます。大手門では和太鼓の演奏がお迎えします。夜は天守を貸し切りにして、ガイドの案内を受け、天守のナイトラウンジで過ごします。お泊まりは、三の丸の延寿閣別館で、宿泊者専用の木造平屋の空間です。2日目は中津万象園で朝食をとり、丸亀うちわ作りや煎茶道も体験できます。城を貸し切る、城泊のプランです。"}],"talk":"丸亀城は、香川県丸亀市の亀山にあるお城です。天守は、全国に12しか残っていない現存天守のひとつで、国の重要文化財です。三重三階の小さな天守ですが、唐破風と千鳥破風がとても美しいんですよ。石垣も見どころで、4層に重なった石垣は、高さの合計が約60mで日本一とされています。泊まっていただく延寿閣別館は1933年に建てられ、京極家の東京の屋敷の部材が使われています。夜には天守を貸し切って、ガイドの案内を受けられます。かつての城主になった気分で、お楽しみください。","sources":[{"title":"丸亀城キャッスルエクスペリエンス 公式トップ","url":"https://marugame-castle.com/"},{"title":"丸亀城キャッスルエクスペリエンスの魅力（about）","url":"https://marugame-castle.com/about/"},{"title":"丸亀の歴史（culture）","url":"https://marugame-castle.com/culture/"},{"title":"ご宿泊（stay）","url":"https://marugame-castle.com/stay/"},{"title":"アクセス（access）","url":"https://marugame-castle.com/access/"},{"title":"文化遺産オンライン 丸亀城天守","url":"https://online.bunka.go.jp/heritages/detail/191123"},{"title":"国指定文化財等データベース（文化庁）丸亀城天守","url":"https://kunishitei.bunka.go.jp/heritage/detail/102/3286"},{"title":"文化遺産オンライン 丸亀城 大手一の門","url":"https://online.bunka.go.jp/heritages/detail/148481"},{"title":"文化遺産オンライン 丸亀城 大手二の門","url":"https://online.bunka.go.jp/heritages/detail/176522"},{"title":"文化遺産オンライン 丸亀城跡","url":"https://online.bunka.go.jp/heritages/detail/217529"},{"title":"文化遺産オンライン 延寿閣別館","url":"https://online.bunka.go.jp/heritages/detail/624845"},{"title":"香川県教育委員会 国・県指定有形文化財（建造物）","url":"https://www.pref.kagawa.lg.jp/kenkyoui/shogaigakushu/bunkazai/culturalassets/culturalassets_1.html"},{"title":"香川県教育委員会 国・県指定史跡","url":"https://www.pref.kagawa.lg.jp/kenkyoui/shogaigakushu/bunkazai/culturalassets/culturalassets_12.html"},{"title":"香川県 ご提言等の内容（丸亀城の城泊の活用について）","url":"https://www.pref.kagawa.lg.jp/kocho/kocho/koe/k0348050921.html"},{"title":"香川県 亀山公園の資料（PDF）","url":"https://www.pref.kagawa.lg.jp/documents/13195/05kameyamakouenn.pdf"}],"note":"【宿泊か体験か】公式では、丸亀城を貸し切る「城泊」の宿泊プランに、体験プログラムを組み合わせたものとして紹介されている。公式トップのメニューは「ご宿泊」と「体験プログラム」に分かれており、どちらか一方ではなく両方を含む。\n【石垣の「日本一」】公式ページは「4層に積み上げた石垣の高さは日本一」、香川県の資料は「累計約60m」。これは4層の合計の高さ。単体の石垣の高さではない点に注意（要確認）。香川県のPDFは本文が文字化けして読めず、見出し文のみ確認した。\n【天守と大手門が現存する3城】公式aboutページの記述（丸亀城・高知城・弘前城）。公的資料での裏づけは取得できなかったため、本文では「公式ページは説明しています」の形にした（要確認）。\n【天守の建造年】文化庁データベースは「寛永20〜万治3年（1643〜1660）」と幅で記載しており、建造年は一つに決まらない。\n【延寿閣別館の文化財登録】文化遺産オンラインで、登録有形文化財・2026年7月9日登録を確認した。公式サイトの取得ページには、この登録の記載は見つけていない。文化遺産オンラインの時代欄は「明治」だが、年代は1933年（昭和8年）と記載されている。\n【文化庁データベースの確認範囲】文化庁の国指定文化財等データベース（kunishitei）で直接確認できたのは天守のみ。大手一の門・大手二の門・丸亀城跡は、文化遺産オンライン（文化庁）と香川県教育委員会のページで確認した。\n【運営者の表記】公式ページには「operated by VMG」とあるが、フッターの著作表示は「Marugame Tourism Association」。運営の主体について、本文には書いていない。\n【中津万象園など】公式aboutページは中津万象園を市指定文化財と紹介しているが、丸亀市・香川県の資料で裏づけられていないため、designationには入れていない（要確認）。\n【丸亀市の公式ページ】丸亀市の公式サイトのページは、今回の調査では取得できなかった。市の情報は、香川県教育委員会の一覧（所有者・管理団体として丸亀市）で補った。"},{"id":"fukuyama","name":"福山城キャッスルステイ","abbr":"FKY","region":"広島","district":"福山城","group":"キャッスルステイ","url":"https://www.fukuyamacastle.com/","ready":false,"draft":true,"area":"広島県福山市丸之内一丁目8番（福山城公園内）","summary":"福山城公園の歴史的建造物に泊まり、「一日城主」になる宿泊体験です。","history":"福山城は、徳川家康のいとこの水野勝成が、1619年に備後国10万石の領主として入り、福山の地に築いた城です。城が完成したのは1622年（元和8年）で、城下町とともに福山藩の中心になりました。1710年からは阿部氏が明治維新まで藩を治め、幕末の名宰相・阿部正弘もこの家から出ています。1873年の廃城令で城の一部が解体されましたが、天守は1931年に国宝になり、1933年には伏見櫓・御湯殿・筋鉄御門も国宝に指定されました。1945年8月8日の福山空襲で天守や御湯殿が焼け、伏見櫓・筋鉄御門・鐘櫓は残りました。戦後の1950年に文化財保護法が施行され、伏見櫓と筋鉄御門は国の重要文化財になりました。1966年には市制施行50周年の記念事業で天守が再建され、天守・御湯殿・月見櫓の外観が復元されました。","usage":"キャッスルステイは、泊まる人が「一日城主」になり、公園内の歴史的建造物や文化財を楽しむ宿泊体験です。公式ページによると、福山駅で甲冑の出迎えを受け、福寿会館でチェックインと殿様・姫様の衣装への着替え、朝食をします。筋鉄御門で入城体験をしたあと、本丸南東隅の月見櫓で城主の儀を行い、城主証を受け取ります。夕食と就寝も月見櫓です。天守ではキャッスルミュージアム＆バーと、天空の間でのナイトラウンジがあります。入浴は、江戸期の蒸し風呂を再現した御湯殿のサウナ形式で、2日目は伏見櫓の案内があります。","value":"福山城は、福山市の資料で「石高に比して破格の規模を誇った」城とされています。天守の北側には防御用の鉄板が張られていたとされ、「全国唯一」といわれています。この鉄板張りは、築城400年の「令和の大普請」で外観が復元されました。伏見櫓は、梁の陰刻「松ノ丸ノ東やく（ら）」から、京都の伏見城から移されたことがわかった建物です。白壁の3層3階の姿に桃山時代の気風がうかがえ、柱を見せる意匠が特徴とされています。筋鉄御門は本丸の正門で、「枡型多門の型をとらない初期様式」とされ、福山藩の最重要施設を守る「最後の砦」として堅固に造られました。空襲の熱で赤みを帯びた花崗岩が、二之丸と天守台の石垣に残り、戦争の遺跡とされています。","designation":["城の文化財：福山城 伏見櫓（国指定・重要文化財。文化庁データベースの重文指定年月日は1933年1月23日）","城の文化財：福山城 筋鉄御門（国指定・重要文化財。文化遺産オンラインの重文指定年月日は1933年1月23日）","城の文化財：福山城跡（国指定・史跡。文化遺産オンラインの指定年月日は1964年2月7日）","キャッスルステイで使う建物：福山市福寿会館本館（登録有形文化財・建造物。2012年2月23日登録）"],"highlights":["月見櫓で「一日城主の儀」を行い、城主証を受けます","筋鉄御門から入城する体験があります","2日目に、桃山の気風を伝える伏見櫓の案内があります"],"talks":[{"label":"①歴史・物語から","text":"ここは、福山城公園の中に泊まる「キャッスルステイ」です。福山城は、徳川家康のいとこの水野勝成が築いた城で、完成は1622年です。泊まる方は「一日城主」になって、まず筋鉄御門から入城します。この門は、福山城に残る国の重要文化財です。そのあと本丸の月見櫓で城主の儀をして、城主証を受け取り、夕食と就寝もそこで過ごします。天守では、ミュージアム＆バーやナイトラウンジを楽しめます。お風呂は、江戸時代の蒸し風呂を再現した御湯殿です。2日目には、桃山時代の気風を伝える伏見櫓のご案内もあります。城の歴史に包まれる一泊を、ぜひお楽しみください。"},{"label":"②建築・見どころから","text":"福山城には、ほかにはない見どころがあります。天守の北側には、防御のための鉄板が張られていたとされ、全国唯一といわれています。その外観は「令和の大普請」で復元されました。伏見櫓は、梁に刻まれた文字から、京都の伏見城から移されたことがわかった建物です。筋鉄御門は本丸の正門です。石垣には、空襲の熱で赤みを帯びた石が今も残っています。"},{"label":"③お客様の場面から","text":"泊まる方は「一日城主」になります。福山駅では甲冑のお出迎えを受け、殿様・姫様の衣装に着替えます。筋鉄御門から入城し、月見櫓で城主の儀を行って、城主証を受け取ります。夕食と就寝も月見櫓です。天守ではミュージアム＆バーやナイトラウンジをお楽しみいただけます。お風呂は、江戸時代の蒸し風呂を再現した御湯殿のサウナ形式です。2日目は、伏見櫓の案内もあります。"}],"talk":"ここは、福山城公園の中に泊まる「キャッスルステイ」です。福山城は、徳川家康のいとこの水野勝成が築いた城で、完成は1622年です。泊まる方は「一日城主」になって、まず筋鉄御門から入城します。この門は、福山城に残る国の重要文化財です。そのあと本丸の月見櫓で城主の儀をして、城主証を受け取り、夕食と就寝もそこで過ごします。天守では、ミュージアム＆バーやナイトラウンジを楽しめます。お風呂は、江戸時代の蒸し風呂を再現した御湯殿です。2日目には、桃山時代の気風を伝える伏見櫓のご案内もあります。城の歴史に包まれる一泊を、ぜひお楽しみください。","sources":[{"title":"福山城キャッスルステイ（公式トップ）","url":"https://www.fukuyamacastle.com/"},{"title":"福山城キャッスルステイ 体験コンテンツ","url":"https://www.fukuyamacastle.com/experience/"},{"title":"福山城キャッスルステイ 福山城の歴史","url":"https://www.fukuyamacastle.com/history/"},{"title":"福山城キャッスルステイ 福山の魅力","url":"https://www.fukuyamacastle.com/fukuyama/"},{"title":"文化遺産オンライン 福山城 伏見櫓","url":"https://online.bunka.go.jp/heritages/detail/176382"},{"title":"国指定文化財等データベース 福山城 伏見櫓","url":"https://kunishitei.bunka.go.jp/heritage/detail/102/3145"},{"title":"文化遺産データベース 福山城 筋鉄御門","url":"https://online.bunka.go.jp/db/heritages/detail/190983"},{"title":"文化遺産オンライン 福山城跡","url":"https://online.bunka.go.jp/heritages/detail/217389"},{"title":"文化遺産オンライン 福山市福寿会館本館","url":"https://online.bunka.go.jp/heritages/detail/248510"},{"title":"福山市 福山城（ふくやまじょう）","url":"https://www.city.fukuyama.hiroshima.jp/site/miryoku2023/287233.html"},{"title":"福山市 入封400年記念シリーズ(11) 戦前の福山城と福山空襲","url":"https://www.city.fukuyama.hiroshima.jp/koho-detail50/koho-202002/172625.html"},{"title":"福山市 国重要文化財 伏見櫓・筋鉄御門","url":"https://www.city.fukuyama.hiroshima.jp/koho-detail50/koho-202302/282378.html"},{"title":"広島県 たてもの情報 福山城伏見櫓","url":"https://www.pref.hiroshima.lg.jp/site/tatemonogatari/tatemonojouhou19.html"},{"title":"福山城博物館 伏見櫓","url":"https://fukuyamajo.jp/miru/fushimiyagura/"},{"title":"福山城博物館 筋鉄御門","url":"https://fukuyamajo.jp/miru/sugiganegomon/"},{"title":"福山城博物館 月見櫓","url":"https://fukuyamajo.jp/miru/tukimiyagura/"}],"note":"月見櫓の指定：公式「福山の魅力」ページは月見櫓を「国の重要文化財」と書くが、福山城博物館・福山市の資料は1966年の外観復元とし、指定の記載がない。文化遺産オンラインで確認できた重要文化財は伏見櫓と筋鉄御門だけなので、designation には入れていない。\n重要文化財の指定年：文化庁のデータベースは伏見櫓・筋鉄御門の「重文指定年月日」を1933年1月23日と表示する。一方、福山城博物館は1933年に国宝指定、1950年の文化財保護法施行で重要文化財になったと説明しており、書き方が異なる。history は福山城博物館・福山市の説明に合わせ、designation は文化庁データベースの表示のままにした。\n築城の年：公式・福山市の資料は、1619年に水野勝成が入封（築城に着手）、1622年（元和8年）に完成としており、「築城」を1619年とする資料と1622年とする資料が混在する。\n伏見櫓・筋鉄御門の移築の経緯：広島県の資料は「1622年に徳川秀忠が移築させたという伝承」、福山城博物館は「水野勝成の依頼で秀忠が移築させたとされる」、筋鉄御門は「移築されたと伝わる」と書く。断定できる書き方は伏見櫓の陰刻（1954年解体修理で発見）の範囲まで。\n解体修理の年：福山市の広報は1951〜1954年、広島県の資料は1954年の解体修理で陰刻を発見としている（大きな食い違いではないが、引用時は注意）。\n天守北側の鉄板張りの「全国唯一」は、福山市の資料でも「いわれている」という伝聞の書き方。\n福山城跡の国史跡の指定：指定年月日（1964年2月7日）は文化遺産オンライン1件のみで確認。国指定文化財等データベースの福山城跡ページ、福山市・広島県の文化財一覧ページは今回取得できておらず、県指定・市指定の文化財や、伝統的建造物群保存地区は確認できなかった。\n福寿会館：公式の「福寿会館」と文化遺産オンラインの「福山市福寿会館本館」を、名称と場所（福山城の北側）から同じ建物と見なした。社内資料にある福山の福寿会館の事業立ち上げ・出向との関係は、公開情報では確認できないため触れていない。\nusage は公式「体験コンテンツ」のスケジュール例の範囲。時刻・内容は変わる可能性があり、具体的な時刻は書いていない。公式ページに、城主の儀の具体的な進行の説明はなかった。\n福山城の石垣の築き方や意匠に関する詳しい説明は、取得できた出典になかった（価値の欄では、空襲の熱で変色した石垣の記述のみ使用）。"}],"stats":{"total":32,"published":0,"draft":32,"invalid":0}}/*MOCK_FAC_END*/;

roles":["リーダー"],"keyword":"提供の順番","text":"披露宴でお料理を提供するときの順番と、基本の動きを説明してください。","explain":"提供の順番と、右手側・ドリンクケアが書けていれば、できています。","draft":false,"type":"text","model":"・主賓テーブルから提供し、そこを基準に前方卓から提供していく\n・親御様卓が最終のゲスト卓\n・ゲストの右手側からサービスし、料理提供後にドリンクケアも行う\n・お客様に手をあげさせない"},{"id":"B84","service":"banquet","roles":["親御様","バンケSV"],"keyword":"下げる","text":"お皿を下げるときの基本を、2つ以上挙げてください。","explain":"模範解答のうち2つ以上書けていれば、できています。","draft":false,"type":"text","model":"・ゲストの右手側から下げる\n・前方卓より、食べ終わっているゲストから下げる\n・使用していないシルバーも同時に下げる\n・肉料理のときは、パン皿やオリーブ皿、箸、グラスも下げる"},{"id":"B85","service":"banquet","roles":["レセプショニスト"],"keyword":"ご両家名","text":"ご両家名をお伺いするときの対応を、文言も含めて説明してください。","explain":"こちらから言わないこと・文言・分からないときの対応が書けていれば、できています。","draft":false,"type":"text","model":"・こちらから絶対にご両家名を言わない\n・文言例：『おめでとうございます。ご結婚式の参列のお客様でしょうか。ご参列のご両家名をお伺いいたします。』\n・ご両家ごとが分からなければ、新郎新婦様のフルネームをお伺いする\n・名称は『結婚式』、ご両親は『親御様』で統一する"}],"stats":{"total":172,"published":172,"draft":0,"invalid":0,"unknownRoles":0},"passPercent":90,"size":10},"facilities":{"facilities":[{"id":"hakodate","name":"NIPPONIA HOTEL 函館 港町","abbr":"HKD","region":"北海道","district":"函館ベイエリア","group":"ホテル＆レストラン","url":"https://www.vmg.co.jp/venues/hakodate.html","ready":true,"draft":false,"area":"北海道函館市豊川町","summary":"赤レンガ倉庫を改修した、9室の港町オーベルジュです。","history":"函館は、幕末に最初に開かれた港町の一つです。公式ページによると、箱館の開港で異文化が入ってきたことが、独自の景観を生みました。国土交通省の資料では、1855年（安政元年）に開港し、1859年（安政6年）には長崎・横浜とともに本格的な貿易港になったとされています。明治の大火のあとに、今のまちなみの原型ができたとも書かれています。このホテルは、まちのシンボルである赤レンガ倉庫を改修した施設で、赤レンガ倉庫群地区にあります。公式ページには、明治末期から昭和初期の和風・洋風・和洋折衷の建物が多く残ると書かれています。旅行メディアの記事には、明治期に建てられた昆布倉庫を活かしたという説明があります。","usage":"客室は9室で、宿泊と食事を一緒に楽しむオーベルジュとして運営されています。レストランでは、北海道や函館の旬の食材に北欧料理の手法を取り入れた料理を出し、イカ、カニ、マグロなど函館の海の幸を味わえます。内装は、曲線の美しい北欧デザインの家具で整えられ、空間も素材の種類も少なく、シンプルで素朴な印象です。公式ページ（kazenoheritage.jp）では、年間を通したカヌーツアーなど、地元の自然を楽しむ体験も紹介されています。また、赤レンガ倉庫全体を婚礼で貸し切ることもできると書かれています。","value":"函館は開港によって異文化が入り、和風・洋風・和洋折衷の建物が坂道や街路と調和する、独自のまちなみを育てました（公式ページ、国土交通省の資料）。その港町の景観の中で、赤レンガ倉庫は「まちのシンボル」と公式ページに書かれています。倉庫は商いの場として使われてきた建物で、ホテルになっても、レンガ造りの外観や、当時の柱やレンガが残る空間が受け継がれています（公式ページ、旅行メディアの記事）。壊すのではなく改修して使い続けることで、港町の歴史を、宿泊を通して体験できる場所になっています。公式ページによれば、敷地の赤レンガ倉庫は北海道遺産に選定されています。","designation":["重要伝統的建造物群保存地区内のエリア（赤レンガ倉庫群地区）に位置：公式ページ（kazenoheritage.jp）に「赤レンガ倉庫エリアは重要伝統的建造物群保存地区の一部」と読める記述あり。地区名は公式ページに明記なし。範囲図では未確認"],"highlights":["まちのシンボル、赤レンガ倉庫での滞在","北欧デザインの家具とシンプルな内装","函館の海の幸と北欧料理の手法の食事"],"talks":[{"label":"①歴史・物語から","text":"こちらは、函館のまちのシンボルになっている赤レンガ倉庫を改修した、9室だけの港町オーベルジュです。函館は、幕末に最初に開かれた港町の一つで、開港で入ってきた異文化が、このまちならではの景観をつくりました。倉庫だった建物を壊さずに使い、内装は曲線がきれいな北欧デザインの家具で、シンプルにまとめています。レストランでは、函館の旬の食材に北欧料理の手法を合わせた料理を味わえます。保存地区のまちなみを歩いて、港町の歴史もあわせて楽しんでいただけます。"},{"label":"②建築・見どころから","text":"見どころは、赤レンガ倉庫を改修した建物そのものです。函館のまちのシンボルである倉庫で、赤レンガ倉庫群地区にあります。中に入ると、曲線がきれいな北欧デザインの家具が並び、空間も素材も絞ったシンプルで素朴な印象です。古い倉庫の力強さと、北欧らしい静かな雰囲気が同居しています。ここでは、倉庫だった建物の空気を、そのまま味わっていただけます。"},{"label":"③お客様の場面から","text":"泊まることと食べることを、一緒に楽しむ滞在です。客室は9室のオーベルジュで、レストランでは、北海道や函館の旬の食材に北欧料理の手法を合わせた料理を味わえます。イカ、カニ、マグロなど函館の海の幸も楽しめます。公式ページでは、カヌーツアーなど地元の自然を楽しむ体験も紹介されています。婚礼では、赤レンガ倉庫全体を貸し切ることもできます。"}],"talk":"こちらは、函館のまちのシンボルになっている赤レンガ倉庫を改修した、9室だけの港町オーベルジュです。函館は、幕末に最初に開かれた港町の一つで、開港で入ってきた異文化が、このまちならではの景観をつくりました。倉庫だった建物を壊さずに使い、内装は曲線がきれいな北欧デザインの家具で、シンプルにまとめています。レストランでは、函館の旬の食材に北欧料理の手法を合わせた料理を味わえます。保存地区のまちなみを歩いて、港町の歴史もあわせて楽しんでいただけます。","sources":[{"title":"NIPPONIA HOTEL 函館 港町（VMG公式 施設ページ）","url":"https://www.vmg.co.jp/venues/hakodate.html"},{"title":"NIPPONIA HOTEL 函館 港町（kazenoheritage.jp 公式ページ）","url":"https://www.kazenoheritage.jp/hotels/hakodate/"},{"title":"函館市元町末広町伝統的建造物群保存地区（国土交通省 多言語解説文DB・英語）","url":"https://www.mlit.go.jp/tagengo-db/R1-00879.html"},{"title":"函館 赤レンガ倉庫の歴史（るるぶ&more）","url":"https://rurubu.jp/andmore/article/18264"},{"title":"NIPPONIA HOTEL 函館 港町（まっぷるトラベルガイド）","url":"https://www.mapple.net/original/565961/"},{"title":"NIPPONIA HOTEL 函館 港町（日本旅行 TRIPA）","url":"https://www.nta.co.jp/media/tripa/articles/rvSNN"},{"title":"金森倉庫群周辺の区域（国土交通省 多言語解説文DB）","url":"https://www.mlit.go.jp/tagengo-db/R1-00881.html"}]},{"id":"villakyoto","name":"東山露路 Kazeno Heritage","abbr":"VKT","region":"京都","district":"東山","group":"ホテル＆レストラン","url":"https://www.vmg.co.jp/venues/villakyoto","ready":true,"draft":false,"area":"京都府京都市東山区高台寺北門前通下河原東入鷲尾町523番地","summary":"高台寺のそばにある、茶人の私邸を生かした一日一組限定の宿です。","history":"公式ページによると、この建物の前身は「東山茶寮」で、築約120年の茶人の私邸です。明治後期の1904年頃に、遠州流の茶人・鵜野吾一が茶会のために建てたと伝わります。鵜野は、大阪で「大阪一」ともいわれた割烹料理屋「堺卯楼」の主人だったと紹介されています。茶の湯、建築、庭、料理、工芸を愛した数寄者で、茶人や京都・大阪の文化人を招いて茶会を重ね、交流の場にしていたと伝えられます。建物には、四畳半の茶室、茶室と対になる露地庭、和の居間、洋風の待合があり、和と洋が同居する造りです。遠州流が大切にする「綺麗さび」の美意識が、空間の基調になっているそうです。ただし、1904年頃や鵜野による建築は「伝わる」「頃」という言い方で、確かな史料に基づくかは公式ページからは分かりません。","usage":"公式ページによると、一日一組限定で、定員は1〜6名です。三世代の家族や友人同士の旅行を想定しています。二階建ての建物に、四畳半の茶室、露地庭、和の居間、洋風の待合があります。1階では庭を眺めながら食事をし、茶室でお茶をいただきます。食事を出すレストランはなく、専任コンシェルジュが要望に応じてお店を紹介し、茶道、芸舞妓、京都の歴史・文化に触れるプランも個別に組みます。体験として、玉露体験と、香道・花・茶の文化体験があります。チェックインは「寧々の道別邸 Kazeno Heritage」（下河原町463-23）で行い、スタッフが東山露地まで案内します。","value":"この建物の価値は、茶会のために築かれた私邸の姿を残していることにあります。公式ページによると、前身の「東山茶寮」は明治後期に茶人・鵜野吾一が築いたと伝わり、四畳半の茶室と露地庭を中心に、洋風の待合も備えます。公式ページは、数寄者を建築、庭園、器、花、料理などを一つの世界として捉える人と説明しており、その暮らしと、遠州流の「綺麗さび」の美意識を伝える建物です。また、文化遺産オンラインの説明では、八坂神社、法観寺、清水寺の門前町として栄えたこの一帯の二年坂から高台寺辺りに、大正時代以降の二階建て数寄屋風の町家が見られるとされています。","designation":["重要伝統的建造物群保存地区「京都市産寧坂」（種別：門前町、面積8.2ha、1976年9月4日選定）内に位置すると公式ストーリーページが記載（「産寧坂伝統的建造物群保存地区の静かな路地」）。地区の選定内容の根拠：https://kunishitei.bunka.go.jp/heritage/detail/103/17"],"highlights":["四畳半の茶室と、対になる露地庭","茶人・鵜野吾一が茶会のために築いたと伝わる私邸","和の居間と洋風の待合が並ぶ和洋の造り"],"talks":[{"label":"①歴史・物語から","text":"こちらの東山露地は、もともと「東山茶寮」と呼ばれた、築およそ120年の茶人の私邸です。明治の後期、1904年ごろに、遠州流の茶人だった鵜野吾一さんが、茶会のために建てたと伝えられています。鵜野さんは、大阪の「堺卯楼」という料理屋のご主人で、茶人や文化人の方々をここへお招きして、茶会を重ねていたそうです。建物には、四畳半の茶室と露地のお庭、和の居間、洋風の待合があります。今は一日一組限定で、お庭を眺めながらお食事をしたり、茶室でお茶をいただいたりできます。高台寺や八坂神社も歩いて行ける距離ですので、東山のさんぽもお楽しみください。"},{"label":"②建築・見どころから","text":"見どころは、茶室と庭が対になった造りです。四畳半の茶室と、それに続く露地のお庭、和の居間、洋風の待合があり、和と洋が同居しています。公式ページでは、遠州流が大切にする「綺麗さび」の美意識が空間の基調だと紹介されています。築およそ120年の茶人の私邸という、静かな時間の流れる建物です。ぜひ、茶室と庭の関係にも目を向けてみてください。"},{"label":"③お客様の場面から","text":"一日一組限定で、定員は1〜6名です。三世代のご家族や、ご友人同士の旅行にお使いいただけます。1階ではお庭を眺めながらお食事をし、茶室でお茶をいただきます。レストランはなく、専任のコンシェルジュが、ご希望に合わせてお店を紹介します。玉露体験や、香道・花・茶の文化体験もあります。貸し切りの時間を、ゆったり過ごしていただけます。"}],"talk":"こちらの東山露地は、もともと「東山茶寮」と呼ばれた、築およそ120年の茶人の私邸です。明治の後期、1904年ごろに、遠州流の茶人だった鵜野吾一さんが、茶会のために建てたと伝えられています。鵜野さんは、大阪の「堺卯楼」という料理屋のご主人で、茶人や文化人の方々をここへお招きして、茶会を重ねていたそうです。建物には、四畳半の茶室と露地のお庭、和の居間、洋風の待合があります。今は一日一組限定で、お庭を眺めながらお食事をしたり、茶室でお茶をいただいたりできます。高台寺や八坂神社も歩いて行ける距離ですので、東山のさんぽもお楽しみください。","sources":[{"title":"東山露地 Kazeno Heritage（公式・施設トップ）","url":"https://www.kazenoheritage.jp/hotels/higashiyamaroji/"},{"title":"東山露地 Kazeno Heritage（公式・ストーリー）","url":"https://www.kazenoheritage.jp/hotels/higashiyamaroji/story/"},{"title":"The Villa Higashiyama Roji Kazeno Heritage（公式・英語ストーリー）","url":"https://www.kazenoheritage.jp/en/hotels/higashiyamaroji/story/"},{"title":"京都市産寧坂（国指定文化財等データベース）","url":"https://kunishitei.bunka.go.jp/heritage/detail/103/17"},{"title":"京都市産寧坂（文化遺産オンライン）","url":"https://online.bunka.go.jp/heritages/detail/125134"},{"title":"産寧坂伝統的建造物群保存地区保存計画（京都市）","url":"https://www.city.kyoto.lg.jp/tokei/page/0000281761.html"},{"title":"伝統的建造物群保存地区（京都市）／参考図","url":"https://www.city.kyoto.lg.jp/tokei/page/0000281305.html"},{"title":"東山露地を取り上げた建築媒体の記事（TECTURE MAG、2026-06-19公開）","url":"https://mag.tecture.jp/project/20260619-hotel-vmg-villa-kyoto/"}]},{"id":"chichibu","name":"NIPPONIA 秩父 門前町","abbr":"CCB","region":"埼玉","district":"宮側町","group":"ホテル＆レストラン","url":"https://www.vmg.co.jp/venues/chichibu","ready":true,"draft":false,"area":"埼玉県秩父市宮側町（フロント所在地は宮側町17-5）","summary":"昭和初期の薬局や煙草店を改修した、秩父神社の門前の分散型ホテルです。","history":"秩父は山々に囲まれた土地です。公式ページによると、秩父往還道が峠を越えて上州、信濃、甲斐、武蔵とつながり、山あいでも多くの人や物が集まりました。江戸時代には養蚕、製糸、絹織物が地域の礎となりました。秩父市教育委員会の資料には、秩父神社の周辺で絹の市「絹大市」が開かれ、秩父祭の笠鉾・屋台も登場したこと、この流れが今の市街地が商業の町として発展した一因になったことが書かれています。明治には織物業も盛んになり、「秩父銘仙」は大正・昭和初期に海外からも注目されたと公式ページは紹介しています。秩父神社は崇神天皇の時代の創建と伝えられています。こうした信仰と産業の歴史を持つ秩父神社へ続く参道沿いが、このホテルのある門前町です。","usage":"3棟8室の分散型ホテルです。MARUJU棟は、2017年まで薬局として営業していた築約100年の旧マル十薬局を、梁や壁をほぼそのまま残して改修しました。客室・フロント・レストランがあり、ファブリックには地元の銘仙や織物を使っています。KOIKE・MIYATANI棟は、旧小池煙草店と旧宮谷履物店を改修した客室棟です。ほかに、小池カフェ（店内・テイクアウト）、Restaurant MARUJU（地元食材の創作料理）、秩父和定食の朝食、客室でのフリードリンク（秩父サイダー、ご当地コーラ、地酒など）があります。","value":"小池煙草店は、秩父市教育委員会の資料で「装飾に富んだ昭和初期の店舗併用住宅で、秩父神社参道沿いの角地に建つ木造2階建」と紹介されています。マル十薬局は、公式ページによると明治元年から昭和初期に建てられたとされる建物で、築約100年です。市の資料では、秩父の市街地には絹や織物の取引が行われた建物や商工業の建物が数多く残り、その一部が国の登録有形文化財になっています。ホテルの建物は、絹と織物で栄えた門前の商いのまちの姿を今に伝える歴史的な資源です。","designation":["小池煙草店（KOIKE棟）：国登録有形文化財（建造物）。秩父市教育委員会の資料と公式ページ（KOIKE203号室が登録有形文化財に指定）が根拠"],"highlights":["登録有形文化財の旧小池煙草店に泊まれます","築約100年の旧マル十薬局を改修した棟","地元の銘仙や織物を使った客室の布"],"talks":[{"label":"①歴史・物語から","text":"秩父は山に囲まれた町で、昔から秩父往還道を通って、いろいろな土地の人や物が集まってきました。江戸時代には養蚕や絹織物が盛んで、秩父神社のまわりでは絹の市も開かれたそうです。のちに秩父銘仙も有名になりました。このお宿は、そんな門前町にあった薬局や煙草店を改修した建物です。マル十薬局は築約100年で、2017年まで薬局でした。小池煙草店は昭和初期の建物で、国の登録有形文化財です。ぜひ、参道も歩いてみてください。"},{"label":"②建築・見どころから","text":"ここでは、昭和初期の商いの建物の中に入れます。小池煙草店は、装飾に富んだ木造2階建てで、秩父神社の参道沿いの角地に建っています。国の登録有形文化財です。もう一つのマル十薬局は築約100年で、梁や壁をほぼそのまま残して改修しました。客室の布には、地元の銘仙や織物を使っています。外から眺めるだけでなく、泊まって、建物の中の空気まで味わっていただけます。"},{"label":"③お客様の場面から","text":"お夕食の場面を思い浮かべてください。旧薬局の棟にあるレストランで、地元の食材を使った創作料理をどうぞ。客室では、秩父サイダーやご当地コーラ、地酒などを、フリードリンクとして自由にお飲みいただけます。朝は秩父和定食、小池カフェでひと息つくこともできます。お食事も、お部屋での一杯も、歴史ある建物の中で過ごせるのが、ここに泊まる意味です。"}],"talk":"秩父は山に囲まれた町で、昔から秩父往還道を通って、いろいろな土地の人や物が集まってきました。江戸時代には養蚕や絹織物が盛んで、秩父神社のまわりでは絹の市も開かれたそうです。のちに秩父銘仙も有名になりました。このお宿は、そんな門前町にあった薬局や煙草店を改修した建物です。マル十薬局は築約100年で、2017年まで薬局でした。小池煙草店は昭和初期の建物で、国の登録有形文化財です。ぜひ、参道も歩いてみてください。","sources":[{"title":"NIPPONIA 秩父 門前町（VMG公式）","url":"https://www.vmg.co.jp/venues/chichibu"},{"title":"秩父市教育委員会文化財保護課 発表資料「秩父市街地における国登録有形文化財群を活用した歴史まちづくり」（国土交通省サイト掲載PDF）","url":"https://www.mlit.go.jp/toshi/townscape/content/001966895.pdf"},{"title":"埼玉県 登録有形文化財（建造物）一覧","url":"https://www.pref.saitama.lg.jp/documents/27121/02_r7torokuyukebunkazai.pdf"},{"title":"国指定文化財等データベース（文化遺産オンライン）秩父市（11207）の検索結果","url":"https://online.bunka.go.jp/heritages/search/prefecture_cd:11/city_code:11207/museum:国指定文化財等データベース"},{"title":"秩父神社の歴史・由来（国土交通省 多言語解説文データベース）","url":"https://www.mlit.go.jp/tagengo-db/R1-01212.html"},{"title":"重要伝統的建造物群保存地区一覧（文化庁）","url":"https://www.bunka.go.jp/seisaku/bunkazai/shokai/hozonchiku/judenken_ichiran.html"}]},{"id":"sasayama","name":"篠山城下町ホテル NIPPONIA","abbr":"SSY","region":"兵庫","district":"河原町・西町","group":"ホテル＆レストラン","url":"https://www.vmg.co.jp/venues/sasayama.html","ready":true,"draft":false,"area":"兵庫県丹波篠山市西町（ONAE所在。公式ページは「篠山市西町25」と表記）ほか、城下町内に点在","summary":"城下町に点在する築100年超の建物を客室にした分散型ホテルです。","history":"丹波篠山の城下町は、篠山城を核につくられたまちです。篠山城は、慶長14年（1609）に徳川家康の命で築かれました。諸大名が築城を助けた公儀（天下）普請で、山陰道を押さえる要衝として重んじられたと、国の史跡の解説にあります。城のまわりには旧武家町と旧商家町が町割りされ、近世の城下町の基本的な構造が今もよく残っています。松平氏のあと、寛延元年（1748）に青山氏が封ぜられ、明治維新まで続きました。公式ページは、このまちを「400年の歴史」を持つ城下町と紹介し、街道筋にあったことから文化が盛んだったと伝えています。公式ページによると、まちは二条城の白書院を模して造られた篠山城を中心とした城下町です。","usage":"公式ページでは、築100年を超える明治前期の元銀行経営者の旧邸宅など、まちに点在する歴史的建造物を客室にした分散型ホテルと紹介されています。客室棟には、旧山陰街道沿いのONAE、春日大社付近のSAWASHIRO、河原町のNOZI・YAMAZINO・KAWARANO、城跡から徒歩5分で一棟貸しのYOMENA、濠に面したNOKONがあります。築100年を超える古民家のレストランでは、関西フレンチ界の巨匠・石井之悠さん監修のお料理を楽しめます。ウェディングの会場としても紹介されています。","value":"篠山城跡は、全体の規模がよく残り、南門の馬出がほぼそのまま残っています。外堀は今も水をたたえ、四角い曲輪が同心状に並ぶ縄張の典型を見られると、国の史跡の解説は述べています。城下町は、国の選定理由で「近世初頭の城下町として特色ある歴史的風致をよく残す」と説明されています。武家町と商家町の町割りが残り、武家屋敷や町家、寺院などが、近世から近代にかけて建てられた姿で伝わります。河原町には、間口が狭く奥行きの深い建物が並び、格子のある町並みが楽しめます。ONAEは、城下町の町並みを形づくる景観重要建造物とされています。","designation":["重要伝統的建造物群保存地区「丹波篠山市篠山」（2004年12月10日選定）。国指定史跡の篠山城跡とその周囲の旧武家町・旧商家町からなり、東西約1,500m・南北約600m（文化遺産オンライン／日本遺産ポータル）","NOZI：国の伝建地区に指定された河原町の一角にあると公式ページに記載","YAMAZINO・KAWARANO：河原町妻入商家群のある河原町に位置すると公式ページに記載（河原町は国の伝建地区と同ページが記載）","ONAE棟：景観重要建造物に指定（公式ページの記載）","参考（施設そのものの指定ではない）：篠山城跡は国指定史跡（1956年12月28日指定）。YOMENAは城跡から徒歩5分と公式に記載"],"highlights":["国指定史跡の篠山城跡を核にした、城下町のまち全体が客室","河原町の妻入商家や長屋を改修した客室（NOZI・YAMAZINO・KAWARANO）","明治期の元銀行経営者の旧邸宅ONAE（景観重要建造物）"],"talks":[{"label":"①歴史・物語から","text":"こちらは、丹波篠山の城下町そのものを楽しむホテルです。まちには、徳川家康の命で築かれた篠山城を中心に、武家町と商家町の町割りが今も残っています。客室は、まちに点在する築100年を超える建物を改修したもので、河原町の客室は、国の伝建地区に指定された河原町の一角にあります。ONAEは明治期に建てられた元銀行経営者の旧住居で、景観重要建造物に指定されています。城下町の歴史に包まれながら、ごゆっくりお過ごしください。"},{"label":"②建築・見どころから","text":"ここでは、お城とまちのつくりをご覧いただけます。篠山城跡では、外堀が今も水をたたえ、南門の前の「馬出」という守りの場所もほぼそのまま残っています。城のまわりには、武家町と商家町の町割りが今も残ります。河原町には、間口が狭く奥行きの深い建物と、格子のある町並みが続きます。公式ページでは、NOZIは国の伝建地区に指定された河原町の一角にあると紹介されています。"},{"label":"③お客様の場面から","text":"お食事の場面から、思い浮かべてください。築100年を超える古民家のレストランで、関西フレンチ界の巨匠・石井之悠さん監修のお料理を楽しめます。お泊まりは、城下町に点在する、築100年を超える建物を改修した客室です。城跡から徒歩5分の一棟貸しのお部屋もあります。ウェディングの会場としても紹介されています。食事も滞在も、城下町の中で過ごせます。"}],"talk":"こちらは、丹波篠山の城下町そのものを楽しむホテルです。まちには、徳川家康の命で築かれた篠山城を中心に、武家町と商家町の町割りが今も残っています。客室は、まちに点在する築100年を超える建物を改修したもので、河原町の客室は、国の伝建地区に指定された河原町の一角にあります。ONAEは明治期に建てられた元銀行経営者の旧住居で、景観重要建造物に指定されています。城下町の歴史に包まれながら、ごゆっくりお過ごしください。","sources":[{"title":"篠山城下町ホテル NIPPONIA（公式）","url":"https://www.vmg.co.jp/venues/sasayama.html"},{"title":"丹波篠山市篠山（文化遺産オンライン）","url":"https://online.bunka.go.jp/heritages/detail/177612"},{"title":"篠山城下町地区（日本遺産ポータルサイト）","url":"https://japan-heritage.bunka.go.jp/ja/culturalproperties/result/880/"},{"title":"篠山城跡（日本遺産ポータルサイト）","url":"https://japan-heritage.bunka.go.jp/ja/culturalproperties/result/878/"},{"title":"篠山城跡（国指定文化財等データベース）","url":"https://kunishitei.bunka.go.jp/heritage/detail/401/1884"},{"title":"河原町妻入商家群（ヒョーゴアーカイブス）","url":"https://web.pref.hyogo.lg.jp/archives/c536.html"}]},{"id":"sawara","name":"佐原商家町ホテル NIPPONIA","abbr":"SWR","region":"千葉","district":"小野川","group":"ホテル＆レストラン","url":"https://www.vmg.co.jp/venues/sawara.html","ready":true,"draft":false,"area":"千葉県香取市佐原（公式ページの所在地は〒287-0003 香取市イ1708−2、KAGURA棟）","summary":"江戸の水運で栄えた佐原の商家や酒蔵を、まちごと宿に再生したホテルです。","history":"佐原は、利根川の支流の小野川と香取街道が交わる場所にあり、江戸時代から利根川の水運で栄えた商家の町です。江戸時代には全国から商人が集まり、伊能忠敬も商人として暮らしたと公式ページにあります。香取市のページによると、水運で栄えた佐原は「江戸優り」と呼ばれ、人々は江戸の文化を取り入れて自分たちの文化に育てました。文化庁の文化遺産オンラインは、利根川下流域の物資が集まる河港の商業都市として、江戸時代から大正時代まで栄えたと説明しています。この町並みは、1996年（平成8年）12月に、関東で初めて重要伝統的建造物群保存地区に選ばれました。","usage":"町全体を一つのホテルに見立て、築100年を超える商家を含む8つの棟が、町の中に点在しています。客室は、歴史的建造物を改修した13室で、梁や格子などのデザインを残しながら、現代的な内装に整えています。フロントとレストランのKAGURAは、300年以上前に開業した地元の酒蔵「馬場本店酒造」の木造の建物で、かつて実際に日本酒を造っていた空間です。レストランでは、酒粕・醤油・味噌・麹などを使い、日本酒とのペアリングを楽しめる「発酵フレンチ」を出しています。朝食は粕汁などの和朝食です。","value":"佐原の町並みは、利根川水運の河港商業都市として栄えた江戸時代から大正時代の姿を伝えています。保存地区は小野川沿いと香取街道沿いが十字型に広がり、木造や蔵造り、切妻や寄棟、平入や妻入など、さまざまな造りの町家や土蔵、洋館が並びます。小野川沿いには「だし」と呼ばれる荷揚場も残っています。香取市のページでは、商家が家業を受け継いで営む「生きている町並み」と紹介されています。ホテルのGEISHOがある中村屋商店は、店舗が1855年、土蔵が1892年以降の建築で、変形した敷地に合わせた五角形断面の柱が特徴と、香取市のページにあります。","designation":["重要伝統的建造物群保存地区「香取市佐原」（約7.1ヘクタール、平成8年（1996）12月10日選定）。小野川沿いと香取街道沿いの町並みで、公式ページは、小野川沿いの町並みが保存地区に選ばれたと説明し、ホテルの棟はその町に点在すると説明（出典：公式ページ、千葉県、香取市、文化遺産オンライン）","建物（GEISHO＝中村屋商店）：千葉県指定有形文化財（建造物）、平成5年（1993）2月26日指定、対象は店舗兼住宅・土蔵の2棟（出典：千葉県、香取市）"],"highlights":["酒蔵を活かしたレストランの発酵フレンチ","築100年超の商家など8棟が町に点在","小野川沿いの町並みと忠敬橋のまち歩き"],"talks":[{"label":"①歴史・物語から","text":"佐原は、江戸時代に利根川の水運で栄えた商家の町です。小野川と香取街道が交わるこの一帯の町並みは、1996年に関東で初めて重要伝統的建造物群保存地区に選ばれました。このホテルは、町全体を一つのホテルに見立てていて、築100年を超える商家など8つの棟が、町の中に点在しています。フロントとレストランは、300年以上前に開業した酒蔵の建物です。かつてお酒を造っていた空間で、酒粕や麹を使った発酵フレンチを楽しめます。ぜひ、町を歩きながら過ごしてみてください。"},{"label":"②建築・見どころから","text":"佐原の見どころは、さまざまな造りの建物が並ぶ町並みです。木造や蔵造り、屋根の形や入口の向きもさまざまな町家や土蔵、洋館が並びます。小野川沿いには「だし」と呼ばれる荷揚場も残っています。ホテルのGEISHOがある中村屋商店は、店舗が1855年、土蔵が1892年以降の建築で、敷地に合わせた、断面が五角形の柱が特徴です。"},{"label":"③お客様の場面から","text":"夜のお食事の場面からお話しします。レストランKAGURAは、公式ページによると300年以上前に開業した酒蔵の木造の建物で、かつて実際に日本酒を造っていた空間です。そこで、酒粕・醤油・味噌・麹などを使った発酵フレンチを、日本酒とのペアリングとともに楽しめます。朝は粕汁などの和朝食です。お泊まりは、築100年を超える商家を含む、町に点在する棟です。"}],"talk":"佐原は、江戸時代に利根川の水運で栄えた商家の町です。小野川と香取街道が交わるこの一帯の町並みは、1996年に関東で初めて重要伝統的建造物群保存地区に選ばれました。このホテルは、町全体を一つのホテルに見立てていて、築100年を超える商家など8つの棟が、町の中に点在しています。フロントとレストランは、300年以上前に開業した酒蔵の建物です。かつてお酒を造っていた空間で、酒粕や麹を使った発酵フレンチを楽しめます。ぜひ、町を歩きながら過ごしてみてください。","sources":[{"title":"佐原商家町ホテル NIPPONIA（公式）","url":"https://www.vmg.co.jp/venues/sawara.html"},{"title":"香取市佐原の伝統的建造物群保存地区と景観形成地区について（香取市）","url":"https://www.city.katori.lg.jp/living/sumai/machinamihozon.html"},{"title":"佐原の町並み（香取市）","url":"https://www.city.katori.lg.jp/sightseeing/machinami/index.html"},{"title":"国指定史跡・千葉県有形文化財（香取市）","url":"https://www.city.katori.lg.jp/sightseeing/machinami/hozonchiku.html"},{"title":"香取市佐原（文化遺産オンライン・文化庁）","url":"https://online.bunka.go.jp/heritages/detail/149551"},{"title":"重要伝統的建造物群保存地区（千葉県）","url":"https://www.pref.chiba.lg.jp/kyouiku/bunkazai/shitei/kuni/s05-denken.html"},{"title":"香取市の有形文化財（建造物）（千葉県）","url":"https://www.pref.chiba.lg.jp/kyouiku/bunkazai/shitei/shichouson/katori-kenzou.html"}]},{"id":"takeda","name":"竹田城 城下町 ホテルEN","abbr":"TKD","region":"兵庫","district":"竹田城下","group":"ホテル＆レストラン","url":"https://www.vmg.co.jp/venues/takeda.html","ready":true,"draft":false,"area":"兵庫県朝来市和田山町竹田（字上町西側）","summary":"竹田城跡のふもと、約400年続いた旧木村酒造場を活かしたホテルです。","history":"竹田城は、公式ページでは、但馬守護の山名宗全が1443年から13年をかけて築いたと伝わります。朝来市は、嘉吉年間（1443年頃）に宗全が配下の太田垣氏に築かせたと伝わる（口碑）と説明しています。天正13年（1585）に赤松広秀（広英・広通とも書かれます）が入城し、現在の石垣はこのころ整えられたと考えられています。1600年（慶長5）の関ヶ原の戦いのあと広秀が自刃し、竹田城は廃城となりました。城下町は、円山川が大きく曲がる河川敷を使って計画されたと兵庫県立歴史博物館は説明しています。城山のふもとには、4つの寺と表米神社が並ぶ約600mの「寺町通り」があります。ホテルになった旧木村酒造場は、公式ページで約400年酒造りを続けた酒造所と紹介されています。","usage":"公式ページによると、旧木村酒造の建物を使った、全13室の分散型ブティックホテルです。店舗兼母屋はホテル、米蔵は店舗、舟蔵はレストラン、貯蔵所は観光案内所や情報館として使われています。旧発酵蔵は、地元但馬の食材を使うフレンチレストランと宴会場になっています。朝来市のページでは、明治初期の造り酒屋を改修した「たけだ城下町交流館」が、情報館「天空の城」や宿泊施設、レストラン、カフェ、マルシェなどを備え、平成25年11月にオープンしたと紹介されています。","value":"店舗兼主屋は、竹田城跡の東のふもとで通りに面して建つ大型の町家です。正面に下屋と格子があり、屋根の両端にうだつを立ち上げます。軸部は重厚で上質で、「町並み景観の核となる」と、国の登録の解説にあります。舟蔵は敷地の西側にある大型の土蔵で、かつては麹室があり、絞りなども行われました。竹田城跡に臨む敷地背面の景観にも役立つと説明されています。竹田城跡は、石垣を残す山城として稀有のものと国の史跡の解説は述べています。城下には寺院が並ぶ寺町があり、兵庫県は竹田城下町の寺町通りを歴史的町並みとして紹介しています。","designation":["旧木村酒造場店舗兼主屋：登録有形文化財（建造物）、2015年11月17日登録、明治期（1898〜1912年）の建築、2013年改修（文化遺産オンライン）","旧木村酒造場舟蔵：登録有形文化財（建造物）、2015年11月17日登録（国指定文化財等データベース）","朝来市の一覧で、旧木村酒造場は国登録文化財（有形文化財・建造物）、所在は和田山町竹田（登録年は同ページに記載なし）","参考（施設そのものの指定ではない）：竹田城跡は国指定史跡（1943年9月8日指定、2009年7月23日追加指定）。ホテルは城跡の東のふもとに建つ"],"highlights":["国の登録有形文化財の旧木村酒造場店舗兼主屋","竹田城跡のふもと。城跡を望む客室や中二階のカフェ","旧発酵蔵のレストランと、舟蔵・米蔵など酒造りの建物"],"talks":[{"label":"①歴史・物語から","text":"こちらは、天空の城として知られる竹田城跡のふもとにあるホテルです。もとは、約400年酒造りを続けた旧木村酒造場で、店舗兼主屋と舟蔵は、国の登録有形文化財になっています。店舗兼主屋は、竹田城跡の東のふもとに建つ大型の町家で、町並み景観の核とされています。米蔵や舟蔵、貯蔵所なども、地域の職人の手で生まれ変わりました。近くには、お寺が並ぶ寺町通りもあります。お部屋で、酒造りの歴史と城下町の空気を感じてみてください。"},{"label":"②建築・見どころから","text":"竹田では、まず建物をご覧ください。店舗兼主屋は、竹田城跡の東のふもとで通りに面して建つ大きな町家です。正面に下屋と格子があり、屋根の両端にはうだつが立ち上がります。柱や梁は重厚で上質で、町並みの核となると、国の登録の解説にあります。敷地の西には、大きな土蔵の舟蔵があり、かつては麹室がありました。城跡を望む景色も、見どころのひとつです。"},{"label":"③お客様の場面から","text":"お食事の場面を思い浮かべてください。旧発酵蔵のレストランでは、地元但馬の食材を使ったフレンチをお楽しみいただけます。宴会場としても使われています。お泊まりは、約400年酒造りを続けた旧木村酒造場の建物です。米蔵は店舗に、貯蔵所は観光案内所になっています。竹田城跡のふもとで、食べて、泊まって、まち歩きの案内まで、ひとつの場所で過ごせます。"}],"talk":"こちらは、天空の城として知られる竹田城跡のふもとにあるホテルです。もとは、約400年酒造りを続けた旧木村酒造場で、店舗兼主屋と舟蔵は、国の登録有形文化財になっています。店舗兼主屋は、竹田城跡の東のふもとに建つ大型の町家で、町並み景観の核とされています。米蔵や舟蔵、貯蔵所なども、地域の職人の手で生まれ変わりました。近くには、お寺が並ぶ寺町通りもあります。お部屋で、酒造りの歴史と城下町の空気を感じてみてください。","sources":[{"title":"竹田城 城下町 ホテルEN（公式）","url":"https://www.vmg.co.jp/venues/takeda.html"},{"title":"旧木村酒造場店舗兼主屋（文化遺産オンライン）","url":"https://online.bunka.go.jp/heritages/detail/237981"},{"title":"旧木村酒造場舟蔵（国指定文化財等データベース）","url":"https://kunishitei.bunka.go.jp/bsys/maindetails/101/00010868"},{"title":"竹田城跡（国指定文化財等データベース）","url":"https://kunishitei.bunka.go.jp/heritage/detail/401/1874"},{"title":"国指定・国登録・国選定文化財一覧（朝来市）","url":"https://www.city.asago.hyogo.jp/site/kyoiku/2899.html"},{"title":"竹田城の歴史（朝来市）","url":"https://www.city.asago.hyogo.jp/site/takeda/3092.html"},{"title":"竹田城跡周辺（朝来市）","url":"https://www.city.asago.hyogo.jp/site/takeda/1109.html"},{"title":"但馬竹田城（兵庫県立歴史博物館）","url":"https://rekihaku.pref.hyogo.lg.jp/castle/takeda/"},{"title":"ビューポイントから見える「歴史的町並み」（兵庫県）","url":"https://web.pref.hyogo.lg.jp/ks20/150/ruikei/rekimachi.html"}]},{"id":"isekawasaki","name":"NIPPONIA HOTEL 伊勢河崎 商人町","abbr":"ISK","region":"三重","district":"河崎","group":"ホテル＆レストラン","url":"https://vmg-isekawasaki.com/","ready":true,"draft":false,"area":"三重県伊勢市河崎（フロント所在地は河崎2丁目14-12）","summary":"勢田川ぞいの問屋街・河崎の商家や蔵に泊まる、分散型ホテルです。","history":"河崎は、伊勢市の中心を流れる全長7km余りの勢田川の中流域の両側に広がる小さな町です。公式ページによると、室町時代に環濠と土塁で囲まれた町として発展を始め、安土桃山時代には勢田川の水運を活かした問屋街として栄えました。江戸時代にはお伊勢参りのブームの中で、参拝客への物資の供給地となり、「伊勢の台所」と呼ばれました。神宮の神職である御師が参拝客をもてなす物資を調達したのも、この問屋街です。明治時代には、御師制度の廃止や自動車の普及があっても、河崎は伊勢の商業の中心地としてにぎわい続けました。昭和49年の七夕水害をきっかけにした河川改修で勢田川の景観は大きく変わりましたが、川に沿う歴史ある町並みは、今も町の人々に守られていると伊勢河崎商人館のサイトは伝えています。","usage":"まちに点在する歴史的な建物を
