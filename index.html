<!DOCTYPE html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>HM_サービスマニュアル</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&family=Shippori+Mincho:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f8f4ec; --card:#fffdf9; --primary:#26334d; --primary-ink:#fffdf9; --primary-soft:#efe7d6;
  --accent:#a98349; --accent-ink:#7a5c2c; --hero-a:#26334d; --hero-b:#3d4c6e; --hero-ink:#fffdf9;
  --text:#2b2622; --subtext:#7a7066; --border:#e2d8c6; --hair:#ece4d4;
  --success:#4a8f6a; --ok-ink:#2f6b4a; --ok-soft:#e8f2ea; --danger:#a8383f; --ng-soft:#f6e7e6;
  --warn-bg:#f7ecd4; --warn-ink:#6b4a12; --mark:#f3e1a8;
  --shadow:0 1px 2px rgba(60,45,20,.06),0 8px 22px rgba(60,45,20,.07);
  --num:"Shippori Mincho","Hiragino Mincho ProN","Yu Mincho",serif;
  --hdr:56px; --nav:64px; --safe-b:env(safe-area-inset-bottom,0px); --r:16px;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#14120f; --card:#1f1b16; --primary:#d9bb7e; --primary-ink:#1a1610; --primary-soft:#2b2418;
    --accent:#d9bb7e; --accent-ink:#e6cf9f; --hero-a:#3a2f1a; --hero-b:#2a2314; --hero-ink:#f3ece0;
    --text:#f3ece0; --subtext:#a89c8a; --border:#3a342b; --hair:#2a261f;
    --success:#5fb784; --ok-ink:#7fd0a1; --ok-soft:#18281f; --danger:#e07a80; --ng-soft:#3a1d1f;
    --warn-bg:#3a2c10; --warn-ink:#ffd98a; --mark:#5a4a12;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 22px rgba(0,0,0,.35);
  }
}
:root[data-theme="dark"]{
  --bg:#14120f; --card:#1f1b16; --primary:#d9bb7e; --primary-ink:#1a1610; --primary-soft:#2b2418;
  --accent:#d9bb7e; --accent-ink:#e6cf9f; --hero-a:#3a2f1a; --hero-b:#2a2314; --hero-ink:#f3ece0;
  --text:#f3ece0; --subtext:#a89c8a; --border:#3a342b; --hair:#2a261f;
  --success:#5fb784; --ok-ink:#7fd0a1; --ok-soft:#18281f; --danger:#e07a80; --ng-soft:#3a1d1f;
  --warn-bg:#3a2c10; --warn-ink:#ffd98a; --mark:#5a4a12;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 22px rgba(0,0,0,.35);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%;scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--text);font-size:16px;
  font-family:"Noto Sans JP","Hiragino Sans","Yu Gothic",sans-serif;line-height:1.7}
button,input,textarea{font:inherit;color:inherit}
button{touch-action:manipulation}
:focus-visible{outline:3px solid var(--primary);outline-offset:2px;border-radius:8px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.app{max-width:720px;margin:0 auto;padding:0 16px calc(var(--nav) + var(--safe-b) + 28px);min-height:100vh}
body.running .app{padding-bottom:calc(96px + var(--safe-b))}

/* ヘッダー */
.hdr{position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:10px;height:var(--hdr);margin:0 -16px;padding:0 16px;
  background:var(--bg);border-bottom:1px solid var(--hair)}
@supports (backdrop-filter:blur(8px)){.hdr{background:color-mix(in srgb,var(--bg) 86%,transparent);backdrop-filter:saturate(1.5) blur(14px)}}
.brand{flex:1;min-width:0;line-height:1.25}
.brand b{display:block;font-family:var(--num);letter-spacing:.06em;font-size:17px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
@media (max-width:480px){
  .hdr{gap:8px}
  .me{max-width:44%}
  .brand b{font-size:12.5px;letter-spacing:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .brand small{display:none!important}
}
.brand small{display:block;font-size:11px;color:var(--subtext);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.me{display:inline-flex;align-items:center;gap:8px;max-width:50%;min-height:44px;padding:3px 12px;line-height:1.25;text-align:left;border:1px solid var(--border);
  background:var(--card);border-radius:999px;font-size:13px;font-weight:700;cursor:pointer;color:var(--primary)}
.me span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:block}
.me small{display:block;font-size:10px;font-weight:500;color:var(--subtext);overflow:hidden;text-overflow:ellipsis}
.me b{display:block;font-size:14px;overflow:hidden;text-overflow:ellipsis}
.me svg{flex:0 0 auto}
.ibtn{flex:0 0 auto;width:40px;height:40px;border:1px solid var(--border);background:var(--card);border-radius:50%;cursor:pointer;display:grid;place-items:center;color:var(--subtext)}
body.running .hdr,body.running .notice{display:none}

.notice{margin:12px 0 0;padding:10px 14px;border-radius:14px;background:var(--primary-soft);font-size:13px}
.notice.warn{background:var(--warn-bg);color:var(--warn-ink)}

/* 下のナビ */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:40;display:flex;justify-content:center;
  padding-bottom:var(--safe-b);background:var(--card);border-top:1px solid var(--hair)}
@supports (backdrop-filter:blur(8px)){.nav{background:color-mix(in srgb,var(--card) 88%,transparent);backdrop-filter:saturate(1.5) blur(14px)}}
.nav-in{display:flex;width:100%;max-width:720px}
.nav button{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;height:var(--nav);
  border:0;background:none;color:var(--subtext);font-size:11px;font-weight:500;cursor:pointer;position:relative}
.nav button[aria-selected="true"]{color:var(--accent-ink);font-weight:700}
.nav button[aria-selected="true"]::before{content:"";position:absolute;top:0;left:30%;right:30%;height:3px;border-radius:0 0 3px 3px;background:var(--accent)}
.nav svg{width:24px;height:24px}
body.running .nav{display:none}

/* 施設紹介 */
.fgroup{margin:20px 2px 8px;font-size:12px;font-weight:700;letter-spacing:.08em;color:var(--subtext)}
.fcard{display:block;width:100%;text-align:left;padding:14px 16px;border:1px solid var(--hair);background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);margin-bottom:10px;cursor:pointer;color:inherit;font:inherit}
.fcard b{display:block;font-family:var(--num);font-size:17px;line-height:1.5;letter-spacing:.02em}
.fcard small{display:block;margin-top:2px;font-size:12px;color:var(--subtext)}
.fcard p{margin:6px 0 0;font-size:13px;line-height:1.7}
.fcard.mine{border-color:var(--accent)}
.fcard .tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.fback{display:inline-flex;align-items:center;gap:4px;min-height:44px;border:0;background:none;color:var(--accent-ink);font-size:14px;font-weight:700;cursor:pointer;padding:0}
.fsec{margin:14px 0 0;padding:16px 18px;border-radius:var(--r);background:var(--card);border:1px solid var(--hair);box-shadow:var(--shadow)}
.fsec h2{margin:0 0 8px;font-family:var(--num);font-size:16px;font-weight:700;letter-spacing:.04em;padding-left:10px;border-left:3px solid var(--accent)}
.fsec p{margin:0;font-size:15px;line-height:1.85;white-space:pre-line;overflow-wrap:anywhere}
.fsec ol{margin:0;padding-left:1.4em;font-size:15px;line-height:1.85}
.fsec.talk{background:var(--warn-bg);border-color:transparent}
.fsec.talk p{color:var(--warn-ink)}
.fsec .fhint{margin-top:10px;font-size:12px;line-height:1.7;color:var(--subtext)}
.fact{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0 0}
.fact .btn{flex:1 1 140px;min-height:46px;font-size:14px;padding:0 12px;text-align:center;text-decoration:none;color:inherit;display:inline-flex;align-items:center;justify-content:center}
.fsrc{list-style:none;margin:0;padding:0;font-size:13px;line-height:1.7}
.fsrc li{padding:6px 0;border-top:1px solid var(--hair);overflow-wrap:anywhere}
.fsrc li:first-child{border-top:0}
.fsrc a{color:var(--accent-ink)}
.abbr{display:inline-block;margin-right:8px;padding:0 8px;border:1px solid var(--accent);border-radius:6px;font-family:var(--num);font-size:12px;font-weight:700;letter-spacing:.08em;color:var(--accent-ink)}
.fdes{list-style:none;margin:12px 0 0;padding:0}
.fdes li{margin-top:6px;padding:8px 12px;border-radius:10px;background:var(--ok-soft);color:var(--ok-ink);font-size:13px;line-height:1.7;overflow-wrap:anywhere;white-space:pre-line}
.fnote{margin:12px 0 0;padding:10px 14px;border-radius:12px;background:var(--warn-bg);color:var(--warn-ink);font-size:12px;line-height:1.7}
.fnote summary{cursor:pointer;font-weight:700;min-height:24px}
.fnote ul{margin:8px 0 0;padding-left:1.3em}
.fnote li{margin-top:6px}

/* 共通部品 */
.page-title{margin:22px 0 6px;font-family:var(--num);font-size:24px;font-weight:700;line-height:1.35;letter-spacing:.04em}
.page-title::after{content:"";display:block;width:36px;height:2px;margin-top:8px;background:var(--accent);border-radius:2px}
.page-sub{margin:0 0 14px;font-size:13px;color:var(--subtext)}
.finder{padding:12px 0 4px}
.search-big{display:block;position:relative}
.search-big svg{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--subtext);pointer-events:none}
.search-big input{width:100%;height:52px;border:2px solid transparent;background:var(--card);border-radius:16px;padding:0 16px 0 44px;font-size:16px;box-shadow:var(--shadow)}
.search-big input:focus{border-color:var(--primary);outline:none}
.chips{display:flex;gap:8px;overflow-x:auto;padding:12px 16px 4px;margin:0 -16px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;min-height:40px;border:1px solid var(--border);background:var(--card);border-radius:999px;padding:0 16px;font-size:14px;cursor:pointer;white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--primary);border-color:var(--primary);color:var(--primary-ink);font-weight:700}
.chip.toggle[aria-pressed="false"]{color:var(--subtext)}
.seg{display:flex;padding:3px;border-radius:14px;background:var(--hair)}
.seg button{flex:1;min-height:40px;border:0;background:transparent;border-radius:11px;padding:0 14px;font-size:14px;cursor:pointer;color:var(--subtext);font-weight:500}
.seg button[aria-pressed="true"]{background:var(--card);color:var(--text);font-weight:700;box-shadow:0 1px 3px rgba(0,0,0,.12)}
.row{display:flex;gap:10px;flex-wrap:wrap;margin:12px 0}
.btn{min-height:48px;border:1px solid var(--border);background:var(--card);border-radius:14px;padding:0 18px;cursor:pointer;font-size:15px;font-weight:500}
.btn.primary{background:var(--primary);border-color:var(--primary);color:var(--primary-ink);font-weight:700}
.btn.done{background:var(--success);border-color:var(--success);color:#fff;font-weight:700}
.btn.block{display:block;width:100%;min-height:54px;font-size:16px}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.count{font-size:12px;color:var(--subtext);margin:12px 2px 8px}
.hint{font-size:12px;color:var(--subtext);margin:8px 2px 0}
.empty{padding:40px 12px;text-align:center;color:var(--subtext)}
.skel{height:92px;border-radius:var(--r);background:linear-gradient(90deg,var(--hair),var(--card),var(--hair));background-size:200% 100%;animation:sh 1.2s infinite;margin:12px 0}
@keyframes sh{to{background-position:-200% 0}}
mark{background:var(--mark);color:inherit;border-radius:3px;padding:0 1px}
.tag{display:inline-block;font-size:11px;font-weight:500;border-radius:6px;padding:1px 8px;background:var(--primary-soft);color:var(--primary);white-space:nowrap}
.tag.warn{background:var(--warn-bg);color:var(--warn-ink)}
.tag.ok{background:var(--ok-soft);color:var(--ok-ink)}
.card{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);margin-bottom:12px;overflow:hidden;border:1px solid var(--hair)}
.card-in{padding:16px 18px}
.vbtns{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.vbtns button,.vbtns a{display:inline-flex;align-items:center;gap:6px;min-height:40px;font-size:13px;text-decoration:none;border:1px solid var(--primary);color:var(--primary);background:transparent;border-radius:999px;padding:0 14px;cursor:pointer}
.more{display:flex;align-items:center;justify-content:center;gap:6px;width:100%;min-height:44px;border:0;border-top:1px solid var(--hair);background:none;color:var(--primary);font-size:14px;font-weight:700;cursor:pointer}

/* 手順カード */
.pcard h3{margin:2px 0 8px;font-size:17px;line-height:1.45}
.p-meta{margin:0;font-size:12px;color:var(--subtext)}
.p-who{margin:0 0 6px;font-size:12px;color:var(--subtext)}
.p-lines{list-style:none;margin:0;padding:0}
.p-lines li{padding:10px 0;border-top:1px solid var(--hair);font-size:15px;white-space:pre-line;overflow-wrap:anywhere}
.p-lines li:first-child{border-top:0}
.p-lines li.key{font-weight:500}
.where{display:inline-block;font-size:11px;background:var(--primary-soft);color:var(--primary);border-radius:6px;padding:1px 7px;margin-right:6px;white-space:nowrap}

/* 担当別ガイド */
.ginfo{font-size:12px;color:var(--subtext);background:var(--card);border-radius:12px;padding:10px 12px;margin:12px 0 0;box-shadow:var(--shadow)}
.gh{position:sticky;top:var(--hdr);z-index:5;margin:18px -16px 8px;padding:8px 16px;font-family:var(--num);font-size:15px;font-weight:700;letter-spacing:.12em;color:var(--accent-ink);background:var(--bg)}
.gs{margin:10px 2px 6px;font-size:12px;color:var(--subtext);font-weight:700}
.gcard h3{margin:4px 0 4px;font-size:17px;line-height:1.45;overflow-wrap:anywhere;white-space:pre-line}
.g-tags{display:flex;gap:6px;flex-wrap:wrap}
.g-who{margin:0 0 10px;font-size:12px;color:var(--subtext)}
.gkey{border-radius:14px;padding:10px 14px;background:var(--primary-soft)}
.gkey .glabel{color:var(--primary);font-weight:700}
.gkey p{margin:0;font-size:15px;font-weight:500;white-space:pre-line;overflow-wrap:anywhere}
.gkey.clamp p{display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden}
.gblk{padding:12px 0 0}
.glabel{display:block;font-size:11px;color:var(--subtext);letter-spacing:.06em;margin-bottom:2px;font-weight:700}
.gblk p{margin:0;font-size:15px;white-space:pre-line;overflow-wrap:anywhere}
.gblk.phrase p{background:var(--hair);border-radius:12px;padding:10px 14px;font-size:14px}
.grule{margin:12px 0 0;font-size:13px;white-space:pre-line;border-left:3px solid var(--primary);padding:2px 0 2px 12px;overflow-wrap:anywhere}

/* 確認テスト */
.hero{padding:22px 20px;border-radius:var(--r);background:linear-gradient(155deg,var(--hero-a),var(--hero-b));color:var(--hero-ink);box-shadow:var(--shadow);margin-top:16px;position:relative;overflow:hidden}
.hero::after{content:"";position:absolute;right:-40px;top:-40px;width:140px;height:140px;border-radius:50%;border:1px solid rgba(217,187,126,.45)}
.hero p{margin:0}
.hero .big{font-family:var(--num);font-size:34px;font-weight:700;line-height:1.2;letter-spacing:.04em}
.hero .sub:first-child{color:#d9bb7e;letter-spacing:.14em;font-weight:700}
.hero .sub{font-size:13px;opacity:.9;margin-top:4px}
.hero .btn{margin-top:16px;background:var(--bg);color:var(--primary);border-color:var(--bg)}
.stat{display:flex;gap:10px;margin:12px 0}
.stat>div{flex:1;background:var(--card);border-radius:14px;padding:12px;box-shadow:var(--shadow);text-align:center}
.stat b{display:block;font-family:var(--num);font-size:22px}
.stat span{font-size:11px;color:var(--subtext)}
details.qd{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);margin:12px 0}
details.qd summary{list-style:none;cursor:pointer;padding:14px 18px;font-size:14px;font-weight:700;display:flex;justify-content:space-between;align-items:center}
details.qd summary::-webkit-details-marker{display:none}
details.qd[open] summary{border-bottom:1px solid var(--hair)}
.qlist{list-style:none;margin:0;padding:4px 18px 8px}
.qlist li{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-top:1px solid var(--hair);font-size:14px}
.qlist li:first-child{border-top:0}
.qmark{flex:0 0 3.6em;font-size:11px;color:var(--subtext);padding-top:2px}
.qmark.ok{color:var(--ok-ink)}.qmark.ng{color:var(--danger)}
.qlist button{border:0;background:none;text-align:left;cursor:pointer;padding:0;font-size:14px;color:var(--text);overflow-wrap:anywhere;min-height:24px}
.qtop{display:flex;align-items:center;gap:12px;height:var(--hdr)}
.qbar{flex:1;height:8px;border-radius:99px;background:var(--hair);overflow:hidden}
.qbar i{display:block;height:100%;background:var(--primary);border-radius:99px;transition:width .3s ease}
.qcount{font-size:13px;font-weight:700;font-variant-numeric:tabular-nums;color:var(--subtext)}
.qcard{padding:8px 2px}
.qtype{display:inline-block;margin:6px 0 0;font-size:12px;font-weight:700;color:var(--primary);background:var(--primary-soft);border-radius:8px;padding:2px 10px}
.qtext{margin:12px 0 8px;font-family:var(--num);font-size:20px;line-height:1.6;font-weight:500;overflow-wrap:anywhere}
.qbtns{display:grid;gap:10px;margin:18px 0}
.qopt{display:flex;align-items:flex-start;gap:12px;width:100%;text-align:left;min-height:60px;border:2px solid var(--border);background:var(--card);border-radius:16px;padding:14px 16px;font-size:16px;cursor:pointer;overflow-wrap:anywhere}
.qopt .lt{flex:0 0 28px;height:28px;border-radius:50%;display:grid;place-items:center;font-size:13px;font-weight:700;background:var(--hair);color:var(--subtext)}
.qopt:active{transform:scale(.985)}
.qopt.tf{justify-content:center;align-items:center;min-height:96px;font-size:40px;font-weight:700;font-family:var(--num)}
.qopt.ok{border-color:var(--success);background:var(--ok-soft)}
.qopt.ok .lt{background:var(--success);color:#fff}
.qopt.ng{border-color:var(--danger);background:var(--ng-soft)}
.qopt.ng .lt{background:var(--danger);color:#fff}
.qopt[disabled]{cursor:default}
.qgrid2{grid-template-columns:1fr 1fr}
textarea.qans{width:100%;min-height:140px;border:2px solid var(--border);background:var(--card);border-radius:16px;padding:14px 16px;font-size:16px;line-height:1.6;resize:vertical}
textarea.qans:focus{border-color:var(--primary);outline:none}
.qbanner{display:flex;align-items:center;gap:10px;margin:8px 0;padding:14px 16px;border-radius:16px;font-weight:700;font-size:17px}
.qbanner .ic{flex:0 0 32px;height:32px;border-radius:50%;display:grid;place-items:center;color:#fff;font-size:18px}
.qbanner.ok{background:var(--ok-soft);color:var(--ok-ink)}.qbanner.ok .ic{background:var(--success)}
.qbanner.ng{background:var(--ng-soft);color:var(--danger)}.qbanner.ng .ic{background:var(--danger)}
.qbanner.info{background:var(--primary-soft);color:var(--primary)}
.qexp{margin:10px 2px;font-size:15px;white-space:pre-line;overflow-wrap:anywhere}
.qdock{position:fixed;left:0;right:0;bottom:0;z-index:45;padding:12px 16px calc(12px + var(--safe-b));background:var(--bg);border-top:1px solid var(--hair)}
.qdock-in{display:flex;gap:10px;max-width:720px;margin:0 auto}
.qdock .btn{flex:1;min-height:54px;font-size:16px}
.ring{display:block;margin:20px auto 8px}
.ring circle{fill:none;stroke-width:12}
.ring .tr{stroke:var(--hair)}
.ring .pr{stroke:var(--danger);stroke-linecap:round;transform:rotate(-90deg);transform-origin:50% 50%;transition:stroke-dashoffset .8s ease}
.ring.pass .pr{stroke:var(--success)}
.ring text{font-family:var(--num);font-weight:700;fill:var(--text)}
.verdict{text-align:center;font-family:var(--num);font-size:23px;font-weight:700;margin:4px 0}
.verdict.pass{color:var(--ok-ink)}.verdict.fail{color:var(--danger)}
.vsub{text-align:center;font-size:13px;color:var(--subtext);margin:0 0 12px}

/* ホーム・続ける仕掛け */
.st-top{display:flex;align-items:center;justify-content:space-between;gap:12px}
.st-num{margin:0;font-size:15px;color:var(--subtext)}
.st-num b{font-family:var(--num);font-size:44px;line-height:1;color:var(--accent);margin-right:4px;font-variant-numeric:tabular-nums}
.st-msg{margin:0;font-size:13px;color:var(--subtext);text-align:right;max-width:58%;text-wrap:balance}
.dots{display:flex;justify-content:space-between;margin-top:14px}
.dot{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:11px;color:var(--subtext)}

  MOCK.facilities = /*MOCK_FAC_BEGIN*/{"facilities":[{"id":"hakodate","name":"NIPPONIA HOTEL 函館 港町","abbr":"HKD","region":"北海道","district":"函館ベイエリア","group":"ホテル＆レストラン","url":"https://www.vmg.co.jp/venues/hakodate.html","ready":false,"draft":true,"area":"北海道函館市豊川町","summary":"赤レンガ倉庫を改修した、9室の港町オーベルジュです。","history":"函館は、幕末に最初に開かれた港町の一つです。公式ページによると、箱館の開港で異文化が入ってきたことが、独自の景観を生みました。国土交通省の資料では、1855年（安政元年）に開港し、1859年（安政6年）には長崎・横浜とともに本格的な貿易港になったとされています。明治の大火のあとに、今のまちなみの原型ができたとも書かれています。このホテルは、まちのシンボルである赤レンガ倉庫を改修した施設で、赤レンガ倉庫群地区にあります。公式ページには、明治末期から昭和初期の和風・洋風・和洋折衷の建物が多く残ると書かれています。旅行メディアの記事には、明治期に建てられた昆布倉庫を活かしたという説明があります。","usage":"客室は9室で、宿泊と食事を一緒に楽しむオーベルジュとして運営されています。レストランでは、北海道や函館の旬の食材に北欧料理の手法を取り入れた料理を出し、イカ、カニ、マグロなど函館の海の幸を味わえます。内装は、曲線の美しい北欧デザインの家具で整えられ、空間も素材の種類も少なく、シンプルで素朴な印象です。公式ページ（kazenoheritage.jp）では、年間を通したカヌーツアーなど、地元の自然を楽しむ体験も紹介されています。また、赤レンガ倉庫全体を婚礼で貸し切ることもできると書かれています。","value":"函館は開港によって異文化が入り、和風・洋風・和洋折衷の建物が坂道や街路と調和する、独自のまちなみを育てました（公式ページ、国土交通省の資料）。その港町の景観の中で、赤レンガ倉庫は「まちのシンボル」と公式ページに書かれています。倉庫は商いの場として使われてきた建物で、ホテルになっても、レンガ造りの外観や、当時の柱やレンガが残る空間が受け継がれています（公式ページ、旅行メディアの記事）。壊すのではなく改修して使い続けることで、港町の歴史を、宿泊を通して体験できる場所になっています。公式ページによれば、敷地の赤レンガ倉庫は北海道遺産に選定されています。","designation":["重要伝統的建造物群保存地区内のエリア（赤レンガ倉庫群地区）に位置：公式ページ（kazenoheritage.jp）に「赤レンガ倉庫エリアは重要伝統的建造物群保存地区の一部」と読める記述あり。地区名は公式ページに明記なし。範囲図では未確認"],"highlights":["まちのシンボル、赤レンガ倉庫での滞在","北欧デザインの家具とシンプルな内装","函館の海の幸と北欧料理の手法の食事"],"talks":[{"label":"①歴史・物語から","text":"こちらは、函館のまちのシンボルになっている赤レンガ倉庫を改修した、9室だけの港町オーベルジュです。函館は、幕末に最初に開かれた港町の一つで、開港で入ってきた異文化が、このまちならではの景観をつくりました。倉庫だった建物を壊さずに使い、内装は曲線がきれいな北欧デザインの家具で、シンプルにまとめています。レストランでは、函館の旬の食材に北欧料理の手法を合わせた料理を味わえます。保存地区のまちなみを歩いて、港町の歴史もあわせて楽しんでいただけます。"},{"label":"②建築・見どころから","text":"見どころは、赤レンガ倉庫を改修した建物そのものです。函館のまちのシンボルである倉庫で、赤レンガ倉庫群地区にあります。中に入ると、曲線がきれいな北欧デザインの家具が並び、空間も素材も絞ったシンプルで素朴な印象です。古い倉庫の力強さと、北欧らしい静かな雰囲気が同居しています。ここでは、倉庫だった建物の空気を、そのまま味わっていただけます。"},{"label":"③お客様の場面から","text":"泊まることと食べることを、一緒に楽しむ滞在です。客室は9室のオーベルジュで、レストランでは、北海道や函館の旬の食材に北欧料理の手法を合わせた料理を味わえます。イカ、カニ、マグロなど函館の海の幸も楽しめます。公式ページでは、カヌーツアーなど地元の自然を楽しむ体験も紹介されています。婚礼では、赤レンガ倉庫全体を貸し切ることもできます。"}],"talk":"こちらは、函館のまちのシンボルになっている赤レンガ倉庫を改修した、9室だけの港町オーベルジュです。函館は、幕末に最初に開かれた港町の一つで、開港で入ってきた異文化が、このまちならではの景観をつくりました。倉庫だった建物を壊さずに使い、内装は曲線がきれいな北欧デザインの家具で、シンプルにまとめています。レストランでは、函館の旬の食材に北欧料理の手法を合わせた料理を味わえます。保存地区のまちなみを歩いて、港町の歴史もあわせて楽しんでいただけます。","sources":[{"title":"NIPPONIA HOTEL 函館 港町（VMG公式 施設ページ）","url":"https://www.vmg.co.jp/venues/hakodate.html"},{"title":"NIPPONIA HOTEL 函館 港町（kazenoheritage.jp 公式ページ）","url":"https://www.kazenoheritage.jp/hotels/hakodate/"},{"title":"函館市元町末広町伝統的建造物群保存地区（国土交通省 多言語解説文DB・英語）","url":"https://www.mlit.go.jp/tagengo-db/R1-00879.html"},{"title":"函館 赤レンガ倉庫の歴史（るるぶ&more）","url":"https://rurubu.jp/andmore/article/18264"},{"title":"NIPPONIA HOTEL 函館 港町（まっぷるトラベルガイド）","url":"https://www.mapple.net/original/565961/"},{"title":"NIPPONIA HOTEL 函館 港町（日本旅行 TRIPA）","url":"https://www.nta.co.jp/media/tripa/articles/rvSNN"},{"title":"金森倉庫群周辺の区域（国土交通省 多言語解説文DB）","url":"https://www.mlit.go.jp/tagengo-db/R1-00881.html"}],"note":"ホテルの建物の建築年は確認できていません。公式は「明治」としか書いておらず（kazenoheritage.jp）、旅行メディアも「明治期」のみです。\n「昆布倉庫だった」という点は旅行メディア（るるぶ&more）1件のみで、公式ページでは確認できていません。そのため断定せず、記事の説明として書いています。\nホテルが保存地区のどの地区名（函館市元町末広町など）に入るかは、公式ページに地区名がなく、範囲図でも確認できていません。国土交通省の資料では元町末広町地区は1989年に国が選定とありますが、豊川町11-8がその範囲内かは未確認です。\nVMG公式ページは「函館は重要伝統的建造物群保存地区に指定」とまち全体のように書いており、kazenoheritage.jpの「赤レンガ倉庫エリアは保存地区の一部」という書き方と粒度が違います。\n公式ページの「敷地の赤レンガ倉庫は北海道遺産に選定」は、他の出典で裏づけていません。\n旅行メディアには2021年4月にホテルとして開業と読める記述がありますが、公式で確認できていないため本文には入れていません。\nホテルの建物が、隣接する金森赤レンガ倉庫（1887年創業の渡邉熊四郎の倉庫業が起源）と同じ建物・同じ系統かどうかは確認できていません。\nレストラン名が出典により異なる（公式ページと旅行記事で別の店名）ため、店名は書いていません。"},{"id":"villakyoto","name":"東山露路 Kazeno Heritage","abbr":"VKT","region":"京都","district":"東山","group":"ホテル＆レストラン","url":"https://www.vmg.co.jp/venues/villakyoto","ready":false,"draft":true,"area":"京都府京都市東山区高台寺北門前通下河原東入鷲尾町523番地","summary":"高台寺のそばにある、茶人の私邸を生かした一日一組限定の宿です。","history":"公式ページによると、この建物の前身は「東山茶寮」で、築約120年の茶人の私邸です。明治後期の1904年頃に、遠州流の茶人・鵜野吾一が茶会のために建てたと伝わります。鵜野は、大阪で「大阪一」ともいわれた割烹料理屋「堺卯楼」の主人だったと紹介されています。茶の湯、建築、庭、料理、工芸を愛した数寄者で、茶人や京都・大阪の文化人を招いて茶会を重ね、交流の場にしていたと伝えられます。建物には、四畳半の茶室、茶室と対になる露地庭、和の居間、洋風の待合があり、和と洋が同居する造りです。遠州流が大切にする「綺麗さび」の美意識が、空間の基調になっているそうです。ただし、1904年頃や鵜野による建築は「伝わる」「頃」という言い方で、確かな史料に基づくかは公式ページからは分かりません。","usage":"公式ページによると、一日一組限定で、定員は1〜6名です。三世代の家族や友人同士の旅行を想定しています。二階建ての建物に、四畳半の茶室、露地庭、和の居間、洋風の待合があります。1階では庭を眺めながら食事をし、茶室でお茶をいただきます。食事を出すレストランはなく、専任コンシェルジュが要望に応じてお店を紹介し、茶道、芸舞妓、京都の歴史・文化に触れるプランも個別に組みます。体験として、玉露体験と、香道・花・茶の文化体験があります。チェックインは「寧々の道別邸 Kazeno Heritage」（下河原町463-23）で行い、スタッフが東山露地まで案内します。","value":"この建物の価値は、茶会のために築かれた私邸の姿を残していることにあります。公式ページによると、前身の「東山茶寮」は明治後期に茶人・鵜野吾一が築いたと伝わり、四畳半の茶室と露地庭を中心に、洋風の待合も備えます。公式ページは、数寄者を建築、庭園、器、花、料理などを一つの世界として捉える人と説明しており、その暮らしと、遠州流の「綺麗さび」の美意識を伝える建物です。また、文化遺産オンラインの説明では、八坂神社、法観寺、清水寺の門前町として栄えたこの一帯の二年坂から高台寺辺りに、大正時代以降の二階建て数寄屋風の町家が見られるとされています。","designation":["重要伝統的建造物群保存地区「京都市産寧坂」（種別：門前町、面積8.2ha、1976年9月4日選定）内に位置すると公式ストーリーページが記載（「産寧坂伝統的建造物群保存地区の静かな路地」）。地区の選定内容の根拠：https://kunishitei.bunka.go.jp/heritage/detail/103/17"],"highlights":["四畳半の茶室と、対になる露地庭","茶人・鵜野吾一が茶会のために築いたと伝わる私邸","和の居間と洋風の待合が並ぶ和洋の造り"],"talks":[{"label":"①歴史・物語から","text":"こちらの東山露地は、もともと「東山茶寮」と呼ばれた、築およそ120年の茶人の私邸です。明治の後期、1904年ごろに、遠州流の茶人だった鵜野吾一さんが、茶会のために建てたと伝えられています。鵜野さんは、大阪の「堺卯楼」という料理屋のご主人で、茶人や文化人の方々をここへお招きして、茶会を重ねていたそうです。建物には、四畳半の茶室と露地のお庭、和の居間、洋風の待合があります。今は一日一組限定で、お庭を眺めながらお食事をしたり、茶室でお茶をいただいたりできます。高台寺や八坂神社も歩いて行ける距離ですので、東山のさんぽもお楽しみください。"},{"label":"②建築・見どころから","text":"見どころは、茶室と庭が対になった造りです。四畳半の茶室と、それに続く露地のお庭、和の居間、洋風の待合があり、和と洋が同居しています。公式ページでは、遠州流が大切にする「綺麗さび」の美意識が空間の基調だと紹介されています。築およそ120年の茶人の私邸という、静かな時間の流れる建物です。ぜひ、茶室と庭の関係にも目を向けてみてください。"},{"label":"③お客様の場面から","text":"一日一組限定で、定員は1〜6名です。三世代のご家族や、ご友人同士の旅行にお使いいただけます。1階ではお庭を眺めながらお食事をし、茶室でお茶をいただきます。レストランはなく、専任のコンシェルジュが、ご希望に合わせてお店を紹介します。玉露体験や、香道・花・茶の文化体験もあります。貸し切りの時間を、ゆったり過ごしていただけます。"}],"talk":"こちらの東山露地は、もともと「東山茶寮」と呼ばれた、築およそ120年の茶人の私邸です。明治の後期、1904年ごろに、遠州流の茶人だった鵜野吾一さんが、茶会のために建てたと伝えられています。鵜野さんは、大阪の「堺卯楼」という料理屋のご主人で、茶人や文化人の方々をここへお招きして、茶会を重ねていたそうです。建物には、四畳半の茶室と露地のお庭、和の居間、洋風の待合があります。今は一日一組限定で、お庭を眺めながらお食事をしたり、茶室でお茶をいただいたりできます。高台寺や八坂神社も歩いて行ける距離ですので、東山のさんぽもお楽しみください。","sources":[{"title":"東山露地 Kazeno Heritage（公式・施設トップ）","url":"https://www.kazenoheritage.jp/hotels/higashiyamaroji/"},{"title":"東山露地 Kazeno Heritage（公式・ストーリー）","url":"https://www.kazenoheritage.jp/hotels/higashiyamaroji/story/"},{"title":"The Villa Higashiyama Roji Kazeno Heritage（公式・英語ストーリー）","url":"https://www.kazenoheritage.jp/en/hotels/higashiyamaroji/story/"},{"title":"京都市産寧坂（国指定文化財等データベース）","url":"https://kunishitei.bunka.go.jp/heritage/detail/103/17"},{"title":"京都市産寧坂（文化遺産オンライン）","url":"https://online.bunka.go.jp/heritages/detail/125134"},{"title":"産寧坂伝統的建造物群保存地区保存計画（京都市）","url":"https://www.city.kyoto.lg.jp/tokei/page/0000281761.html"},{"title":"伝統的建造物群保存地区（京都市）／参考図","url":"https://www.city.kyoto.lg.jp/tokei/page/0000281305.html"},{"title":"東山露地を取り上げた建築媒体の記事（TECTURE MAG、2026-06-19公開）","url":"https://mag.tecture.jp/project/20260619-hotel-vmg-villa-kyoto/"}],"note":"建築年が出典で食い違う。公式は「明治後期」「1904年頃」（いずれも「伝わる」）。TECTURE MAG（2026-06-19公開）は、天井裏の御幣から大正9年（1920）上棟、建主は「当時大阪一といわれた料亭の主人で茶人」（名前の記載なし）、『大正茶道記』に記述がある、と書く。\n上記TECTURE記事は題名が「HOTEL VMG VILLA KYOTO」だが、所在地は下河原町463-23（寧々の道別邸の公式住所）、敷地面積473.05㎡（東山露地の公式は225㎡）と、東山露地の公式情報と合わない。延床198.00㎡は東山露地の建物198㎡と一致する。どちらの建物の記事か確認できないため、年号・人物は本草稿に採用していない。\n鵜野吾一・堺卯楼・「東山茶寮」は公式ページ以外の出典で裏づけられなかった（検索で第三者資料なし）。公式の英語ページでは人名表記が Ueno Goichi と Goichi Uno にゆれる。\n改修の時期・経緯・設計者は公式ページに記載がない（TECTURE記事は設計期間2023.06–2024.01、施工2024.04–2024.09などを載せるが、上記の取り違えの可能性があり不採用）。\n建物が重伝建「京都市産寧坂」の範囲内かは、公式ストーリーの記載のみ。京都市の範囲図は画像で、保存計画に町名（鷲尾町など）の記載がなく、地番との照合ができなかった。公式トップの「まちの分類」も同じ表示。\n祇園新橋地区（別の重伝建、1.4ha、新橋通中心）との関係は、範囲図で確認できず不明。この物件の公式ページは祇園新橋に触れていない。\n京都市「京を彩る建物や庭園」の選定リスト（PDF）、文化庁データベース・文化遺産オンラインで、この建物個別の指定・登録・選定は確認できなかった（リストPDFは文字抽出ができず、全件の照合はできていない）。"},{"id":"chichibu","name":"NIPPONIA 秩父 門前町","abbr":"CCB","region":"埼玉","district":"宮側町","group":"ホテル＆レストラン","url":"https://www.vmg.co.jp/venues/chichibu","ready":false,"draft":true,"area":"埼玉県秩父市宮側町（フロント所在地は宮側町17-5）","summary":"昭和初期の薬局や煙草店を改修した、秩父神社の門前の分散型ホテルです。","history":"秩父は山々に囲まれた土地です。公式ページによると、秩父往還道が峠を越えて上州、信濃、甲斐、武蔵とつながり、山あいでも多くの人や物が集まりました。江戸時代には養蚕、製糸、絹織物が地域の礎となりました。秩父市教育委員会の資料には、秩父神社の周辺で絹の市「絹大市」が開かれ、秩父祭の笠鉾・屋台も登場したこと、この流れが今の市街地が商業の町として発展した一因になったことが書かれています。明治には織物業も盛んになり、「秩父銘仙」は大正・昭和初期に海外からも注目されたと公式ページは紹介しています。秩父神社は崇神天皇の時代の創建と伝えられています。こうした信仰と産業の歴史を持つ秩父神社へ続く参道沿いが、このホテルのある門前町です。","usage":"3棟8室の分散型ホテルです。MARUJU棟は、2017年まで薬局として営業していた築約100年の旧マル十薬局を、梁や壁をほぼそのまま残して改修しました。客室・フロント・レストランがあり、ファブリックには地元の銘仙や織物を使っています。KOIKE・MIYATANI棟は、旧小池煙草店と旧宮谷履物店を改修した客室棟です。ほかに、小池カフェ（店内・テイクアウト）、Restaurant MARUJU（地元食材の創作料理）、秩父和定食の朝食、客室でのフリードリンク（秩父サイダー、ご当地コーラ、地酒など）があります。","value":"小池煙草店は、秩父市教育委員会の資料で「装飾に富んだ昭和初期の店舗併用住宅で、秩父神社参道沿いの角地に建つ木造2階建」と紹介されています。マル十薬局は、公式ページによると明治元年から昭和初期に建てられたとされる建物で、築約100年です。市の資料では、秩父の市街地には絹や織物の取引が行われた建物や商工業の建物が数多く残り、その一部が国の登録有形文化財になっています。ホテルの建物は、絹と織物で栄えた門前の商いのまちの姿を今に伝える歴史的な資源です。","designation":["小池煙草店（KOIKE棟）：国登録有形文化財（建造物）。秩父市教育委員会の資料と公式ページ（KOIKE203号室が登録有形文化財に指定）が根拠"],"highlights":["登録有形文化財の旧小池煙草店に泊まれます","築約100年の旧マル十薬局を改修した棟","地元の銘仙や織物を使った客室の布"],"talks":[{"label":"①歴史・物語から","text":"秩父は山に囲まれた町で、昔から秩父往還道を通って、いろいろな土地の人や物が集まってきました。江戸時代には養蚕や絹織物が盛んで、秩父神社のまわりでは絹の市も開かれたそうです。のちに秩父銘仙も有名になりました。このお宿は、そんな門前町にあった薬局や煙草店を改修した建物です。マル十薬局は築約100年で、2017年まで薬局でした。小池煙草店は昭和初期の建物で、国の登録有形文化財です。ぜひ、参道も歩いてみてください。"},{"label":"②建築・見どころから","text":"ここでは、昭和初期の商いの建物の中に入れます。小池煙草店は、装飾に富んだ木造2階建てで、秩父神社の参道沿いの角地に建っています。国の登録有形文化財です。もう一つのマル十薬局は築約100年で、梁や壁をほぼそのまま残して改修しました。客室の布には、地元の銘仙や織物を使っています。外から眺めるだけでなく、泊まって、建物の中の空気まで味わっていただけます。"},{"label":"③お客様の場面から","text":"お夕食の場面を思い浮かべてください。旧薬局の棟にあるレストランで、地元の食材を使った創作料理をどうぞ。客室では、秩父サイダーやご当地コーラ、地酒などを、フリードリンクとして自由にお飲みいただけます。朝は秩父和定食、小池カフェでひと息つくこともできます。お食事も、お部屋での一杯も、歴史ある建物の中で過ごせるのが、ここに泊まる意味です。"}],"talk":"秩父は山に囲まれた町で、昔から秩父往還道を通って、いろいろな土地の人や物が集まってきました。江戸時代には養蚕や絹織物が盛んで、秩父神社のまわりでは絹の市も開かれたそうです。のちに秩父銘仙も有名になりました。このお宿は、そんな門前町にあった薬局や煙草店を改修した建物です。マル十薬局は築約100年で、2017年まで薬局でした。小池煙草店は昭和初期の建物で、国の登録有形文化財です。ぜひ、参道も歩いてみてください。","sources":[{"title":"NIPPONIA 秩父 門前町（VMG公式）","url":"https://www.vmg.co.jp/venues/chichibu"},{"title":"秩父市教育委員会文化財保護課 発表資料「秩父市街地における国登録有形文化財群を活用した歴史まちづくり」（国土交通省サイト掲載PDF）","url":"https://www.mlit.go.jp/toshi/townscape/content/001966895.pdf"},{"title":"埼玉県 登録有形文化財（建造物）一覧","url":"https://www.pref.saitama.lg.jp/documents/27121/02_r7torokuyukebunkazai.pdf"},{"title":"国指定文化財等データベース（文化遺産オンライン）秩父市（11207）の検索結果","url":"https://online.bunka.go.jp/heritages/search/prefecture_cd:11/city_code:11207/museum:国指定文化財等データベース"},{"title":"秩父神社の歴史・由来（国土交通省 多言語解説文データベース）","url":"https://www.mlit.go.jp/tagengo-db/R1-01212.html"},{"title":"重要伝統的建造物群保存地区一覧（文化庁）","url":"https://www.bunka.go.jp/seisaku/bunkazai/shokai/hozonchiku/judenken_ichiran.html"}],"note":"名称表記が出典で異なる：施設ページの見出しは「NIPPONIA 秩父 門前町」、VMGサイトの施設一覧では「NIPPONIA HOTEL 秩父 門前町」。\n重要伝統的建造物群保存地区：文化庁の一覧（ページ記載で2026年9月4日時点）に秩父市の地区はありません。このため保存地区内とは書けません。景観計画など他の制度との関係は確認できていません。\n小池煙草店の登録年：埼玉県の一覧表に「平16・2・17」と読める行がありますが、表の段組みが崩れており、小池煙草店の行との対応を確定できませんでした。\n所在地：公式ページのフロント所在地は宮側町17-5ですが、県の一覧表で小池煙草店の行と読める部分の地番は番場町です。対応は確定できないため、町名は宮側町のみ記載しました。\n旧マル十薬局・旧宮谷履物店は、国指定文化財等データベースの検索結果に登録有形文化財として確認できませんでした。公式ページの「宮谷家」との関係も未確認です。\nKOIKE203号室が「登録有形文化財に指定」という公式の書き方は、建物全体（小池煙草店）との関係が公式ページだけでははっきりしません。\nマル十薬局の築年：「築約100年」と「明治元年から昭和初期に建築」の2つの書き方があり、年代に幅があります。小池煙草店は「昭和初期」までしか確認できていません。\n門前町という呼び方は公式ページの表現です。秩父神社を紹介する公開ページ（国土交通省）には門前町の記述がなく、門前町としての成り立ちを示す自治体の記述は確認できていません。\n開業年は公式ページに記載がなく、確認できていません。"},{"id":"sasayama","name":"篠山城下町ホテル NIPPONIA","abbr":"SSY","region":"兵庫","district":"河原町・西町","group":"ホテル＆レストラン","url":"https://www.vmg.co.jp/venues/sasayama.html","ready":false,"draft":true,"area":"兵庫県丹波篠山市西町（ONAE所在。公式ページは「篠山市西町25」と表記）ほか、城下町内に点在","summary":"城下町に点在する築100年超の建物を客室にした分散型ホテルです。","history":"丹波篠山の城下町は、篠山城を核につくられたまちです。篠山城は、慶長14年（1609）に徳川家康の命で築かれました。諸大名が築城を助けた公儀（天下）普請で、山陰道を押さえる要衝として重んじられたと、国の史跡の解説にあります。城のまわりには旧武家町と旧商家町が町割りされ、近世の城下町の基本的な構造が今もよく残っています。松平氏のあと、寛延元年（1748）に青山氏が封ぜられ、明治維新まで続きました。公式ページは、このまちを「400年の歴史」を持つ城下町と紹介し、街道筋にあったことから文化が盛んだったと伝えています。公式ページによると、まちは二条城の白書院を模して造られた篠山城を中心とした城下町です。","usage":"公式ページでは、築100年を超える明治前期の元銀行経営者の旧邸宅など、まちに点在する歴史的建造物を客室にした分散型ホテルと紹介されています。客室棟には、旧山陰街道沿いのONAE、春日大社付近のSAWASHIRO、河原町のNOZI・YAMAZINO・KAWARANO、城跡から徒歩5分で一棟貸しのYOMENA、濠に面したNOKONがあります。築100年を超える古民家のレストランでは、関西フレンチ界の巨匠・石井之悠さん監修のお料理を楽しめます。ウェディングの会場としても紹介されています。","value":"篠山城跡は、全体の規模がよく残り、南門の馬出がほぼそのまま残っています。外堀は今も水をたたえ、四角い曲輪が同心状に並ぶ縄張の典型を見られると、国の史跡の解説は述べています。城下町は、国の選定理由で「近世初頭の城下町として特色ある歴史的風致をよく残す」と説明されています。武家町と商家町の町割りが残り、武家屋敷や町家、寺院などが、近世から近代にかけて建てられた姿で伝わります。河原町には、間口が狭く奥行きの深い建物が並び、格子のある町並みが楽しめます。ONAEは、城下町の町並みを形づくる景観重要建造物とされています。","designation":["重要伝統的建造物群保存地区「丹波篠山市篠山」（2004年12月10日選定）。国指定史跡の篠山城跡とその周囲の旧武家町・旧商家町からなり、東西約1,500m・南北約600m（文化遺産オンライン／日本遺産ポータル）","NOZI：国の伝建地区に指定された河原町の一角にあると公式ページに記載","YAMAZINO・KAWARANO：河原町妻入商家群のある河原町に位置すると公式ページに記載（河原町は国の伝建地区と同ページが記載）","ONAE棟：景観重要建造物に指定（公式ページの記載）","参考（施設そのものの指定ではない）：篠山城跡は国指定史跡（1956年12月28日指定）。YOMENAは城跡から徒歩5分と公式に記載"],"highlights":["国指定史跡の篠山城跡を核にした、城下町のまち全体が客室","河原町の妻入商家や長屋を改修した客室（NOZI・YAMAZINO・KAWARANO）","明治期の元銀行経営者の旧邸宅ONAE（景観重要建造物）"],"talks":[{"label":"①歴史・物語から","text":"こちらは、丹波篠山の城下町そのものを楽しむホテルです。まちには、徳川家康の命で築かれた篠山城を中心に、武家町と商家町の町割りが今も残っています。客室は、まちに点在する築100年を超える建物を改修したもので、河原町の客室は、国の伝建地区に指定された河原町の一角にあります。ONAEは明治期に建てられた元銀行経営者の旧住居で、景観重要建造物に指定されています。城下町の歴史に包まれながら、ごゆっくりお過ごしください。"},{"label":"②建築・見どころから","text":"ここでは、お城とまちのつくりをご覧いただけます。篠山城跡では、外堀が今も水をたたえ、南門の前の「馬出」という守りの場所もほぼそのまま残っています。城のまわりには、武家町と商家町の町割りが今も残ります。河原町には、間口が狭く奥行きの深い建物と、格子のある町並みが続きます。公式ページでは、NOZIは国の伝建地区に指定された河原町の一角にあると紹介されています。"},{"label":"③お客様の場面から","text":"お食事の場面から、思い浮かべてください。築100年を超える古民家のレストランで、関西フレンチ界の巨匠・石井之悠さん監修のお料理を楽しめます。お泊まりは、城下町に点在する、築100年を超える建物を改修した客室です。城跡から徒歩5分の一棟貸しのお部屋もあります。ウェディングの会場としても紹介されています。食事も滞在も、城下町の中で過ごせます。"}],"talk":"こちらは、丹波篠山の城下町そのものを楽しむホテルです。まちには、徳川家康の命で築かれた篠山城を中心に、武家町と商家町の町割りが今も残っています。客室は、まちに点在する築100年を超える建物を改修したもので、河原町の客室は、国の伝建地区に指定された河原町の一角にあります。ONAEは明治期に建てられた元銀行経営者の旧住居で、景観重要建造物に指定されています。城下町の歴史に包まれながら、ごゆっくりお過ごしください。","sources":[{"title":"篠山城下町ホテル NIPPONIA（公式）","url":"https://www.vmg.co.jp/venues/sasayama.html"},{"title":"丹波篠山市篠山（文化遺産オンライン）","url":"https://online.bunka.go.jp/heritages/detail/177612"},{"title":"篠山城下町地区（日本遺産ポータルサイト）","url":"https://japan-heritage.bunka.go.jp/ja/culturalproperties/result/880/"},{"title":"篠山城跡（日本遺産ポータルサイト）","url":"https://japan-heritage.bunka.go.jp/ja/culturalproperties/result/878/"},{"title":"篠山城跡（国指定文化財等データベース）","url":"https://kunishitei.bunka.go.jp/heritage/detail/401/1884"},{"title":"河原町妻入商家群（ヒョーゴアーカイブス）","url":"https://web.pref.hyogo.lg.jp/archives/c536.html"}],"note":"ONAE・SAWASHIRO（西町）、YOMENA、NOKONが保存地区の範囲内かは、範囲図を取得できず確認できませんでした（文化庁の地区図PDFは本文を読み取れず）\n河原町内の各客室棟が、地区の範囲内に入るかの範囲図での照合はしていません。公式ページは「国の伝建地区に指定された河原町の一角」（NOZI）と書いています\nONAEの景観重要建造物の指定主体・指定年、ONAEの建築年（明治期としか書かれていません）は確認できませんでした\n「400年の歴史」「二条城の白書院を模した」は公式ページの記述のみで、自治体・文化庁の取得ページでは裏づけを確認できていません（国の史跡解説の築城は1609年）\n社内でいう「分散型開発の起点」や開業年は、取得した公式・自治体ページでは確認できませんでした\n公式ページは所在を「篠山市西町25」と表記しています（現在の市名は丹波篠山市）"},{"id":"sawara","name":"佐原商家町ホテル NIPPONIA","abbr":"SWR","region":"千葉","district":"小野川","group":"ホテル＆レストラン","url":"https://www.vmg.co.jp/venues/sawara.html","ready":false,"draft":true,"area":"千葉県香取市佐原（公式ページの所在地は〒287-0003 香取市イ1708−2、KAGURA棟）","summary":"江戸の水運で栄えた佐原の商家や酒蔵を、まちごと宿に再生したホテルです。","history":"佐原は、利根川の支流の小野川と香取街道が交わる場所にあり、江戸時代から利根川の水運で栄えた商家の町です。江戸時代には全国から商人が集まり、伊能忠敬も商人として暮らしたと公式ページにあります。香取市のページによると、水運で栄えた佐原は「江戸優り」と呼ばれ、人々は江戸の文化を取り入れて自分たちの文化に育てました。文化庁の文化遺産オンラインは、利根川下流域の物資が集まる河港の商業都市として、江戸時代から大正時代まで栄えたと説明しています。この町並みは、1996年（平成8年）12月に、関東で初めて重要伝統的建造物群保存地区に選ばれました。","usage":"町全体を一つのホテルに見立て、築100年を超える商家を含む8つの棟が、町の中に点在しています。客室は、歴史的建造物を改修した13室で、梁や格子などのデザインを残しながら、現代的な内装に整えています。フロントとレストランのKAGURAは、300年以上前に開業した地元の酒蔵「馬場本店酒造」の木造の建物で、かつて実際に日本酒を造っていた空間です。レストランでは、酒粕・醤油・味噌・麹などを使い、日本酒とのペアリングを楽しめる「発酵フレンチ」を出しています。朝食は粕汁などの和朝食です。","value":"佐原の町並みは、利根川水運の河港商業都市として栄えた江戸時代から大正時代の姿を伝えています。保存地区は小野川沿いと香取街道沿いが十字型に広がり、木造や蔵造り、切妻や寄棟、平入や妻入など、さまざまな造りの町家や土蔵、洋館が並びます。小野川沿いには「だし」と呼ばれる荷揚場も残っています。香取市のページでは、商家が家業を受け継いで営む「生きている町並み」と紹介されています。ホテルのGEISHOがある中村屋商店は、店舗が1855年、土蔵が1892年以降の建築で、変形した敷地に合わせた五角形断面の柱が特徴と、香取市のページにあります。","designation":["重要伝統的建造物群保存地区「香取市佐原」（約7.1ヘクタール、平成8年（1996）12月10日選定）。小野川沿いと香取街道沿いの町並みで、公式ページは、小野川沿いの町並みが保存地区に選ばれたと説明し、ホテルの棟はその町に点在すると説明（出典：公式ページ、千葉県、香取市、文化遺産オンライン）","建物（GEISHO＝中村屋商店）：千葉県指定有形文化財（建造物）、平成5年（1993）2月26日指定、対象は店舗兼住宅・土蔵の2棟（出典：千葉県、香取市）"],"highlights":["酒蔵を活かしたレストランの発酵フレンチ","築100年超の商家など8棟が町に点在","小野川沿いの町並みと忠敬橋のまち歩き"],"talks":[{"label":"①歴史・物語から","text":"佐原は、江戸時代に利根川の水運で栄えた商家の町です。小野川と香取街道が交わるこの一帯の町並みは、1996年に関東で初めて重要伝統的建造物群保存地区に選ばれました。このホテルは、町全体を一つのホテルに見立てていて、築100年を超える商家など8つの棟が、町の中に点在しています。フロントとレストランは、300年以上前に開業した酒蔵の建物です。かつてお酒を造っていた空間で、酒粕や麹を使った発酵フレンチを楽しめます。ぜひ、町を歩きながら過ごしてみてください。"},{"label":"②建築・見どころから","text":"佐原の見どころは、さまざまな造りの建物が並ぶ町並みです。木造や蔵造り、屋根の形や入口の向きもさまざまな町家や土蔵、洋館が並びます。小野川沿いには「だし」と呼ばれる荷揚場も残っています。ホテルのGEISHOがある中村屋商店は、店舗が1855年、土蔵が1892年以降の建築で、敷地に合わせた、断面が五角形の柱が特徴です。"},{"label":"③お客様の場面から","text":"夜のお食事の場面からお話しします。レストランKAGURAは、公式ページによると300年以上前に開業した酒蔵の木造の建物で、かつて実際に日本酒を造っていた空間です。そこで、酒粕・醤油・味噌・麹などを使った発酵フレンチを、日本酒とのペアリングとともに楽しめます。朝は粕汁などの和朝食です。お泊まりは、築100年を超える商家を含む、町に点在する棟です。"}],"talk":"佐原は、江戸時代に利根川の水運で栄えた商家の町です。小野川と香取街道が交わるこの一帯の町並みは、1996年に関東で初めて重要伝統的建造物群保存地区に選ばれました。このホテルは、町全体を一つのホテルに見立てていて、築100年を超える商家など8つの棟が、町の中に点在しています。フロントとレストランは、300年以上前に開業した酒蔵の建物です。かつてお酒を造っていた空間で、酒粕や麹を使った発酵フレンチを楽しめます。ぜひ、町を歩きながら過ごしてみてください。","sources":[{"title":"佐原商家町ホテル NIPPONIA（公式）","url":"https://www.vmg.co.jp/venues/sawara.html"},{"title":"香取市佐原の伝統的建造物群保存地区と景観形成地区について（香取市）","url":"https://www.city.katori.lg.jp/living/sumai/machinamihozon.html"},{"title":"佐原の町並み（香取市）","url":"https://www.city.katori.lg.jp/sightseeing/machinami/index.html"},{"title":"国指定史跡・千葉県有形文化財（香取市）","url":"https://www.city.katori.lg.jp/sightseeing/machinami/hozonchiku.html"},{"title":"香取市佐原（文化遺産オンライン・文化庁）","url":"https://online.bunka.go.jp/heritages/detail/149551"},{"title":"重要伝統的建造物群保存地区（千葉県）","url":"https://www.pref.chiba.lg.jp/kyouiku/bunkazai/shitei/kuni/s05-denken.html"},{"title":"香取市の有形文化財（建造物）（千葉県）","url":"https://www.pref.chiba.lg.jp/kyouiku/bunkazai/shitei/shichouson/katori-kenzou.html"}],"note":"公式ページでGEISHOは、見出しで「県指定文化財」、本文で「県の登録有形文化財」と書かれていて食い違います。千葉県の一覧では中村屋商店は「県指定有形文化財（建造物）」なので、designationには県の記載を採りました。\nGEISHOが中村屋商店の建物であることは、公式ページ（GOKOの説明）と建築年1855年が一致することから読んでいます。公式ページが指定名称まで書いているわけではありません。\nKAGURA（馬場本店酒造の建物）の文化財指定は、確認できた公開情報にありませんでした。創業「300年以上前」は公式ページの記載のみで、別の裏づけは取れていません。\n各棟の敷地が保存地区の範囲内かどうかは、範囲図で確認できていません。香取市は範囲を「忠敬橋を中心に小野川沿いと香取街道沿いの道路に面する一宅地」と説明しています。\n公式ページの「築100年超の商家」「8つの棟」は公式の記載です。棟ごとの建築年は、公式ページにない棟（KAGURA、AOIなど）では確認できていません。\n伊能忠敬旧宅（国指定史跡）はホテルの建物ではなく、町並みの中の近隣の史跡です。公式ページが書く「伊能忠敬も商人として暮らした」の裏づけは、香取市のページ（旧宅で30年余り過ごした）で取れています。"},{"id":"takeda","name":"竹田城 城下町 ホテルEN","abbr":"TKD","region":"兵庫","district":"竹田城下","group":"ホテル＆レストラン","url":"https://www.vmg.co.jp/venues/takeda.html","ready":false,"draft":true,"area":"兵庫県朝来市和田山町竹田（字上町西側）","summary":"竹田城跡のふもと、約400年続いた旧木村酒造場を活かしたホテルです。","history":"竹田城は、公式ページでは、但馬守護の山名宗全が1443年から13年をかけて築いたと伝わります。朝来市は、嘉吉年間（1443年頃）に宗全が配下の太田垣氏に築かせたと伝わる（口碑）と説明しています。天正13年（1585）に赤松広秀（広英・広通とも書かれます）が入城し、現在の石垣はこのころ整えられたと考えられています。1600年（慶長5）の関ヶ原の戦いのあと広秀が自刃し、竹田城は廃城となりました。城下町は、円山川が大きく曲がる河川敷を使って計画されたと兵庫県立歴史博物館は説明しています。城山のふもとには、4つの寺と表米神社が並ぶ約600mの「寺町通り」があります。ホテルになった旧木村酒造場は、公式ページで約400年酒造りを続けた酒造所と紹介されています。","usage":"公式ページによると、旧木村酒造の建物を使った、全13室の分散型ブティックホテルです。店舗兼母屋はホテル、米蔵は店舗、舟蔵はレストラン、貯蔵所は観光案内所や情報館として使われています。旧発酵蔵は、地元但馬の食材を使うフレンチレストランと宴会場になっています。朝来市のページでは、明治初期の造り酒屋を改修した「たけだ城下町交流館」が、情報館「天空の城」や宿泊施設、レストラン、カフェ、マルシェなどを備え、平成25年11月にオープンしたと紹介されています。","value":"店舗兼主屋は、竹田城跡の東のふもとで通りに面して建つ大型の町家です。正面に下屋と格子があり、屋根の両端にうだつを立ち上げます。軸部は重厚で上質で、「町並み景観の核となる」と、国の登録の解説にあります。舟蔵は敷地の西側にある大型の土蔵で、かつては麹室があり、絞りなども行われました。竹田城跡に臨む敷地背面の景観にも役立つと説明されています。竹田城跡は、石垣を残す山城として稀有のものと国の史跡の解説は述べています。城下には寺院が並ぶ寺町があり、兵庫県は竹田城下町の寺町通りを歴史的町並みとして紹介しています。","designation":["旧木村酒造場店舗兼主屋：登録有形文化財（建造物）、2015年11月17日登録、明治期（1898〜1912年）の建築、2013年改修（文化遺産オンライン）","旧木村酒造場舟蔵：登録有形文化財（建造物）、2015年11月17日登録（国指定文化財等データベース）","朝来市の一覧で、旧木村酒造場は国登録文化財（有形文化財・建造物）、所在は和田山町竹田（登録年は同ページに記載なし）","参考（施設そのものの指定ではない）：竹田城跡は国指定史跡（1943年9月8日指定、2009年7月23日追加指定）。ホテルは城跡の東のふもとに建つ"],"highlights":["国の登録有形文化財の旧木村酒造場店舗兼主屋","竹田城跡のふもと。城跡を望む客室や中二階のカフェ","旧発酵蔵のレストランと、舟蔵・米蔵など酒造りの建物"],"talks":[{"label":"①歴史・物語から","text":"こちらは、天空の城として知られる竹田城跡のふもとにあるホテルです。もとは、約400年酒造りを続けた旧木村酒造場で、店舗兼主屋と舟蔵は、国の登録有形文化財になっています。店舗兼主屋は、竹田城跡の東のふもとに建つ大型の町家で、町並み景観の核とされています。米蔵や舟蔵、貯蔵所なども、地域の職人の手で生まれ変わりました。近くには、お寺が並ぶ寺町通りもあります。お部屋で、酒造りの歴史と城下町の空気を感じてみてください。"},{"label":"②建築・見どころから","text":"竹田では、まず建物をご覧ください。店舗兼主屋は、竹田城跡の東のふもとで通りに面して建つ大きな町家です。正面に下屋と格子があり、屋根の両端にはうだつが立ち上がります。柱や梁は重厚で上質で、町並みの核となると、国の登録の解説にあります。敷地の西には、大きな土蔵の舟蔵があり、かつては麹室がありました。城跡を望む景色も、見どころのひとつです。"},{"label":"③お客様の場面から","text":"お食事の場面を思い浮かべてください。旧発酵蔵のレストランでは、地元但馬の食材を使ったフレンチをお楽しみいただけます。宴会場としても使われています。お泊まりは、約400年酒造りを続けた旧木村酒造場の建物です。米蔵は店舗に、貯蔵所は観光案内所になっています。竹田城跡のふもとで、食べて、泊まって、まち歩きの案内まで、ひとつの場所で過ごせます。"}],"talk":"こちらは、天空の城として知られる竹田城跡のふもとにあるホテルです。もとは、約400年酒造りを続けた旧木村酒造場で、店舗兼主屋と舟蔵は、国の登録有形文化財になっています。店舗兼主屋は、竹田城跡の東のふもとに建つ大型の町家で、町並み景観の核とされています。米蔵や舟蔵、貯蔵所なども、地域の職人の手で生まれ変わりました。近くには、お寺が並ぶ寺町通りもあります。お部屋で、酒造りの歴史と城下町の空気を感じてみてください。","sources":[{"title":"竹田城 城下町 ホテルEN（公式）","url":"https://www.vmg.co.jp/venues/takeda.html"},{"title":"旧木村酒造場店舗兼主屋（文化遺産オンライン）","url":"https://online.bunka.go.jp/heritages/detail/237981"},{"title":"旧木村酒造場舟蔵（国指定文化財等データベース）","url":"https://kunishitei.bunka.go.jp/bsys/maindetails/101/00010868"},{"title":"竹田城跡（国指定文化財等データベース）","url":"https://kunishitei.bunka.go.jp/heritage/detail/401/1874"},{"title":"国指定・国登録・国選定文化財一覧（朝来市）","url":"https://www.city.asago.hyogo.jp/site/kyoiku/2899.html"},{"title":"竹田城の歴史（朝来市）","url":"https://www.city.asago.hyogo.jp/site/takeda/3092.html"},{"title":"竹田城跡周辺（朝来市）","url":"https://www.city.asago.hyogo.jp/site/takeda/1109.html"},{"title":"但馬竹田城（兵庫県立歴史博物館）","url":"https://rekihaku.pref.hyogo.lg.jp/castle/takeda/"},{"title":"ビューポイントから見える「歴史的町並み」（兵庫県）","url":"https://web.pref.hyogo.lg.jp/ks20/150/ruikei/rekimachi.html"}],"note":"竹田に重要伝統的建造物群保存地区があるかは、朝来市の国指定等の一覧に記載がなく、確認できませんでした。範囲図も取得していません。保存地区内とは書けません\n築城年が食い違います。公式ページは「1443年に13年を費やして」、朝来市は「嘉吉年間（1443年頃）の口碑」、兵庫県立歴史博物館の別ページは「1433（嘉吉3）年に13年かけて」と書いています。落城・赤松氏入城の年も、出典で1577・1580・1585年と分かれます\n城主名の表記が出典で分かれます（赤松広秀・広英・廣通）\n店舗兼主屋の建築年は、文化遺産オンラインでは明治期（1898〜1912年）、朝来市は「明治初期の造り酒屋」、公式は「築110年」と書いています。「約400年」の酒造りと建物の古さの関係は、公式ページ内でもはっきり説明されていません\n公式ページは舟蔵をレストランとしつつ、別の箇所で旧発酵蔵のレストランも紹介しており、どの蔵がどの用途かは整理できていません\n社内資料の「朝来市の指定管理」は、取得した朝来市ページでは確認できませんでした（朝来市ページは「たけだ城下町交流館」内に情報館があることまで）\n朝来市の一覧には登録年の記載がなく、登録の件数・構成は個別ページ（店舗兼主屋・舟蔵）以外は照合していません"},{"id":"isekawasaki","name":"NIPPONIA HOTEL 伊勢河崎 商人町","abbr":"ISK","region":"三重","district":"河崎","group":"ホテル＆レストラン","url":"https://vmg-isekawasaki.com/","ready":false,"draft":true,"area":"三重県伊勢市河崎（フロント所在地は河崎2丁目14-12）","summary":"勢田川ぞいの問屋街・河崎の商家や蔵に泊まる、分散型ホテルです。","history":"河崎は、伊勢市の中心を流れる全長7km余りの勢田川の中流域の両側に広がる小さな町です。公式ページによると、室町時代に環濠と土塁で囲まれた町として発展を始め、安土桃山時代には勢田川の水運を活かした問屋街として栄えました。江戸時代にはお伊勢参りのブームの中で、参拝客への物資の供給地となり、「伊勢の台所」と呼ばれました。神宮の神職である御師が参拝客をもてなす物資を調達したのも、この問屋街です。明治時代には、御師制度の廃止や自動車の普及があっても、河崎は伊勢の商業の中心地としてにぎわい続けました。昭和49年の七夕水害をきっかけにした河川改修で勢田川の景観は大きく変わりましたが、川に沿う歴史ある町並みは、今も町の人々に守られていると伊勢河崎商人館のサイトは伝えています。","usage":"まちに点在する歴史的な建物を、フロント・客室などに生かした分散型ホテルです。公式ページでは5棟8室で、1〜4名で泊まれます。SEICHOは明治期に建てられた商家で、かつて鰻屋・下宿屋・豆腐屋でした。TOKIWAは明治44年に建てられた旧履物屋と蔵、TOKOWAKAは創業270年余の卸問屋が持っていた明治初期の雑貨蔵です。「現代の御師」として神宮巡礼の癒しの空間をめざし、レストランは朝食のみで、神饌の伝統を尊重した朝食を出しています。町駕籠のお伊勢参りや人力車のツアーもあります。","value":"河崎は、勢田川の水運を活かして神宮の参拝客を支えた問屋街です。川の両岸に蔵や町家が並び、船から直接蔵へ荷を入れられるつくりでした。蔵は石堤の上に建つ切妻の土蔵造りで、厚い漆喰の壁を、魚の油と煤を使った黒塗りの刻み囲いが守っています。町並みは伊勢に多い「切妻妻入り」で、河崎独特の縁起物の瓦「隅蓋」も見られます。今は暗渠になった環濠の跡が、町の成り立ちを伝えています。宿の棟も、明治初期や明治44年の建物など、この商人町の暮らしと商いを今に残す建物です。","designation":["（ホテルとは別の施設・同じ河崎地区）伊勢河崎商人館（旧酒問屋の酒蔵と邸宅）：国の登録有形文化財。公式ページに記載。商人館のサイトは、全ての建物が平成13年に国の登録有形文化財になったと記載"],"highlights":["勢田川ぞいの問屋街「伊勢の台所」のまち","明治初期の蔵や明治44年築の旧履物屋に泊まれます","切妻妻入りの商家と河崎独特の隅蓋の町並み"],"talks":[{"label":"①歴史・物語から","text":"河崎は、伊勢神宮の近くを流れる勢田川のほとりにある町です。江戸時代には、お伊勢参りの人たちを支える問屋街として栄え、「伊勢の台所」と呼ばれていました。神宮の神職の御師が、参拝客をもてなす品物を、この町でそろえていたそうです。町には、切妻妻入りの商家や、黒く塗られた蔵が今も残っています。このお宿は、そんな商家や蔵を生かした分散型のホテルで、「現代の御師」をめざしています。朝食は神饌の伝統を大切にしたお料理です。"},{"label":"②建築・見どころから","text":"河崎の見どころは、建物のつくりです。町家は、伊勢に多い「切妻妻入り」といって、屋根の三角の面を正面に向けた形です。蔵は石の堤の上に建ち、厚い漆喰の壁を、魚の油と煤を使った黒塗りの囲いが守っています。河崎ならではの縁起物の瓦「隅蓋」も見られます。川の両岸に蔵が並んだのは、船から直接蔵へ荷を入れるためでした。宿の棟にも、明治初期や明治44年の建物があります。"},{"label":"③お客様の場面から","text":"朝のお食事の場面を思い浮かべてください。ここの朝食は、神様へのお供えの伝統を大切にしたお料理です。この宿は「現代の御師」として、神宮を巡る方の癒しの空間をめざしています。お参りの合間に、商家や蔵だった建物でゆっくり休む。そんな滞在ができます。町駕籠でのお伊勢参りや、人力車のツアーもあります。公式ページでは5棟8室で、1〜4名でお泊まりいただけます。"}],"talk":"河崎は、伊勢神宮の近くを流れる勢田川のほとりにある町です。江戸時代には、お伊勢参りの人たちを支える問屋街として栄え、「伊勢の台所」と呼ばれていました。神宮の神職の御師が、参拝客をもてなす品物を、この町でそろえていたそうです。町には、切妻妻入りの商家や、黒く塗られた蔵が今も残っています。このお宿は、そんな商家や蔵を生かした分散型のホテルで、「現代の御師」をめざしています。朝食は神饌の伝統を大切にしたお料理です。","sources":[{"title":"NIPPONIA HOTEL 伊勢河崎 商人町（公式。vmg-isekawasaki.comは301でこのURLへ転送）","url":"https://www.kazenoheritage.jp/hotels/ise-kawasaki/"},{"title":"まちの成り立ち（公式）","url":"https://www.kazenoheritage.jp/hotels/ise-kawasaki/townscape/history/"},{"title":"コンセプト（公式）","url":"https://www.kazenoheritage.jp/hotels/ise-kawasaki/story/"},{"title":"お部屋（公式）","url":"https://www.kazenoheritage.jp/hotels/ise-kawasaki/rooms/"},{"title":"伊勢河崎とは（伊勢河崎商人館／NPO法人伊勢河崎まちづくり衆）","url":"http://www.isekawasaki.jp/about/"},{"title":"伊勢河崎商人館 トップページ（NPO法人伊勢河崎まちづくり衆）","url":"http://www.isekawasaki.jp/"},{"title":"伊勢河崎商人館（観光三重）","url":"https://www.kankomie.or.jp/spot/3131.html"},{"title":"伊勢市景観計画（伊勢市公式）","url":"https://www.city.ise.mie.jp/machi/keikan/keikaku/index.html"},{"title":"重要伝統的建造物群保存地区一覧（文化庁）","url":"https://www.bunka.go.jp/seisaku/bunkazai/shokai/hozonchiku/judenken_ichiran.html"}],"note":"【食い違い・重要】公式ページの基本情報欄には「まちの分類：重要伝統的建造物群保存地区（重伝建）」とありますが、文化庁の選定地区一覧（ページ記載で2026年9月4日時点）で三重県は亀山市関宿のみで、伊勢市河崎は載っていません。このため designation には入れていません。公式の書き方の意味を、運営側に確認する必要があります。\n伊勢市景観計画のページに河崎の記述はなく、重点地区は内宮おはらい町地区と二見町茶屋地区の2つです。河崎が景観重点地区かどうかは確認できていません。\n伊勢河崎商人館の登録の数え方：観光三重は「12棟が国の登録文化財」、商人館のサイトは「全ての建物が平成13年に国の登録有形文化財」と書き、「指定」「登録」の語も混在しています。件数と種別は文化庁・伊勢市の一次資料で要確認です。\n旧酒問屋の名称が、公式ページは「小川商店」、商人館のサイトは「小川酒店」と異なります。\n公式の客室・施設欄は「5棟8室」ですが、お部屋ページにはSEICHO・ASAMA・ASAGIRI・TOKIWA・KAMIJI・TOKOWAKAの6つの名称があり、棟の数え方が確認できていません。\n宿の建物のうち、建築年が分かるのはSEICHO（明治期）、TOKIWA（明治44年）、TOKOWAKA（明治初期）のみです。ほかの棟の来歴と、各棟の文化財指定の有無は確認できていません。\n室町時代の成立は「銀閣寺が棟上げされた年と同時期」と公式が書くだけで、具体的な年や自治体資料による裏づけは取れていません。江戸時代の御師の人数（約2000人）も公式ページのみの記載です。\n開業年は公式ページに記載がなく、確認できていません。"},{"id":"takehara","name":"NIPPONIA HOTEL 竹原 製塩町","abbr":"TSE","region":"広島","district":"本町","group":"ホテル＆レストラン","url":"https://www.vmg.co.jp/venues/takehara.html","ready":false,"draft":true,"area":"広島県竹原市本町1丁目4-16（公式ページのACCESS欄、〒725-0022）","summary":"塩田で栄えた竹原の町並みに、歴史的建造物3棟を再生した分散型ホテルです。","history":"竹原は広島県沿岸のほぼ中央にあり、瀬戸内海式気候で晴天が多い町です。竹原市のページによると、町は中世の末頃に、港に面した市場集落として形づくられました。江戸時代に塩田が開かれると、廻船業や酒造業とともに、塩の産地として発展しました。公式ページでは、塩田の主「浜旦那」が文化の振興にも力を入れ、竹原は「文教の地」としても知られたとあります。文化遺産オンラインは、江戸後期には学問や茶道が盛んになり、京風の文化が広がったと説明しています。大正期には造り酒屋が26蔵あったとも公式ページにあります。この町並みは、1982年（昭和57年）12月16日に、国の重要伝統的建造物群保存地区に選ばれました。","usage":"町並み保存地区に点在する3棟の歴史的建造物を再生した分散型ホテルで、客室は全10室です。旧水儀本店は、江戸期に創業し昭和50年頃まで料亭だった建物で、いまはフロントとダイニングになっています。旧芸備銀行（現広島銀行）・旧水儀旅館は、明治期に銀行として建てられ、のちに旅館になった建物で、MOSOの客室です。旧水出邸はKIKKOの客室で、大正から昭和にかけてはビリヤード場などの娯楽施設でした。ダイニングでは、竹原のブランド牛「峠下牛」や瀬戸内の海産物を使った料理を出します。","value":"竹原の町並みは、製塩業を土台に、廻船業や酒造業で栄えた江戸時代の町の姿を伝えています。竹原市のページによると、本町通り沿いには江戸中期から明治期の二階建ての町家が多く、切妻造・本瓦葺・大壁造が基本です。妻入りと平入りが混ざり、出格子や平格子など多様な格子が並んで、江戸時代の町人文化の伝統が残っています。市は、近世日本の町づくりの変遷を町の中にとどめていると説明しています。ホテルの旧水儀本店は料亭、旧芸備銀行は銀行から旅館へ、旧水出邸は造り酒屋から娯楽施設へと、時代ごとに役割を変えてきました。","designation":["重要伝統的建造物群保存地区「竹原市竹原地区伝統的建造物群保存地区」（本町一・三・四丁目の一部、約5.0ヘクタール、昭和57年（1982）12月16日選定）。ホテルは公式ページで「町並み保存地区に点在する3棟」と説明され、所在地は本町1丁目（出典：公式ページ、竹原市、文化遺産オンライン）"],"highlights":["塩田の町の歴史を伝える町並み保存地区の宿","旧料亭・旧銀行・旧造り酒屋を再生した3棟","竹原の竹を使った客室と、塩・醤油・牡蠣の食体験"],"talks":[{"label":"①歴史・物語から","text":"竹原は、江戸時代に塩田で栄えた町です。このホテルがある本町通りの一帯は、1982年に国の重要伝統的建造物群保存地区に選ばれました。ホテルは、その町並みに点在する3棟の歴史的建造物を再生した分散型のホテルです。フロントとダイニングは、昭和50年頃まで料亭だった旧水儀本店です。客室には、明治期に銀行として建てられた建物もあります。旧水出邸の向かいには、市の重要文化財の松阪邸もあります。どうぞ、町並みを歩きながら、塩の町の歴史を感じてください。"},{"label":"②建築・見どころから","text":"竹原では、町家のつくりに注目してください。本町通り沿いには、江戸中期から明治期の二階建ての町家が多く、妻入りと平入りが混ざり、出格子や平格子など、いろいろな格子が並んでいます。市は、近世日本の町づくりの移り変わりが町の中に残っていると説明しています。ホテルの旧水儀本店は料亭、旧芸備銀行は銀行から旅館へ、旧水出邸はビリヤード場などの娯楽施設と、時代ごとに役割を変えてきた建物です。"},{"label":"③お客様の場面から","text":"お夕食の場面を思い浮かべてください。ダイニングは、公式ページによると昭和50年頃まで料亭だった建物で、竹原のブランド牛「峠下牛」や瀬戸内の海産物を使った料理をお出ししています。客室は全10室で、銀行から旅館になった建物の客室や、かつて娯楽施設だった建物の客室があります。まちに点在する3棟のどこにも、それぞれの時代の使われ方が重なっています。"}],"talk":"竹原は、江戸時代に塩田で栄えた町です。このホテルがある本町通りの一帯は、1982年に国の重要伝統的建造物群保存地区に選ばれました。ホテルは、その町並みに点在する3棟の歴史的建造物を再生した分散型のホテルです。フロントとダイニングは、昭和50年頃まで料亭だった旧水儀本店です。客室には、明治期に銀行として建てられた建物もあります。旧水出邸の向かいには、市の重要文化財の松阪邸もあります。どうぞ、町並みを歩きながら、塩の町の歴史を感じてください。","sources":[{"title":"NIPPONIA HOTEL 竹原 製塩町（公式）","url":"https://www.vmg.co.jp/venues/takehara.html"},{"title":"竹原市竹原地区伝統的建造物群保存地区（竹原市）","url":"https://www.city.takehara.lg.jp/soshikikarasagasu/bunkashogaigakushuka/gyomuannai/9/1/5/2427.html"},{"title":"町並み保存地区（竹原市）","url":"https://www.city.takehara.lg.jp/soshikikarasagasu/bunkashogaigakushuka/gyomuannai/9/2421.html"},{"title":"竹原市竹原地区（文化遺産オンライン・文化庁）","url":"https://online.bunka.go.jp/heritages/detail/192173"},{"title":"旧松阪家住宅（竹原市）","url":"https://www.city.takehara.lg.jp/soshikikarasagasu/bunkashogaigakushuka/gyomuannai/9/1/10/2437.html"},{"title":"歴史的建造物活用に関するサウンディング型市場調査（竹原市）","url":"https://www.city.takehara.lg.jp/soshikikarasagasu/bunkashogaigakushuka/gyomuannai/9/1/5/4995.html"}],"note":"ホテルの3棟（旧水儀本店、旧芸備銀行・旧水儀旅館、旧水出邸）の個別の文化財指定は、確認できた公開情報にありませんでした。竹原市のページにも、これらの建物名は出てきませんでした。\n保存地区内にあることは、公式ページの「町並み保存地区に点在する3棟」と所在地（本町1丁目）が、市の示す範囲（本町一丁目の一部）に読めることによる判断です。各棟の敷地が範囲図の内側かどうかは、確認できていません。\n塩田の開発時期は出典で書き方が異なります。文化遺産オンラインは「1650年に塩田が開発」、竹原市は「江戸中期に新開へ入浜式塩田が築かれた」としています。historyでは年を書かず「江戸時代に塩田が開かれた」としました。\n公式ページの「明治期印は造り酒屋」は、「明治期には造り酒屋」の誤記と読めますが、確認できていません。usageでは旧水出邸の明治期の用途は書いていません。\n「大正期に造り酒屋が26蔵」「浜旦那が文化を振興」は公式ページのみの記載で、市の資料では裏づけが取れていません。\n公式ページが書く「市の重要文化財『松阪邸』」は、竹原市のページで旧松阪家住宅が市重要文化財（昭和60年4月1日指定）であることを確認しました。ただしホテルの建物ではなく、向かいの建物です。「浜旦那」の語は市のページになく、初代が塩田経営や廻船業を営み「竹原塩浜庄屋」を務めたとあります。\n旧水儀本店の「江戸期創業、昭和50年頃まで料亭」、旧芸備銀行の「明治期に銀行」などの来歴は、公式ページのみの記載です。"},{"id":"iga","name":"NIPPONIA HOTEL 伊賀上野 城下町","abbr":"IGU","region":"三重","district":"上野城下","group":"ホテル＆レストラン","url":"https://www.vmg.co.jp/venues/iga.html","ready":false,"draft":true,"area":"三重県伊賀市上野相生町（〒518-0859、公式ページの所在地は上野相生町2842）","summary":"城下町の碁盤状のまちなかに、町家や登録文化財の建物が点在する分散型ホテルです。","history":"伊賀上野は、築城の名手と呼ばれる藤堂高虎によって整えられた城下町です。京・奈良と伊勢を結ぶ交通の要衝にあり、江戸時代には城下町や宿場町として栄えました（伊賀市の計画書）。公式ページでは、フロント棟のKANMURIは、江戸時代から続いた生薬問屋で、のちに料理旅館、学習施設と用途を変えてきた建物と紹介されています。同じ番地（上野相生町2842）の「栄楽館」について、伊賀市の資料は、江戸期の生薬問屋を改造し、明治6年（1873）に料亭「栄楽亭」として開業した建物と説明しています。昭和58年（1983）に廃業したあとは主人の住まいとなり、のちに市へ寄贈され、改修を経て平成7年（1995）5月に生涯学習施設として開館しました。市は、空き家になった歴史的建物を生かす「伊賀上野城下町ホテル」に取り組み、令和元年度に栄楽館の改修工事を行いました。","usage":"城下町に点在する歴史的な建物を改修し、まちなみそのものに滞在できる分散型のホテルです。KANMURIフロント棟は、城下町の碁盤目状の町並みのほぼ中央にあり、フロント、レストラン、客室として使われています。茶室を備えた客室もあります。KOURAI棟は、津市まで続く伊賀街道の起点に面した町家で、母屋の街道側は組紐の店舗・工房、奥に中庭が続きます。MITAKE棟は、明治初期に建てられた木造2階建ての元材木店で、鍔型の虫籠窓や親子格子が特徴です。別棟の蔵は一棟貸しとして使われています。","value":"伊賀市の計画書は、伊賀上野の市街地を、江戸時代の武家屋敷と明治・大正・昭和の近代建築が共存する、全国的にも貴重なまちなみと説明しています。「伊賀上野城下町の文化的景観」は、日本の20世紀遺産20選にも選ばれています。栄楽館は、江戸期の生薬問屋を明治6年（1873）に料亭へ改めた建物です。室内には扇や竹の意匠が見られ、網代天井など部屋ごとに異なる細工が施されています。商家、料亭、住まい、市の学習施設と使い道を変えながら受け継がれてきた、城下町の暮らしの移り変わりを伝える建物です。","designation":["栄楽館（南棟・東棟・土蔵・門及び塀）：登録有形文化財（建造物）、時代は明治、平成26年（2014）4月25日登録。所在は上野相生町2842で、公式のホテル所在地と同じ番地（根拠：伊賀市「国登録文化財」一覧）","KANMURIフロント棟：公式ページが「国の文化財に登録」された歴史的建物と紹介（根拠：公式ページ。登録名称・年は公式ページに記載なし）"],"highlights":["碁盤目状の城下町のほぼ中央にあるKANMURIフロント棟","伊賀街道の起点に面した町家と、組紐の店舗・工房（KOURAI棟）","明治初期築の元材木店。虫籠窓と親子格子が見どころ（MITAKE棟）"],"talks":[{"label":"①歴史・物語から","text":"ようこそ、伊賀上野の城下町へ。このホテルは、まちに点在する古い建物を改修して、まち全体をホテルに見立てています。フロントのKANMURI棟は、江戸時代から続いた生薬問屋で、のちに料理旅館や学習施設として使われてきた建物です。国の文化財に登録されています。KOURAI棟は、伊賀街道の起点に面した町家で、組紐のお店と工房があります。MITAKE棟は、明治の初めに建てられた元材木店で、虫籠窓や親子格子が見どころです。伊賀上野は、藤堂高虎が整えた城下町で、江戸時代には宿場町としても栄えました。どうぞ、まちの空気も一緒にお楽しみください。"},{"label":"②建築・見どころから","text":"ここでは、棟ごとに見どころがあります。KANMURI棟は、碁盤の目のような城下町のほぼ中央にあり、茶室を備えた客室もあります。KOURAI棟は、津市まで続く伊賀街道の起点に面した町家で、街道側は組紐の店舗・工房、奥には中庭が続きます。MITAKE棟は、明治初期に建てられた元材木店で、鍔型の虫籠窓や親子格子が特徴です。"},{"label":"③お客様の場面から","text":"お泊まりの場面から思い浮かべてください。ここでは、まちなみそのものに泊まることができます。お部屋は、城下町に点在する歴史的な建物を改修したもので、茶室を備えたお部屋もあります。別棟の蔵は、一棟貸しとして使われています。フロントやレストランも、城下町のほぼ中央の建物にあります。お泊まりそのものが、まちなかでの滞在になります。"}],"talk":"ようこそ、伊賀上野の城下町へ。このホテルは、まちに点在する古い建物を改修して、まち全体をホテルに見立てています。フロントのKANMURI棟は、江戸時代から続いた生薬問屋で、のちに料理旅館や学習施設として使われてきた建物です。国の文化財に登録されています。KOURAI棟は、伊賀街道の起点に面した町家で、組紐のお店と工房があります。MITAKE棟は、明治の初めに建てられた元材木店で、虫籠窓や親子格子が見どころです。伊賀上野は、藤堂高虎が整えた城下町で、江戸時代には宿場町としても栄えました。どうぞ、まちの空気も一緒にお楽しみください。","sources":[{"title":"NIPPONIA HOTEL 伊賀上野 城下町（公式）","url":"https://www.vmg.co.jp/venues/iga.html"},{"title":"伊賀市 国登録文化財の一覧（建造物）","url":"https://www.city.iga.lg.jp/cmsfiles/contents/0000003/3870/kunitouroku.pdf"},{"title":"伊賀市 工事監査（令和元年度栄楽館施設改修工事）報告","url":"https://www.city.iga.lg.jp/cmsfiles/contents/0000001/1299/1kouji.pdf"},{"title":"第3期伊賀市中心市街地活性化基本計画（概要版）","url":"https://www.city.iga.lg.jp/cmsfiles/contents/0000011/11353/3_hen_gaiyou.pdf"},{"title":"国土交通省 資料「伊賀市の空き家対策」（2019年）","url":"https://www.mlit.go.jp/sogoseisaku/kanminrenkei/content/001311924.pdf"},{"title":"国土交通省ほか 歴史的風致維持向上計画の認定（平成28年5月）","url":"https://www.mlit.go.jp/common/001131757.pdf"},{"title":"三重県観光連盟 NIPPONIA HOTEL 伊賀上野 城下町","url":"https://www.kankomie.or.jp/spot/25190"},{"title":"三重県観光連盟 KANMURI棟","url":"https://www.kankomie.or.jp/spot/24460"}],"note":"社内資料の「指定管理」は公開資料で確認できませんでした。伊賀市の工事監査報告では、栄楽館は伊賀市所有で、市とNOTEが出資する株式会社NOTE伊賀上野が借り上げて運営する形とされ、「指定管理」とは書かれていません。\n栄楽館が「市所有」であることは確認できましたが、文化財の種別は国の登録有形文化財で、市指定文化財ではありません（市の一覧上の記載）。\n公式のKANMURIフロント棟と市の資料の栄楽館が同じ建物と明記した資料は見つけていません。同番地（上野相生町2842）であること、栄楽館が城下町ホテルのフロント機能を持つ基幹施設とされていることから、同一と推定しています（推定）。\n公式ページの「築約150年の登録有形文化財」（三重県観光連盟のページにも同文）がどの建物かは、記載がなく未確認です。\n重要伝統的建造物群保存地区など伝建地区の指定は、公式ページと読んだ市・国の資料のどこにも記述がなく、確認できませんでした（ないと断定もできません）。伊賀市は歴史まちづくり法の計画の認定（平成28年5月19日）を受けていますが、これは伝建地区とは別の制度で、各棟が重点区域内かは範囲図で確認できていません。\nKOURAI棟・MITAKE棟の文化財指定や築年は、公式ページの記述（MITAKE棟は明治初期）以外に確認できる資料がありません。\n室数と住所は資料で食い違います（公式は10室・上野相生町2842、三重県観光連盟のページは16室・上野西町3377）。本文では室数と別住所を使っていません。\n栄楽館の前身は、公式ページでは「料理旅館」、伊賀市の資料では「料亭」と表現が異なります。\nホテルとしての開業時期は、公式ページから確認できませんでした（令和元年度に栄楽館の改修工事が行われたことのみ確認）。"},{"id":"oozu","name":"NIPPONIA HOTEL 大洲 城下町","abbr":"OZU","region":"愛媛","district":"大洲城下","group":"ホテル＆レストラン","url":"https://www.vmg.co.jp/venues/oozu.html","ready":false,"draft":true,"area":"愛媛県大洲市大洲（〒795-0012、公式ページの所在地は大洲378）","summary":"大洲城の城下町にある古い邸宅や町家を改修し、まち全体をホテルに見立てています。","history":"大洲は肱川の中流域にあり、江戸時代は大洲藩の城下町でした。1617年に初代藩主の加藤貞泰が入城しています。大洲城跡から東へ向かって短冊状の町割りがつくられ、道筋は今もほぼ当時のまま残っています。町並みの建物の多くは、木蝋・製糸・舟運で栄えた明治から大正に建てられました（大洲市の資料）。大洲城の天守は明治21年（1888）に取り壊され、平成16年（2004）に木造で復元されました。一方で、城下町では所有者の高齢化などで歴史的な建物が失われつつありました。平成29年（2017）から若い住民たちが町並みの保全活動を始め、平成30年（2018）にNPO法人になっています。2018年4月には官民連携の協定が結ばれ、2020年7月にSADA棟・OKI棟・TUNE棟が開業しました（キタ・マネジメントの資料）。","usage":"城下町に点在する邸宅や町家を改修し、まちなみそのものに滞在できる分散型のホテルです。SADA棟（浦岡邸）は大洲城の目の前にあり、フロントとレストランを備えた客室棟です。OKI棟（村上氏邸）は木蝋で財を成した豪商の邸宅で、敷地は1000坪を超え、フロントと客室になっています。TUNE棟は旧料亭、MITI棟は大正期の邸宅で、どちらも客室です。公式ページには、大洲城で「日本初の城に宿泊するキャッスルステイ」を実現したとも書かれています。","value":"大洲市の資料は、大洲城跡から東に延びる短冊状の町割りの道筋がほぼ失われずに残り、町人町の町並みと合わせて独特の風情があると説明しています。MITI棟は旧大洲藩主の末裔にあたる加藤家の住宅（1925年）で、国の登録有形文化財です。公式ページでは、藩主加藤家の執務と帰郷のために建てられた、西洋風のモダンさを備えた近代和風建築と紹介されています。OKI棟の村上氏邸は、木蝋で財を成した豪商の邸宅で、主屋は明治期もしくはそれ以前の建物とされます。壊されかけた城下町の建物を、「観る文化財から利用する文化財へ」という考え方で生かしています。","designation":["MITI棟：旧加藤家住宅（主屋）が国の登録有形文化財（大正期。登録年は未確認）（根拠：キタ・マネジメント資料でMITI棟＝旧加藤家住宅・国登録・大正期、大洲市の重点区域図と大洲城リーフレットでも旧加藤家住宅主屋を国登録として掲載）","【周辺・ホテル棟ではありません】大洲城の台所櫓・高欄櫓・苧綿櫓・三の丸南隅櫓：国の重要文化財（昭和32年（1957）指定。高欄櫓は昭和32年6月18日指定と市広報に記載）（根拠：大洲市広報、大洲城パンフレット）。復元天守（2004年）は別です","【周辺・ホテル棟ではありません】臥龍山荘庭園：国の名勝、令和3年（2021）10月11日指定（根拠：愛媛県教育委員会の文化財ページ）。臥龍山荘の建物は国の重要文化財（根拠：キタ・マネジメント資料、公式ページ。指定年は未確認）"],"highlights":["大洲城の目の前に建つ、SADA棟（浦岡邸）","木蝋の豪商の邸宅を生かしたOKI棟（敷地1000坪超）","国の文化財・臥龍山荘で、臥龍淵の眺めとお茶を楽しむ"],"talks":[{"label":"①歴史・物語から","text":"ようこそ大洲へ。大洲は、肱川のほとりに広がる城下町です。このホテルは、町家や古いお屋敷を改修して、まち全体を一つのホテルに見立てています。SADA棟は大洲城の目の前にあり、名前は初代藩主の加藤貞泰公にちなんでいます。OKI棟は、木蝋で財を成した豪商の邸宅で、敷地は1000坪を超えます。MITI棟は、藩主の加藤家が大正期に建てた近代和風の邸宅で、国の登録有形文化財です。見どころの臥龍山荘は国の文化財で、臥龍淵の眺めを楽しめます。どうぞ、お城下の散策もお楽しみください。"},{"label":"②建築・見どころから","text":"大洲では、まず大洲城を見て、そのまま城下町を歩いてみてください。城跡から東へ細長い区画が並ぶ町割りの道筋は、今もほぼ当時のままです。SADA棟は大洲城の目の前にあります。OKI棟は木蝋で財を成した豪商の邸宅で、敷地は1000坪を超えます。MITI棟は1925年の旧加藤家住宅で、西洋風のモダンさを備えた近代和風建築、国の登録有形文化財です。"},{"label":"③お客様の場面から","text":"お泊まりの場面を思い浮かべてください。ここは、城下町に点在する邸宅や町家に泊まり、まちなみそのものに滞在する宿です。SADA棟にはフロントとレストランがあり、目の前は大洲城です。TUNE棟は旧料亭、MITI棟は大正期の邸宅で、どちらも客室です。壊されかけた城下町の建物を、「観る文化財から利用する文化財へ」という考え方で生かしています。"}],"talk":"ようこそ大洲へ。大洲は、肱川のほとりに広がる城下町です。このホテルは、町家や古いお屋敷を改修して、まち全体を一つのホテルに見立てています。SADA棟は大洲城の目の前にあり、名前は初代藩主の加藤貞泰公にちなんでいます。OKI棟は、木蝋で財を成した豪商の邸宅で、敷地は1000坪を超えます。MITI棟は、藩主の加藤家が大正期に建てた近代和風の邸宅で、国の登録有形文化財です。見どころの臥龍山荘は国の文化財で、臥龍淵の眺めを楽しめます。どうぞ、お城下の散策もお楽しみください。","sources":[{"title":"NIPPONIA HOTEL 大洲 城下町（公式）","url":"https://www.vmg.co.jp/venues/oozu.html"},{"title":"大洲市 街なみ環境整備方針説明書（肱南地区）","url":"https://www.city.ozu.ehime.jp/uploaded/attachment/23408.pdf"},{"title":"大洲市歴史的風致維持向上計画（第2期）第4章 重点区域","url":"https://www.city.ozu.ehime.jp/uploaded/attachment/34281.pdf"},{"title":"キタ・マネジメント「大洲城下町再生の物語」（内閣官房 資料2）","url":"https://www.cas.go.jp/jp/seisaku/atarashii_chihousousei/yusikishakaigi/dai4/siryou2.pdf"},{"title":"愛媛県 臥龍山荘庭園（名勝）解説","url":"https://ehime-c.esnet.ed.jp/bunkazai/kennobunkazai/shiteibunkazai/meishou/pdf-files/kuni/4-2-13garyuusansou.pdf"},{"title":"広報大洲 2013年5月号（大洲城高欄櫓）","url":"https://www.city.ozu.ehime.jp/uploaded/attachment/12184.pdf"},{"title":"大洲城パンフレット（神奈川大学ウェブサイト掲載）","url":"https://www.arch.kanagawa-u.ac.jp/lab/shimazaki_kazushi/shimazaki/JAPANCasle/082oozu/panf.pdf"},{"title":"文化遺産オンライン 大洲市の文化財","url":"https://online.bunka.go.jp/heritages/region/38/38207"},{"title":"リセマム／PR TIMES バリューマネジメント発表（2022年3月14日）","url":"https://resemom.jp/release/prtimes/20220314/79887.html"}],"note":"社内資料の「売上の10%を文化財保全のため市へ還元」は、公開資料で確認できませんでした。キタ・マネジメントの資料には「キャッスルステイの最終利益は6%」「収入の3割は文化財の保全に」とあり、誰にどう還元するかは書かれていません。本文では使っていません。\n社内資料の「日本初の木造天守貸切」のうち、「日本初の城泊」「木造復元天守に宿泊」は公開資料にありますが、「貸切」は確認できていません（公式は「日本初の城に宿泊するキャッスルステイ」）。なお天守は2004年の木造復元です。\nキタ・マネジメントの関わり方は、公式ページに記載がありません。同法人の資料では、地域DMOとして町家・古民家の改修・賃貸・管理などに関わり、2020年から重要文化財「臥龍山荘」などの指定管理を受託しています。ホテル運営そのものを担うかは確認できていません（要確認）。\n伝建地区の指定は、公式ページと読んだ市の資料のどこにも記述がなく、確認できませんでした（ないと断定もできません）。市は歴史まちづくり法の重点区域「大洲城下町」（約277ha）を定めていますが、これは伝建地区とは別の制度です。各棟が区域内かは範囲図で確認できていません。\n臥龍山荘の建物（重要文化財）の指定年は、一次資料で確認できませんでした（旅行サイトは平成28年と記載）。\n大洲城跡が愛媛県指定史跡であることは年表に出ていますが、指定年はスキャン文字が不鮮明で読み取れませんでした。\nMITI棟の旧加藤家住宅主屋の登録年は未確認です。キタ・マネジメント資料は同住宅を「お殿様公園：大洲市所有」と記しており、所有関係も未確認です。\n文化遺産オンラインには旧村上家住宅（主屋・土蔵・付属屋・貸家）が登録有形文化財として載っていますが、公式のOKI棟（村上氏邸、所在地は大洲378）と同一かは資料に明記がなく、確認できていません。OKI棟の主屋の年代は、公式は「明治期もしくはそれ以前」、キタ・マネジメント資料は「江戸期」と表現が異なります。\nNPO法人YATSUGIは、市の資料では2017年に活動開始・2018年に法人化、キタ・マネジメント資料では2017年設立とあり、食い違います。本文では市の資料に合わせました。\n棟数・室数は時点で変わります（キタ・マネジメント資料では2023年8月に26棟31室、2024年10月に再生した建物が通算32棟）。本文では使っていません。TUNE棟は、公式では元禄元年創業の老舗料亭、キタ・マネジメント資料では「いづみや別館（昭和期）」と表現が異なります。"},{"id":"naramachi","name":"風の ならまち","abbr":"NNM","region":"奈良","district":"ならまち","group":"ホテル＆レストラン","url":"https://www.vmg.co.jp/venues/naramachi.html","ready":false,"draft":true,"area":"奈良県奈良市西城戸町4","summary":"明治創業の蔵元の旧酒蔵を生かした、日本酒がテーマの8室のホテルです。","history":"奈良市の説明では、奈良町は中世以降に発展し、近世に成立した町々の総称で、旧市街地の大部分と重なります。江戸時代の初め、1603年（慶長8年）には「奈良町」の名称が確定し、100町が町として定められました。ならまちは、6世紀に蘇我馬子が創建した飛鳥寺を平城京に移して造った元興寺の旧境内にあたる地区で、極楽坊の周りには江戸時代末の古い町家が今も残っています。昭和50年代からは、歴史的な町並みを生かすまちづくり活動が行われてきました。奈良は日本酒造りの発祥の地とされ、春日大社から流れる水脈がならまちを通っていたため、多くの酒蔵が並んでいたと公式ページは紹介しています。","usage":"明治創業の蔵元「奈良豊澤酒造」のかつての酒蔵をリノベーションした、客室8室の宿です。元は蔵だった部屋、茶室を改修した部屋、離れなど、造りの違う客室があります。酒造りに使われてきた井戸水を今も使っています。元土間を生かした「シェフズカウンター」では、大和野菜や大和牛などの奈良の食材を使い、フレンチの技法で仕立てた料理を日本酒とのペアリングで味わえます。酒粕風呂や檜風呂、豊澤酒造の酒造見学（宿泊者向け）も案内されています。","value":"この場所は、明治創業の蔵元・奈良豊澤酒造が、昭和10年（1935年）に移転するまで酒造りに使っていた建物です。旅行情報サイトでは「創業の地」とも紹介されています。米蔵、蔵元の母屋、茶室、離れ、酒蔵の土間といった、酒蔵と暮らしの場が一つの敷地に残っている点が特徴です。旧正面玄関には「豊澤」の表札と酒蔵のしるしの杉玉が残るとされています。奈良の酒造りの歴史と、元興寺旧境内に重なるならまちの町家の歴史を、あわせて感じられる場所です。","designation":["奈良町都市景観形成地区（公式ホテル一覧のタグ。西城戸町4が区域内かは、範囲図で未確認）"],"highlights":["明治創業の蔵元・奈良豊澤酒造の旧酒蔵が舞台","元土間のシェフズカウンターで日本酒とペアリング","元米蔵・元母屋・茶室跡など造りの違う8室"],"talks":[{"label":"①歴史・物語から","text":"こちらは、奈良のならまちにある、日本酒がテーマのホテルです。もとは明治創業の蔵元、奈良豊澤酒造の酒蔵でした。昭和10年に蔵元が移るまで、ここで酒造りが行われていたそうです。米蔵や母屋、茶室だった場所が、今は客室になっています。お食事は、昔の土間を生かしたカウンターで、奈良の食材を使った料理を日本酒と一緒にお楽しみいただけます。ならまちは、元興寺の昔の境内にあたる地区です。歴史のある町並みの中で、お酒の文化にも触れていただければと思います。"},{"label":"②建築・見どころから","text":"まず見ていただきたいのは、敷地に残る酒蔵の名残です。米蔵、蔵元の母屋、茶室、離れ、酒蔵の土間と、酒造りと暮らしの場が一つの敷地に残っています。旧正面玄関には「豊澤」の表札と、酒蔵のしるしの杉玉が残っているとされています。これらを生かして、元は蔵だった部屋、茶室を改修した部屋、離れなど、造りの違う8室になっています。同じ宿でも部屋ごとに表情が違うのが楽しみのひとつです。"},{"label":"③お客様の場面から","text":"夜は、元は土間だったカウンターに腰かけて、お食事を楽しんでいただけます。大和野菜や大和牛など奈良の食材を、フレンチの技法で仕立て、日本酒とあわせて味わう流れです。酒造りに使われてきた井戸水を今も使っているそうです。そのあとは酒粕風呂や檜風呂でゆっくりしていただけます。宿泊の方は、豊澤酒造の酒造見学も案内されています。お酒の文化を、味わうところから知っていただく滞在です。"}],"talk":"こちらは、奈良のならまちにある、日本酒がテーマのホテルです。もとは明治創業の蔵元、奈良豊澤酒造の酒蔵でした。昭和10年に蔵元が移るまで、ここで酒造りが行われていたそうです。米蔵や母屋、茶室だった場所が、今は客室になっています。お食事は、昔の土間を生かしたカウンターで、奈良の食材を使った料理を日本酒と一緒にお楽しみいただけます。ならまちは、元興寺の昔の境内にあたる地区です。歴史のある町並みの中で、お酒の文化にも触れていただければと思います。","sources":[{"title":"風の ならまち（VMG公式）","url":"https://www.vmg.co.jp/venues/naramachi.html"},{"title":"奈良町 - 奈良市ホームページ","url":"https://www.city.nara.lg.jp/site/naramachi/"},{"title":"奈良町の成立 中世から近世へ - 奈良市ホームページ（文化財課）","url":"https://www.city.nara.lg.jp/site/bunkazai/2331.html"},{"title":"元興寺 - 世界遺産 - 奈良市ホームページ（文化財課）","url":"https://www.city.nara.lg.jp/site/world-heritage/88519.html"},{"title":"近田家住宅主屋、蔵 - 奈良市ホームページ（文化財課）","url":"https://www.city.nara.lg.jp/site/bunkazai/8424.html"},{"title":"奈良市歴史的風致形成建造物について - 奈良町（観光戦略課）","url":"https://www.city.nara.lg.jp/site/naramachi/9346.html"},{"title":"奈良市都市景観形成地区建造物保存整備費補助金 - 奈良町（観光戦略課）","url":"https://www.city.nara.lg.jp/site/naramachi/10259.html"},{"title":"重要伝統的建造物群保存地区 選定一覧（文化庁）","url":"https://www.bunka.go.jp/seisaku/bunkazai/shokai/hozonchiku/judenken_ichiran.html"},{"title":"1日8組限定!日本初・日本酒テーマのホテル「NIPPONIA HOTEL 奈良 ならまち」（るるぶ&more）","url":"https://rurubu.jp/andmore/article/22341"},{"title":"intojapanwaraku 記事（NIPPONIA HOTEL 奈良 ならまち）","url":"https://intojapanwaraku.com/travel/256900/"}],"note":"文化財の指定：ホテルの建物について、国・県・市の指定や登録を示す資料は確認できませんでした（奈良市の「歴史的風致形成建造物」一覧にも西城戸町・豊澤の記載なし）。\n伝統的建造物群保存地区：文化庁の選定一覧に奈良市の地区はなく、ならまちは重要伝統的建造物群保存地区ではありません（確認済み）。\n奈良町都市景観形成地区（景観条例に基づく地区）と、歴史的風致維持向上計画の重点区域「奈良町及び奈良公園地区」は存在しますが、西城戸町4がそれぞれの区域内かは範囲図で確認できていません。指定年・面積は、取得できたページでは確認できませんでした。\n建物の建築年：酒蔵として使われた建物の建築年・旧酒蔵の建築の詳細は確認できていません。公式ページに「昭和に建てられた離れ」「大正期のガラス」の記述がある程度です。\n豊澤酒造の創業年（明治の何年か）は、取得したページでは確認できませんでした。昭和10年の移転は旅行情報サイトの記述で、公式ページ・自治体資料では未確認です。\n客室名と元の用途の説明が、公式ページと旅行情報サイトで一部異なります（例：蔵だった部屋・離れ・茶室の呼び方）。客室ごとの来歴は使わず、全体の記述にとどめました。\nホテル周辺の町家の建築年代は未確認です。奈良市は昭和50年代からのまちづくり活動、江戸時代末の町家の残存（極楽坊周辺）を述べています。\n奈良市は元興寺旧境内を「奈良時代元興寺の境内だった地域」と説明しますが、西城戸町4がその範囲に入るかは、公式ページ（ならまちは元興寺旧境内）と旅行情報サイトの記述のみで、自治体資料では未確認です。\n2026年6月3日の名称変更（旧：NIPPONIA HOTEL 奈良 ならまち）は、依頼文の情報で、取得したページでは日付を確認していません。"},{"id":"dazaifu","name":"HOTEL CULTIA 太宰府","abbr":"CDF","region":"福岡","district":"天満宮参道","group":"ホテル＆レストラン","url":"https://www.vmg.co.jp/venues/dazaifu.html","ready":false,"draft":true,"area":"福岡県太宰府市太宰府3-3-33","summary":"太宰府天満宮の門前にある、吉嗣家の名家の邸宅を生かしたホテルです。","history":"太宰府は、古代に大宰府政庁が置かれ、大陸との外交の窓口を担った土地です。太宰府市の計画資料では、九州全体を治め「遠の朝廷」と呼ばれた大宰府が置かれてから約1350年の歴史があるとされています。太宰府天満宮は、菅原道真公の御墓所の上に築かれ、1100年以上にわたり広く崇敬されてきました。参詣者が市内の名所をめぐる「さいふまいり」のにぎわいは、門前を中心に今も続くと説明されています。ホテルの建物は、その門前にある吉嗣家の住宅です。公式ページによると、吉嗣家は天満宮の神官を三代にわたり務め、梅仙、拝山、鼓山の三名は三代にわたり書画を手がけました。住宅は「古香書屋」とも呼ばれ、のちに「古香庵」として飲食事業が営まれ、地域の人々に親しまれてきました。","usage":"吉嗣家の住宅を再生し、フロント、ダイニング、客室として使っているブティックホテルです。客室は歴史的な風情のある空間で、檜風呂などを備えています。カフェスペースでは福岡のブランド苺「あまおう」を使ったアフタヌーンティー、歴史建築のダイニングでは九州・福岡の食材を使ったフレンチを楽しめます。宿泊者限定で、閉門後の太宰府天満宮で行われる夜間の正式参拝に参加できるほか、九州国立博物館の夜のナイトツアーも案内されています。天満宮から徒歩1分の古民家の貸切利用もできます。","value":"この建物は、太宰府天満宮の神官を三代にわたり務めた吉嗣家の住宅で、公式ページでは江戸末期から昭和初期の名家の邸宅と紹介されています。吉嗣家の梅仙・拝山・鼓山は三代にわたり書画を手がけ、住宅は「古香書屋」とも呼ばれました。拝山（1846〜1915年）は太宰府の生まれとされ、太宰府市教育委員会は2023年に『太宰府の絵師調査報告3 吉嗣家資料【書画編】』を刊行して、吉嗣家の書画を調査しています。天満宮門前のまちの歴史と、地域の書画の歴史の両方に結びつく建物です。","designation":[],"highlights":["太宰府天満宮から徒歩1分の門前にある名家の邸宅","神官を務めた吉嗣家と、書画の三代ゆかりの住宅","宿泊者限定の夜間正式参拝（閉門後）に参加できる"],"talks":[{"label":"①歴史・物語から","text":"こちらは、太宰府天満宮から歩いて1分ほどの、門前にあるホテルです。建物は、天満宮の神官を三代務めた吉嗣家のお住まいで、梅仙、拝山、鼓山の三代は書画を手がけたと伝えられています。住宅は「古香書屋」とも呼ばれ、のちに「古香庵」という飲食店として、地域の方々に親しまれてきました。それを、フロントやダイニング、客室として生まれ変わらせています。宿泊のお客様は、閉門後の天満宮で行われる夜間の正式参拝にご参加いただけます。昼のにぎわいとは違う、静かな太宰府を感じていただけます。"},{"label":"②建築・見どころから","text":"ここの見どころは、建物そのものです。天満宮から歩いて1分ほどの門前にあって、公式ページでは、江戸末期から昭和初期の名家の邸宅と紹介されています。古い邸宅の空間を生かして、フロント、ダイニング、客室に生まれ変わりました。客室は歴史的な風情のある空間で、檜風呂などもございます。かつて「古香書屋」とも呼ばれた住宅の中で過ごせるのが、このホテルならではです。"},{"label":"③お客様の場面から","text":"太宰府での一日を、夜まで楽しんでいただけるホテルです。昼はカフェスペースで、福岡のブランド苺「あまおう」を使ったアフタヌーンティーを。夜は歴史ある建物のダイニングで、九州・福岡の食材を使ったフレンチをどうぞ。宿泊のお客様だけの特典として、閉門後の天満宮で行われる夜の正式参拝にも参加できます。九州国立博物館の夜のナイトツアーも案内されています。"}],"talk":"こちらは、太宰府天満宮から歩いて1分ほどの、門前にあるホテルです。建物は、天満宮の神官を三代務めた吉嗣家のお住まいで、梅仙、拝山、鼓山の三代は書画を手がけたと伝えられています。住宅は「古香書屋」とも呼ばれ、のちに「古香庵」という飲食店として、地域の方々に親しまれてきました。それを、フロントやダイニング、客室として生まれ変わらせています。宿泊のお客様は、閉門後の天満宮で行われる夜間の正式参拝にご参加いただけます。昼のにぎわいとは違う、静かな太宰府を感じていただけます。","sources":[{"title":"ホテル カルティア 太宰府（VMG公式）","url":"https://www.vmg.co.jp/venues/dazaifu.html"},{"title":"フクオカ古民家再生プロジェクト（グラフふくおか 2022 AUTUMN）","url":"https://www.pref.fukuoka.lg.jp/somu/graph-f/2022autumn/special/"},{"title":"太宰府市の維持向上すべき歴史的風致（歴史的風致維持向上計画（第2期）の概要資料）","url":"https://www.mlit.go.jp/common/001260012.pdf"},{"title":"歴史的風致維持向上計画（第2期）の認定について（文化庁）","url":"https://www.bunka.go.jp/koho_hodo_oshirase/hodohappyo/93854401.html"},{"title":"太宰府天満宮 公式サイト（御由緒ページ上部の概要）","url":"https://www.dazaifutenmangu.or.jp/about/"},{"title":"太宰府天満宮（クロスロードふくおか）","url":"https://www.crossroadfukuoka.jp/spot/12546"},{"title":"太宰府の絵師調査報告3 吉嗣家資料【書画編】（奈良文化財研究所 全国遺跡報告総覧）","url":"https://sitereports.nabunken.go.jp/139934"},{"title":"吉嗣拝山（コトバンク／日本人名大辞典+Plus ほか）","url":"https://kotobank.jp/word/%E5%90%89%E5%97%A3%E6%8B%9D%E5%B1%B1-22159"},{"title":"重要伝統的建造物群保存地区 選定一覧（文化庁）","url":"https://www.bunka.go.jp/seisaku/bunkazai/shokai/hozonchiku/judenken_ichiran.html"}],"note":"文化財の指定：ホテルの建物（旧吉嗣家住宅・古香庵）について、国・県・市の指定や登録を示す資料は確認できませんでした。\n伝統的建造物群保存地区：文化庁の選定一覧に太宰府市の地区はなく、保存地区内ではありません（確認済み）。\n歴史的風致維持向上計画の重点区域「太宰府市歴史的風致維持向上地区（1397ha）」は、天満宮門前の「さいふまいり」などを含みますが、太宰府3-3-33が区域内かは範囲図で確認できていません。\n建築年の食い違い：公式ページは「江戸末期から昭和初期の名家の邸宅」、グラフふくおか（2022年）は「大正時代に建てられた」とします。建築年は断定していません。\n吉嗣家の呼び方の食い違い：公式ページは「天満宮の神官を三代」、グラフふくおかは「絵師」、太宰府市教育委員会の報告書名は「絵師調査報告」です。職の呼び方は出典の言い方にとどめました。\n古香書屋と古香庵が同じ住宅を指す点は公式ページの記述のみで、他の資料では確認できていません。梅仙の経歴・生没年も確認できていません。\n太宰府天満宮の創建の年号・左遷や薨去の年は、公式サイトの取得できた部分に本文がなく確認できていません。御本殿が重要文化財であることは、市の計画資料とクロスロードふくおかの記述で確認しました（指定年は未確認）。\n公式ページの「年間1000万人が参拝」「大宰府政庁が置かれ、大陸との外交の窓口を担った」は公式ページの記述のみで、他資料での裏づけはありません。\n参道そのものの成り立ちや、参道沿いの町並みの歴史を述べた一次に近い資料は確認できませんでした。"},{"id":"neene","name":"寧々の道別邸 Kazeno Heritage","abbr":"寧々","region":"京都","district":"東山","group":"ホテル＆レストラン","url":"https://www.vmg.co.jp/venues/kyoto.html","ready":false,"draft":true,"area":"京都府京都市東山区下河原町463-23","summary":"ねねの道に面し、かつて料理旅館だった木造建築を生かした客室3室の宿です。","history":"寧々の道別邸は、八坂神社から清水寺へ続く石畳の「ねねの道」に面しています。公式ストーリーページによると、豊臣秀吉の正室・北政所ねねは、この地で余生を送りました。秀吉の没後、菩提を弔うために高台寺を建て、伏見城から移した化粧御殿で暮らしたそうで、その住まいは現在の圓徳院のあたりにあたります。高台寺の公式サイトも、寺は慶長11年（1606）に、秀吉の菩提を弔うため北政所が開いたと伝えています。ねねの周りには、大名、禅僧、茶人、歌人、画家、陶芸家など、ねねを慕う多くの人々が集まったと伝えられます。建物は、公式ストーリーページによると、かつて料理旅館だった木造建築を再生したものです。柱、梁、土壁、建具など建物に刻まれた時間をできる限り残し、新築のようには塗り替えませんでした。なお、建物の建築年や、旧旅館の名前は、公式ページに書かれていません。","usage":"公式ページによると、客室は3室で、定員は1〜4名です。全室61㎡以上で、1階には坪庭と檜風呂の客室、2階には高台寺、ねねの道、八坂の塔を望む2室があります。空間のテーマは京都のものづくりを支えてきた「銅」で、開化堂の銅の茶筒を置き、清水焼の色彩を思わせる孔雀青を取り入れています。体験として、玉露体験と、香道・花・茶の文化体験があります。レストランは直営の近隣施設にあります。また、東山露地 Kazeno Heritage のチェックインも、この寧々の道別邸で行います（東山露地の公式ページ）。","value":"寧々の道別邸があるのは、北政所ねねが秀吉の菩提を弔うために開いた高台寺（慶長11年、1606年）のそばです。公式ストーリーページによると、寺社へ続く参詣の道には古くから茶店、料理屋、工芸品店が並び、二寧坂、産寧坂、ねねの道の石畳と家並みは、日本を代表する歴史的景観として保存されています。この一帯は、国の重伝建「京都市産寧坂」の説明で、八坂神社、法観寺、清水寺の門前町として栄えた地域とされています。建物自体は、かつて料理旅館だった木造建築で、柱や土壁に刻まれた時間を残して再生されています。建築年や旧旅館の来歴は確認できていないため、ここでは、まちの歴史の中での位置づけを中心にお伝えします。","designation":["重要伝統的建造物群保存地区「京都市産寧坂」（種別：門前町、面積8.2ha、1976年9月4日選定）について、公式ページが「まちの分類」を重要伝統的建造物群保存地区とし、二寧坂と産寧坂が同地区であると説明している（地区の選定内容の根拠：https://kunishitei.bunka.go.jp/heritage/detail/103/17。当館の地番が範囲内かは未確認）"],"highlights":["銅がテーマの客室と、孔雀青の深い青","2階の2室から高台寺・八坂の塔を望む","経年の痕跡を残して再生した柱・土壁・建具"],"talks":[{"label":"①歴史・物語から","text":"寧々の道別邸は、八坂神社から清水寺へ続く石畳の「ねねの道」に面しています。豊臣秀吉の奥様だった北政所ねねさんは、秀吉が亡くなったあと、供養のために高台寺を建てて、この辺りで余生を過ごしたと伝えられています。建物は、もともと料理旅館だった木造の建物を生かしたもので、柱や土壁、建具などに刻まれた時間を、できるだけ残しています。お部屋は3室だけで、京都のものづくりを支えてきた「銅」がテーマです。開化堂さんの銅の茶筒や、清水焼の色を思わせる深い青が目に入ります。2階の2室の窓からは、高台寺や八坂の塔、ねねの道の街並みを眺められます。"},{"label":"②建築・見どころから","text":"見どころは、「銅」をテーマにした客室です。京都のものづくりを支えてきた銅にちなみ、開化堂さんの銅の茶筒を置き、清水焼の色彩を思わせる孔雀青を取り入れています。柱、梁、土壁、建具は、刻まれた時間をできる限り残しました。2階の2室からは、高台寺、ねねの道、八坂の塔を望めます。一つひとつの素材や色にも、ぜひ目を向けてみてください。"},{"label":"③お客様の場面から","text":"石畳のねねの道に面した宿で、ゆっくり過ごす場面を思い浮かべてください。お部屋は3室だけ、定員は1〜4名で、全室61㎡以上のゆとりがあります。1階には坪庭と檜風呂の客室もあります。玉露体験や、香道・花・茶の文化体験もあります。お食事は、直営の近隣のレストランをご利用いただけます。スタッフが案内する、東山露地のチェックインもここで行います。"}],"talk":"寧々の道別邸は、八坂神社から清水寺へ続く石畳の「ねねの道」に面しています。豊臣秀吉の奥様だった北政所ねねさんは、秀吉が亡くなったあと、供養のために高台寺を建てて、この辺りで余生を過ごしたと伝えられています。建物は、もともと料理旅館だった木造の建物を生かしたもので、柱や土壁、建具などに刻まれた時間を、できるだけ残しています。お部屋は3室だけで、京都のものづくりを支えてきた「銅」がテーマです。開化堂さんの銅の茶筒や、清水焼の色を思わせる深い青が目に入ります。2階の2室の窓からは、高台寺や八坂の塔、ねねの道の街並みを眺められます。","sources":[{"title":"寧々の道別邸 Kazeno Heritage（公式・施設トップ）","url":"https://www.kazenoheritage.jp/hotels/nenenomichibettei/"},{"title":"寧々の道別邸 Kazeno Heritage（公式・ストーリー）","url":"https://www.kazenoheritage.jp/hotels/nenenomichibettei/story/"},{"title":"寧々の道別邸 Kazeno Heritage（公式・英語トップ）","url":"https://www.kazenoheritage.jp/hotels/nenenomichibettei/?lang=en"},{"title":"東山露地 Kazeno Heritage（公式・施設トップ）","url":"https://www.kazenoheritage.jp/hotels/higashiyamaroji/"},{"title":"高台寺（公式）歴史","url":"https://www.kodaiji.com/rekishi.html"},{"title":"京都市産寧坂（国指定文化財等データベース）","url":"https://kunishitei.bunka.go.jp/heritage/detail/103/17"},{"title":"京都市産寧坂（文化遺産オンライン）","url":"https://online.bunka.go.jp/heritages/detail/125134"},{"title":"産寧坂伝統的建造物群保存地区保存計画（京都市）","url":"https://www.city.kyoto.lg.jp/tokei/page/0000281761.html"}],"note":"建物の建築年、旧料理旅館の名称、創業・建築の経緯、設計者、改修時期は、公式ページ（トップ・ストーリー・英語版）に記載がなく、他の公開情報でも確認できなかった。\nTECTURE MAG（2026-06-19公開）の記事（題名はHOTEL VMG VILLA KYOTO）は、所在地を「下河原町463-23」（この寧々の道別邸の公式住所）と書き、大正9年（1920）上棟・数寄屋建築と記す。しかし建主の人物像は東山露地の公式の「堺卯楼の主人・鵜野吾一」に近く、記事の所在地が誤記か、建物の取り違えかは確認できない。本草稿には採用していない（2施設の混同を避けるため）。\n建物が重伝建「京都市産寧坂」の範囲内かは、公式ページの「まちの分類」表示のみ。京都市の保存計画は下河原通・高台寺北門通に言及するが、町名の記載がなく、「ねねの道」「下河原町463」の語は出てこない。範囲図は画像で、地番との照合ができなかった。\n祇園新橋地区（別の重伝建、1.4ha、新橋通中心）との関係は確認できず不明。当館の公式ページは祇園新橋に触れていない。\n京都市「京を彩る建物や庭園」の選定リスト（PDF）、文化庁データベース・文化遺産オンラインで、この建物個別の指定・登録・選定は確認できなかった（リストPDFは文字抽出ができず、全件の照合はできていない）。\n高台寺の創建年は、高台寺公式は慶長11年（1606）。他の観光サイトには慶長10年（1605）とする記述もあり、表記が分かれる（本草稿は公式の1606を採用）。\n公式ページの「豊臣秀吉の正室・ねねが愛した地」「余生を送った」は伝承的な書き方で、史料による裏づけは確認していない。"},{"id":"yame","name":"風の 八女福島","abbr":"YMS","region":"福岡","district":"福島","group":"ホテル＆レストラン","url":"https://www.vmg.co.jp/venues/yame-fukushima.html","ready":false,"draft":true,"area":"福岡県八女市本町（八女福島）","summary":"八女福島の町並みの中で、旧酒造場と茶舗の町家を生かした茶と酒の宿です。","history":"八女福島は、福岡県八女市の中心部にある町です。八女市の資料によると、1587年（天正15年）に筑紫広門が福島城を築き、1600年（慶長5年）の関ヶ原の戦いのあとに田中吉政が大きく修築して、城下町が整えられました。1620年（元和6年）に久留米藩有馬氏の支配となり、福島城は廃城になりましたが、町人地は交通と経済の中心として栄え、後に久留米藩内で最大級の在郷の商家町になったと説明されています。大火が多かったため、江戸末期から明治にかけて、白壁の土蔵造りの「居蔵（いぐら）」の町家が建てられました。昭和40年代以降は商業の中心が町の外へ移りましたが、往還道路沿いは開発を免れ、町家が残りました。2002年（平成14年）5月に国の重要伝統的建造物群保存地区に選定されています。","usage":"活用しているのは、旧喜多屋と旧大坪茶舗の二つの建築です。KITAYA BETTEI（喜多屋 別邸）は、重伝建地区の中央にある6棟続きの旧酒造場と屋敷で、1棟は今も焼酎の仕込み蔵として使われています。フロント、レストラン、日本酒バー、客室があります。OTSUBO CHAHO（旧大坪茶舗）は、主屋、離れ座敷、土蔵2棟、作業場からなる、間口が狭く奥行きの長い屋敷です。客室は全7室で、伝統的な佇まいや意匠を残し、最小限の改修で現代の快適さを加えています。八女茶を使った料理とティーペアリングや、久留米絣のクラフト体験などがあります。","value":"八女福島は、江戸時代の初めに城下町の町人地として生まれ、のちに久留米藩内で最大級の在郷の商家町として栄えました（文化遺産オンライン）。城下町だった期間は短いものの、短冊状の敷地割りや屈曲した道路網など、計画された町の面影が残っています。大火に備えて発達した居蔵造りの町家が連なり、江戸時代から近代にかけての伝統的建造物が残っていることが、保存地区の特徴として説明されています。この宿は、その町並みの中の旧酒造場と旧茶舗の町家を生かしており、町の商いと茶の文化に触れる滞在を目指しています。","designation":["重要伝統的建造物群保存地区「八女福島」（商家町）：2002年（平成14年）5月23日選定（文化遺産オンライン）","活用する建物は「重伝建地区内の『伝統的建造物』」と公式ブランドページに記載（範囲図での確認はしていません）"],"highlights":["旧酒造場の6棟続きの町家に泊まる","八女茶を使った料理とティーペアリング","仏壇や提灯の工房を巡る町の生業めぐり"],"talks":[{"label":"①歴史・物語から","text":"八女福島へようこそ。ここは江戸時代のはじめに城下町として生まれ、のちに商家町として栄えた町で、国の重要伝統的建造物群保存地区になっています。白壁の土蔵造りの「居蔵」と呼ばれる町家が並ぶのが特徴です。こちらの宿は、その町並みの中にある、旧酒造場の屋敷と旧茶舗の町家を生かしてつくられました。伝統的な佇まいを残しながら、必要最小限の改修で、今の暮らしに合う快適さを加えています。八女は茶どころですので、八女茶を使ったお料理やティーペアリングも、ぜひお楽しみください。町の工房をめぐるコースもあります。"},{"label":"②建築・見どころから","text":"八女福島の町を歩くと、白壁の土蔵造りの町家が続いています。大火に備えて建てられた「居蔵」という造りです。道が曲がっていたり、細長い敷地が並んでいたりと、計画された城下町の面影も残っています。この宿は、その町並みの中の、旧酒造場の6棟続きの建物と、間口が狭く奥行きの長い旧茶舗の屋敷です。公式ページでは、重伝建地区内の伝統的建造物と紹介されています。"},{"label":"③お客様の場面から","text":"八女は茶どころです。お食事では八女茶を使ったお料理と、お茶とのペアリングを楽しんでいただけます。日本酒バーもございます。日中は、久留米絣のクラフト体験や、仏壇や提灯の工房を巡る町の生業めぐりが案内されています。町の商いと茶の文化を、食べて、触れて、歩いて感じていただく滞在です。伝統的な佇まいは残しつつ、改修は最小限で、快適さを加えています。"}],"talk":"八女福島へようこそ。ここは江戸時代のはじめに城下町として生まれ、のちに商家町として栄えた町で、国の重要伝統的建造物群保存地区になっています。白壁の土蔵造りの「居蔵」と呼ばれる町家が並ぶのが特徴です。こちらの宿は、その町並みの中にある、旧酒造場の屋敷と旧茶舗の町家を生かしてつくられました。伝統的な佇まいを残しながら、必要最小限の改修で、今の暮らしに合う快適さを加えています。八女は茶どころですので、八女茶を使ったお料理やティーペアリングも、ぜひお楽しみください。町の工房をめぐるコースもあります。","sources":[{"title":"風の 八女福島（VMG公式）","url":"https://www.vmg.co.jp/venues/yame-fukushima.html"},{"title":"風の 八女福島（Kazeno Heritage公式）","url":"https://www.kazenoheritage.jp/hotels/yame-fukushima/"},{"title":"八女福島の町並み（歴史と保存の取り組み）八女市ホームページ","url":"https://www.city.yame.fukuoka.jp/soshiki/sangyou/kankou/rekimachi/1454651769364.html"},{"title":"八女市八女福島（商家町 福岡）文化遺産オンライン","url":"https://online.bunka.go.jp/heritages/detail/91153"},{"title":"八女市八女福島 文化遺産オンライン","url":"https://online.bunka.go.jp/heritages/detail/148068"}],"note":"公式ページ同士の食い違い：住所はVMGページ「八女市本町204番地」、Kazeno Heritageページ「本町西京町204」。コンセプトはVMGページ「JAPANESE TEA HOTEL」、Kazeno Heritageページ「TEA & SAKE HOTEL」。どちらを使うか要確認\n旧喜多屋の仕込み蔵：VMGページは「現役の焼酎の仕込み蔵」、Kazeno Heritageページは「旧喜多屋は銘酒を醸し」と記載。酒の種類の整理が要確認\n活用建物が保存地区の範囲内かは、公式ページの記載（重伝建地区内の伝統的建造物）のみで、八女市の範囲図では確認できていません。八女市ページの範囲表は画像で、本文から読み取れませんでした\n活用建物（旧喜多屋・旧大坪茶舗）の建築年代、個別の国・県・市の文化財指定は、公式ページ・自治体ページで記載を確認できませんでした\n名称変更のお知らせ（2026年6月3日付）の本文は取得できず、VMGページではタイトルのみ。Kazeno Heritageページでは、空間・サービスは7月17日以降に段階的に更新予定とあり、現在の状態は未確認\nVMGページの「OTSUBO CHAHOは重伝建地区の東に位置する」が、地区の東端付近を指すのか地区の外かは、読み取れませんでした"},{"id":"ginza","name":"THE GRAND GINZA","abbr":"G6","region":"東京","district":"銀座","group":"レストラン＆パーティ","url":"https://www.vmg.co.jp/venues/ginza.html","ready":false,"draft":true,"area":"東京都中央区銀座6丁目（GINZA SIX 13階）","summary":"GINZA SIXの最上階にある、食と文化を味わう複合施設です。","history":"THE GRAND GINZAがあるのは、2017年に開業した商業施設GINZA SIXの最上階（13階）です。GINZA SIXは、松坂屋銀座店の跡地を含む、道路をはさんだ2つの街区（約1.4ヘクタール）をまとめて再開発してできました。銀座は、1612年（慶長17年）に駿府から銀座が移ってきたことで生まれた町です。明治10年（1877年）にはれんが街ができ、新聞社が集まるなど、時代の先端の町になりました。その後も、関東大震災や昭和20年の空襲などで大きな被害を受けましたが、そのたびに復興してきました。公式ページでも、こうした銀座の歴史が紹介されています。なお、施設の建築年や設計者、開業日は、公式ページでは確認できませんでした。","usage":"THE GRAND GINZAは、GINZA SIXのトップフロア約1,500平方メートルに広がる「食の複合施設」です。日本47都道府県の食材を扱うレストラン「THE GRAND 47」、12席限定のカウンター「銀座 極-KIWAMI-」、ランチやアフタヌーンティー、バーが楽しめるラウンジがあります。このほか、ダイニング・バンケット、貸切バンケットルーム、多目的ホール「CEREMONY SPACE」、茶室もあり、パーティやMICEに使われます。公式サイトにはWEDDINGのご案内ページへのリンクもあります。","value":"ここは2017年に開業したGINZA SIXの最上階にあり、建物そのものが歴史的建造物というわけではありません。歴史的価値は、場所の歴史と、空間に取り入れられた日本の工芸にあります。銀座は1612年（慶長17年）に駿府から銀座が移ってきたことで生まれた町で、明治10年（1877年）にはれんが街ができ、新聞社が集まるなど時代の先端の町になりました。","designation":[],"highlights":["最上階から銀座の街並みを望む","茶道家・木村宗慎氏によるインテリア","斉藤上太郎氏の屏風絵・襖絵と織物"],"talks":[{"label":"①歴史・物語から","text":"ここは、銀座の中心にあるGINZA SIXの最上階です。銀座は、1612年に駿府から銀座が移ってきたことから始まった町で、震災や空襲のたびに復興してきました。その銀座を見渡す場所に、京都の茶道家・木村宗慎さんが手がけたインテリアや、着物デザイナー・斉藤上太郎さんの屏風絵、襖絵が並びます。新しい建物ですが、日本の文化を取り入れた空間です。大切な日を、銀座の歴史と日本の美にかこまれて迎えられることが、この場所を選ぶ意味だと思います。"},{"label":"②建築・見どころから","text":"まずお見せしたいのは、窓の外に広がる銀座の街並みです。ここはGINZA SIXの最上階、13階にあります。店内には、京都の茶道家・木村宗慎さんが手がけたインテリアがあり、着物デザイナー・斉藤上太郎さんの屏風絵や襖絵、織物も飾られています。高い場所から街を見渡しながら、日本の美しさにゆっくり触れていただける空間です。"},{"label":"③お客様の場面から","text":"お仕事の仲間や大切な方との集まりを思い浮かべてみてください。ランチやアフタヌーンティー、バーでのひとときもあれば、貸切のバンケットルームでのパーティもあります。日本47都道府県の食材を扱うレストランや、12席限定のカウンターもあります。銀座の街を望む最上階で過ごす時間が、その日を特別な思い出にしてくれると思います。"}],"talk":"ここは、銀座の中心にあるGINZA SIXの最上階です。銀座は、1612年に駿府から銀座が移ってきたことから始まった町で、震災や空襲のたびに復興してきました。その銀座を見渡す場所に、京都の茶道家・木村宗慎さんが手がけたインテリアや、着物デザイナー・斉藤上太郎さんの屏風絵、襖絵が並びます。新しい建物ですが、日本の文化を取り入れた空間です。大切な日を、銀座の歴史と日本の美にかこまれて迎えられることが、この場所を選ぶ意味だと思います。","sources":[{"title":"THE GRAND GINZA（VMG公式）","url":"https://www.vmg.co.jp/venues/ginza.html"},{"title":"銀座エリア最大の商業施設「GINZA SIX」4月20日（木）開業（森ビル）","url":"https://www.mori.co.jp/press/release/ginza_six420/"},{"title":"松坂屋銀座店跡地に商業施設「GINZA SIX」 2017年4月20日開業へ（All About ニュース）","url":"https://news.allabout.co.jp/articles/o/19155/"},{"title":"中央区の沿革・ダイジェスト（中央区ホームページ）","url":"https://www.city.chuo.lg.jp/miryoku/history/index.html"},{"title":"GINZA SIX（GO TOKYO）","url":"https://www.gotokyo.org/jp/spot/260/index.html"}],"note":"GINZA SIXの開業年：THE GRAND GINZAの公式ページには「2016年に誕生」とあるが、森ビルの発表やGO TOKYOでは2017年4月20日開業。本文は2017年を採用した。\nTHE GRAND GINZA自体の開業日・建築年・設計者は、公式ページに記載がなく確認できなかった。\n文化財指定：国指定文化財等データベースでの検索は行っておらず、公開情報では指定を確認できなかった（「文化財ではない」とは断定していない）。\n婚礼（ウェディング）：公式ページにはWEDDINGへのリンク文言のみで、婚礼の内容を説明する本文は確認できなかった。\n「THE GRAND 47」の47都道府県の食材は公式ページの記述に基づく。\n銀座の1612年の創設（駿府からの移転）と1877年のれんが街は中央区の沿革ページ。公式ページの「二度の明治の大火」の年は確認していない。"},{"id":"heianjingu","name":"平安神宮会館","abbr":"HAJ","region":"京都","district":"岡崎","group":"レストラン＆パーティ","url":"https://www.vmg.co.jp/venues/heianjingu.html","ready":false,"draft":true,"area":"京都府京都市左京区岡崎西天王町（平安神宮の境内・神苑内）","summary":"平安神宮の名勝・神苑の池のほとりに建つ会館です。","history":"平安神宮は、明治28年（1895年）の平安遷都1100年を記念して創建されました。もとは平安遷都千百年紀念祭と第4回内国勧業博覧会の会場施設として、平安京の大内裏を模して計画され、全国からの募金で建てられました。設計は宮内省技師の木子清敬と帝国大学大学院生の伊東忠太、施工は清水組です。背後に桓武天皇を祀る本殿が建てられ、竣工とともに神社になりました。平安神宮会館は、平安神宮の御鎮座70年と孝明天皇100年祭を記念して、1969年に建てられました。会館がある神苑は、琵琶湖疏水の水を使い、七代小川治兵衛が作庭した庭で、約20年の歳月をかけてつくられたと公式ページに紹介されています。","usage":"平安神宮会館は、神苑の景色を楽しめるレストランとラウンジとして、アフタヌーンティーや季節限定のランチを提供しています。ガラス張りのロビーラウンジのほか、西側の栖鳳殿バンケット、神苑の最も奥にある迎賓殿バンケットで、パーティやMICEが開かれます。平安神宮での正式参拝や神前挙式の案内もあり、パーティやMICEのお客様には、正式参拝を特別な体験として用意しています。イベントによっては、通常は非公開の「尚美館」を見学できます。","value":"","designation":["所在する平安神宮神苑：国指定名勝（1975年12月10日指定）","境内の大極殿：国指定重要文化財（2010年12月24日指定）"],"highlights":["国の名勝・神苑の池のほとりに建つ","泰平閣は京都御所から移された建物","折上格天井の栖鳳殿バンケット"],"talks":[{"label":"①歴史・物語から","text":"平安神宮会館は、国の名勝に指定された神苑の中にあります。神苑は、琵琶湖疏水の水を使って七代小川治兵衛が作った庭で、20年もの歳月をかけてつくられました。池のそばには京都御所から移された泰平閣があり、通常は非公開の尚美館を見学できる機会もあります。平安神宮は、平安遷都1100年を記念して明治28年に創建された神社です。そのご縁の場所で正式参拝を行い、庭を眺めながら過ごす時間は、ここだけのものです。この場所の背景を知って選ぶことで、お二人の大切な日に深い意味が生まれます。"},{"label":"②建築・見どころから","text":"こちらの見どころは、国の名勝に指定された神苑の池のほとりに建っていることです。窓から庭を眺められるほか、池のそばには京都御所から移された建物、泰平閣があるとご紹介しています。西側の栖鳳殿バンケットは、天井が格子状に組まれた立派なつくりです。庭と建物の両方を、じっくりご覧いただけます。イベントによっては、通常は非公開の尚美館を見学できることもあります。"},{"label":"③お客様の場面から","text":"神苑の景色を眺めながら、アフタヌーンティーや季節限定のランチを楽しむ時間を思い浮かべてみてください。パーティや会議でお集まりのお客様には、平安神宮での正式参拝を特別な体験としてご用意しています。お参りの時間と、庭を前にした食事やパーティの時間。この二つを一日で味わえることが、ここで過ごす意味だと思います。"}],"talk":"平安神宮会館は、国の名勝に指定された神苑の中にあります。神苑は、琵琶湖疏水の水を使って七代小川治兵衛が作った庭で、20年もの歳月をかけてつくられました。池のそばには京都御所から移された泰平閣があり、通常は非公開の尚美館を見学できる機会もあります。平安神宮は、平安遷都1100年を記念して明治28年に創建された神社です。そのご縁の場所で正式参拝を行い、庭を眺めながら過ごす時間は、ここだけのものです。この場所の背景を知って選ぶことで、お二人の大切な日に深い意味が生まれます。","sources":[{"title":"平安神宮会館（VMG公式）","url":"https://www.vmg.co.jp/venues/heianjingu.html"},{"title":"平安神宮神苑（国指定文化財等データベース）","url":"https://kunishitei.bunka.go.jp/heritage/detail/401/1735"},{"title":"平安神宮 大極殿（文化遺産オンライン）","url":"https://online.bunka.go.jp/heritages/detail/213943"},{"title":"平安神宮（公式サイト）","url":"https://www.heianjingu.or.jp/"}],"note":"平安神宮が模した建物：VMG公式は「朝堂院」、文化遺産オンラインは「平安宮大極殿院」と表記が異なる。本文は「平安京の大内裏を模して」とぼかした。\n神苑の作庭期間（約20年）、泰平閣・臥龍橋・尚美館の由来は、VMG公式ページの記述のみで、他の公的資料では未確認。\n神苑の池の呼称：VMG公式は東神苑の「栖鳳池」と記載。データベースの解説文の抜粋は中神苑の「蒼龍池」、西神苑の「白虎池」を記載し、栖鳳池は確認していない。\nVMG公式の「多くの重要文化財、登録有形文化財」のうち、確認できたのは大極殿（重要文化財）のみ。応天門・白虎楼・蒼龍楼などの指定や登録有形文化財は、公的データベースの本文で直接確認していない（検索結果の要約では登録有形文化財が出たが未検証）。\n平安神宮会館の建物自体の文化財指定は、公開情報で確認できなかった。\n祭神：VMG公式は桓武天皇と孝明天皇を挙げるが、本文では文化遺産オンラインで確認した桓武天皇のみ明記し、孝明天皇は100年祭の記念としてのみ記した。\n婚礼：VMG公式の本文に「神前挙式」「正式参拝」の記述はあるが、婚礼プランの説明は確認していない。"},{"id":"kudan","name":"東京 九段会館テラス","abbr":"QDK","region":"東京","district":"九段下","group":"レストラン＆パーティ","url":"https://www.tokyokudan.com/","ready":false,"draft":true,"area":"東京都千代田区九段南（九段下駅4番出口から徒歩1分）","summary":"昭和9年に建った軍人会館の姿を受け継ぐ、登録有形文化財の会場です。","history":"九段会館は、昭和9年（1934年）に建てられました。もとは「軍人会館」という名前の建物で、昭和天皇の即位の礼を記念する昭和大礼記念事業の一環として建設されたと、VMGの会場一覧で紹介されています。文化遺産オンラインによると、軍人会館として、競技設計の1等案をもとに建てられた鉄骨鉄筋コンクリート造の建物です。公式サイトは、数々の昭和史の舞台となり、多くの貴人が訪れた建物だと紹介しています。そして昭和・平成を経て令和の時代へ受け継がれ、由緒ある姿を活かしながら現代的な要素を加えた空間として、いまの「東京 九段会館テラス」になっています。","usage":"公式サイトでは、ウエディング（挙式、パーティ、ブライダルフェア、ウエディングプラン）、カフェ、宴会・イベント、レストラン関連の案内が出ています。挙式は、北の丸公園の四季の景色を正面に望む屋上でできるとされ、都内でも希少な屋上挙式とうたっています。趣のあるエントランスでの挙式もあります。パーティ会場は、レトロとモダンを組み合わせた2つの会場で、創建時の姿が復元された空間に自然光がやわらかく入ります。屋上庭園に面したカフェや、季節限定のルーフトップバルもあります。","value":"","designation":["旧九段会館：登録有形文化財（建造物）（2019年9月10日登録）"],"highlights":["登録有形文化財（2019年登録）の建物","洋風の外観に和風瓦の屋根、「帝冠様式」","創建時の姿が復元されたパーティ会場","屋上庭園から北の丸公園などを望める"],"talks":[{"label":"①歴史・物語から","text":"こちらは昭和9年に、昭和天皇の即位の礼を記念する事業の一環として建てられた、もとの軍人会館です。洋風の外観に和風の瓦屋根をのせた「帝冠様式」で、国の登録有形文化財にもなっています。昭和の歴史の舞台になり、多くの方が訪れた建物の姿を残しながら、いまは婚礼やパーティ、カフェとして使われています。パーティ会場には、創建時の姿を復元した空間があります
