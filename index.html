、フロント・客室などに生かした分散型ホテルです。公式ページでは5棟8室で、1〜4名で泊まれます。SEICHOは明治期に建てられた商家で、かつて鰻屋・下宿屋・豆腐屋でした。TOKIWAは明治44年に建てられた旧履物屋と蔵、TOKOWAKAは創業270年余の卸問屋が持っていた明治初期の雑貨蔵です。「現代の御師」として神宮巡礼の癒しの空間をめざし、レストランは朝食のみで、神饌の伝統を尊重した朝食を出しています。町駕籠のお伊勢参りや人力車のツアーもあります。","value":"河崎は、勢田川の水運を活かして神宮の参拝客を支えた問屋街です。川の両岸に蔵や町家が並び、船から直接蔵へ荷を入れられるつくりでした。蔵は石堤の上に建つ切妻の土蔵造りで、厚い漆喰の壁を、魚の油と煤を使った黒塗りの刻み囲いが守っています。町並みは伊勢に多い「切妻妻入り」で、河崎独特の縁起物の瓦「隅蓋」も見られます。今は暗渠になった環濠の跡が、町の成り立ちを伝えています。宿の棟も、明治初期や明治44年の建物など、この商人町の暮らしと商いを今に残す建物です。","designation":["（ホテルとは別の施設・同じ河崎地区）伊勢河崎商人館（旧酒問屋の酒蔵と邸宅）：国の登録有形文化財。公式ページに記載。商人館のサイトは、全ての建物が平成13年に国の登録有形文化財になったと記載"],"highlights":["勢田川ぞいの問屋街「伊勢の台所」のまち","明治初期の蔵や明治44年築の旧履物屋に泊まれます","切妻妻入りの商家と河崎独特の隅蓋の町並み"],"talks":[{"label":"①歴史・物語から","text":"河崎は、伊勢神宮の近くを流れる勢田川のほとりにある町です。江戸時代には、お伊勢参りの人たちを支える問屋街として栄え、「伊勢の台所」と呼ばれていました。神宮の神職の御師が、参拝客をもてなす品物を、この町でそろえていたそうです。町には、切妻妻入りの商家や、黒く塗られた蔵が今も残っています。このお宿は、そんな商家や蔵を生かした分散型のホテルで、「現代の御師」をめざしています。朝食は神饌の伝統を大切にしたお料理です。"},{"label":"②建築・見どころから","text":"河崎の見どころは、建物のつくりです。町家は、伊勢に多い「切妻妻入り」といって、屋根の三角の面を正面に向けた形です。蔵は石の堤の上に建ち、厚い漆喰の壁を、魚の油と煤を使った黒塗りの囲いが守っています。河崎ならではの縁起物の瓦「隅蓋」も見られます。川の両岸に蔵が並んだのは、船から直接蔵へ荷を入れるためでした。宿の棟にも、明治初期や明治44年の建物があります。"},{"label":"③お客様の場面から","text":"朝のお食事の場面を思い浮かべてください。ここの朝食は、神様へのお供えの伝統を大切にしたお料理です。この宿は「現代の御師」として、神宮を巡る方の癒しの空間をめざしています。お参りの合間に、商家や蔵だった建物でゆっくり休む。そんな滞在ができます。町駕籠でのお伊勢参りや、人力車のツアーもあります。公式ページでは5棟8室で、1〜4名でお泊まりいただけます。"}],"talk":"河崎は、伊勢神宮の近くを流れる勢田川のほとりにある町です。江戸時代には、お伊勢参りの人たちを支える問屋街として栄え、「伊勢の台所」と呼ばれていました。神宮の神職の御師が、参拝客をもてなす品物を、この町でそろえていたそうです。町には、切妻妻入りの商家や、黒く塗られた蔵が今も残っています。このお宿は、そんな商家や蔵を生かした分散型のホテルで、「現代の御師」をめざしています。朝食は神饌の伝統を大切にしたお料理です。","sources":[{"title":"NIPPONIA HOTEL 伊勢河崎 商人町（公式。vmg-isekawasaki.comは301でこのURLへ転送）","url":"https://www.kazenoheritage.jp/hotels/ise-kawasaki/"},{"title":"まちの成り立ち（公式）","url":"https://www.kazenoheritage.jp/hotels/ise-kawasaki/townscape/history/"},{"title":"コンセプト（公式）","url":"https://www.kazenoheritage.jp/hotels/ise-kawasaki/story/"},{"title":"お部屋（公式）","url":"https://www.kazenoheritage.jp/hotels/ise-kawasaki/rooms/"},{"title":"伊勢河崎とは（伊勢河崎商人館／NPO法人伊勢河崎まちづくり衆）","url":"http://www.isekawasaki.jp/about/"},{"title":"伊勢河崎商人館 トップページ（NPO法人伊勢河崎まちづくり衆）","url":"http://www.isekawasaki.jp/"},{"title":"伊勢河崎商人館（観光三重）","url":"https://www.kankomie.or.jp/spot/3131.html"},{"title":"伊勢市景観計画（伊勢市公式）","url":"https://www.city.ise.mie.jp/machi/keikan/keikaku/index.html"},{"title":"重要伝統的建造物群保存地区一覧（文化庁）","url":"https://www.bunka.go.jp/seisaku/bunkazai/shokai/hozonchiku/judenken_ichiran.html"}]},{"id":"takehara","name":"NIPPONIA HOTEL 竹原 製塩町","abbr":"TSE","region":"広島","district":"本町","group":"ホテル＆レストラン","url":"https://www.vmg.co.jp/venues/takehara.html","ready":true,"draft":false,"area":"広島県竹原市本町1丁目4-16（公式ページのACCESS欄、〒725-0022）","summary":"塩田で栄えた竹原の町並みに、歴史的建造物3棟を再生した分散型ホテルです。","history":"竹原は広島県沿岸のほぼ中央にあり、瀬戸内海式気候で晴天が多い町です。竹原市のページによると、町は中世の末頃に、港に面した市場集落として形づくられました。江戸時代に塩田が開かれると、廻船業や酒造業とともに、塩の産地として発展しました。公式ページでは、塩田の主「浜旦那」が文化の振興にも力を入れ、竹原は「文教の地」としても知られたとあります。文化遺産オンラインは、江戸後期には学問や茶道が盛んになり、京風の文化が広がったと説明しています。大正期には造り酒屋が26蔵あったとも公式ページにあります。この町並みは、1982年（昭和57年）12月16日に、国の重要伝統的建造物群保存地区に選ばれました。","usage":"町並み保存地区に点在する3棟の歴史的建造物を再生した分散型ホテルで、客室は全10室です。旧水儀本店は、江戸期に創業し昭和50年頃まで料亭だった建物で、いまはフロントとダイニングになっています。旧芸備銀行（現広島銀行）・旧水儀旅館は、明治期に銀行として建てられ、のちに旅館になった建物で、MOSOの客室です。旧水出邸はKIKKOの客室で、大正から昭和にかけてはビリヤード場などの娯楽施設でした。ダイニングでは、竹原のブランド牛「峠下牛」や瀬戸内の海産物を使った料理を出します。","value":"竹原の町並みは、製塩業を土台に、廻船業や酒造業で栄えた江戸時代の町の姿を伝えています。竹原市のページによると、本町通り沿いには江戸中期から明治期の二階建ての町家が多く、切妻造・本瓦葺・大壁造が基本です。妻入りと平入りが混ざり、出格子や平格子など多様な格子が並んで、江戸時代の町人文化の伝統が残っています。市は、近世日本の町づくりの変遷を町の中にとどめていると説明しています。ホテルの旧水儀本店は料亭、旧芸備銀行は銀行から旅館へ、旧水出邸は造り酒屋から娯楽施設へと、時代ごとに役割を変えてきました。","designation":["重要伝統的建造物群保存地区「竹原市竹原地区伝統的建造物群保存地区」（本町一・三・四丁目の一部、約5.0ヘクタール、昭和57年（1982）12月16日選定）。ホテルは公式ページで「町並み保存地区に点在する3棟」と説明され、所在地は本町1丁目（出典：公式ページ、竹原市、文化遺産オンライン）"],"highlights":["塩田の町の歴史を伝える町並み保存地区の宿","旧料亭・旧銀行・旧造り酒屋を再生した3棟","竹原の竹を使った客室と、塩・醤油・牡蠣の食体験"],"talks":[{"label":"①歴史・物語から","text":"竹原は、江戸時代に塩田で栄えた町です。このホテルがある本町通りの一帯は、1982年に国の重要伝統的建造物群保存地区に選ばれました。ホテルは、その町並みに点在する3棟の歴史的建造物を再生した分散型のホテルです。フロントとダイニングは、昭和50年頃まで料亭だった旧水儀本店です。客室には、明治期に銀行として建てられた建物もあります。旧水出邸の向かいには、市の重要文化財の松阪邸もあります。どうぞ、町並みを歩きながら、塩の町の歴史を感じてください。"},{"label":"②建築・見どころから","text":"竹原では、町家のつくりに注目してください。本町通り沿いには、江戸中期から明治期の二階建ての町家が多く、妻入りと平入りが混ざり、出格子や平格子など、いろいろな格子が並んでいます。市は、近世日本の町づくりの移り変わりが町の中に残っていると説明しています。ホテルの旧水儀本店は料亭、旧芸備銀行は銀行から旅館へ、旧水出邸はビリヤード場などの娯楽施設と、時代ごとに役割を変えてきた建物です。"},{"label":"③お客様の場面から","text":"お夕食の場面を思い浮かべてください。ダイニングは、公式ページによると昭和50年頃まで料亭だった建物で、竹原のブランド牛「峠下牛」や瀬戸内の海産物を使った料理をお出ししています。客室は全10室で、銀行から旅館になった建物の客室や、かつて娯楽施設だった建物の客室があります。まちに点在する3棟のどこにも、それぞれの時代の使われ方が重なっています。"}],"talk":"竹原は、江戸時代に塩田で栄えた町です。このホテルがある本町通りの一帯は、1982年に国の重要伝統的建造物群保存地区に選ばれました。ホテルは、その町並みに点在する3棟の歴史的建造物を再生した分散型のホテルです。フロントとダイニングは、昭和50年頃まで料亭だった旧水儀本店です。客室には、明治期に銀行として建てられた建物もあります。旧水出邸の向かいには、市の重要文化財の松阪邸もあります。どうぞ、町並みを歩きながら、塩の町の歴史を感じてください。","sources":[{"title":"NIPPONIA HOTEL 竹原 製塩町（公式）","url":"https://www.vmg.co.jp/venues/takehara.html"},{"title":"竹原市竹原地区伝統的建造物群保存地区（竹原市）","url":"https://www.city.takehara.lg.jp/soshikikarasagasu/bunkashogaigakushuka/gyomuannai/9/1/5/2427.html"},{"title":"町並み保存地区（竹原市）","url":"https://www.city.takehara.lg.jp/soshikikarasagasu/bunkashogaigakushuka/gyomuannai/9/2421.html"},{"title":"竹原市竹原地区（文化遺産オンライン・文化庁）","url":"https://online.bunka.go.jp/heritages/detail/192173"},{"title":"旧松阪家住宅（竹原市）","url":"https://www.city.takehara.lg.jp/soshikikarasagasu/bunkashogaigakushuka/gyomuannai/9/1/10/2437.html"},{"title":"歴史的建造物活用に関するサウンディング型市場調査（竹原市）","url":"https://www.city.takehara.lg.jp/soshikikarasagasu/bunkashogaigakushuka/gyomuannai/9/1/5/4995.html"}]},{"id":"iga","name":"NIPPONIA HOTEL 伊賀上野 城下町","abbr":"IGU","region":"三重","district":"上野城下","group":"ホテル＆レストラン","url":"https://www.vmg.co.jp/venues/iga.html","ready":true,"draft":false,"area":"三重県伊賀市上野相生町（〒518-0859、公式ページの所在地は上野相生町2842）","summary":"城下町の碁盤状のまちなかに、町家や登録文化財の建物が点在する分散型ホテルです。","history":"伊賀上野は、築城の名手と呼ばれる藤堂高虎によって整えられた城下町です。京・奈良と伊勢を結ぶ交通の要衝にあり、江戸時代には城下町や宿場町として栄えました（伊賀市の計画書）。公式ページでは、フロント棟のKANMURIは、江戸時代から続いた生薬問屋で、のちに料理旅館、学習施設と用途を変えてきた建物と紹介されています。同じ番地（上野相生町2842）の「栄楽館」について、伊賀市の資料は、江戸期の生薬問屋を改造し、明治6年（1873）に料亭「栄楽亭」として開業した建物と説明しています。昭和58年（1983）に廃業したあとは主人の住まいとなり、のちに市へ寄贈され、改修を経て平成7年（1995）5月に生涯学習施設として開館しました。市は、空き家になった歴史的建物を生かす「伊賀上野城下町ホテル」に取り組み、令和元年度に栄楽館の改修工事を行いました。","usage":"城下町に点在する歴史的な建物を改修し、まちなみそのものに滞在できる分散型のホテルです。KANMURIフロント棟は、城下町の碁盤目状の町並みのほぼ中央にあり、フロント、レストラン、客室として使われています。茶室を備えた客室もあります。KOURAI棟は、津市まで続く伊賀街道の起点に面した町家で、母屋の街道側は組紐の店舗・工房、奥に中庭が続きます。MITAKE棟は、明治初期に建てられた木造2階建ての元材木店で、鍔型の虫籠窓や親子格子が特徴です。別棟の蔵は一棟貸しとして使われています。","value":"伊賀市の計画書は、伊賀上野の市街地を、江戸時代の武家屋敷と明治・大正・昭和の近代建築が共存する、全国的にも貴重なまちなみと説明しています。「伊賀上野城下町の文化的景観」は、日本の20世紀遺産20選にも選ばれています。栄楽館は、江戸期の生薬問屋を明治6年（1873）に料亭へ改めた建物です。室内には扇や竹の意匠が見られ、網代天井など部屋ごとに異なる細工が施されています。商家、料亭、住まい、市の学習施設と使い道を変えながら受け継がれてきた、城下町の暮らしの移り変わりを伝える建物です。","designation":["栄楽館（南棟・東棟・土蔵・門及び塀）：登録有形文化財（建造物）、時代は明治、平成26年（2014）4月25日登録。所在は上野相生町2842で、公式のホテル所在地と同じ番地（根拠：伊賀市「国登録文化財」一覧）","KANMURIフロント棟：公式ページが「国の文化財に登録」された歴史的建物と紹介（根拠：公式ページ。登録名称・年は公式ページに記載なし）"],"highlights":["碁盤目状の城下町のほぼ中央にあるKANMURIフロント棟","伊賀街道の起点に面した町家と、組紐の店舗・工房（KOURAI棟）","明治初期築の元材木店。虫籠窓と親子格子が見どころ（MITAKE棟）"],"talks":[{"label":"①歴史・物語から","text":"ようこそ、伊賀上野の城下町へ。このホテルは、まちに点在する古い建物を改修して、まち全体をホテルに見立てています。フロントのKANMURI棟は、江戸時代から続いた生薬問屋で、のちに料理旅館や学習施設として使われてきた建物です。国の文化財に登録されています。KOURAI棟は、伊賀街道の起点に面した町家で、組紐のお店と工房があります。MITAKE棟は、明治の初めに建てられた元材木店で、虫籠窓や親子格子が見どころです。伊賀上野は、藤堂高虎が整えた城下町で、江戸時代には宿場町としても栄えました。どうぞ、まちの空気も一緒にお楽しみください。"},{"label":"②建築・見どころから","text":"ここでは、棟ごとに見どころがあります。KANMURI棟は、碁盤の目のような城下町のほぼ中央にあり、茶室を備えた客室もあります。KOURAI棟は、津市まで続く伊賀街道の起点に面した町家で、街道側は組紐の店舗・工房、奥には中庭が続きます。MITAKE棟は、明治初期に建てられた元材木店で、鍔型の虫籠窓や親子格子が特徴です。"},{"label":"③お客様の場面から","text":"お泊まりの場面から思い浮かべてください。ここでは、まちなみそのものに泊まることができます。お部屋は、城下町に点在する歴史的な建物を改修したもので、茶室を備えたお部屋もあります。別棟の蔵は、一棟貸しとして使われています。フロントやレストランも、城下町のほぼ中央の建物にあります。お泊まりそのものが、まちなかでの滞在になります。"}],"talk":"ようこそ、伊賀上野の城下町へ。このホテルは、まちに点在する古い建物を改修して、まち全体をホテルに見立てています。フロントのKANMURI棟は、江戸時代から続いた生薬問屋で、のちに料理旅館や学習施設として使われてきた建物です。国の文化財に登録されています。KOURAI棟は、伊賀街道の起点に面した町家で、組紐のお店と工房があります。MITAKE棟は、明治の初めに建てられた元材木店で、虫籠窓や親子格子が見どころです。伊賀上野は、藤堂高虎が整えた城下町で、江戸時代には宿場町としても栄えました。どうぞ、まちの空気も一緒にお楽しみください。","sources":[{"title":"NIPPONIA HOTEL 伊賀上野 城下町（公式）","url":"https://www.vmg.co.jp/venues/iga.html"},{"title":"伊賀市 国登録文化財の一覧（建造物）","url":"https://www.city.iga.lg.jp/cmsfiles/contents/0000003/3870/kunitouroku.pdf"},{"title":"伊賀市 工事監査（令和元年度栄楽館施設改修工事）報告","url":"https://www.city.iga.lg.jp/cmsfiles/contents/0000001/1299/1kouji.pdf"},{"title":"第3期伊賀市中心市街地活性化基本計画（概要版）","url":"https://www.city.iga.lg.jp/cmsfiles/contents/0000011/11353/3_hen_gaiyou.pdf"},{"title":"国土交通省 資料「伊賀市の空き家対策」（2019年）","url":"https://www.mlit.go.jp/sogoseisaku/kanminrenkei/content/001311924.pdf"},{"title":"国土交通省ほか 歴史的風致維持向上計画の認定（平成28年5月）","url":"https://www.mlit.go.jp/common/001131757.pdf"},{"title":"三重県観光連盟 NIPPONIA HOTEL 伊賀上野 城下町","url":"https://www.kankomie.or.jp/spot/25190"},{"title":"三重県観光連盟 KANMURI棟","url":"https://www.kankomie.or.jp/spot/24460"}]},{"id":"oozu","name":"NIPPONIA HOTEL 大洲 城下町","abbr":"OZU","region":"愛媛","district":"大洲城下","group":"ホテル＆レストラン","url":"https://www.vmg.co.jp/venues/oozu.html","ready":true,"draft":false,"area":"愛媛県大洲市大洲（〒795-0012、公式ページの所在地は大洲378）","summary":"大洲城の城下町にある古い邸宅や町家を改修し、まち全体をホテルに見立てています。","history":"大洲は肱川の中流域にあり、江戸時代は大洲藩の城下町でした。1617年に初代藩主の加藤貞泰が入城しています。大洲城跡から東へ向かって短冊状の町割りがつくられ、道筋は今もほぼ当時のまま残っています。町並みの建物の多くは、木蝋・製糸・舟運で栄えた明治から大正に建てられました（大洲市の資料）。大洲城の天守は明治21年（1888）に取り壊され、平成16年（2004）に木造で復元されました。一方で、城下町では所有者の高齢化などで歴史的な建物が失われつつありました。平成29年（2017）から若い住民たちが町並みの保全活動を始め、平成30年（2018）にNPO法人になっています。2018年4月には官民連携の協定が結ばれ、2020年7月にSADA棟・OKI棟・TUNE棟が開業しました（キタ・マネジメントの資料）。","usage":"城下町に点在する邸宅や町家を改修し、まちなみそのものに滞在できる分散型のホテルです。SADA棟（浦岡邸）は大洲城の目の前にあり、フロントとレストランを備えた客室棟です。OKI棟（村上氏邸）は木蝋で財を成した豪商の邸宅で、敷地は1000坪を超え、フロントと客室になっています。TUNE棟は旧料亭、MITI棟は大正期の邸宅で、どちらも客室です。公式ページには、大洲城で「日本初の城に宿泊するキャッスルステイ」を実現したとも書かれています。","value":"大洲市の資料は、大洲城跡から東に延びる短冊状の町割りの道筋がほぼ失われずに残り、町人町の町並みと合わせて独特の風情があると説明しています。MITI棟は旧大洲藩主の末裔にあたる加藤家の住宅（1925年）で、国の登録有形文化財です。公式ページでは、藩主加藤家の執務と帰郷のために建てられた、西洋風のモダンさを備えた近代和風建築と紹介されています。OKI棟の村上氏邸は、木蝋で財を成した豪商の邸宅で、主屋は明治期もしくはそれ以前の建物とされます。壊されかけた城下町の建物を、「観る文化財から利用する文化財へ」という考え方で生かしています。","designation":["MITI棟：旧加藤家住宅（主屋）が国の登録有形文化財（大正期。登録年は未確認）（根拠：キタ・マネジメント資料でMITI棟＝旧加藤家住宅・国登録・大正期、大洲市の重点区域図と大洲城リーフレットでも旧加藤家住宅主屋を国登録として掲載）","【周辺・ホテル棟ではありません】大洲城の台所櫓・高欄櫓・苧綿櫓・三の丸南隅櫓：国の重要文化財（昭和32年（1957）指定。高欄櫓は昭和32年6月18日指定と市広報に記載）（根拠：大洲市広報、大洲城パンフレット）。復元天守（2004年）は別です","【周辺・ホテル棟ではありません】臥龍山荘庭園：国の名勝、令和3年（2021）10月11日指定（根拠：愛媛県教育委員会の文化財ページ）。臥龍山荘の建物は国の重要文化財（根拠：キタ・マネジメント資料、公式ページ。指定年は未確認）"],"highlights":["大洲城の目の前に建つ、SADA棟（浦岡邸）","木蝋の豪商の邸宅を生かしたOKI棟（敷地1000坪超）","国の文化財・臥龍山荘で、臥龍淵の眺めとお茶を楽しむ"],"talks":[{"label":"①歴史・物語から","text":"ようこそ大洲へ。大洲は、肱川のほとりに広がる城下町です。このホテルは、町家や古いお屋敷を改修して、まち全体を一つのホテルに見立てています。SADA棟は大洲城の目の前にあり、名前は初代藩主の加藤貞泰公にちなんでいます。OKI棟は、木蝋で財を成した豪商の邸宅で、敷地は1000坪を超えます。MITI棟は、藩主の加藤家が大正期に建てた近代和風の邸宅で、国の登録有形文化財です。見どころの臥龍山荘は国の文化財で、臥龍淵の眺めを楽しめます。どうぞ、お城下の散策もお楽しみください。"},{"label":"②建築・見どころから","text":"大洲では、まず大洲城を見て、そのまま城下町を歩いてみてください。城跡から東へ細長い区画が並ぶ町割りの道筋は、今もほぼ当時のままです。SADA棟は大洲城の目の前にあります。OKI棟は木蝋で財を成した豪商の邸宅で、敷地は1000坪を超えます。MITI棟は1925年の旧加藤家住宅で、西洋風のモダンさを備えた近代和風建築、国の登録有形文化財です。"},{"label":"③お客様の場面から","text":"お泊まりの場面を思い浮かべてください。ここは、城下町に点在する邸宅や町家に泊まり、まちなみそのものに滞在する宿です。SADA棟にはフロントとレストランがあり、目の前は大洲城です。TUNE棟は旧料亭、MITI棟は大正期の邸宅で、どちらも客室です。壊されかけた城下町の建物を、「観る文化財から利用する文化財へ」という考え方で生かしています。"}],"talk":"ようこそ大洲へ。大洲は、肱川のほとりに広がる城下町です。このホテルは、町家や古いお屋敷を改修して、まち全体を一つのホテルに見立てています。SADA棟は大洲城の目の前にあり、名前は初代藩主の加藤貞泰公にちなんでいます。OKI棟は、木蝋で財を成した豪商の邸宅で、敷地は1000坪を超えます。MITI棟は、藩主の加藤家が大正期に建てた近代和風の邸宅で、国の登録有形文化財です。見どころの臥龍山荘は国の文化財で、臥龍淵の眺めを楽しめます。どうぞ、お城下の散策もお楽しみください。","sources":[{"title":"NIPPONIA HOTEL 大洲 城下町（公式）","url":"https://www.vmg.co.jp/venues/oozu.html"},{"title":"大洲市 街なみ環境整備方針説明書（肱南地区）","url":"https://www.city.ozu.ehime.jp/uploaded/attachment/23408.pdf"},{"title":"大洲市歴史的風致維持向上計画（第2期）第4章 重点区域","url":"https://www.city.ozu.ehime.jp/uploaded/attachment/34281.pdf"},{"title":"キタ・マネジメント「大洲城下町再生の物語」（内閣官房 資料2）","url":"https://www.cas.go.jp/jp/seisaku/atarashii_chihousousei/yusikishakaigi/dai4/siryou2.pdf"},{"title":"愛媛県 臥龍山荘庭園（名勝）解説","url":"https://ehime-c.esnet.ed.jp/bunkazai/kennobunkazai/shiteibunkazai/meishou/pdf-files/kuni/4-2-13garyuusansou.pdf"},{"title":"広報大洲 2013年5月号（大洲城高欄櫓）","url":"https://www.city.ozu.ehime.jp/uploaded/attachment/12184.pdf"},{"title":"大洲城パンフレット（神奈川大学ウェブサイト掲載）","url":"https://www.arch.kanagawa-u.ac.jp/lab/shimazaki_kazushi/shimazaki/JAPANCasle/082oozu/panf.pdf"},{"title":"文化遺産オンライン 大洲市の文化財","url":"https://online.bunka.go.jp/heritages/region/38/38207"},{"title":"リセマム／PR TIMES バリューマネジメント発表（2022年3月14日）","url":"https://resemom.jp/release/prtimes/20220314/79887.html"}]},{"id":"naramachi","name":"風の ならまち","abbr":"NNM","region":"奈良","district":"ならまち","group":"ホテル＆レストラン","url":"https://www.vmg.co.jp/venues/naramachi.html","ready":true,"draft":false,"area":"奈良県奈良市西城戸町4","summary":"明治創業の蔵元の旧酒蔵を生かした、日本酒がテーマの8室のホテルです。","history":"奈良市の説明では、奈良町は中世以降に発展し、近世に成立した町々の総称で、旧市街地の大部分と重なります。江戸時代の初め、1603年（慶長8年）には「奈良町」の名称が確定し、100町が町として定められました。ならまちは、6世紀に蘇我馬子が創建した飛鳥寺を平城京に移して造った元興寺の旧境内にあたる地区で、極楽坊の周りには江戸時代末の古い町家が今も残っています。昭和50年代からは、歴史的な町並みを生かすまちづくり活動が行われてきました。奈良は日本酒造りの発祥の地とされ、春日大社から流れる水脈がならまちを通っていたため、多くの酒蔵が並んでいたと公式ページは紹介しています。","usage":"明治創業の蔵元「奈良豊澤酒造」のかつての酒蔵をリノベーションした、客室8室の宿です。元は蔵だった部屋、茶室を改修した部屋、離れなど、造りの違う客室があります。酒造りに使われてきた井戸水を今も使っています。元土間を生かした「シェフズカウンター」では、大和野菜や大和牛などの奈良の食材を使い、フレンチの技法で仕立てた料理を日本酒とのペアリングで味わえます。酒粕風呂や檜風呂、豊澤酒造の酒造見学（宿泊者向け）も案内されています。","value":"この場所は、明治創業の蔵元・奈良豊澤酒造が、昭和10年（1935年）に移転するまで酒造りに使っていた建物です。旅行情報サイトでは「創業の地」とも紹介されています。米蔵、蔵元の母屋、茶室、離れ、酒蔵の土間といった、酒蔵と暮らしの場が一つの敷地に残っている点が特徴です。旧正面玄関には「豊澤」の表札と酒蔵のしるしの杉玉が残るとされています。奈良の酒造りの歴史と、元興寺旧境内に重なるならまちの町家の歴史を、あわせて感じられる場所です。","designation":["奈良町都市景観形成地区（公式ホテル一覧のタグ。西城戸町4が区域内かは、範囲図で未確認）"],"highlights":["明治創業の蔵元・奈良豊澤酒造の旧酒蔵が舞台","元土間のシェフズカウンターで日本酒とペアリング","元米蔵・元母屋・茶室跡など造りの違う8室"],"talks":[{"label":"①歴史・物語から","text":"こちらは、奈良のならまちにある、日本酒がテーマのホテルです。もとは明治創業の蔵元、奈良豊澤酒造の酒蔵でした。昭和10年に蔵元が移るまで、ここで酒造りが行われていたそうです。米蔵や母屋、茶室だった場所が、今は客室になっています。お食事は、昔の土間を生かしたカウンターで、奈良の食材を使った料理を日本酒と一緒にお楽しみいただけます。ならまちは、元興寺の昔の境内にあたる地区です。歴史のある町並みの中で、お酒の文化にも触れていただければと思います。"},{"label":"②建築・見どころから","text":"まず見ていただきたいのは、敷地に残る酒蔵の名残です。米蔵、蔵元の母屋、茶室、離れ、酒蔵の土間と、酒造りと暮らしの場が一つの敷地に残っています。旧正面玄関には「豊澤」の表札と、酒蔵のしるしの杉玉が残っているとされています。これらを生かして、元は蔵だった部屋、茶室を改修した部屋、離れなど、造りの違う8室になっています。同じ宿でも部屋ごとに表情が違うのが楽しみのひとつです。"},{"label":"③お客様の場面から","text":"夜は、元は土間だったカウンターに腰かけて、お食事を楽しんでいただけます。大和野菜や大和牛など奈良の食材を、フレンチの技法で仕立て、日本酒とあわせて味わう流れです。酒造りに使われてきた井戸水を今も使っているそうです。そのあとは酒粕風呂や檜風呂でゆっくりしていただけます。宿泊の方は、豊澤酒造の酒造見学も案内されています。お酒の文化を、味わうところから知っていただく滞在です。"}],"talk":"こちらは、奈良のならまちにある、日本酒がテーマのホテルです。もとは明治創業の蔵元、奈良豊澤酒造の酒蔵でした。昭和10年に蔵元が移るまで、ここで酒造りが行われていたそうです。米蔵や母屋、茶室だった場所が、今は客室になっています。お食事は、昔の土間を生かしたカウンターで、奈良の食材を使った料理を日本酒と一緒にお楽しみいただけます。ならまちは、元興寺の昔の境内にあたる地区です。歴史のある町並みの中で、お酒の文化にも触れていただければと思います。","sources":[{"title":"風の ならまち（VMG公式）","url":"https://www.vmg.co.jp/venues/naramachi.html"},{"title":"奈良町 - 奈良市ホームページ","url":"https://www.city.nara.lg.jp/site/naramachi/"},{"title":"奈良町の成立 中世から近世へ - 奈良市ホームページ（文化財課）","url":"https://www.city.nara.lg.jp/site/bunkazai/2331.html"},{"title":"元興寺 - 世界遺産 - 奈良市ホームページ（文化財課）","url":"https://www.city.nara.lg.jp/site/world-heritage/88519.html"},{"title":"近田家住宅主屋、蔵 - 奈良市ホームページ（文化財課）","url":"https://www.city.nara.lg.jp/site/bunkazai/8424.html"},{"title":"奈良市歴史的風致形成建造物について - 奈良町（観光戦略課）","url":"https://www.city.nara.lg.jp/site/naramachi/9346.html"},{"title":"奈良市都市景観形成地区建造物保存整備費補助金 - 奈良町（観光戦略課）","url":"https://www.city.nara.lg.jp/site/naramachi/10259.html"},{"title":"重要伝統的建造物群保存地区 選定一覧（文化庁）","url":"https://www.bunka.go.jp/seisaku/bunkazai/shokai/hozonchiku/judenken_ichiran.html"},{"title":"1日8組限定!日本初・日本酒テーマのホテル「NIPPONIA HOTEL 奈良 ならまち」（るるぶ&more）","url":"https://rurubu.jp/andmore/article/22341"},{"title":"intojapanwaraku 記事（NIPPONIA HOTEL 奈良 ならまち）","url":"https://intojapanwaraku.com/travel/256900/"}]},{"id":"dazaifu","name":"HOTEL CULTIA 太宰府","abbr":"CDF","region":"福岡","district":"天満宮参道","group":"ホテル＆レストラン","url":"https://www.vmg.co.jp/venues/dazaifu.html","ready":true,"draft":false,"area":"福岡県太宰府市太宰府3-3-33","summary":"太宰府天満宮の門前にある、吉嗣家の名家の邸宅を生かしたホテルです。","history":"太宰府は、古代に大宰府政庁が置かれ、大陸との外交の窓口を担った土地です。太宰府市の計画資料では、九州全体を治め「遠の朝廷」と呼ばれた大宰府が置かれてから約1350年の歴史があるとされています。太宰府天満宮は、菅原道真公の御墓所の上に築かれ、1100年以上にわたり広く崇敬されてきました。参詣者が市内の名所をめぐる「さいふまいり」のにぎわいは、門前を中心に今も続くと説明されています。ホテルの建物は、その門前にある吉嗣家の住宅です。公式ページによると、吉嗣家は天満宮の神官を三代にわたり務め、梅仙、拝山、鼓山の三名は三代にわたり書画を手がけました。住宅は「古香書屋」とも呼ばれ、のちに「古香庵」として飲食事業が営まれ、地域の人々に親しまれてきました。","usage":"吉嗣家の住宅を再生し、フロント、ダイニング、客室として使っているブティックホテルです。客室は歴史的な風情のある空間で、檜風呂などを備えています。カフェスペースでは福岡のブランド苺「あまおう」を使ったアフタヌーンティー、歴史建築のダイニングでは九州・福岡の食材を使ったフレンチを楽しめます。宿泊者限定で、閉門後の太宰府天満宮で行われる夜間の正式参拝に参加できるほか、九州国立博物館の夜のナイトツアーも案内されています。天満宮から徒歩1分の古民家の貸切利用もできます。","value":"この建物は、太宰府天満宮の神官を三代にわたり務めた吉嗣家の住宅で、公式ページでは江戸末期から昭和初期の名家の邸宅と紹介されています。吉嗣家の梅仙・拝山・鼓山は三代にわたり書画を手がけ、住宅は「古香書屋」とも呼ばれました。拝山（1846〜1915年）は太宰府の生まれとされ、太宰府市教育委員会は2023年に『太宰府の絵師調査報告3 吉嗣家資料【書画編】』を刊行して、吉嗣家の書画を調査しています。天満宮門前のまちの歴史と、地域の書画の歴史の両方に結びつく建物です。","designation":[],"highlights":["太宰府天満宮から徒歩1分の門前にある名家の邸宅","神官を務めた吉嗣家と、書画の三代ゆかりの住宅","宿泊者限定の夜間正式参拝（閉門後）に参加できる"],"talks":[{"label":"①歴史・物語から","text":"こちらは、太宰府天満宮から歩いて1分ほどの、門前にあるホテルです。建物は、天満宮の神官を三代務めた吉嗣家のお住まいで、梅仙、拝山、鼓山の三代は書画を手がけたと伝えられています。住宅は「古香書屋」とも呼ばれ、のちに「古香庵」という飲食店として、地域の方々に親しまれてきました。それを、フロントやダイニング、客室として生まれ変わらせています。宿泊のお客様は、閉門後の天満宮で行われる夜間の正式参拝にご参加いただけます。昼のにぎわいとは違う、静かな太宰府を感じていただけます。"},{"label":"②建築・見どころから","text":"ここの見どころは、建物そのものです。天満宮から歩いて1分ほどの門前にあって、公式ページでは、江戸末期から昭和初期の名家の邸宅と紹介されています。古い邸宅の空間を生かして、フロント、ダイニング、客室に生まれ変わりました。客室は歴史的な風情のある空間で、檜風呂などもございます。かつて「古香書屋」とも呼ばれた住宅の中で過ごせるのが、このホテルならではです。"},{"label":"③お客様の場面から","text":"太宰府での一日を、夜まで楽しんでいただけるホテルです。昼はカフェスペースで、福岡のブランド苺「あまおう」を使ったアフタヌーンティーを。夜は歴史ある建物のダイニングで、九州・福岡の食材を使ったフレンチをどうぞ。宿泊のお客様だけの特典として、閉門後の天満宮で行われる夜の正式参拝にも参加できます。九州国立博物館の夜のナイトツアーも案内されています。"}],"talk":"こちらは、太宰府天満宮から歩いて1分ほどの、門前にあるホテルです。建物は、天満宮の神官を三代務めた吉嗣家のお住まいで、梅仙、拝山、鼓山の三代は書画を手がけたと伝えられています。住宅は「古香書屋」とも呼ばれ、のちに「古香庵」という飲食店として、地域の方々に親しまれてきました。それを、フロントやダイニング、客室として生まれ変わらせています。宿泊のお客様は、閉門後の天満宮で行われる夜間の正式参拝にご参加いただけます。昼のにぎわいとは違う、静かな太宰府を感じていただけます。","sources":[{"title":"ホテル カルティア 太宰府（VMG公式）","url":"https://www.vmg.co.jp/venues/dazaifu.html"},{"title":"フクオカ古民家再生プロジェクト（グラフふくおか 2022 AUTUMN）","url":"https://www.pref.fukuoka.lg.jp/somu/graph-f/2022autumn/special/"},{"title":"太宰府市の維持向上すべき歴史的風致（歴史的風致維持向上計画（第2期）の概要資料）","url":"https://www.mlit.go.jp/common/001260012.pdf"},{"title":"歴史的風致維持向上計画（第2期）の認定について（文化庁）","url":"https://www.bunka.go.jp/koho_hodo_oshirase/hodohappyo/93854401.html"},{"title":"太宰府天満宮 公式サイト（御由緒ページ上部の概要）","url":"https://www.dazaifutenmangu.or.jp/about/"},{"title":"太宰府天満宮（クロスロードふくおか）","url":"https://www.crossroadfukuoka.jp/spot/12546"},{"title":"太宰府の絵師調査報告3 吉嗣家資料【書画編】（奈良文化財研究所 全国遺跡報告総覧）","url":"https://sitereports.nabunken.go.jp/139934"},{"title":"吉嗣拝山（コトバンク／日本人名大辞典+Plus ほか）","url":"https://kotobank.jp/word/%E5%90%89%E5%97%A3%E6%8B%9D%E5%B1%B1-22159"},{"title":"重要伝統的建造物群保存地区 選定一覧（文化庁）","url":"https://www.bunka.go.jp/seisaku/bunkazai/shokai/hozonchiku/judenken_ichiran.html"}]},{"id":"neene","name":"寧々の道別邸 Kazeno Heritage","abbr":"寧々","region":"京都","district":"東山","group":"ホテル＆レストラン","url":"https://www.vmg.co.jp/venues/kyoto.html","ready":true,"draft":false,"area":"京都府京都市東山区下河原町463-23","summary":"ねねの道に面し、かつて料理旅館だった木造建築を生かした客室3室の宿です。","history":"寧々の道別邸は、八坂神社から清水寺へ続く石畳の「ねねの道」に面しています。公式ストーリーページによると、豊臣秀吉の正室・北政所ねねは、この地で余生を送りました。秀吉の没後、菩提を弔うために高台寺を建て、伏見城から移した化粧御殿で暮らしたそうで、その住まいは現在の圓徳院のあたりにあたります。高台寺の公式サイトも、寺は慶長11年（1606）に、秀吉の菩提を弔うため北政所が開いたと伝えています。ねねの周りには、大名、禅僧、茶人、歌人、画家、陶芸家など、ねねを慕う多くの人々が集まったと伝えられます。建物は、公式ストーリーページによると、かつて料理旅館だった木造建築を再生したものです。柱、梁、土壁、建具など建物に刻まれた時間をできる限り残し、新築のようには塗り替えませんでした。なお、建物の建築年や、旧旅館の名前は、公式ページに書かれていません。","usage":"公式ページによると、客室は3室で、定員は1〜4名です。全室61㎡以上で、1階には坪庭と檜風呂の客室、2階には高台寺、ねねの道、八坂の塔を望む2室があります。空間のテーマは京都のものづくりを支えてきた「銅」で、開化堂の銅の茶筒を置き、清水焼の色彩を思わせる孔雀青を取り入れています。体験として、玉露体験と、香道・花・茶の文化体験があります。レストランは直営の近隣施設にあります。また、東山露地 Kazeno Heritage のチェックインも、この寧々の道別邸で行います（東山露地の公式ページ）。","value":"寧々の道別邸があるのは、北政所ねねが秀吉の菩提を弔うために開いた高台寺（慶長11年、1606年）のそばです。公式ストーリーページによると、寺社へ続く参詣の道には古くから茶店、料理屋、工芸品店が並び、二寧坂、産寧坂、ねねの道の石畳と家並みは、日本を代表する歴史的景観として保存されています。この一帯は、国の重伝建「京都市産寧坂」の説明で、八坂神社、法観寺、清水寺の門前町として栄えた地域とされています。建物自体は、かつて料理旅館だった木造建築で、柱や土壁に刻まれた時間を残して再生されています。建築年や旧旅館の来歴は確認できていないため、ここでは、まちの歴史の中での位置づけを中心にお伝えします。","designation":["重要伝統的建造物群保存地区「京都市産寧坂」（種別：門前町、面積8.2ha、1976年9月4日選定）について、公式ページが「まちの分類」を重要伝統的建造物群保存地区とし、二寧坂と産寧坂が同地区であると説明している（地区の選定内容の根拠：https://kunishitei.bunka.go.jp/heritage/detail/103/17。当館の地番が範囲内かは未確認）"],"highlights":["銅がテーマの客室と、孔雀青の深い青","2階の2室から高台寺・八坂の塔を望む","経年の痕跡を残して再生した柱・土壁・建具"],"talks":[{"label":"①歴史・物語から","text":"寧々の道別邸は、八坂神社から清水寺へ続く石畳の「ねねの道」に面しています。豊臣秀吉の奥様だった北政所ねねさんは、秀吉が亡くなったあと、供養のために高台寺を建てて、この辺りで余生を過ごしたと伝えられています。建物は、もともと料理旅館だった木造の建物を生かしたもので、柱や土壁、建具などに刻まれた時間を、できるだけ残しています。お部屋は3室だけで、京都のものづくりを支えてきた「銅」がテーマです。開化堂さんの銅の茶筒や、清水焼の色を思わせる深い青が目に入ります。2階の2室の窓からは、高台寺や八坂の塔、ねねの道の街並みを眺められます。"},{"label":"②建築・見どころから","text":"見どころは、「銅」をテーマにした客室です。京都のものづくりを支えてきた銅にちなみ、開化堂さんの銅の茶筒を置き、清水焼の色彩を思わせる孔雀青を取り入れています。柱、梁、土壁、建具は、刻まれた時間をできる限り残しました。2階の2室からは、高台寺、ねねの道、八坂の塔を望めます。一つひとつの素材や色にも、ぜひ目を向けてみてください。"},{"label":"③お客様の場面から","text":"石畳のねねの道に面した宿で、ゆっくり過ごす場面を思い浮かべてください。お部屋は3室だけ、定員は1〜4名で、全室61㎡以上のゆとりがあります。1階には坪庭と檜風呂の客室もあります。玉露体験や、香道・花・茶の文化体験もあります。お食事は、直営の近隣のレストランをご利用いただけます。スタッフが案内する、東山露地のチェックインもここで行います。"}],"talk":"寧々の道別邸は、八坂神社から清水寺へ続く石畳の「ねねの道」に面しています。豊臣秀吉の奥様だった北政所ねねさんは、秀吉が亡くなったあと、供養のために高台寺を建てて、この辺りで余生を過ごしたと伝えられています。建物は、もともと料理旅館だった木造の建物を生かしたもので、柱や土壁、建具などに刻まれた時間を、できるだけ残しています。お部屋は3室だけで、京都のものづくりを支えてきた「銅」がテーマです。開化堂さんの銅の茶筒や、清水焼の色を思わせる深い青が目に入ります。2階の2室の窓からは、高台寺や八坂の塔、ねねの道の街並みを眺められます。","sources":[{"title":"寧々の道別邸 Kazeno Heritage（公式・施設トップ）","url":"https://www.kazenoheritage.jp/hotels/nenenomichibettei/"},{"title":"寧々の道別邸 Kazeno Heritage（公式・ストーリー）","url":"https://www.kazenoheritage.jp/hotels/nenenomichibettei/story/"},{"title":"寧々の道別邸 Kazeno Heritage（公式・英語トップ）","url":"https://www.kazenoheritage.jp/hotels/nenenomichibettei/?lang=en"},{"title":"東山露地 Kazeno Heritage（公式・施設トップ）","url":"https://www.kazenoheritage.jp/hotels/higashiyamaroji/"},{"title":"高台寺（公式）歴史","url":"https://www.kodaiji.com/rekishi.html"},{"title":"京都市産寧坂（国指定文化財等データベース）","url":"https://kunishitei.bunka.go.jp/heritage/detail/103/17"},{"title":"京都市産寧坂（文化遺産オンライン）","url":"https://online.bunka.go.jp/heritages/detail/125134"},{"title":"産寧坂伝統的建造物群保存地区保存計画（京都市）","url":"https://www.city.kyoto.lg.jp/tokei/page/0000281761.html"}]},{"id":"yame","name":"風の 八女福島","abbr":"YMS","region":"福岡","district":"福島","group":"ホテル＆レストラン","url":"https://www.vmg.co.jp/venues/yame-fukushima.html","ready":true,"draft":false,"area":"福岡県八女市本町（八女福島）","summary":"八女福島の町並みの中で、旧酒造場と茶舗の町家を生かした茶と酒の宿です。","history":"八女福島は、福岡県八女市の中心部にある町です。八女市の資料によると、1587年（天正15年）に筑紫広門が福島城を築き、1600年（慶長5年）の関ヶ原の戦いのあとに田中吉政が大きく修築して、城下町が整えられました。1620年（元和6年）に久留米藩有馬氏の支配となり、福島城は廃城になりましたが、町人地は交通と経済の中心として栄え、後に久留米藩内で最大級の在郷の商家町になったと説明されています。大火が多かったため、江戸末期から明治にかけて、白壁の土蔵造りの「居蔵（いぐら）」の町家が建てられました。昭和40年代以降は商業の中心が町の外へ移りましたが、往還道路沿いは開発を免れ、町家が残りました。2002年（平成14年）5月に国の重要伝統的建造物群保存地区に選定されています。","usage":"活用しているのは、旧喜多屋と旧大坪茶舗の二つの建築です。KITAYA BETTEI（喜多屋 別邸）は、重伝建地区の中央にある6棟続きの旧酒造場と屋敷で、1棟は今も焼酎の仕込み蔵として使われています。フロント、レストラン、日本酒バー、客室があります。OTSUBO CHAHO（旧大坪茶舗）は、主屋、離れ座敷、土蔵2棟、作業場からなる、間口が狭く奥行きの長い屋敷です。客室は全7室で、伝統的な佇まいや意匠を残し、最小限の改修で現代の快適さを加えています。八女茶を使った料理とティーペアリングや、久留米絣のクラフト体験などがあります。","value":"八女福島は、江戸時代の初めに城下町の町人地として生まれ、のちに久留米藩内で最大級の在郷の商家町として栄えました（文化遺産オンライン）。城下町だった期間は短いものの、短冊状の敷地割りや屈曲した道路網など、計画された町の面影が残っています。大火に備えて発達した居蔵造りの町家が連なり、江戸時代から近代にかけての伝統的建造物が残っていることが、保存地区の特徴として説明されています。この宿は、その町並みの中の旧酒造場と旧茶舗の町家を生かしており、町の商いと茶の文化に触れる滞在を目指しています。","designation":["重要伝統的建造物群保存地区「八女福島」（商家町）：2002年（平成14年）5月23日選定（文化遺産オンライン）","活用する建物は「重伝建地区内の『伝統的建造物』」と公式ブランドページに記載（範囲図での確認はしていません）"],"highlights":["旧酒造場の6棟続きの町家に泊まる","八女茶を使った料理とティーペアリング","仏壇や提灯の工房を巡る町の生業めぐり"],"talks":[{"label":"①歴史・物語から","text":"八女福島へようこそ。ここは江戸時代のはじめに城下町として生まれ、のちに商家町として栄えた町で、国の重要伝統的建造物群保存地区になっています。白壁の土蔵造りの「居蔵」と呼ばれる町家が並ぶのが特徴です。こちらの宿は、その町並みの中にある、旧酒造場の屋敷と旧茶舗の町家を生かしてつくられました。伝統的な佇まいを残しながら、必要最小限の改修で、今の暮らしに合う快適さを加えています。八女は茶どころですので、八女茶を使ったお料理やティーペアリングも、ぜひお楽しみください。町の工房をめぐるコースもあります。"},{"label":"②建築・見どころから","text":"八女福島の町を歩くと、白壁の土蔵造りの町家が続いています。大火に備えて建てられた「居蔵」という造りです。道が曲がっていたり、細長い敷地が並んでいたりと、計画された城下町の面影も残っています。この宿は、その町並みの中の、旧酒造場の6棟続きの建物と、間口が狭く奥行きの長い旧茶舗の屋敷です。公式ページでは、重伝建地区内の伝統的建造物と紹介されています。"},{"label":"③お客様の場面から","text":"八女は茶どころです。お食事では八女茶を使ったお料理と、お茶とのペアリングを楽しんでいただけます。日本酒バーもございます。日中は、久留米絣のクラフト体験や、仏壇や提灯の工房を巡る町の生業めぐりが案内されています。町の商いと茶の文化を、食べて、触れて、歩いて感じていただく滞在です。伝統的な佇まいは残しつつ、改修は最小限で、快適さを加えています。"}],"talk":"八女福島へようこそ。ここは江戸時代のはじめに城下町として生まれ、のちに商家町として栄えた町で、国の重要伝統的建造物群保存地区になっています。白壁の土蔵造りの「居蔵」と呼ばれる町家が並ぶのが特徴です。こちらの宿は、その町並みの中にある、旧酒造場の屋敷と旧茶舗の町家を生かしてつくられました。伝統的な佇まいを残しながら、必要最小限の改修で、今の暮らしに合う快適さを加えています。八女は茶どころですので、八女茶を使ったお料理やティーペアリングも、ぜひお楽しみください。町の工房をめぐるコースもあります。","sources":[{"title":"風の 八女福島（VMG公式）","url":"https://www.vmg.co.jp/venues/yame-fukushima.html"},{"title":"風の 八女福島（Kazeno Heritage公式）","url":"https://www.kazenoheritage.jp/hotels/yame-fukushima/"},{"title":"八女福島の町並み（歴史と保存の取り組み）八女市ホームページ","url":"https://www.city.yame.fukuoka.jp/soshiki/sangyou/kankou/rekimachi/1454651769364.html"},{"title":"八女市八女福島（商家町 福岡）文化遺産オンライン","url":"https://online.bunka.go.jp/heritages/detail/91153"},{"title":"八女市八女福島 文化遺産オンライン","url":"https://online.bunka.go.jp/heritages/detail/148068"}]},{"id":"ginza","name":"THE GRAND GINZA","abbr":"G6","region":"東京","district":"銀座","group":"レストラン＆パーティ","url":"https://www.vmg.co.jp/venues/ginza.html","ready":true,"draft":false,"area":"東京都中央区銀座6丁目（GINZA SIX 13階）","summary":"GINZA SIXの最上階にある、食と文化を味わう複合施設です。","history":"THE GRAND GINZAがあるのは、2017年に開業した商業施設GINZA SIXの最上階（13階）です。GINZA SIXは、松坂屋銀座店の跡地を含む、道路をはさんだ2つの街区（約1.4ヘクタール）をまとめて再開発してできました。銀座は、1612年（慶長17年）に駿府から銀座が移ってきたことで生まれた町です。明治10年（1877年）にはれんが街ができ、新聞社が集まるなど、時代の先端の町になりました。その後も、関東大震災や昭和20年の空襲などで大きな被害を受けましたが、そのたびに復興してきました。公式ページでも、こうした銀座の歴史が紹介されています。なお、施設の建築年や設計者、開業日は、公式ページでは確認できませんでした。","usage":"THE GRAND GINZAは、GINZA SIXのトップフロア約1,500平方メートルに広がる「食の複合施設」です。日本47都道府県の食材を扱うレストラン「THE GRAND 47」、12席限定のカウンター「銀座 極-KIWAMI-」、ランチやアフタヌーンティー、バーが楽しめるラウンジがあります。このほか、ダイニング・バンケット、貸切バンケットルーム、多目的ホール「CEREMONY SPACE」、茶室もあり、パーティやMICEに使われます。公式サイトにはWEDDINGのご案内ページへのリンクもあります。","value":"ここは2017年に開業したGINZA SIXの最上階にあり、建物そのものが歴史的建造物というわけではありません。歴史的価値は、場所の歴史と、空間に取り入れられた日本の工芸にあります。銀座は1612年（慶長17年）に駿府から銀座が移ってきたことで生まれた町で、明治10年（1877年）にはれんが街ができ、新聞社が集まるなど時代の先端の町になりました。GINZA SIXは、その銀座の松坂屋銀座店の跡地を含む街区の再開発でできています。公式ページによると、インテリアは京都の茶道家・木村宗慎氏がキュレーションし、屏風絵と襖絵、バーの壁面の織物は京都の着物デザイナー・斉藤上太郎氏の手によるものです。","designation":[],"highlights":["最上階から銀座の街並みを望む","茶道家・木村宗慎氏によるインテリア","斉藤上太郎氏の屏風絵・襖絵と織物"],"talks":[{"label":"①歴史・物語から","text":"ここは、銀座の中心にあるGINZA SIXの最上階です。銀座は、1612年に駿府から銀座が移ってきたことから始まった町で、震災や空襲のたびに復興してきました。その銀座を見渡す場所に、京都の茶道家・木村宗慎さんが手がけたインテリアや、着物デザイナー・斉藤上太郎さんの屏風絵、襖絵が並びます。新しい建物ですが、日本の文化を取り入れた空間です。大切な日を、銀座の歴史と日本の美にかこまれて迎えられることが、この場所を選ぶ意味だと思います。"},{"label":"②建築・見どころから","text":"まずお見せしたいのは、窓の外に広がる銀座の街並みです。ここはGINZA SIXの最上階、13階にあります。店内には、京都の茶道家・木村宗慎さんが手がけたインテリアがあり、着物デザイナー・斉藤上太郎さんの屏風絵や襖絵、織物も飾られています。高い場所から街を見渡しながら、日本の美しさにゆっくり触れていただける空間です。"},{"label":"③お客様の場面から","text":"お仕事の仲間や大切な方との集まりを思い浮かべてみてください。ランチやアフタヌーンティー、バーでのひとときもあれば、貸切のバンケットルームでのパーティもあります。日本47都道府県の食材を扱うレストランや、12席限定のカウンターもあります。銀座の街を望む最上階で過ごす時間が、その日を特別な思い出にしてくれると思います。"}],"talk":"ここは、銀座の中心にあるGINZA SIXの最上階です。銀座は、1612年に駿府から銀座が移ってきたことから始まった町で、震災や空襲のたびに復興してきました。その銀座を見渡す場所に、京都の茶道家・木村宗慎さんが手がけたインテリアや、着物デザイナー・斉藤上太郎さんの屏風絵、襖絵が並びます。新しい建物ですが、日本の文化を取り入れた空間です。大切な日を、銀座の歴史と日本の美にかこまれて迎えられることが、この場所を選ぶ意味だと思います。","sources":[{"title":"THE GRAND GINZA（VMG公式）","url":"https://www.vmg.co.jp/venues/ginza.html"},{"title":"銀座エリア最大の商業施設「GINZA SIX」4月20日（木）開業（森ビル）","url":"https://www.mori.co.jp/press/release/ginza_six420/"},{"title":"松坂屋銀座店跡地に商業施設「GINZA SIX」 2017年4月20日開業へ（All About ニュース）","url":"https://news.allabout.co.jp/articles/o/19155/"},{"title":"中央区の沿革・ダイジェスト（中央区ホームページ）","url":"https://www.city.chuo.lg.jp/miryoku/history/index.html"},{"title":"GINZA SIX（GO TOKYO）","url":"https://www.gotokyo.org/jp/spot/260/index.html"}]},{"id":"heianjingu","name":"平安神宮会館","abbr":"HAJ","region":"京都","district":"岡崎","group":"レストラン＆パーティ","url":"https://www.vmg.co.jp/venues/heianjingu.html","ready":true,"draft":false,"area":"京都府京都市左京区岡崎西天王町（平安神宮の境内・神苑内）","summary":"平安神宮の名勝・神苑の池のほとりに建つ会館です。","history":"平安神宮は、明治28年（1895年）の平安遷都1100年を記念して創建されました。もとは平安遷都千百年紀念祭と第4回内国勧業博覧会の会場施設として、平安京の大内裏を模して計画され、全国からの募金で建てられました。設計は宮内省技師の木子清敬と帝国大学大学院生の伊東忠太、施工は清水組です。背後に桓武天皇を祀る本殿が建てられ、竣工とともに神社になりました。平安神宮会館は、平安神宮の御鎮座70年と孝明天皇100年祭を記念して、1969年に建てられました。会館がある神苑は、琵琶湖疏水の水を使い、七代小川治兵衛が作庭した庭で、約20年の歳月をかけてつくられたと公式ページに紹介されています。","usage":"平安神宮会館は、神苑の景色を楽しめるレストランとラウンジとして、アフタヌーンティーや季節限定のランチを提供しています。ガラス張りのロビーラウンジのほか、西側の栖鳳殿バンケット、神苑の最も奥にある迎賓殿バンケットで、パーティやMICEが開かれます。平安神宮での正式参拝や神前挙式の案内もあり、パーティやMICEのお客様には、正式参拝を特別な体験として用意しています。イベントによっては、通常は非公開の「尚美館」を見学できます。","value":"平安神宮は、明治28年（1895年）の平安遷都1100年を記念して創建されました。平安京の大内裏を模して計画され、全国からの募金で建てられた神社です。会館がある神苑は、琵琶湖疏水の水を使い、七代小川治兵衛が作庭した庭で、約20年の歳月をかけてつくられたと公式ページに紹介されています。池のそばには、京都御所から移されたとされる泰平閣があります。境内の大極殿は国の重要文化財で、神苑は国の名勝です。会館そのものは1969年に建てられた建物ですが、こうした歴史ある景観のただ中に建っています。","designation":["所在する平安神宮神苑：国指定名勝（1975年12月10日指定）","境内の大極殿：国指定重要文化財（2010年12月24日指定）"],"highlights":["国の名勝・神苑の池のほとりに建つ","泰平閣は京都御所から移された建物","折上格天井の栖鳳殿バンケット"],"talks":[{"label":"①歴史・物語から","text":"平安神宮会館は、国の名勝に指定された神苑の中にあります。神苑は、琵琶湖疏水の水を使って七代小川治兵衛が作った庭で、20年もの歳月をかけてつくられました。池のそばには京都御所から移された泰平閣があり、通常は非公開の尚美館を見学できる機会もあります。平安神宮は、平安遷都1100年を記念して明治28年に創建された神社です。そのご縁の場所で正式参拝を行い、庭を眺めながら過ごす時間は、ここだけのものです。この場所の背景を知って選ぶことで、お二人の大切な日に深い意味が生まれます。"},{"label":"②建築・見どころから","text":"こちらの見どころは、国の名勝に指定された神苑の池のほとりに建っていることです。窓から庭を眺められるほか、池のそばには京都御所から移された建物、泰平閣があるとご紹介しています。西側の栖鳳殿バンケットは、天井が格子状に組まれた立派なつくりです。庭と建物の両方を、じっくりご覧いただけます。イベントによっては、通常は非公開の尚美館を見学できることもあります。"},{"label":"③お客様の場面から","text":"神苑の景色を眺めながら、アフタヌーンティーや季節限定のランチを楽しむ時間を思い浮かべてみてください。パーティや会議でお集まりのお客様には、平安神宮での正式参拝を特別な体験としてご用意しています。お参りの時間と、庭を前にした食事やパーティの時間。この二つを一日で味わえることが、ここで過ごす意味だと思います。"}],"talk":"平安神宮会館は、国の名勝に指定された神苑の中にあります。神苑は、琵琶湖疏水の水を使って七代小川治兵衛が作った庭で、20年もの歳月をかけてつくられました。池のそばには京都御所から移された泰平閣があり、通常は非公開の尚美館を見学できる機会もあります。平安神宮は、平安遷都1100年を記念して明治28年に創建された神社です。そのご縁の場所で正式参拝を行い、庭を眺めながら過ごす時間は、ここだけのものです。この場所の背景を知って選ぶことで、お二人の大切な日に深い意味が生まれます。","sources":[{"title":"平安神宮会館（VMG公式）","url":"https://www.vmg.co.jp/venues/heianjingu.html"},{"title":"平安神宮神苑（国指定文化財等データベース）","url":"https://kunishitei.bunka.go.jp/heritage/detail/401/1735"},{"title":"平安神宮 大極殿（文化遺産オンライン）","url":"https://online.bunka.go.jp/heritages/detail/213943"},{"title":"平安神宮（公式サイト）","url":"https://www.heianjingu.or.jp/"}]},{"id":"kudan","name":"東京 九段会館テラス","abbr":"QDK","region":"東京","district":"九段下","group":"レストラン＆パーティ","url":"https://www.tokyokudan.com/","ready":true,"draft":false,"area":"東京都千代田区九段南（九段下駅4番出口から徒歩1分）","summary":"昭和9年に建った軍人会館の姿を受け継ぐ、登録有形文化財の会場です。","history":"九段会館は、昭和9年（1934年）に建てられました。もとは「軍人会館」という名前の建物で、昭和天皇の即位の礼を記念する昭和大礼記念事業の一環として建設されたと、VMGの会場一覧で紹介されています。文化遺産オンラインによると、軍人会館として、競技設計の1等案をもとに建てられた鉄骨鉄筋コンクリート造の建物です。公式サイトは、数々の昭和史の舞台となり、多くの貴人が訪れた建物だと紹介しています。そして昭和・平成を経て令和の時代へ受け継がれ、由緒ある姿を活かしながら現代的な要素を加えた空間として、いまの「東京 九段会館テラス」になっています。","usage":"公式サイトでは、ウエディング（挙式、パーティ、ブライダルフェア、ウエディングプラン）、カフェ、宴会・イベント、レストラン関連の案内が出ています。挙式は、北の丸公園の四季の景色を正面に望む屋上でできるとされ、都内でも希少な屋上挙式とうたっています。趣のあるエントランスでの挙式もあります。パーティ会場は、レトロとモダンを組み合わせた2つの会場で、創建時の姿が復元された空間に自然光がやわらかく入ります。屋上庭園に面したカフェや、季節限定のルーフトップバルもあります。","value":"昭和9年（1934年）に、昭和天皇の即位の礼を記念する昭和大礼記念事業の一環として建てられた「軍人会館」が前身です（VMG会場一覧）。競技設計の1等案をもとにした鉄骨鉄筋コンクリート造で、通り沿いは両端に城郭風の入母屋造の塔屋をのせた、和風表現を基調とする歴史主義の建物です。要所にはアール・デコの手法も取り入れられ、文化遺産オンラインは九段下の街路景観を象徴する存在と紹介しています。公式サイトでは、洋風の外観に和風瓦の屋根をもつ「帝冠様式」と説明されています。昭和の歴史の舞台となった建物の姿を、いまに伝える会場です。","designation":["旧九段会館：登録有形文化財（建造物）（2019年9月10日登録）"],"highlights":["登録有形文化財（2019年登録）の建物","洋風の外観に和風瓦の屋根、「帝冠様式」","創建時の姿が復元されたパーティ会場","屋上庭園から北の丸公園などを望める"],"talks":[{"label":"①歴史・物語から","text":"こちらは昭和9年に、昭和天皇の即位の礼を記念する事業の一環として建てられた、もとの軍人会館です。洋風の外観に和風の瓦屋根をのせた「帝冠様式」で、国の登録有形文化財にもなっています。昭和の歴史の舞台になり、多くの方が訪れた建物の姿を残しながら、いまは婚礼やパーティ、カフェとして使われています。パーティ会場には、創建時の姿を復元した空間があります。屋上では、北の丸公園の景色を前にした挙式もできます。長く受け継がれてきた場所で新しい日を迎える、という意味を大切にしていただける会場です。"},{"label":"②建築・見どころから","text":"こちらの建物は、洋風の外観に和風の瓦屋根をのせた、「帝冠様式」というつくりです。国の登録有形文化財にもなっています。中には、創建当時の姿を復元したパーティ会場があり、やわらかい自然光が入ります。屋上庭園からは、北の丸公園の景色も眺められます。趣のあるエントランスも含めて、建物そのものをお楽しみいただけます。"},{"label":"③お客様の場面から","text":"結婚式の日を思い浮かべてみてください。北の丸公園の四季の景色を正面に、屋上で挙式ができます。公式サイトでは、都内でも希少な屋上挙式とご案内しています。そのあとは、レトロとモダンを組み合わせた会場でパーティです。屋上庭園に面したカフェもあります。景色のなかで始まる一日を、ご家族やご友人と過ごしていただけます。"}],"talk":"こちらは昭和9年に、昭和天皇の即位の礼を記念する事業の一環として建てられた、もとの軍人会館です。洋風の外観に和風の瓦屋根をのせた「帝冠様式」で、国の登録有形文化財にもなっています。昭和の歴史の舞台になり、多くの方が訪れた建物の姿を残しながら、いまは婚礼やパーティ、カフェとして使われています。パーティ会場には、創建時の姿を復元した空間があります。屋上では、北の丸公園の景色を前にした挙式もできます。長く受け継がれてきた場所で新しい日を迎える、という意味を大切にしていただける会場です。","sources":[{"title":"東京 九段会館テラス（公式トップ）","url":"https://www.tokyokudan.com/"},{"title":"東京 九段会館テラス（公式 ABOUT）","url":"https://www.tokyokudan.com/about/"},{"title":"東京 九段会館テラス（公式 ウエディング）","url":"https://www.tokyokudan.com/wedding/"},{"title":"文化遺産オンライン「旧九段会館」","url":"https://online.bunka.go.jp/heritages/detail/457999"},{"title":"VMG HOTELS & UNIQUE VENUES 会場一覧","url":"https://www.vmg.co.jp/venues/"}]},{"id":"kulpe","name":"北野異人館 旧クルペ邸","abbr":"KSG","region":"神戸","district":"北野","group":"レストラン＆パーティ","url":"https://www.vmg.co.jp/venues/kulpe.html","ready":true,"draft":false,"area":"兵庫県神戸市中央区北野町（山本通を東に抜けた先）","summary":"ドイツ人貿易商の私邸だった、一棟貸しの北野の異人館です。","history":"旧クルペ邸は、明治時代に、ドイツ人の貿易商クルペ氏の私邸として建てられた異人館です。神戸では明治の開港後に外国人の住まいが広がり、山手の北野エリアが開かれていきました。神戸市によると、北野町・山本通一帯は、1887年以降から第二次世界大戦前にかけて、200棟以上の洋風・和風の建物が並ぶ雑居地になりました。のちに旧クルペ邸は、「セントジョージジャパン」という格式高い会員制クラブとなり、当時2000名もの会員に親しまれ、多くの賓客をもてなしたと公式サイトに書かれています。築造から100年以上がたち、当時からのアンティークな調度品が残っています。現在は、一棟貸しのゲストハウスとして使われています。","usage":"公式ページでは、一棟貸しのゲストハウスとして、婚礼、パーティ・会議（MICE）、レストランの3つの使い方が紹介されています。婚礼は邸宅を貸し切りにした結婚式で、挙式会場と披露宴会場があります。パーティでは、忘新年会、謝恩会（平日限定）、サマーパーティ、歓送迎会などのプランが案内されています。レストランは完全予約制で、神戸流フレンチを提供しています。木目を基調にした重厚でクラシカルな空間が、いずれの場面でも使われます。","value":"明治時代にドイツ人貿易商の私邸として建てられた異人館です（築造年・設計者は確認できていません）。神戸の北野は、明治の開港後に外国人の住まいが広がり、1887年以降から第二次世界大戦前にかけて200棟以上の洋風・和風の建物が並ぶ「雑居地」になりました（神戸市）。のちに会員制クラブ「セントジョージジャパン」となり、多くの賓客をもてなしたと公式サイトに書かれています。築100年以上の建物には当時からの調度品が残り、1階の大広間には特注の椅子とテーブルがあります。所在する北野町山本通は、1979年12月に神戸市が伝統的建造物群保存地区に指定し、1980年4月10日に国の重要伝統的建造物群保存地区に選定された、異人館の街並みです。","designation":["重要伝統的建造物群保存地区「北野町山本通」に位置（公式サイトの記述。国選定1980年4月10日）"],"highlights":["木目の壁と深紅のファブリックが重厚","1階大広間に当時特注の椅子とテーブルが残る","サンルームを改修した、光あふれるセレモニースペース","重要伝統的建造物群保存地区・北野にある"],"talks":[{"label":"①歴史・物語から","text":"こちらは明治時代に、ドイツ人の貿易商の私邸として建てられた異人館です。のちに会員制の社交クラブになり、多くのお客様をお迎えしてきました。築100年以上の建物には、当時からの調度品が残っていて、1階の大広間では、特注の椅子とテーブルをご覧いただけます。北野は、国の重要伝統的建造物群保存地区に選ばれている街並みです。一棟まるごと貸し切りで、おふたりとご家族、ご友人だけの時間をお過ごしいただけます。長く人を迎えてきた建物で、大切な日を迎える意味を感じていただけると思います。"},{"label":"②建築・見どころから","text":"入ってまず目に入るのは、木目を基調にした壁と、深紅のファブリックです。重厚で落ち着いた雰囲気の空間です。1階の大広間には、当時特注の椅子とテーブルが残っています。サンルームを改修したセレモニースペースは、光があふれる明るい場所です。アンティークな調度品も残っていて、お部屋ごとに違った表情をご覧いただける建物です。"},{"label":"③お客様の場面から","text":"邸宅をまるごと貸し切って過ごす一日を思い浮かべてみてください。結婚式なら、挙式会場と披露宴会場があります。忘新年会や歓送迎会、サマーパーティなどのパーティにも使えます。レストランは完全予約制で、神戸流のフレンチをお出ししています。一棟貸しなので、周りを気にせず、集まった皆さまだけで過ごしていただけます。"}],"talk":"こちらは明治時代に、ドイツ人の貿易商の私邸として建てられた異人館です。のちに会員制の社交クラブになり、多くのお客様をお迎えしてきました。築100年以上の建物には、当時からの調度品が残っていて、1階の大広間では、特注の椅子とテーブルをご覧いただけます。北野は、国の重要伝統的建造物群保存地区に選ばれている街並みです。一棟まるごと貸し切りで、おふたりとご家族、ご友人だけの時間をお過ごしいただけます。長く人を迎えてきた建物で、大切な日を迎える意味を感じていただけると思います。","sources":[{"title":"北野異人館 旧クルペ邸（VMG 会場ページ）","url":"https://www.vmg.co.jp/venues/kulpe.html"},{"title":"北野異人館 旧クルペ邸（VMG 会場ページ・別URL）","url":"https://www.vmg.co.jp/venues/kulpe/"},{"title":"北野異人館 旧クルペ邸（公式サイト）","url":"https://www.kulpehaus.com/"},{"title":"VMG コラム 北野異人館 旧クルペ邸 セントジョージジャパン","url":"https://www.vmg.co.jp/column/vmguniquevenues/kitanokulpe/"},{"title":"神戸市：北野町・山本通にゆかりの歴史的な建物の魅力","url":"https://www.city.kobe.lg.jp/a21651/kanko/bunka/bunkashisetsu/foreigner/sub1.html"},{"title":"神戸市：重要伝統的建造物群保存地区（北野町山本通）関連ページ","url":"https://www.city.kobe.lg.jp/a21651/kanko/bunka/bunkashisetsu/foreigner/sub5/index.html"}]},{"id":"funatsuru","name":"鮒鶴京都鴨川リゾート","abbr":"FUN","region":"京都","district":"河原町","group":"レストラン＆パーティ","url":"https://www.vmg.co.jp/venues/funatsuru.html","ready":true,"draft":false,"area":"京都府京都市下京区（木屋町通松原上ル美濃屋町）","summary":"鴨川沿いに建つ昭和初期の木造大料亭。登録有形文化財の建物で食事や宴が楽しめます。","history":"鮒鶴は、明治3年（1870年）に川魚業者の田中鶴三郎が仕出し屋を始めたのが起こりです。鮒をよく扱い、「鮒屋の鶴さん」と呼ばれたことが「鮒鶴」の名の由来とされています。のちに現在の木屋町松原に移り、宮大工の上田喜三郎や山本米蔵らの手で大きな建物が建てられました。旧館は昭和2年（1927年）に完成し、昭和8年（1933年）には新館が増築されています。公式サイトでは、当時、京都で随一の規模を誇った料理旅館だったと紹介されています。建物には、日本画家の小村大雲が描いた鯉の天井絵も残っています。その後、平成24年（2012年）に登録有形文化財（建造物）に登録されました。","usage":"現在は「鮒鶴京都鴨川リゾート」として、レストラン＆バンケットを運営しています。バンケットスペースは、GRAND BALL ROOM、GALLERY ROOM、VIP ROOMの3つです。ルーフトップテラスとセレモニースペースもあります。鴨川沿いには、5月から9月末まで鴨川納涼床が設けられます。公式サイトにはウエディングの案内ページもありますが、くわしい内容は施設ページでは確認できていません。","value":"鮒鶴は、明治3年（1870年）に川魚業者が始めた仕出し屋を起こりとする老舗です。現在の建物は昭和初期（旧館は昭和2年・1927年頃）の木造の大料亭で、文化遺産オンラインは「近代の大規模和風料亭」と説明しています。鴨川右岸に建ち、急勾配の屋根にパラペットを回し、四階の屋根上に入母屋造の塔屋があり、地下にはアール・デコ意匠のダンスホールがあります。公式サイトは、宮大工の手による折上格天井や、日本画家・小村大雲が描いた鯉の天井絵が残ると紹介しています。2012年には本館が国の登録有形文化財に登録されました。","designation":["鮒鶴本館：登録有形文化財（建造物）（2012年登録）"],"highlights":["鴨川沿いに南北へ連なる、純和風の木造五層楼閣","地下にアールデコ意匠のダンスホールがある","宮大工の折上格天井と、小村大雲の天井絵"],"talks":[{"label":"①歴史・物語から","text":"ここ鮒鶴は、明治3年に川魚業者の田中鶴三郎という方が始めた仕出し屋がはじまりなんです。「鮒屋の鶴さん」と呼ばれたことが、お店の名前の由来だそうですよ。今の建物は昭和の初めに建てられたもので、国の登録有形文化財になっています。鴨川沿いに建つ木造の楼閣で、地下にはアールデコの意匠のダンスホールまであるんです。日本画家の小村大雲が描いた鯉の天井絵も残っています。そうした背景を知ったうえで会場を選んでいただくと、お式やお食事の時間が、より思い出深いものになるのではないでしょうか。"},{"label":"②建築・見どころから","text":"まず天井をご覧ください。宮大工の技が光る格子状の天井があり、日本画家・小村大雲が描いた鯉の天井絵も残っています。鴨川沿いに連なる純和風の木造の楼閣で、地下にはアールデコの意匠のダンスホールがあります。和と洋の見どころを、一つの建物のなかで味わっていただけます。ルーフトップテラスや、セレモニースペースもあります。"},{"label":"③お客様の場面から","text":"初夏の夕方、鴨川を眺めながらお食事をする場面を思い浮かべてみてください。鴨川沿いには、5月から9月末まで納涼床が設けられます。バンケットスペースは、GRAND BALL ROOM、GALLERY ROOM、VIP ROOMの3つで、ルーフトップテラスもあります。お食事やパーティなど、お集まりの規模に合わせて場を選んでいただけます。"}],"talk":"ここ鮒鶴は、明治3年に川魚業者の田中鶴三郎という方が始めた仕出し屋がはじまりなんです。「鮒屋の鶴さん」と呼ばれたことが、お店の名前の由来だそうですよ。今の建物は昭和の初めに建てられたもので、国の登録有形文化財になっています。鴨川沿いに建つ木造の楼閣で、地下にはアールデコの意匠のダンスホールまであるんです。日本画家の小村大雲が描いた鯉の天井絵も残っています。そうした背景を知ったうえで会場を選んでいただくと、お式やお食事の時間が、より思い出深いものになるのではないでしょうか。","sources":[{"title":"鮒鶴京都鴨川リゾート（VMG公式 施設ページ）","url":"https://www.vmg.co.jp/venues/funatsuru.html"},{"title":"鮒鶴本館 - 文化遺産オンライン（文化庁）","url":"https://online.bunka.go.jp/heritages/detail/273043"},{"title":"鮒鶴について 鮒鶴の歴史【鮒鶴 登録有形文化財】","url":"https://www.funatsuru.org/about/history.html"},{"title":"鮒鶴について【鮒鶴 登録有形文化財】","url":"https://www.funatsuru.org/about/"},{"title":"鮒鶴の歴史 【公式】鮒鶴京都鴨川リゾート","url":"https://www.funatsuru.com/wedding/history/"}]},{"id":"hillside","name":"ザ・ヒルサイド神戸","abbr":"HRY","region":"神戸","district":"六甲","group":"レストラン＆パーティ","url":"https://www.vmg.co.jp/venues/hillside.html","ready":true,"draft":false,"area":"兵庫県神戸市灘区六甲台町（六甲山のふもとの文教地区）","summary":"安藤忠雄が1986年に設計した、六甲のふもとに建つ光と緑のコンクリート建築です。","history":"ザ・ヒルサイド神戸は、世界的な建築家の安藤忠雄が1986年に設計した建物です。安藤が建築界のノーベル賞といわれるプリツカー賞を受賞する前に手がけた、初期の作品として紹介されています。場所は、六甲山のふもとにある文教地区の神戸市灘区六甲台町です。コンセプトは「光と自然との調和」で、大きなガラスで光を取り込み、外壁には地元で産出される本御影石が使われています。建物の中心にはシンボルツリーの欅の木があり、安藤がその枝ぶりに惚れ込んだといわれています。2024年5月には、この建物でフレンチレストランが開業しました。","usage":"ウエディングの会場として使われています。建物を一棟貸し切りにできるのが特徴です。レストランではモダンフレンチを楽しめます。パーティやMICEにも使われ、展示会や研修会にも対応しています。待合室（ラウンジ）やセレモニースペースもあり、映画上映や演奏の会場になったこともあります。2025年2月には、安藤忠雄の特別講演会とディナーも開かれました。","value":"建築家・安藤忠雄が1986年に設計した建物で、プリツカー賞を受賞する前の初期の作品として紹介されています。コンセプトは「光と自然との調和」。コンクリートとガラスで光と緑を取り込み、外壁は地元で産出される本御影石の石垣で周囲になじみつつ、外に対して閉じた私的な空間です。中央には天井が開いたセンターコートがあり、ガラス張りのフライングコリドーを通ってセレモニースペースへ向かう動線がつくられています。建てられた当初の用途などは確認できていませんが、世界的な建築家の初期作品という価値を、いまも体験できる建物です。","designation":[],"highlights":["ガラスとコンクリートで光と緑を取り込む建築","御影石の石垣と、天井が開いたセンターコート","ガラス張りのフライングコリドーを通る動線"],"talks":[{"label":"","text":"ここは、世界的な建築家の安藤忠雄さんが1986年に設計した建物なんです。プリツカー賞を受賞する前の、初期の作品として知られています。コンセプトは「光と自然との調和」で、大きなガラスから光が入り、外壁には地元の御影石が使われています。建物の中央には天井が開いたセンターコートがあって、シンボルツリーの欅が、訪れた方を見守るように枝を広げているんですよ。ガラス張りのコリドーを通ってセレモニースペースへ向かう流れも、この建築をならではです。そうした背景を知ったうえで選んでいただくと、お二人の大切な一日が、より特別なものになると思います。"}],"talk":"ここは、世界的な建築家の安藤忠雄さんが1986年に設計した建物なんです。プリツカー賞を受賞する前の、初期の作品として知られています。コンセプトは「光と自然との調和」で、大きなガラスから光が入り、外壁には地元の御影石が使われています。建物の中央には天井が開いたセンターコートがあって、シンボルツリーの欅が、訪れた方を見守るように枝を広げているんですよ。ガラス張りのコリドーを通ってセレモニースペースへ向かう流れも、この建築をならではです。そうした背景を知ったうえで選んでいただくと、お二人の大切な一日が、より特別なものになると思います。","sources":[{"title":"ザ・ヒルサイド神戸（VMG公式 施設ページ）","url":"https://www.vmg.co.jp/venues/hillside.html"},{"title":"【安藤忠雄氏 ディナー付き特別講演 2025.2.11】ザ・ヒルサイド神戸にて開催（VMG公式ニュース）","url":"https://www.vmg.co.jp/news/20250211_tadaoando_dinner/"},{"title":"ザ・ヒルサイド神戸（VMG公式コラム）","url":"https://www.vmg.co.jp/column/vmguniquevenues/hillsidekobe/"},{"title":"安藤忠雄氏建築のフレンチレストラン『ザ・ヒルサイド神戸』が5月23日にオープン（kisspress）","url":"https://kisspress.jp/articles/48808/"},{"title":"ザ・ヒルサイド神戸（建築パース）","url":"https://kenchiku-pers.com/photo/the-hillside-kobe/"}]},{"id":"akagane","name":"アカガネリゾート京都東山1925","abbr":"AKG","region":"京都","district":"東山","group":"レストラン＆パーティ","url":"https://www.vmg.co.jp/venues/akagane.html","ready":true,"draft":false,"area":"京都府京都市東山区（下河原通高台寺塔之前上る 金園町400-1）","summary":"大正14年に建てられた旧邸宅を受け継ぐ、東山の森の隠れ家です。","history":"アカガネリゾート京都東山1925の前身は、大正14年（1925年）に建てられた旧邸宅です。公式サイトによると、もとは銅加工メーカーのオーナーの私邸で、銅がいたるところに使われていたことから、かつては「アカガネ邸」と呼ばれていました。公式サイトの別の説明では、江戸時代から約250年続く京都の老舗企業の創業者が建てた旧邸宅とされています。京都市の「京を彩る建物や庭園」の一覧でも、大正14年（1925）に建てられた伸銅会社の社長の旧邸宅として紹介されています。昭和初期には洋館が増築され、もとは応接間として使われていました。東山の傾斜をいかした約700坪の敷地に、いくつもの建物が点在しています。設計した人や、持ち主がどのように移り変わったかは、確認できた公開情報には書かれていません。","usage":"公式サイトには、フレンチダイニング「LE UN」、11席限定のシェフズテーブル「高台寺 極 -KIWAMI-」、上林春松本店と組んだカフェ「Salon de KANBAYASHI」が紹介されています。蔵を改修した日本茶カフェラウンジや、望楼棟を開放したアフタヌーンティーもあります。パーティやMICEでは、AKAGANE、HISUI、KIWAMI、望楼棟、貴賓室、蔵、CEREMONY SPACEなどを組み合わせて使えるとされています。挙式は、独立型のセレモニースペースで行えます。","value":"大正14年（1925年）に建てられた旧邸宅が前身で、公式サイトは、銅加工メーカーのオーナーの私邸で、屋根や雨どいなどに銅が使われていたことから「アカガネ邸」と呼ばれていたと紹介しています。京都市の「京を彩る建物や庭園」の一覧にも掲載されています。昭和初期に増築された洋館の貴賓室には、大理石の暖炉、寄木細工の床、ステンドグラスがあり、屋久杉を用いた望楼棟や、天井を飾る孔雀の西陣織など、当時の暮らしの意匠が受け継がれています。所在する東山山麓は、公式サイトによると平安京以前から社寺が立ち並んだ門前町で、公式サイトは近くの産寧坂を国の重要伝統的建造物群保存地区と紹介しています。蔵は、公式サイトで「重要伝統建造物にも指定された蔵」と紹介されています。","designation":["京都市「京を彩る建物や庭園」に掲載"],"highlights":["銅（アカガネ）を屋根や雨どいに使った意匠","約700坪の庭園と、東山の森を望む眺め","孔雀の西陣織が天井を飾るシェフズテーブル"],"talks":[{"label":"①歴史・物語から","text":"こちらは、大正14年、1925年に建てられた旧邸宅を受け継いだ会場です。もとは銅加工メーカーのオーナーの私邸で、屋根や雨どいなどに銅がたくさん使われていたため、かつては「アカガネ邸」と呼ばれていました。約700坪の敷地には庭園や蔵、昭和初期に増築された洋館があり、いまはレストランやパーティ、挙式の場として使われています。ただ新しくおしゃれな場所というだけでなく、人の暮らしの記憶が残る建物で大切な日を過ごせるのが、ここを選ぶ意味だと思います。建物の背景を知っていただくと、お料理やお庭の見え方も少し変わるかもしれません。"},{"label":"②建築・見どころから","text":"こちらの見どころは、銅を使った意匠です。屋根や雨どいなどに銅がたくさん使われていたことから、かつては「アカガネ邸」と呼ばれていました。約700坪の敷地には庭園があり、東山の森を望めます。シェフズテーブルは、孔雀の西陣織が天井を飾る空間です。昭和初期に増築された洋館もあり、見て歩くだけでも楽しめます。"},{"label":"③お客様の場面から","text":"お食事の日を思い浮かべてみてください。フレンチダイニングや、11席限定のシェフズテーブルがあります。日本茶のカフェラウンジや、望楼棟でのアフタヌーンティーもあります。パーティや会議では、いくつもの建物を組み合わせて使えます。挙式は、独立した専用のセレモニースペースで行えます。広い敷地のなかで、ゆったりと一日を過ごしていただけます。"}],"talk":"こちらは、大正14年、1925年に建てられた旧邸宅を受け継いだ会場です。もとは銅加工メーカーのオーナーの私邸で、屋根や雨どいなどに銅がたくさん使われていたため、かつては「アカガネ邸」と呼ばれていました。約700坪の敷地には庭園や蔵、昭和初期に増築された洋館があり、いまはレストランやパーティ、挙式の場として使われています。ただ新しくおしゃれな場所というだけでなく、人の暮らしの記憶が残る建物で大切な日を過ごせるのが、ここを選ぶ意味だと思います。建物の背景を知っていただくと、お料理やお庭の見え方も少し変わるかもしれません。","sources":[{"title":"アカガネリゾート京都東山1925（VMG 公式）","url":"https://www.vmg.co.jp/venues/akagane.html"},{"title":"アカガネリゾート京都東山1925（VMG 公式・施設一覧内ページ）","url":"https://www.vmg.co.jp/venues/akagane/"},{"title":"アカガネリゾート京都東山1925（VMG 公式コラム）","url":"https://www.vmg.co.jp/column/vmguniquevenues/akagane/"},{"title":"アカガネリゾート京都東山1925 京都観光Navi（京都市観光協会）","url":"https://ja.kyoto.travel/tourism/single01.php?category_id=4&tourism_id=3083"},{"title":"京都を彩る建物や庭園 東山区（京都市）","url":"https://kyoto-irodoru.city.kyoto.lg.jp/list3.html"},{"title":"国指定文化財等データベース（参考：高台寺表門のページ。アカガネとは無関係と確認）","url":"https://kunishitei.bunka.go.jp/heritage/detail/102/1786"}]},{"id":"moore","name":"北野異人館 旧ムーア邸","abbr":"MOO","region":"神戸","district":"北野","group":"レストラン＆パーティ","url":"https://www.vmg.co.jp/venues/kitanomoore.html","ready":true,"draft":false,"area":"兵庫県神戸市中央区北野町（北野異人館街）","summary":"明治31年築の木造洋館で、青いタイルの暖炉が目を引く異人館です。","history":"公式サイトによると、旧ムーア邸は明治31年（1898年）に、同じ北野の異人館「ラインの館」の建築主であるドレウェル夫人によって建てられました。その後、ムーア氏の一族が100年以上にわたり代々住まいとして使い、長いあいだ一般には公開されませんでした。庭には、以前の持ち主が植えたとされるハーブが今も受け継がれています。今も残っているサンルームからは、創建当時、神戸港が一望できたと言われています。ほかの公開情報では、北野・山本地区の異人館の中でも早い時期に建てられた館のひとつとされています。2020年には、ウエディングやカフェの場として新しく開かれました。なお、名前に「ムーア」が付いた経緯や、建てられてから100年のあいだの細かい出来事は、確認できた公開情報には書かれていません。","usage":"公式サイトによると、レストラン・カフェラウンジとしてティータイムを楽しめます。老舗フランス料理店「銀座マキシム・ド・パリ」のレシピをもとにした苺のミルフィーユが看板メニューで、2025年4月には8種のスイーツの盛り合わせ「カフェ・グルマン」が登場しました。ハーブに囲まれたテラスのガーデン席もあります。パーティやウエディングでは、家族婚や少人数の食事会、親しい方だけを招く邸宅ウエディングに対応しています。","value":"明治31年（1898年）に建てられた北野の木造洋館で、公開情報では北野・山本地区の異人館の中でも早い時期に建てられた館のひとつとされています。公式サイトによると、ムーア氏の一族が100年以上にわたり代々住まいとして使いました。下見板張りの外壁、桟瓦葺き、白オイルペンキ塗りの木造2階建てで、北野異人館の建築的特徴がそろった館として、伝統的建造物に初期に指定された（5番目に登録された）と公式サイトは紹介しています。サロンの青タイル張りの暖炉やアンティークシャンデリア、創建当時は神戸港が一望できたというサンルームが残ります。所在する北野町山本通は、1979年12月に神戸市が保存地区に指定し、1980年4月10日に国の重要伝統的建造物群保存地区に選定された異人館の街並みで、公式サイトもこのエリアを重伝建地区と紹介しています。","designation":["重要伝統的建造物群保存地区「北野町山本通」に位置（公式サイトの記述。国選定1980年4月10日）","伝統的建造物として5番目に登録（公式サイトの記述）"],"highlights":["鮮やかな青タイル張りの暖炉とシャンデリア","創建当時は神戸港が見えたサンルーム","庭に受け継がれるハーブと、苺のミルフィーユ"],"talks":[{"label":"","text":"こちらは、明治31年1898年に建てられた北野の異人館です。ムーア氏の一族が100年以上にわたって住まわれ、長いあいだ一般には公開されていませんでした。下見板張りの白い外観、青いタイルの暖炉、サンルームなど、異人館らしい特徴がそろっています。庭には、以前の持ち主が植えたとされるハーブが今も咲いています。いまはカフェとしてお茶を楽しめるほか、家族や親しい方だけを招く邸宅ウエディングもできます。建物がたどってきた時間を知ったうえで選ぶと、その日の思い出に、この場所の物語が重なると思います。"}],"talk":"こちらは、明治31年1898年に建てられた北野の異人館です。ムーア氏の一族が100年以上にわたって住まわれ、長いあいだ一般には公開されていませんでした。下見板張りの白い外観、青いタイルの暖炉、サンルームなど、異人館らしい特徴がそろっています。庭には、以前の持ち主が植えたとされるハーブが今も咲いています。いまはカフェとしてお茶を楽しめるほか、家族や親しい方だけを招く邸宅ウエディングもできます。建物がたどってきた時間を知ったうえで選ぶと、その日の思い出に、この場所の物語が重なると思います。","sources":[{"title":"北野異人館 旧ムーア邸（VMG 公式）","url":"https://www.vmg.co.jp/venues/kitanomoore.html"},{"title":"北野異人館 旧ムーア邸（VMG 公式・施設一覧内ページ）","url":"https://www.vmg.co.jp/venues/kitanomoore/"},{"title":"VMG 運営ベニュー一覧","url":"https://www.vmg.co.jp/venues/"},{"title":"Concept 北野異人館 旧ムーア邸（結婚式場サイト）","url":"https://www.kitanomoore.com/wedding/concept-history/"},{"title":"旧ムーア邸（異人館ネット）","url":"https://www.ijinkan.net/ijinkan/3110"},{"title":"神戸市 北野町山本通 重要伝統的建造物群保存地区（神戸市）","url":"https://www.city.kobe.lg.jp/a21651/kanko/bunka/bunkashisetsu/foreigner/sub5/index.html"},{"title":"神戸市認定伝統的建造物「旧ドレウェル邸（ラインの館）」（神戸市）","url":"https://www.city.kobe.lg.jp/a21651/kanko/bunka/bunkashisetsu/foreigner/sub4.html"},{"title":"邸宅レストラン レイン邸（4travel）","url":"https://4travel.jp/dm_shisetsu/11342447"}]},{"id":"osakacastle","name":"大阪城西の丸庭園 大阪迎賓館","abbr":"OCG","region":"大阪","district":"大阪城","group":"レストラン＆パーティ","url":"https://www.vmg.co.jp/venues/osakacastle.html","ready":true,"draft":false,"area":"大阪府大阪市中央区（大阪城公園内・西の丸庭園）","summary":"大阪城の西の丸庭園にある、二条城の白書院を手本にした純和風の迎賓館です。","history":"大阪城は、1583年に豊臣秀吉が築いた城です。その跡は「大坂城跡」として、国の特別史跡になっています。大阪迎賓館は、この大阪城公園の西の丸庭園の中にあります。西の丸庭園は、1965年（昭和40年）に約6.5haの芝生庭園として開園した庭で、かつて秀吉の正室・北政所の屋敷があった場所とされています。大阪迎賓館は、1995年に大阪で開かれたAPEC首脳会議のために、海外の要人をおもてなしする場として新しく建てられました。京都の二条城にある二の丸御殿の白書院をモデルにした純和風の建築で、APEC大阪の会場になりました。2019年のG20大阪サミットでは、晩餐会の会場にもなっています。","usage":"大阪迎賓館では、大阪近郊の食材を使った正統派のフレンチを楽しめます。なにわの伝統野菜や、近郊のA5ランクの和牛を使った料理が特徴です。空間を貸し切ってのパーティや、会議・イベントにも使われています。婚礼では、ガーデンでのアペリティフや挙式ができます。宴内人前式では、武将の甲冑による「出陣」の演出も行われています。","value":"大阪城は、1583年に豊臣秀吉が築いた城で、その跡「大坂城跡」は国の特別史跡です。国の解説には、豊臣氏時代の大坂城は本丸・二の丸・三の丸・西の丸・山里丸などでできていたと書かれています。大阪迎賓館は、その大阪城公園の西の丸庭園の中にあります。西の丸庭園は1965年（昭和40年）に約6.5haの芝生庭園として開園した庭で、かつて秀吉の正室・北政所の屋敷があった場所とされています。建物は1995年のAPEC大阪首脳会議を機に新しく建てられた建築ですが、京都・二条城二の丸御殿の白書院をモデルに、木部は生漆の古色塗り、屋根は銅板の柿葺風、天井も二条城の造りを再現した純和風の建築で、日本の伝統建築の姿を受け継いでいます。","designation":["国の特別史跡「大坂城跡」のある大阪城公園内（西の丸庭園）"],"highlights":["二条城の白書院をモデルにした純和風建築","生漆の古色塗りと、銅板の柿葉風の屋根","全席から西の丸庭園の芝生を見わたせる宴会場"],"talks":[{"label":"①歴史・物語から","text":"こちらは、大阪城の西の丸庭園にある大阪迎賓館です。1995年に大阪で開かれたAPECの首脳会議のために、海外の大切なお客様をおもてなしする場所として建てられました。モデルは、京都の二条城にある二の丸御殿の白書院です。木の部分は漆で古びた味わいを出し、天井も二条城の造りを再現しています。大阪城は、豊臣秀吉が築いた城の跡で、国の特別史跡です。そんな場所で結婚式やお食事をすることは、この土地の物語を、ご自身の大切な一日に重ねることでもあります。"},{"label":"②建築・見どころから","text":"まず建物をご覧ください。京都の二条城にある白書院を手本にした、純和風の造りです。木の部分は生漆で古びた味わいを出し、屋根は銅板を使って、木の板で葺いたような雰囲気に仕上げています。天井も二条城の内部の造りを再現しています。宴会場は、どの席からも西の丸庭園の芝生を見わたせます。大阪城公園の中の、静かな和の空間です。"},{"label":"③お客様の場面から","text":"大切な一日を、海外の要人をおもてなしするために建てられた場所で過ごす。それがここで過ごす意味です。結婚式では、ガーデンで食前のお飲み物を楽しんだり、挙式をしたりできます。宴内人前式では、武将の甲冑による「出陣」の演出もあります。お料理は、なにわの伝統野菜や近郊のA5ランクの和牛を使ったフレンチです。"}],"talk":"こちらは、大阪城の西の丸庭園にある大阪迎賓館です。1995年に大阪で開かれたAPECの首脳会議のために、海外の大切なお客様をおもてなしする場所として建てられました。モデルは、京都の二条城にある二の丸御殿の白書院です。木の部分は漆で古びた味わいを出し、天井も二条城の造りを再現しています。大阪城は、豊臣秀吉が築いた城の跡で、国の特別史跡です。そんな場所で結婚式やお食事をすることは、この土地の物語を、ご自身の大切な一日に重ねることでもあります。","sources":[{"title":"大阪城西の丸庭園 大阪迎賓館（VMG公式）","url":"https://www.vmg.co.jp/venues/osakacastle.html"},{"title":"大阪迎賓館 公式サイト（由来紹介ページ）","url":"https://osakacastle.jp/?p=488"},{"title":"大阪城西の丸庭園 大阪迎賓館 公式サイト（トップ）","url":"https://www.osakacastle.jp/?p=2947"},{"title":"大阪城西の丸庭園（大阪観光局 OSAKA-INFO）","url":"https://osaka-info.jp/spot/osaka-castle-nishinomaru-garden/"},{"title":"国指定文化財等データベース：大坂城跡","url":"https://kunishitei.bunka.go.jp/bsys/maindetails/401/1792"},{"title":"大阪府：府内の史跡公園等の紹介【大坂城跡（大阪城公園）】","url":"https://www.pref.osaka.lg.jp/bunkazaihogo/bunkazai/oosakajoukouen.html"},{"title":"大阪迎賓館（Wikipedia・手がかりとして参照）","url":"https://ja.wikipedia.org/wiki/大阪迎賓館"}]},{"id":"kobe","name":"神戸迎賓館 旧西尾邸","abbr":"VIZ","region":"神戸","district":"須磨","group":"レストラン＆パーティ","url":"https://www.vmg.co.jp/venues/kobe.html","ready":true,"draft":false,"area":"兵庫県神戸市須磨区離宮西町（須磨海岸の近く）","summary":"須磨に建つ、大正8年築の洋館と日本庭園をもつ、文化財の邸宅です。","history":"神戸迎賓館 旧西尾邸の建物は、西尾家住宅（旧西尾類蔵邸）です。神戸で活躍した貿易商の西尾類蔵氏の自邸として、1919年（大正8年）に建てられました。設計は、初代通天閣を手がけた建築家の設楽貞雄氏です。大正から昭和初期にかけて、須磨では別荘建築が流行しました。西尾邸も、その時代に建てられた邸宅の一つです。終戦後の1945年（昭和20年）には、GHQに接収されました。阪神・淡路大震災では、周辺の邸宅の多くが倒壊・解体されたと伝えられています。2007年（平成19年）からは、結婚式場・レストランとして活用されています。","usage":"現在は、フランス料理のレストランとして使われています。公式ページでは、VMGの「LE UN」のフラッグシップ店と紹介されています。庭園を望むサロンスペースでは、アフタヌーンティーを楽しめます。婚礼では、大正ロマンをテーマにした「大正ロマンウエディング」ができます。そのほか、バンケットや企業イベントなど、パーティ・MICEにも使われています。敷地には、独立型バンケット「THE VIZCAYA GARDEN」の新館もあります。","value":"1919年（大正8年）に、神戸で活躍した貿易商・西尾類蔵氏の自邸として建てられた「西尾家住宅」です。大正から昭和初期にかけて須磨では別荘建築が流行し、西尾邸もその時代に建てられた邸宅の一つです。2010年（平成22年）に兵庫県指定重要有形文化財に指定され（主屋ほか5棟）、庭園は神戸市指定名勝です。公式サイトは、竣工当時の状態が現存する貴重な建造物と紹介しています。洋館のステンドグラスや網代天井、延べ31畳の書院造の日本座敷「鳳凰の間」の鳳凰の欄間や組子細工など、和と洋が出会う意匠が見どころです。","designation":["西尾家住宅：兵庫県指定重要有形文化財（2010年・主屋ほか5棟）","庭園：神戸市指定名勝"],"highlights":["洋館のステンドグラスと、和洋折衷の意匠","書院造の大広間「鳳凰の間」と鳳凰の欄間","池泉回遊式の日本庭園（神戸市指定名勝）"],"talks":[{"label":"①歴史・物語から","text":"こちらは、貿易商の西尾類蔵氏が、1919年、大正8年に建てた邸宅です。設計は、初代通天閣を手がけた設楽貞雄氏です。建物は兵庫県の重要有形文化財、お庭は神戸市の名勝に指定されています。洋館のステンドグラスや、書院造の「鳳凰の間」など、和と洋が出会う意匠が見どころです。終戦後にはGHQの接収も経験し、時代を越えて受け継がれてきました。そんな歴史のある場所で結婚式やお食事をすることは、建物が重ねてきた物語を、ご自身の大切な日に重ねることでもあります。"},{"label":"②建築・見どころから","text":"こちらの見どころは、和と洋が出会う意匠です。洋館にはステンドグラスがあり、書院造の大広間「鳳凰の間」には、鳳凰の欄間があります。そしてお庭は、池のまわりを歩いて楽しめる日本庭園で、神戸市指定の名勝です。窓から庭を眺めるだけでなく、建物と庭を行き来しながら、文化財の邸宅をじっくり味わっていただけます。"},{"label":"③お客様の場面から","text":"大正ロマンの雰囲気の中で、大切な一日を過ごしていただけます。婚礼では「大正ロマンウエディング」ができます。お食事はフランス料理で、公式には「LE UN」のフラッグシップ店と紹介されています。庭園を望むサロンでは、アフタヌーンティーも楽しめます。バンケットや企業イベントなど、パーティにもお使いいただけます。"}],"talk":"こちらは、貿易商の西尾類蔵氏が、1919年、大正8年に建てた邸宅です。設計は、初代通天閣を手がけた設楽貞雄氏です。建物は兵庫県の重要有形文化財、お庭は神戸市の名勝に指定されています。洋館のステンドグラスや、書院造の「鳳凰の間」など、和と洋が出会う意匠が見どころです。終戦後にはGHQの接収も経験し、時代を越えて受け継がれてきました。そんな歴史のある場所で結婚式やお食事をすることは、建物が重ねてきた物語を、ご自身の大切な日に重ねることでもあります。","sources":[{"title":"神戸迎賓館 旧西尾邸（VMG公式）","url":"https://www.vmg.co.jp/venues/kobe.html"},{"title":"西尾家住宅（旧西尾類蔵邸）について（西尾家住宅の公式サイト）","url":"https://www.nishiotei.org/about/"},{"title":"神戸新聞NEXT 連載「わが町の文化財」＜108＞ 県指定・西尾家住宅（神戸市須磨区）","url":"https://www.kobe-np.co.jp/rentoku/bunkazai/201803/0011028509.shtml"},{"title":"神戸歴史遺産：近代建築を訪れる（神戸市）","url":"https://kobe-rekishiisan.city.kobe.lg.jp/visit-architecture/"},{"title":"兵庫県指定文化財（建造物）一覧PDF（兵庫県教育委員会）","url":"https://www.hyogo-c.ed.jp/~shabun-bo/gyouseisituhp/top/23kenshitei.pdf"},{"title":"西尾家住宅（Wikipedia・手がかりとして参照）","url":"https://ja.wikipedia.org/wiki/西尾家住宅"}]},{"id":"higaki","name":"京都御苑 中立売御門 檜垣","abbr":"KYG","region":"京都","district":"京都御苑","group":"レストラン＆パーティ","url":"https://nakadachiuri.jp/restaurant/","ready":true,"draft":false,"area":"京都府京都市上京区 京都御苑内（中立売御門の北側、中立売休憩所内）","summary":"京都御苑の中立売休憩所にある、和食とお茶のレストランです。","history":"檜垣がある京都御苑は、江戸時代には140以上の宮家や公家の屋敷が並ぶ「公家町」でした。1869年（明治2年）の東京遷幸のあと公家町は荒れましたが、1877年（明治10年）に京都府へ御所の保存が命じられ、屋敷の撤去や石垣の工事、植樹などの「大内保存事業」が進み、1883年（明治16年）に完了しました。1947年（昭和22年）には閣議決定で「国民公園」となり、現在は環境省が管理しています。檜垣が入る中立売休憩所は、中立売地区の再整備のなかで古い休憩所が2018年10月に閉店し、新しい休憩所として2019年1月9日に営業を始めました。檜垣の名前での営業は、運営会社の発表で、2026年5月1日の和食ランチ開始が確認できます。","usage":"檜垣は、無料で使える中立売休憩所の中にあるレストランです。運営会社の発表では、2026年5月1日に和食ランチで始まり、7月1日から朝食、7月18日から夜のビアテラスが加わり、8月1日からは土日限定・完全予約制の会席コースが始まるとされています。コンセプトは「御苑にひらく、日本文化のショーケース」。メニューの考え方は「御苑リトリート」で、近隣の方や観光客が心身を整える「第三の居場所」と位置づけ、京都の伝統食材を使った和食の御膳や、洋の技法を取り入れたプレート、スイーツを用意しています。宇治茶と珈琲の老舗・株式会社放香堂と協業し、抹茶や珈琲の喫茶メニューもあります。","value":"檜垣が入る中立売休憩所は2019年に開店した新しい施設で、古い建物そのものを使っているという記載は見つかりません。歴史的価値は、場所の歴史にあります。京都御苑は、かつて140以上の宮家・公家の屋敷が並んだ「公家町」のあとで、明治の「大内保存事業」を経て整えられ、1947年に国民公園となりました。環境省は、苑内に旧公家屋敷跡や庭園などの歴史的遺構が点在していると説明しています。同じ苑内の、京都御所を中心とする歴史の場所に囲まれていることが、ここで過ごす時間の背景になります。","designation":["京都御苑：国民公園（1947年・環境省管理）"],"highlights":["京都御苑の木々に囲まれた「森の休憩所」の中にあります","東側のテラス席から京都御所を眺められます","宇治茶と珈琲の老舗・放香堂と協業した喫茶メニュー"],"talks":[{"label":"①歴史・物語から","text":"こちらは京都御苑の中にある「檜垣」です。御苑は、江戸時代には140以上の宮家や公家のお屋敷が並ぶ公家町でした。明治になってお屋敷が取り除かれ、公園として整えられて、戦後の1947年に国民公園になっています。檜垣は、その御苑の中立売休憩所に入っているレストランです。コンセプトは「御苑にひらく、日本文化のショーケース」。京都の食材を使った和食の御膳や、宇治茶と珈琲の老舗・放香堂さんと一緒につくる抹茶や珈琲のメニューがあります。休憩所の東側のテラス席からは、京都御所が見えます。木々に囲まれた静かな場所で、ひと息ついていただければうれしいです。"},{"label":"②建築・見どころから","text":"見どころは、まず場所そのものです。檜垣は、京都御苑の木々に囲まれた「森の休憩所」の中にあります。東側のテラス席からは、京都御所を眺められます。お茶は、宇治茶と珈琲の老舗・放香堂さんと一緒につくる、抹茶や珈琲のメニューです。京都の中心にいながら、緑の中で景色を楽しめるのが魅力です。ぜひ、テラスからの眺めもお楽しみください。"},{"label":"③お客様の場面から","text":"檜垣は、近くの方も観光の方も、心と体を整えるための「第三の居場所」として使っていただくことを考えています。ランチや朝食でひと息ついたり、夜はビアテラスで過ごしたりできます。土日限定・完全予約制の会席コースもあります。無料で使える休憩所の中なので、散策の途中にふらりと立ち寄れます。京都の伝統食材を使った和食の御膳や、スイーツもあります。"}],"talk":"こちらは京都御苑の中にある「檜垣」です。御苑は、江戸時代には140以上の宮家や公家のお屋敷が並ぶ公家町でした。明治になってお屋敷が取り除かれ、公園として整えられて、戦後の1947年に国民公園になっています。檜垣は、その御苑の中立売休憩所に入っているレストランです。コンセプトは「御苑にひらく、日本文化のショーケース」。京都の食材を使った和食の御膳や、宇治茶と珈琲の老舗・放香堂さんと一緒につくる抹茶や珈琲のメニューがあります。休憩所の東側のテラス席からは、京都御所が見えます。木々に囲まれた静かな場所で、ひと息ついていただければうれしいです。","sources":[{"title":"【京都御苑】土・日の夜限定… 8月1日より「京都御苑 中立売御門 檜垣」で完全予約制レストラン開始（PR TIMES・2026年7月29日発表）","url":"https://prtimes.jp/main/html/rd/p/000000658.000018871.html"},{"title":"京都御苑 中立売休憩所（公式サイト）レストランのページ","url":"https://nakadachiuri.jp/restaurant/"},{"title":"京都御苑 中立売休憩所（公式サイト）コンセプトのページ","url":"https://nakadachiuri.jp/concept/"},{"title":"京都御苑 中立売休憩所（公式サイト）トップ","url":"https://nakadachiuri.jp/"},{"title":"TableCheck「京都御苑 中立売御門 桧垣」","url":"https://www.tablecheck.com/ja/kyotogyoen-nakadachiuri-higaki"},{"title":"環境省 京都御苑 歴史","url":"https://www.env.go.jp/garden/kyotogyoen/1_intro/history.html"},{"title":"環境省 京都御苑 トップページ","url":"https://www.env.go.jp/garden/kyotogyoen/"},{"title":"環境省 京都御苑 お知らせ（中立売休憩所の開店）","url":"https://www.env.go.jp/garden/kyotogyoen/topics/post_113.html"}]},{"id":"visitorsdock","name":"VISITORS DOCK | Brew&Blend","abbr":"YKD","region":"横浜","district":"山下町","group":"カフェ","url":"https://www.vmg.co.jp/venues/visitorsdock/","ready":true,"draft":false,"area":"神奈川県横浜市中区山下町","summary":"山下公園通りにある、トレーラーハウスのカフェです。","history":"山下町は、1859年（安政6年）に横浜が開港したあと、運上所（税関）の東側が外国人居留地とされた場所です。1899年（明治32年）7月24日に居留地の町名がすべて廃止され、「山下町」という町が新しくできました。近くの山下公園は、1923年（大正12年）の関東大震災のがれきで海を埋め立ててつくられ、1930年（昭和5年）に開園しました。戦中は海軍が接収し、戦後は米軍の住宅用地となり、1954年に返還、1960年に全域が市民に開放されました。この場所にはメルパルク横浜がありました。その跡地の一部に、日本郵政不動産が整備する交流拠点「JP BAYSIDE HUB」ができ、カフェはその一角にあります。カフェ自体は新しい施設で、長い歴史はありません。","usage":"2台のトレーラーハウスとウッドデッキでできたカフェです。港の埠頭や貨物の積み下ろし、ターミナルを行き交う人々など、海と都市が交わる横浜の風景からデザインされています。観光や仕事、愛犬の散歩の合間に立ち寄れる場所として案内されています。デッキは、イベントやマルシェなど、地域の人々が自然に集まる場としても想定されています。コーヒーやオーガニックティー、瀬戸内レモンのレモネード、ビール、オリジナルカクテルなどが楽しめます。「港町・横浜らしさ」を体験できる場を目指しています。","value":"カフェはトレーラーハウスでできた新しい施設で、建物自体に歴史はありません。歴史的価値は、場所の歴史にあります。横浜は1859年に開港し、この一帯は外国人居留地をもとに1899年に「山下町」となった、開港の歴史をうけつぐ町です。近くの山下公園は、関東大震災のがれきで海を埋め立てて1930年に開園した公園で、2007年2月6日に登録記念物（名勝）に登録され、「日本で最初に開設された臨海都市公園」と文化遺産オンラインに書かれています。山下公園前に係留されている氷川丸は、2016年8月17日に重要文化財に指定されています。これらは周辺にある別の文化財で、このカフェ自体の価値ではありません。","designation":["周辺（別の文化財）：山下公園＝登録記念物（名勝）（2007年2月6日登録）","周辺（別の文化財）：氷川丸＝重要文化財（2016年8月17日指定）"],"highlights":["トレーラーハウス2台とウッドデッキの港町らしい造り","メルパルク横浜跡地の交流拠点「JP BAYSIDE HUB」の一角","山下公園通りにあり、マリンタワーを望める"],"talks":[{"label":"①歴史・物語から","text":"こちらは、トレーラーハウスでできたカフェ、ビジターズドックです。山下公園通りにあり、マリンタワーを望めます。2台のトレーラーハウスとウッドデッキで、港の埠頭や貨物の積み下ろしなど、横浜の海と街の風景からデザインされています。もとはメルパルク横浜があった場所で、その跡地の一部にできた交流拠点「JP BAYSIDE HUB」の一角にあります。建物は新しいので、長い歴史があるわけではありません。ただ、すぐ近くの山下公園は登録記念物に登録されていて、氷川丸も係留されています。散歩の合間に、ぜひ立ち寄ってみてください。"},{"label":"②建築・見どころから","text":"見どころは、港町らしい造りです。2台のトレーラーハウスとウッドデッキでできたカフェで、港の埠頭や貨物の積み下ろし、ターミナルを行き交う人々など、横浜の海と街の風景からデザインされています。山下公園通りにあり、マリンタワーを望めます。まるで港の一角にいるような気分で、お過ごしいただけます。ぜひ、デッキに腰かけて、海と街の気配を感じてみてください。"},{"label":"③お客様の場面から","text":"観光の合間、お仕事の合間、愛犬のお散歩の途中。そんな場面で、ふらりと立ち寄っていただける場所です。コーヒーやオーガニックティー、瀬戸内レモンのレモネード、ビール、オリジナルカクテルなどが楽しめます。デッキは、マルシェなど地域の方が集まる場にも想定されています。港町・横浜らしさを体験できる場を目指しています。"}],"talk":"こちらは、トレーラーハウスでできたカフェ、ビジターズドックです。山下公園通りにあり、マリンタワーを望めます。2台のトレーラーハウスとウッドデッキで、港の埠頭や貨物の積み下ろしなど、横浜の海と街の風景からデザインされています。もとはメルパルク横浜があった場所で、その跡地の一部にできた交流拠点「JP BAYSIDE HUB」の一角にあります。建物は新しいので、長い歴史があるわけではありません。ただ、すぐ近くの山下公園は登録記念物に登録されていて、氷川丸も係留されています。散歩の合間に、ぜひ立ち寄ってみてください。","sources":[{"title":"VISITORS DOCK | Brew&Blend（VMG公式）","url":"https://www.vmg.co.jp/venues/visitorsdock/"},{"title":"日本郵政不動産のプレスリリース（PR TIMES配信、Excite転載）2025年10月3日","url":"https://www.excite.co.jp/news/article/Prtimes_2025-10-03-83972-48/"},{"title":"Impress Watchニュース記事","url":"https://www.watch.impress.co.jp/docs/news/2052466.html"},{"title":"横浜市中区「山下町」町名のあゆみ","url":"https://www.city.yokohama.lg.jp/naka/shokai/gaiyo/chonai_ayumi/chomei08.html"},{"title":"横浜市 横浜港の歴史（開港の経緯）","url":"https://www.city.yokohama.lg.jp/kanko-bunka/minato/taikan/manabu/rekishi/history1.html"},{"title":"文化遺産オンライン 山下公園","url":"https://online.bunka.go.jp/heritages/detail/164701"},{"title":"文化遺産オンライン 氷川丸","url":"https://online.bunka.go.jp/heritages/detail/389361"},{"title":"横浜市 山下公園通り周辺地区のまちづくり","url":"https://www.city.yokohama.lg.jp/kurashi/machizukuri-kankyo/toshiseibi/toshin/kannaikangai/yamashitakoendori.html"}]},{"id":"soma","name":"旧相馬家 Kazeno Heritage","abbr":"SOU","region":"北海道","district":"元町","group":"ホテル＆レストラン","url":"https://www.kazenoheritage.jp/hotels/old-soma-residence/","ready":true,"draft":false,"area":"北海道函館市元町","summary":"国指定重要文化財「旧相馬家住宅」に泊まる、3室のホテルです。","history":"旧相馬家住宅は、1908年（明治41年）に、北海道屈指の豪商だった相馬哲平の私邸として建てられました（公式ページ）。相馬哲平（1833〜1921）は、米や水産物の取引と銀行の設立で成功した函館の有力商人で、同じ1908年に旧函館区公会堂の再建にも資金を出しています（国土交通省の資料）。建物は、函館山を背にして海を見わたせる高台にあります（秋田魁新報）。その後、受け継ぐ人がいなくなって取り壊しの危機になりましたが、残すことを求めた市民が2009年に買い取り、翌2010年から一般公開されました。そして2018年に国の重要文化財に指定されました（秋田魁新報）。2026年3月1日に、ホテルとして開業しました（北海道新聞、秋田魁新報）。","usage":"全3室のヘリテージホテルで、1日に泊まれるのは最大3組です。一般公開の時間が終わると、宿泊者だけで建物を使えます。客室は、当時の蔵をまるごと使った部屋などがあり、実際に使われていたダイニングテーブルや、大火から家財を守った重い扉は、できるだけ手を加えずに使われています（秋田魁新報）。函館の文化を次の世代に伝える「つなぎ手」に出会える特別なプログラムもあります。食事は、近くの直営レストランを利用できます。ラウンジやWi-Fi、荷物預かりもあります。建物を活用した収益を保存の費用に充てる取り組みでもあります（秋田魁新報）。","value":"和風と洋風が合わさった意匠で、当時の最高水準の建築技術で仕上げられた建物です（公式ページ）。国土交通省の資料では、玄関に北海道では珍しい湾曲した瓦屋根があり、洋間は緑色の外観、精緻な彫刻の窓枠、天井の飾り、シャンデリアで整えられています。一方、居間は畳敷きで、囲炉裏と神棚があります。隣の土蔵には、江戸時代の北海道やアイヌの人々を描いた屏風などの美術品が収められていたと書かれています。豪商の暮らしと、開港後の函館の和洋の文化が、1つの住まいに表れた建物です。公式ページは、北前船交易や開港の歴史を背景にした港町の雰囲気も、見どころに挙げています。","designation":["建物：国指定重要文化財「旧相馬家住宅」の主屋と土蔵（文化庁 国指定文化財等データベースに両方が重要文化財として掲載。指定年月日はデータベースの一覧に記載なし）","2018年に国の重要文化財に指定（秋田魁新報の記事による）","重要伝統的建造物群保存地区内に位置：公式ページに「重要伝統的建造物群保存地区の高台にあり」「所在地は国選定の重要伝統的建造物群保存地区」との記述あり（地区名は公式ページに明記なし）"],"highlights":["1908年築、豪商・相馬哲平の私邸","和洋折衷の意匠と、湾曲した瓦屋根の玄関","土蔵をまるごと使った客室。1日3組限定"],"talks":[{"label":"①歴史・物語から","text":"こちらは、1908年に、函館屈指の豪商だった相馬哲平さんが私邸として建てた、国指定の重要文化財です。和風と洋風が合わさった建物で、玄関の湾曲した瓦屋根は北海道では珍しいそうです。一度は取り壊しの危機がありましたが、残したいという市民の力で守られ、2018年に重要文化財になりました。今は全3室のホテルで、1日3組だけ。当時の蔵をそのまま使った客室もあります。一般公開が終わったあとは、宿泊の方だけで建物を使えます。泊まることが、建物を守ることにもつながっています。"},{"label":"②建築・見どころから","text":"見どころは、和洋折衷の意匠と、湾曲した瓦屋根の玄関です。国指定重要文化財の建物で、客室には当時の蔵をまるごと使った部屋があります。実際に使われていたダイニングテーブルや、大火から家財を守った重い扉は、できるだけ手を加えずに使われています。文化財の中で、本物の空気を感じていただけます。ぜひ、建物のひとつひとつの細部もご覧ください。"},{"label":"③お客様の場面から","text":"一般公開の時間が終わると、宿泊の方だけで建物を使えます。全3室で、1日に泊まれるのは最大3組です。ここで過ごすことは、函館の文化を伝える「つなぎ手」に出会うプログラムを通じて、まちの物語に触れることでもあります。お食事は近くの直営レストランが使えます。建物を活用した収益は、保存の費用に充てられています。"}],"talk":"こちらは、1908年に、函館屈指の豪商だった相馬哲平さんが私邸として建てた、国指定の重要文化財です。和風と洋風が合わさった建物で、玄関の湾曲した瓦屋根は北海道では珍しいそうです。一度は取り壊しの危機がありましたが、残したいという市民の力で守られ、2018年に重要文化財になりました。今は全3室のホテルで、1日3組だけ。当時の蔵をそのまま使った客室もあります。一般公開が終わったあとは、宿泊の方だけで建物を使えます。泊まることが、建物を守ることにもつながっています。","sources":[{"title":"旧相馬家 Kazeno Heritage（kazenoheritage.jp 公式ページ）","url":"https://www.kazenoheritage.jp/hotels/old-soma-residence/"},{"title":"旧相馬家住宅 概要（国土交通省 多言語解説文DB）","url":"https://www.mlit.go.jp/tagengo-db/R1-00909.html"},{"title":"文化庁 国指定文化財等データベース（函館市）","url":"https://online.bunka.go.jp/heritages/region/1/1202"},{"title":"百年前の豪商邸がホテルに、函館 国の重文「宿泊し継承を」（秋田魁新報）","url":"https://www.sakigake.jp/news/article/20260224CO0111/"},{"title":"函館「旧相馬家住宅」ホテルに（北海道新聞）","url":"https://www.hokkaido-np.co.jp/article/1279268/"},{"title":"函館市元町末広町伝統的建造物群保存地区（国土交通省 多言語解説文DB）","url":"https://www.mlit.go.jp/tagengo-db/R1-00879.html"}]},{"id":"kurayoshi","name":"風の 倉吉","abbr":"KRY","region":"鳥取","district":"河原町","group":"ホテル＆レストラン","url":"https://www.kazenoheritage.jp/hotels/kurayoshi/","ready":true,"draft":false,"area":"鳥取県倉吉市河原町（河原町1969）","summary":"文化財の小川家と髙多家を宿にした、河原町の分散型ヘリテージ・リトリートです。","history":"風の 倉吉がある河原町は、鳥取県中部の倉吉市で、小鴨川の右岸に位置します。県の文化財ナビによると、打吹山のふもとに東西に広がる町の西端にあたり、東の端には重要伝統的建造物群保存地区「倉吉市打吹玉川」があります。宿の一棟「小川家」の小川家住宅は、主屋のほかに洋館、新座敷、茶室「清和軒」、蔵などが増築された、近代の実業家の屋敷構えを伝える建物です（県指定保護文化財、2015年指定）。もう一棟「髙多家」の旧髙多家住宅主屋は、打吹山の西方にある商家で、平屋建て切妻造りの古式な造りと説明されています（国登録有形文化財、2021年登録）。小川家については、江戸時代後期以降に醸造業を営み、1885年（明治18年）に製糸会社を創業したと紹介するサイトもあります。","usage":"小川家と髙多家の2棟に、11室の客室を設けた分散型ヘリテージ・リトリート宿です。小川家の棟にフロントと専用駐車場があり、客室は定員1〜5名です。食事は里山の食材を使うリトリートダイニングで、五行の考え方を取り入れた「調律食」と位置づけられています。指定名勝「環翠園」の庭園ガイドと呈茶体験、竹林の旧国鉄倉吉線廃線跡を歩く瞑想とウォーキング、民藝・工芸体験、三徳山三佛寺への参拝登山など、鳥取県中部を巡る滞在を提案しています。","value":"小川家住宅について、鳥取県は、湾曲した絵様腕木や虹梁状の差鴨居など、県中部の近代の商家建築の特徴をよく示すとしています。洋館、新座敷、茶室などが増築され、各時代の好みを含めた建築の移り変わりがうかがえるとも説明しています。鉢屋川や本通り周辺に伝統的建造物が多く残る地区の中で、核となる貴重な建造物とされています。旧髙多家住宅主屋は、たちの低い古式なつくりで、旧商家町の様相を伝える建物と文化遺産オンラインに解説されています。","designation":["建物（小川家）：鳥取県指定保護文化財「小川家住宅」（建造物、2015年4月7日指定）（とっとり文化財ナビ）","建物（髙多家）：登録有形文化財（建造物）「旧髙多家住宅主屋」（2021年6月24日登録、倉吉市河原町1879-1）（文化遺産オンライン）","庭園：「小川氏庭園」は国登録記念物（2010年8月5日登録）（とっとり文化財ナビ）。倉吉市ページは「国登録記念物・県指定名勝」と表記","参考：重要伝統的建造物群保存地区「倉吉市打吹玉川」は1998年（平成10年）選定（鳥取県ページ）。小川家住宅のある河原町は、その地区の西にある町並みとされています（地区内とは確認できていません）","公式ホテル一覧で「重伝建地区」のタグ（公式の分類。小川家住宅のある河原町が、重要伝統的建造物群保存地区「倉吉打吹玉川」の範囲内かは、範囲図で未確認）"],"highlights":["文化財の座敷で過ごす、2棟11室の宿","指定名勝「環翠園」の庭園ガイドと呈茶","竹林の旧国鉄倉吉線廃線跡を歩く瞑想"],"talks":[{"label":"①歴史・物語から","text":"風の 倉吉は、倉吉市の河原町にある宿です。小川家と髙多家という2つの建物に、客室が11室あります。小川家の建物は鳥取県の指定保護文化財、髙多家の建物は国の登録有形文化財になっています。河原町は、打吹山のふもとに広がる町の西の端にあたり、東の端には、白壁土蔵群で知られる重要伝統的建造物群保存地区の打吹玉川があります。ご滞在では、指定名勝の庭園「環翠園」の庭園ガイドと呈茶体験や、竹林の廃線跡を歩く瞑想などが用意されています。"},{"label":"②建築・見どころから","text":"まず建物の見どころです。小川家は、主屋のほかに洋館、新座敷、茶室の「清和軒」、蔵などが増築された屋敷で、時代ごとの好みがうかがえると県が説明しています。鳥取県の指定保護文化財です。髙多家は、平屋建てで屋根が切妻の、古い形式の商家で、国の登録有形文化財です。この2棟に、11室の客室を設けています。ひとつの宿の中で、建物の違いを見比べていただけます。"},{"label":"③お客様の場面から","text":"こちらでは、鳥取県中部をめぐる滞在をご提案しています。指定名勝の庭園「環翠園」では、庭園ガイドと呈茶体験があります。竹林の旧国鉄倉吉線の廃線跡を歩く瞑想やウォーキング、民藝・工芸の体験、三徳山三佛寺への参拝登山も案内されています。お食事は里山の食材を使った、五行の考え方を取り入れた「調律食」です。ゆっくり整える旅としてお楽しみください。"}],"talk":"風の 倉吉は、倉吉市の河原町にある宿です。小川家と髙多家という2つの建物に、客室が11室あります。小川家の建物は鳥取県の指定保護文化財、髙多家の建物は国の登録有形文化財になっています。河原町は、打吹山のふもとに広がる町の西の端にあたり、東の端には、白壁土蔵群で知られる重要伝統的建造物群保存地区の打吹玉川があります。ご滞在では、指定名勝の庭園「環翠園」の庭園ガイドと呈茶体験や、竹林の廃線跡を歩く瞑想などが用意されています。","sources":[{"title":"風の 倉吉（Kazeno Heritage公式）","url":"https://www.kazenoheritage.jp/hotels/kurayoshi/"},{"title":"PR TIMES 風のヘリテージ発表（風の 倉吉 グランドオープン）","url":"https://prtimes.jp/main/html/rd/p/000000654.000018871.html"},{"title":"PR TIMES 風のヘリテージ発表（風の 倉吉）","url":"https://prtimes.jp/main/html/rd/p/000000647.000018871.html"},{"title":"小川家住宅 とっとり文化財ナビ（鳥取県）","url":"http://db.pref.tottori.jp/bunkazainavi.nsf/bunkazai_web_view/81801E062D55083349257E200010AB92"},{"title":"小川氏庭園 とっとり文化財ナビ（鳥取県）","url":"http://db.pref.tottori.jp/bunkazainavi.nsf/bunkazai_web_view/DC7C56B7331F56D74925796F00080091"},{"title":"旧髙多家住宅主屋 文化遺産オンライン","url":"https://online.bunka.go.jp/heritages/detail/572162"},{"title":"国指定文化財・国選定文化財 倉吉市公式ウェブサイト","url":"https://www.city.kurayoshi.lg.jp/4252.htm"},{"title":"鳥取県 文化財・歴史ページ（倉吉市打吹玉川）","url":"https://www.pref.tottori.lg.jp/item/1261793.htm"},{"title":"小川氏庭園「環翠園」一般公開しています 倉吉市公式ウェブサイト","url":"https://www.city.kurayoshi.lg.jp/4183.htm"},{"title":"小川家住宅（倉吉民泊 KURAYOSHI STAY）","url":"https://kurayoshi-stay.jp/history/ogawake/"},{"title":"地域の見どころリレー：小川氏庭園・小川家住宅 鳥取県立美術館","url":"https://tottori-moa.jp/uncategorized/1038/"}]},{"id":"ryoi","name":"Hotel VMG Kyoto 鴨川","abbr":"了以","region":"京都","district":"木屋町","group":"ホテル＆レストラン","url":"https://www.kazenoheritage.jp/hotels/kamogawa/","ready":true,"draft":false,"area":"京都府京都市下京区和泉屋町（木屋町通沿い）","summary":"木屋町通に立つ、旧料理旅館を受け継いだ宿。高瀬川と鴨川にはさまれた場所です。","history":"公式ページによると、この建物は1907年に置屋として建てられ、1925年の創業以来、長いあいだ旅館として人々を迎えてきました。公式ページは、この宿を「元老舗料理旅館を受け継いだ」宿とも紹介しています。場所は京都市下京区の木屋町通沿いで、西に高瀬川、東に鴨川が流れています。高瀬川は、氾濫をくり返した鴨川のそばに安定した水路を確保するため、江戸時代初期に開かれた川です。京都市の資料では、角倉了以とその子の素庵が1611年に工事を始め、1614年に完成させたとされています。公式ページによると、この川に材木問屋や材木商が軒を連ね、川沿いの通りは「木屋町」と呼ばれて、料理屋や酒屋、旅館でにぎわう町になりました。2023年2月の運営会社のリリースでは、旅館だった建物を改装した客室棟「了以」を、同年3月25日に開く予定と発表されました。2026年4月15日に、名称は「Hotel VMG Kyoto 鴨川」へ変わりました。","usage":"公式ページによると、旅館として歴史を刻んだかつての趣を生かしながら、全部屋に和室があります。すべての客室には、日本の伝統建築で最も格式の高い特別な部屋に設けられてきた「折上格天井」があり、職人の高度な技術を要する設えです。客室は、鴨川を望む部屋と、高瀬川沿いの部屋に分かれています。春には、ライトアップされる高瀬川沿いの桜が窓から眺められます。館内の各所には、京都出身の作家の作品が展示されています。ラウンジは有料で、レストランはありません。","value":"この場所の価値は、高瀬川と木屋町の歴史の中にあります。高瀬川は、角倉了以と素庵が1614年に完成させた運河で、舟で市内中心部へ物資を運べるようになりました（京都市）。木屋町という町名は、この川沿いに並んだ材木屋に由来するとされています（京都観光Navi）。高瀬川は1920年に廃止されましたが、川沿いの通りは、料理屋や酒屋、旅館でにぎわう町として続いてきました。建物は、1907年に置屋として建ち、1925年から旅館として使われてきたと公式ページにあります。宿の名前は、高瀬川を開いた角倉了以に由来すると公式ページは説明しています。全客室には、格式の高い意匠とされる折上格天井が設けられています。","designation":["周辺（別の文化財）：高瀬川一之船入は、国の史跡（1934年1月22日指定、京都市中京区木屋町通二条下ル西側一之船入町）。同じ高瀬川沿いにある別の場所で、この宿そのものの指定ではありません。"],"highlights":["西に高瀬川、東に鴨川。二つの川にはさまれた立地","1907年に置屋として建ち、1925年から旅館として続く建物","全客室に、格式ある意匠「折上格天井」"],"talks":[{"label":"①歴史・物語から","text":"こちらは、京都の木屋町通にある宿です。西には高瀬川、東には鴨川が流れていて、二つの川にはさまれた場所にあります。建物は1907年に置屋として建てられて、1925年からは旅館として、長くお客様を迎えてきたそうです。宿の名前は、江戸時代の初めに高瀬川を開いた角倉了以に由来すると、公式ページで紹介されています。お部屋には、日本の伝統建築の中でも、とくに格式の高い部屋に使われてきた折上格天井があります。春には高瀬川沿いの桜が窓から見られますし、夏には鴨川の納涼床が出ます。納涼床の歴史は、秀吉の時代までさかのぼるといわれているそうです。"},{"label":"②建築・見どころから","text":"お部屋の見どころは、天井です。すべての客室に「折上格天井」があります。日本の伝統建築のなかで、最も格式の高い特別な部屋に設けられてきた天井で、職人さんの高い技術が必要な造りです。全部屋に和室があり、客室は鴨川を望むお部屋と、高瀬川沿いのお部屋に分かれています。館内には、京都出身の作家の作品も展示されています。旅館として長く続いてきた趣を、建物の中で感じていただけます。"},{"label":"③お客様の場面から","text":"窓の外を思い浮かべてみてください。春には、ライトアップされた高瀬川沿いの桜を、お部屋の窓から眺めていただけます。和室で、鴨川や高瀬川の流れを近くに感じながら過ごす時間が、この宿の魅力です。館内の作品を見て歩くのも、ひとつの楽しみです。なお、ラウンジは有料で、レストランはございませんので、お食事はご予定に合わせてお考えください。"}],"talk":"こちらは、京都の木屋町通にある宿です。西には高瀬川、東には鴨川が流れていて、二つの川にはさまれた場所にあります。建物は1907年に置屋として建てられて、1925年からは旅館として、長くお客様を迎えてきたそうです。宿の名前は、江戸時代の初めに高瀬川を開いた角倉了以に由来すると、公式ページで紹介されています。お部屋には、日本の伝統建築の中でも、とくに格式の高い部屋に使われてきた折上格天井があります。春には高瀬川沿いの桜が窓から見られますし、夏には鴨川の納涼床が出ます。納涼床の歴史は、秀吉の時代までさかのぼるといわれているそうです。","sources":[{"title":"Hotel VMG Kyoto 鴨川（旧HOTEL VMG RESORT KYOTO 了以）公式トップ","url":"https://www.kazenoheritage.jp/hotels/kamogawa/"},{"title":"歴史と物語 - Hotel VMG Kyoto 鴨川（公式）","url":"https://www.kazenoheritage.jp/hotels/kamogawa/story/"},{"title":"お部屋 - Hotel VMG Kyoto 鴨川（公式）","url":"https://www.kazenoheritage.jp/hotels/kamogawa/rooms/"},{"title":"施設名変更のお知らせおよびご予約に関するご案内（公式・2026年4月15日）","url":"https://www.kazenoheritage.jp/hotels/kamogawa/2026/04/15/hotel-vmg-kyoto-kamogawa-notice/"},{"title":"Hotel VMG Kyoto Kamogawa（公式・英語ページ）","url":"https://www.kazenoheritage.jp/en/hotels/kamogawa/"},{"title":"History and Stories（公式・英語ページ）","url":"https://www.kazenoheritage.jp/en/hotels/kamogawa/story/"},{"title":"【HOTEL VMG VILLA KYOTO・HOTEL VMG RESORT KYOTO】運営形態・施設名称変更のお知らせ（VMG）","url":"https://www.vmg.co.jp/news/kyoto_rename/"},{"title":"新客室棟「了以」予約スタートのリリース（VMG・2023年2月17日）","url":"https://www.vmg.co.jp/news/ryoui_open/"},{"title":"京都市：高瀬川再生プロジェクト","url":"https://www.city.kyoto.lg.jp/kensetu/page/0000272260.html"},{"title":"高瀬川一之船入 京都市公式 京都観光Navi","url":"https://ja.kyoto.travel/tourism/single02.php?category_id=9&tourism_id=184"},{"title":"高瀬川一之船入 国指定文化財等データベース（文化庁）","url":"https://kunishitei.bunka.go.jp/heritage/detail/401/1684"},{"title":"伝統的建造物群保存地区 - 京都市","url":"https://www.city.kyoto.lg.jp/tokei/page/0000281305.html"}]},{"id":"ozucastle","name":"大洲城キャッスルステイ","abbr":"","region":"愛媛","district":"大洲城","group":"キャッスルステイ","url":"https://castlestay.ozucastle.com/","ready":true,"draft":false,"area":"愛媛県大洲市大洲（大洲城）","summary":"木造復元天守に泊まる、日本初をうたう城泊体験。舞台は櫓が残る大洲城です。","history":"大洲城は、愛媛県大洲市の肱川と久米川が合流するあたりの丘に築かれた平山城です。中世には宇都宮氏の居城で、戸田氏、藤堂氏、脇坂氏の時代に近世の城へ整えられたと考えられています。1617年に加藤貞泰が6万石で入城し、1869年の廃藩まで加藤氏が治めました。明治に入ると、1874年に入札で民間へ払い下げられ、1888年に天守が解体されました。ただし、櫓は残りました。1906年には本丸と二の丸の一部が大洲町の所有となり、城山公園として管理が始まりました。2004年には、市制施行50周年の記念事業として、古写真や江戸時代の絵図、木組みの模型などを手がかりに、木造で天守が復元されました。","usage":"公式ページでは、大洲城キャッスルステイを、木造復元天守に泊まる城泊の体験として紹介しています。天守の1階で布団に休み、夕食は櫓でいただく流れです。1日1組限定で、滞在中は、バトラーとシェフ以外の城山一帯への立ち入りが制限されます。城を望むキャッスルラウンジには、宿泊者だけが使える浴場があります。翌朝は、国の重要文化財の臥龍山荘を貸し切って、朝食とお茶を楽しみます。公式ページは、売上の一部が文化財の維持保全に充てられると説明しています。","value":"現存する4つの櫓は、江戸時代の終わり近くに建て直されたものが中心です。大洲市の資料では、台所櫓が1859年、高欄櫓が1861年、苧綿櫓が1843年に再建され、三の丸南隅櫓は1766年に再建されたとあります。三の丸南隅櫓は、4つの櫓のうち最も古いと紹介されています。高欄櫓は、天守に付けることが多い高欄（手すり）を櫓に付けた珍しい例で、「天守に次ぐ高い格式」の櫓と考えられています。台所櫓は、籠城のときに台所になるよう、1階の約3分の1が土間になっています。天守の復元では、必要な史料が多く残っていたことが、とても珍しいと大洲市は紹介しています。","designation":["城の文化財：大洲城 台所櫓・高欄櫓・苧綿櫓・三の丸南隅櫓の4棟は、国の重要文化財（1957年（昭和32年）6月18日指定）","城の文化財：大洲城跡（本丸と二の丸の一部）は、愛媛県指定の史跡（指定年は出典により食い違いあり。uncertainを参照）"],"highlights":["2004年に復元された木造の天守に泊まれます","国の重要文化財の櫓が4棟、城内に残っています","夕食は櫓で、朝食は重要文化財の臥龍山荘で"],"talks":[{"label":"①歴史・物語から","text":"大洲城は、愛媛県大洲市にあるお城です。江戸時代には、1617年から明治の初めまで加藤氏が治めました。天守は明治に取り壊されましたが、2004年に古写真や木組みの模型などをもとに、木造で復元されました。城には、国の重要文化財の櫓が4棟、今も残っています。公式ページでは、この復元天守に泊まる日本初の城泊体験とご紹介しています。夕食は櫓でいただき、翌朝は、国の重要文化財の臥龍山荘で朝食とお茶をお楽しみいただきます。売上の一部は、文化財の維持保全に充てられています。城主になったつもりで、ごゆっくりお過ごしください。"},{"label":"②建築・見どころから","text":"大洲城の見どころは、今も残る4つの櫓です。台所櫓、高欄櫓、苧綿櫓、三の丸南隅櫓で、いずれも国の重要文化財です。高欄櫓は、天守に付けることの多い手すりを付けた珍しい櫓です。台所櫓は、籠城のときに台所になるよう、1階の約3分の1が土間になっています。そして2004年に木造で復元された天守があります。この城山の天守と櫓が、宿泊の舞台です。"},{"label":"③お客様の場面から","text":"1日1組だけの、貸切の滞在です。天守の1階で布団に休み、夕食は櫓でいただきます。滞在中は、バトラーとシェフ以外、城山一帯への立ち入りが制限されますので、お城を独り占めするようなひとときになります。城を望むラウンジには、宿泊者だけが使える浴場があります。翌朝は、国の重要文化財の臥龍山荘を貸し切って、朝食とお茶を楽しんでいただきます。"}],"talk":"大洲城は、愛媛県大洲市にあるお城です。江戸時代には、1617年から明治の初めまで加藤氏が治めました。天守は明治に取り壊されましたが、2004年に古写真や木組みの模型などをもとに、木造で復元されました。城には、国の重要文化財の櫓が4棟、今も残っています。公式ページでは、この復元天守に泊まる日本初の城泊体験とご紹介しています。夕食は櫓でいただき、翌朝は、国の重要文化財の臥龍山荘で朝食とお茶をお楽しみいただきます。売上の一部は、文化財の維持保全に充てられています。城主になったつもりで、ごゆっくりお過ごしください。","sources":[{"title":"大洲城キャッスルステイ 公式トップ","url":"https://castlestay.ozucastle.com/"},{"title":"大洲城キャッスルステイ 魅力（about）","url":"https://castlestay.ozucastle.com/about"},{"title":"大洲城キャッスルステイ 歴史（history）","url":"https://castlestay.ozucastle.com/history"},{"title":"大洲城キャッスルステイ 滞在空間（stay）","url":"https://castlestay.ozucastle.com/stay"},{"title":"大洲城キャッスルステイ よくあるご質問（faq）","url":"https://castlestay.ozucastle.com/faq"},{"title":"大洲城キャッスルステイ 体験プログラム","url":"https://castlestay.ozucastle.com/experience"},{"title":"大洲市 現地説明会参考資料（大洲城の沿革）PDF","url":"https://www.city.ozu.ehime.jp/uploaded/attachment/17239.pdf"},{"title":"大洲市 わがまちの文化財「大洲城跡」","url":"https://www.city.ozu.ehime.jp/site/bunkazai/0205.html"},{"title":"大洲市 わがまちの文化財 史跡（県指定）一覧","url":"https://www.city.ozu.ehime.jp/site/bunkazai/11509.html"},{"title":"大洲市 大洲城台所櫓","url":"https://www.city.ozu.ehime.jp/site/bunkazai/0259.html"},{"title":"大洲市 大洲城高欄櫓","url":"https://www.city.ozu.ehime.jp/site/bunkazai/0262.html"},{"title":"大洲市 大洲城苧綿櫓","url":"https://www.city.ozu.ehime.jp/site/bunkazai/0270.html"},{"title":"大洲市 大洲城三の丸南隅櫓","url":"https://www.city.ozu.ehime.jp/site/bunkazai/0271.html"},{"title":"国指定文化財等データベース（文化庁）大洲城三の丸南隅櫓","url":"https://kunishitei.bunka.go.jp/heritage/detail/102/3379"},{"title":"文化遺産オンライン 大洲城 台所櫓","url":"https://online.bunka.go.jp/heritages/detail/191213"},{"title":"文化遺産オンライン 大洲城 高欄櫓","url":"https://online.bunka.go.jp/heritages/detail/124184"},{"title":"文化遺産オンライン 大洲城 苧綿櫓","url":"https://online.bunka.go.jp/heritages/detail/157915/3"},{"title":"えひめの文化財（たから）大洲城（愛媛県）","url":"https://www.pref.ehime.jp/ehimenotakara/18.html"},{"title":"大洲市観光情報 大洲城","url":"https://www.city.ozu.ehime.jp/site/kanko/1223.html"}]},{"id":"marugame","name":"丸亀城キャッスルエクスペリエンス","abbr":"","region":"香川","district":"丸亀城","group":"キャッスルステイ","url":"https://marugame-castle.com/","ready":true,"draft":false,"area":"香川県丸亀市一番丁（丸亀城内）","summary":"現存天守のある丸亀城で過ごす、宿泊と文化体験を組み合わせた城泊です。","history":"丸亀城は、香川県丸亀市の亀山（標高約66m）に築かれた城で、築城から400年以上の歴史があります。文化遺産オンラインの解説では、1587年に生駒親正が讃岐に入り、1597年にこの地で築城しました。生駒氏の後、山崎氏が廃城となっていた古い城を修築して、現在の城を整えました。その後は京極氏が治め、明治維新まで続きました。公式ページによると、京極氏は初代の京極高和から約210年、7代にわたって西讃岐一帯を治めました。天守は三重三階で、1643年から1660年ごろの建造とされています。大手一の門と大手二の門は、1670年に再建されました。三の丸の延寿閣別館は1933年に建てられた建物で、東京の京極家屋敷の部材が使われています。","usage":"公式ページでは、丸亀城キャッスルエクスペリエンスを、城を貸し切って過ごす「城泊」の宿泊プランとして紹介しています。体験プログラムも組み合わせた内容です。宿泊の拠点は三の丸の延寿閣別館で、木造平屋、延べ床面積120平方メートルの宿泊者専用の空間です。1日目は、人力車でJR丸亀駅から城へ向かい、大手門で和太鼓の演奏に迎えられます。夜は天守を貸し切ってガイドの案内を受け、天守内のナイトラウンジで過ごします。2日目は中津万象園で朝食をとり、丸亀うちわ作りや煎茶道を体験します。","value":"丸亀城は「石垣の名城」と呼ばれ、内堀から天守へ向けて4層に重ねられた石垣は、高さの合計が約60mで日本一とされています（公式ページと香川県の資料）。天守は現存する十二天守のひとつです。三重三階で「日本一小さい天守」といわれますが、唐破風と千鳥破風を備えると公式ページは紹介しています。大手一の門は櫓門、大手二の門は高麗門で、大手口の堂々とした姿を伝え、枡形を保存するうえでも重要な建物とされています。天守と大手門の両方が現存する城は、丸亀城、高知城、弘前城の3城だけと公式ページは説明しています。","designation":["城の文化財：丸亀城天守（附：板札1枚）は、国の重要文化財（1943年（昭和18年）6月9日指定）","城の文化財：丸亀城 大手一の門・大手二の門（附：東西土塀）は、国の重要文化財（1957年（昭和32年）6月18日指定）","城の文化財：丸亀城跡は、国指定の史跡（1953年（昭和28年）3月31日指定）","城の文化財：丸亀城 玄関先御門・番所・長屋（附：土塀）は、香川県指定の有形文化財（1963年（昭和38年）4月9日指定）","宿泊棟の文化財：延寿閣別館は、国の登録有形文化財（2026年7月9日登録）"],"highlights":["現存十二天守のひとつ。夜は天守を貸切で案内します","4層に重なる高石垣。合計約60mで日本一とされます","1933年建築の延寿閣別館に泊まれます"],"talks":[{"label":"①歴史・物語から","text":"丸亀城は、香川県丸亀市の亀山にあるお城です。天守は、全国に12しか残っていない現存天守のひとつで、国の重要文化財です。三重三階の小さな天守ですが、唐破風と千鳥破風がとても美しいんですよ。石垣も見どころで、4層に重なった石垣は、高さの合計が約60mで日本一とされています。泊まっていただく延寿閣別館は1933年に建てられ、京極家の東京の屋敷の部材が使われています。夜には天守を貸し切って、ガイドの案内を受けられます。かつての城主になった気分で、お楽しみください。"},{"label":"②建築・見どころから","text":"丸亀城は「石垣の名城」と呼ばれています。内堀から天守に向けて、石垣が4層に重なっていて、高さを合計すると約60mで、日本一とされています。その上に建つ天守は、三重三階で、現存する十二天守のひとつです。小さな天守ですが、唐破風と千鳥破風という、屋根の飾りを備えていると公式ページで紹介されています。大手門も、櫓門と高麗門の2つが残っています。"},{"label":"③お客様の場面から","text":"1日目は、人力車でJR丸亀駅からお城へ向かいます。大手門では和太鼓の演奏がお迎えします。夜は天守を貸し切りにして、ガイドの案内を受け、天守のナイトラウンジで過ごします。お泊まりは、三の丸の延寿閣別館で、宿泊者専用の木造平屋の空間です。2日目は中津万象園で朝食をとり、丸亀うちわ作りや煎茶道も体験できます。城を貸し切る、城泊のプランです。"}],"talk":"丸亀城は、香川県丸亀市の亀山にあるお城です。天守は、全国に12しか残っていない現存天守のひとつで、国の重要文化財です。三重三階の小さな天守ですが、唐破風と千鳥破風がとても美しいんですよ。石垣も見どころで、4層に重なった石垣は、高さの合計が約60mで日本一とされています。泊まっていただく延寿閣別館は1933年に建てられ、京極家の東京の屋敷の部材が使われています。夜には天守を貸し切って、ガイドの案内を受けられます。かつての城主になった気分で、お楽しみください。","sources":[{"title":"丸亀城キャッスルエクスペリエンス 公式トップ","url":"https://marugame-castle.com/"},{"title":"丸亀城キャッスルエクスペリエンスの魅力（about）","url":"https://marugame-castle.com/about/"},{"title":"丸亀の歴史（culture）","url":"https://marugame-castle.com/culture/"},{"title":"ご宿泊（stay）","url":"https://marugame-castle.com/stay/"},{"title":"アクセス（access）","url":"https://marugame-castle.com/access/"},{"title":"文化遺産オンライン 丸亀城天守","url":"https://online.bunka.go.jp/heritages/detail/191123"},{"title":"国指定文化財等データベース（文化庁）丸亀城天守","url":"https://kunishitei.bunka.go.jp/heritage/detail/102/3286"},{"title":"文化遺産オンライン 丸亀城 大手一の門","url":"https://online.bunka.go.jp/heritages/detail/148481"},{"title":"文化遺産オンライン 丸亀城 大手二の門","url":"https://online.bunka.go.jp/heritages/detail/176522"},{"title":"文化遺産オンライン 丸亀城跡","url":"https://online.bunka.go.jp/heritages/detail/217529"},{"title":"文化遺産オンライン 延寿閣別館","url":"https://online.bunka.go.jp/heritages/detail/624845"},{"title":"香川県教育委員会 国・県指定有形文化財（建造物）","url":"https://www.pref.kagawa.lg.jp/kenkyoui/shogaigakushu/bunkazai/culturalassets/culturalassets_1.html"},{"title":"香川県教育委員会 国・県指定史跡","url":"https://www.pref.kagawa.lg.jp/kenkyoui/shogaigakushu/bunkazai/culturalassets/culturalassets_12.html"},{"title":"香川県 ご提言等の内容（丸亀城の城泊の活用について）","url":"https://www.pref.kagawa.lg.jp/kocho/kocho/koe/k0348050921.html"},{"title":"香川県 亀山公園の資料（PDF）","url":"https://www.pref.kagawa.lg.jp/documents/13195/05kameyamakouenn.pdf"}]},{"id":"fukuyama","name":"福山城キャッスルステイ","abbr":"FKY","region":"広島","district":"福山城","group":"キャッスルステイ","url":"https://www.fukuyamacastle.com/","ready":true,"draft":false,"area":"広島県福山市丸之内一丁目8番（福山城公園内）","summary":"福山城公園の歴史的建造物に泊まり、「一日城主」になる宿泊体験です。","history":"福山城は、徳川家康のいとこの水野勝成が、1619年に備後国10万石の領主として入り、福山の地に築いた城です。城が完成したのは1622年（元和8年）で、城下町とともに福山藩の中心になりました。1710年からは阿部氏が明治維新まで藩を治め、幕末の名宰相・阿部正弘もこの家から出ています。1873年の廃城令で城の一部が解体されましたが、天守は1931年に国宝になり、1933年には伏見櫓・御湯殿・筋鉄御門も国宝に指定されました。1945年8月8日の福山空襲で天守や御湯殿が焼け、伏見櫓・筋鉄御門・鐘櫓は残りました。戦後の1950年に文化財保護法が施行され、伏見櫓と筋鉄御門は国の重要文化財になりました。1966年には市制施行50周年の記念事業で天守が再建され、天守・御湯殿・月見櫓の外観が復元されました。","usage":"キャッスルステイは、泊まる人が「一日城主」になり、公園内の歴史的建造物や文化財を楽しむ宿泊体験です。公式ページによると、福山駅で甲冑の出迎えを受け、福寿会館でチェックインと殿様・姫様の衣装への着替え、朝食をします。筋鉄御門で入城体験をしたあと、本丸南東隅の月見櫓で城主の儀を行い、城主証を受け取ります。夕食と就寝も月見櫓です。天守ではキャッスルミュージアム＆バーと、天空の間でのナイトラウンジがあります。入浴は、江戸期の蒸し風呂を再現した御湯殿のサウナ形式で、2日目は伏見櫓の案内があります。","value":"福山城は、福山市の資料で「石高に比して破格の規模を誇った」城とされています。天守の北側には防御用の鉄板が張られていたとされ、「全国唯一」といわれています。この鉄板張りは、築城400年の「令和の大普請」で外観が復元されました。伏見櫓は、梁の陰刻「松ノ丸ノ東やく（ら）」から、京都の伏見城から移されたことがわかった建物です。白壁の3層3階の姿に桃山時代の気風がうかがえ、柱を見せる意匠が特徴とされています。筋鉄御門は本丸の正門で、「枡型多門の型をとらない初期様式」とされ、福山藩の最重要施設を守る「最後の砦」として堅固に造られました。空襲の熱で赤みを帯びた花崗岩が、二之丸と天守台の石垣に残り、戦争の遺跡とされています。","designation":["城の文化財：福山城 伏見櫓（国指定・重要文化財。文化庁データベースの重文指定年月日は1933年1月23日）","城の文化財：福山城 筋鉄御門（国指定・重要文化財。文化遺産オンラインの重文指定年月日は1933年1月23日）","城の文化財：福山城跡（国指定・史跡。文化遺産オンラインの指定年月日は1964年2月7日）","キャッスルステイで使う建物：福山市福寿会館本館（登録有形文化財・建造物。2012年2月23日登録）"],"highlights":["月見櫓で「一日城主の儀」を行い、城主証を受けます","筋鉄御門から入城する体験があります","2日目に、桃山の気風を伝える伏見櫓の案内があります"],"talks":[{"label":"①歴史・物語から","text":"ここは、福山城公園の中に泊まる「キャッスルステイ」です。福山城は、徳川家康のいとこの水野勝成が築いた城で、完成は1622年です。泊まる方は「一日城主」になって、まず筋鉄御門から入城します。この門は、福山城に残る国の重要文化財です。そのあと本丸の月見櫓で城主の儀をして、城主証を受け取り、夕食と就寝もそこで過ごします。天守では、ミュージアム＆バーやナイトラウンジを楽しめます。お風呂は、江戸時代の蒸し風呂を再現した御湯殿です。2日目には、桃山時代の気風を伝える伏見櫓のご案内もあります。城の歴史に包まれる一泊を、ぜひお楽しみください。"},{"label":"②建築・見どころから","text":"福山城には、ほかにはない見どころがあります。天守の北側には、防御のための鉄板が張られていたとされ、全国唯一といわれています。その外観は「令和の大普請」で復元されました。伏見櫓は、梁に刻まれた文字から、京都の伏見城から移されたことがわかった建物です。筋鉄御門は本丸の正門です。石垣には、空襲の熱で赤みを帯びた石が今も残っています。"},{"label":"③お客様の場面から","text":"泊まる方は「一日城主」になります。福山駅では甲冑のお出迎えを受け、殿様・姫様の衣装に着替えます。筋鉄御門から入城し、月見櫓で城主の儀を行って、城主証を受け取ります。夕食と就寝も月見櫓です。天守ではミュージアム＆バーやナイトラウンジをお楽しみいただけます。お風呂は、江戸時代の蒸し風呂を再現した御湯殿のサウナ形式です。2日目は、伏見櫓の案内もあります。"}],"talk":"ここは、福山城公園の中に泊まる「キャッスルステイ」です。福山城は、徳川家康のいとこの水野勝成が築いた城で、完成は1622年です。泊まる方は「一日城主」になって、まず筋鉄御門から入城します。この門は、福山城に残る国の重要文化財です。そのあと本丸の月見櫓で城主の儀をして、城主証を受け取り、夕食と就寝もそこで過ごします。天守では、ミュージアム＆バーやナイトラウンジを楽しめます。お風呂は、江戸時代の蒸し風呂を再現した御湯殿です。2日目には、桃山時代の気風を伝える伏見櫓のご案内もあります。城の歴史に包まれる一泊を、ぜひお楽しみください。","sources":[{"title":"福山城キャッスルステイ（公式トップ）","url":"https://www.fukuyamacastle.com/"},{"title":"福山城キャッスルステイ 体験コンテンツ","url":"https://www.fukuyamacastle.com/experience/"},{"title":"福山城キャッスルステイ 福山城の歴史","url":"https://www.fukuyamacastle.com/history/"},{"title":"福山城キャッスルステイ 福山の魅力","url":"https://www.fukuyamacastle.com/fukuyama/"},{"title":"文化遺産オンライン 福山城 伏見櫓","url":"https://online.bunka.go.jp/heritages/detail/176382"},{"title":"国指定文化財等データベース 福山城 伏見櫓","url":"https://kunishitei.bunka.go.jp/heritage/detail/102/3145"},{"title":"文化遺産データベース 福山城 筋鉄御門","url":"https://online.bunka.go.jp/db/heritages/detail/190983"},{"title":"文化遺産オンライン 福山城跡","url":"https://online.bunka.go.jp/heritages/detail/217389"},{"title":"文化遺産オンライン 福山市福寿会館本館","url":"https://online.bunka.go.jp/heritages/detail/248510"},{"title":"福山市 福山城（ふくやまじょう）","url":"https://www.city.fukuyama.hiroshima.jp/site/miryoku2023/287233.html"},{"title":"福山市 入封400年記念シリーズ(11) 戦前の福山城と福山空襲","url":"https://www.city.fukuyama.hiroshima.jp/koho-detail50/koho-202002/172625.html"},{"title":"福山市 国重要文化財 伏見櫓・筋鉄御門","url":"https://www.city.fukuyama.hiroshima.jp/koho-detail50/koho-202302/282378.html"},{"title":"広島県 たてもの情報 福山城伏見櫓","url":"https://www.pref.hiroshima.lg.jp/site/tatemonogatari/tatemonojouhou19.html"},{"title":"福山城博物館 伏見櫓","url":"https://fukuyamajo.jp/miru/fushimiyagura/"},{"title":"福山城博物館 筋鉄御門","url":"https://fukuyamajo.jp/miru/sugiganegomon/"},{"title":"福山城博物館 月見櫓","url":"https://fukuyamajo.jp/miru/tukimiyagura/"}]}],"stats":{"total":32,"published":32,"draft":0,"invalid":0}},"ai":{"status":"off","guard":[]},"progress":{}}/*A01_STATIC_END*/;
