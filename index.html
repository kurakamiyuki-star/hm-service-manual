    state.me = {svc:m.svc||'', pos:m.pos||'', set:!!m.svc};
    state.g.mode = gg.mode==='vip' ? 'vip' : 'hm';
  }
  function readEdition(cb){
    var done = false;
    function fin(v){
      if(done){ return; } done = true;
      v = String(Array.isArray(v) ? v[0] : (v||'')).toLowerCase();
      cb(/^[a-z0-9]{1,12}$/.test(v) ? v : '');
    }
    try{
      if(isGas && google.script.url && google.script.url.getLocation){
        google.script.url.getLocation(function(loc){ fin((loc && loc.parameter && loc.parameter.v) || (loc && loc.parameters && loc.parameters.v)); });
        setTimeout(function(){ fin(''); }, 3000);
        return;
      }
      fin(new URLSearchParams(location.search).get('v'));
    }catch(e){ fin(''); }
  }
  function saveQ(){ lsSet('a01-quiz', state.qz.res); }
  function saveP(){ lsSet('a01-quiz-pass', state.qz.pass); }

  var ICON_SEARCH = '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>';
  var ICON_PLAY = '<svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><path d="M7 5l12 7-12 7z"/></svg>';
  var ICON_DOWN = '<svg width="14" height="14" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 4l4 4 4-4"/></svg>';
  var ICON_UP = '<svg width="14" height="14" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 8l4-4 4 4"/></svg>';

  function flat(){
    var out=[];
    state.data.groups.forEach(function(g){ g.videos.forEach(function(v){ out.push({g:g,v:v}); }); });
    return out;
  }
  function isDone(v){ return !!state.data.progress[v.fileId]; }

  /* ---------- 担当（サービス＋ポジション） ---------- */
  function procSets(){
    var d = state.data;
    if(d.procedureSets && d.procedureSets.length){ return d.procedureSets; }
    return [{key:'res', label:'レストランSV', roles:d.roles||[], procedures:d.procedures||[]}];

  function meSet(){

    for(i=0;i<sets.length;i++){ if(sets[i].key===state.me.svc){ return sets[i]; } }
    state.me.svc = sets[0].key; return sets[0];
  }
  function mePos(){
    var set = meSet();
    return (state.me.pos && (set.roles||[]).indexOf(state.me.pos)!==-1) ? state.me.pos : '';
  }
  function shortLabel(set){ return String(set.label).replace(/（.*）/,''); }
  function meText(){ var p = mePos(); return shortLabel(meSet()) + (p ? '・'+p : ''); }
  function updateHeader(){
    var el = $('meLabel');
    if(!state.me.set){ el.innerHTML = '<b>担当を選ぶ</b>'; return; }
    el.innerHTML = '<small>'+esc(shortLabel(meSet()))+'</small><b>'+esc(mePos() || 'すべての担当')+'</b>';
  }

  function renderMeSheet(){
    var sets = procSets(), set = meSet(), pos = mePos();
    var svc = '<p class="mlabel">サービス</p><div class="me-svc">'+sets.map(function(s){
      var sub = s.key==='banquet' ? '婚礼・内式' : 'レストラン';

    }).join('')+'</div>';
    var chips = '<p class="mlabel">ポジション（担当）</p><div class="me-pos">'+
      chip('mepos','','すべて', pos==='')+(set.roles||[]).map(function(r){ return chip('mepos', r, esc(r), pos===r); }).join('')+'</div>';
    $('meBody').innerHTML = svc + chips;
  }
  function openMe(){ renderMeSheet(); var d = $('meDlg'); if(!d.open){ d.showModal(); } }
  function closeMe(){
    state.me.set = true; saveMe(); updateHeader();

  function chip(act, v, label, on){

  function mineChip(){

  function init(data){
    state.data = data;
    state.titles = {};
    flat().forEach(function(x){ state.titles[x.v.fileId] = x.v.title; });
    $('title').textContent = data.title || 'HM_サービスマニュアル';
    $('subtitle').textContent = data.subtitle || '';

    if(STATIC_DATA){
      notice.textContent = '手順・ガイド・テストは、どなたでも見られます。動画は、VMCのGoogleアカウントでログインしている人だけが見られます。学習の記録は、この端末にだけ保存されます。';

  var VIEWS = ['home','procedures','guide','quiz','facilities','library'];
  function aiOn(){ return !!(state.data && state.data.ai && state.data.ai.status==='on'); }
  function updateFab(){ var f = $('fab'); if(f){ f.hidden = !aiOn() || state.view==='ask' || state.view==='admin'; } }
  function setTabs(view){
    VIEWS.forEach(function(v){ $('tab-'+v).setAttribute('aria-selected', String(v===view)); });
  }
  function render(){ showView(state.view, true); }
  function showView(view, keepScroll){
    state.view = view; setTabs(view);

  /* ---------- ホーム ----------
     続けたくなる仕掛け：連続日数・今日の3問・合格までの状況・最近見たもの・★保存。すべて端末のブラウザ内だけで完結 */
  function ymd(d){ return d.getFullYear()+'-'+('0'+(d.getMonth()+1)).slice(-2)+'-'+('0'+d.getDate()).slice(-2); }
  function daysAgo(n){ var d = new Date(); d.setDate(d.getDate()-n); return ymd(d); }
  function markActive(){
    var a = state.act, t = today();
    if(a.last===t){ return; }
    a.streak = (a.last===daysAgo(1)) ? (a.streak||0)+1 : 1;
    a.last = t; a.days = (a.days||[]).concat([t]).slice(-30);
    lsSet('a01-act', a);
  }
  function streakNow(){ var a = state.act; return (a.last===today() || a.last===daysAgo(1)) ? (a.streak||0) : 0; }
  function addRecentQ(val){
    var q = String(val||'').trim(); if(!q){ return; }
    state.recent.q = [q].concat((state.recent.q||[]).filter(function(x){ return x!==q; })).slice(0,5);
    lsSet('a01-recent', state.recent);
  }
  function dailyIds(){
    var pool = quizPool(), r = state.qz.res;
    var wrong = pool.filter(function(q){ return r[q.id]===false; }), fresh = pool.filter(function(q){ return r[q.id]===undefined; }), ok = pool.filter(function(q){ return r[q.id]===true; });
    return shuffle(wrong).concat(shuffle(fresh)).concat(shuffle(ok)).slice(0,3).map(function(q){ return q.id; });
  }
  function greet(){ var h = new Date().getHours(); return h<11 ? 'おはようございます' : (h<17 ? 'こんにちは' : 'おつかれさまです'); }

  function renderHome(){
    var pool = quizPool(), cfg = quizCfg(), rec = state.qz.pass[quizScope()];
    var all = flat(), vdone = all.filter(isDone).length;
    var ok = pool.filter(function(q){ return state.qz.res[q.id]===true; }).length;
    var st = streakNow(), todayActive = state.act.last===today(), days = state.act.days||[];
    var wk = ['日','月','火','水','木','金','土'];
    var dots = '';
    for(var i=6;i>=0;i--){
      var dstr = daysAgo(i), dd = new Date(); dd.setDate(dd.getDate()-i);
      dots += '<span class="dot'+(days.indexOf(dstr)!==-1?' on':'')+(i===0?' today':'')+'"><b>'+(days.indexOf(dstr)!==-1?'✓':'')+'</b>'+wk[dd.getDay()]+'</span>';
    }
    var msg = todayActive ? '今日も学習できました。この調子です。' : (st>0 ? '今日1問やると、連続 '+(st+1)+'日になります。' : '今日、1問だけやってみましょう。');
    var html = '<h1 class="page-title">'+greet()+'</h1><p class="page-sub">'+esc(meText())+'</p>'+
      '<div class="card"><div class="card-in"><div class="st-top"><div><p class="sum-label">学習の連続日数</p><p class="st-num"><b>'+st+'</b>日</p></div><p class="st-msg">'+msg+'</p></div><div class="dots" aria-label="直近7日の学習">'+dots+'</div></div></div>';
    if(pool.length){
      var dn = state.daily.date===today() ? state.daily.n : 0, ids = dailyIds();
      html += '<div class="card daily"><div class="card-in"><p class="sum-label">今日の3問（約1分）</p>'+
        '<p class="d-title">'+(dn ? '✓ 今日の3問は完了しました' : 'まず3問、気軽に解いてみましょう')+'</p>'+
        '<p class="hint" style="margin:0 0 12px">まちがえた設問や、まだ解いていない設問から出します。成績には影響しません。</p>'+
        '<button type="button" class="btn primary block" data-act="dstart"'+(ids.length?'':' disabled')+'>'+(dn?'もう1セットやる':'3問をはじめる')+'</button></div></div>';
      var n = Math.min(cfg.size, pool.length);
      html += '<div class="card"><div class="card-in"><p class="sum-label">合格ライン 正答率'+cfg.pass+'%</p>'+
        '<p class="d-title">'+(rec&&rec.passed ? '✓ 合格済み（'+esc(rec.passedAt)+'）' : (rec ? '直近 '+rec.score+'/'+rec.n+'。あと一歩です' : '本番のテストは'+n+'問です'))+'</p>'+
        '<button type="button" class="btn block" data-act="tab" data-view="quiz">テストへ進む</button></div></div>';
    }
    if(aiOn()){
      html += '<div class="card"><div class="card-in"><p class="d-title">わからないことは、AIに聞けます</p><p class="hint" style="margin:0 0 12px">マニュアルに書いてあることから、答えを探します。</p><button type="button" class="btn block" data-act="ask">AIに聞く</button></div></div>';
    }
    if(state.data.user.isAdmin && state.data.ai && state.data.ai.status!=='on'){
      html += '<p class="ginfo">【管理者向け】AI機能は '+(state.data.ai.status==='nokey' ? 'オンですが、APIキーが未設定です（台帳のメニュー「AI（Gemini）」→「APIキーを設定する」）' : 'オフです（台帳のメニュー「AI（Gemini）」で、キー設定→接続テスト→入／切）')+'。</p>';
    }
    html += '<div class="stat"><div><b>'+vdone+'/'+all.length+'</b><span>見た動画</span></div><div><b>'+ok+'/'+pool.length+'</b><span>正解した設問</span></div>'+
      '<div><b>'+(rec&&rec.passed?'✓':'―')+'</b><span>合格</span></div></div>';
    var rq = (state.recent.q||[]).map(function(q){ return '<button type="button" class="chip" data-act="rq" data-q="'+esc(q)+'">'+esc(q)+'</button>'; }).join('');
    var rv = (state.recent.v||[]).filter(function(id){ return state.titles[id]; }).map(function(id){ return '<button type="button" class="chip" data-act="open" data-id="'+esc(id)+'">'+ICON_PLAY+' '+esc(state.titles[id])+'</button>'; }).join('');
    if(rq || rv){
      html += '<p class="mlabel" style="margin-top:20px">最近見たもの</p><div class="chips" style="padding-top:0">'+rq+rv+'</div>';
    }
    var favs = Object.keys(state.fav).map(function(k){ return {k:k, f:state.fav[k]}; });
    html += '<p class="mlabel" style="margin-top:20px">★ 保存した項目</p>';
    html += favs.length ? '<div class="card"><ul class="qlist" style="padding-top:2px">'+favs.map(function(x){
      return '<li><button type="button" data-act="gofav" data-id="'+esc(x.k)+'" style="flex:1">'+esc(x.f.title)+'</button><button type="button" class="star" data-act="favdel" data-id="'+esc(x.k)+'" aria-label="保存を外す">★</button></li>';
    }).join('')+'</ul></div>' : '<p class="hint">ガイドで大事な項目の ☆ を押すと、ここに保存されます。</p>';
    if(facAll().length){
      html += '<div class="card"><div class="card-in"><p class="d-title">運営する施設を知る</p><p class="hint" style="margin:0 0 12px">会場の歴史・いまの活かし方・歴史的価値を、会場ごとに学べます。お客様へのご案内にも。</p><button type="button" class="btn block" data-act="tab" data-view="facilities">施設紹介を見る</button></div></div>';
    }
    html += '<div class="row"><button type="button" class="btn" data-act="tab" data-view="procedures" style="flex:1">手順を探す</button><button type="button" class="btn" data-act="tab" data-view="guide" style="flex:1">担当別ガイド</button></div>'+
      '<p class="hint">学習の記録・テストの結果・保存した項目は、この端末のブラウザにだけ保存されます。</p>';
    $('app').innerHTML = html;
  }

  /* ---------- 施設紹介 ----------
     一覧は全施設。歴史・活用・文化財の深掘りは「公開」のものだけ（管理者には草稿も出る）。
     「自分の会場」は端末のブラウザにだけ覚える */
  var FAC_GROUPS = ['レストラン＆パーティ','カフェ','ホテル＆レストラン','キャッスルステイ'];
  var FAC_REGIONS = ['京都','大阪','神戸','東京','横浜'];   // この順に並べる。ほかのエリアは台帳の並び順
  function facPlace(f){ return [f.region, f.district].filter(Boolean).join('・'); }
  function facRegions(all){
    var rs = [];
    all.forEach(function(x){ var g = x.region || 'その他'; if(rs.indexOf(g)===-1){ rs.push(g); } });
    rs.sort(function(a, b){ var i = FAC_REGIONS.indexOf(a), j = FAC_REGIONS.indexOf(b); return (i<0?99:i)-(j<0?99:j); });
    return rs;
  }
  function facAll(){ return (state.data.facilities && state.data.facilities.facilities) || []; }
  function facById(id){ var a = facAll(), i; for(i=0;i<a.length;i++){ if(a[i].id===id){ return a[i]; } } return null; }
  function facLink(url, label, cls){
    return url ? '<a class="'+cls+'" href="'+esc(url)+'" target="_blank" rel="noopener noreferrer">'+label+'</a>' : '';
  }
  function facCardHtml(f){
    var tags = '';
    if(f.draft){ tags += '<span class="tag warn">草稿（管理者だけに表示）</span>'; }
    else if(!f.ready){ tags += '<span class="tag">深掘りは準備中</span>'; }
    if(state.fac.mine===f.id){ tags += '<span class="tag ok">自分の会場</span>'; }
    return '<button type="button" class="fcard'+(state.fac.mine===f.id?' mine':'')+'" data-act="fac" data-id="'+esc(f.id)+'"><b>'+esc(f.name)+'</b>'+
      (f.abbr||facPlace(f) ? '<small>'+(f.abbr ? '<span class="abbr">'+esc(f.abbr)+'</span>' : '')+esc(facPlace(f))+(f.group ? '　／　'+esc(f.group) : '')+'</small>' : '')+
      (f.summary ? '<p>'+esc(f.summary)+'</p>' : '')+
      (tags ? '<span class="tags">'+tags+'</span>' : '')+'</button>';
  }
  function renderFacilities(){
    var f = state.fac.id ? facById(state.fac.id) : null;
    if(f){ renderFacilityDetail(f); return; }
    state.fac.id = '';
    var all = facAll();
    if(!all.length){
      $('app').innerHTML = '<h1 class="page-title">施設紹介</h1><p class="empty">施設の一覧を準備中です。<br><small>台帳の「施設」シートに施設が登録されているかを確認してください。</small></p>';
      return;
    }
    var groups = facRegions(all), html = '';
    if(state.fac.group && groups.indexOf(state.fac.group)===-1){ state.fac.group = ''; }
    html += '<h1 class="page-title">施設紹介</h1><p class="page-sub">運営する会場の歴史・いまの活かし方・歴史的価値を、エリアごと・会場ごとに学べます。</p>'+
      '<label class="search-big" style="margin-bottom:10px"><span class="sr">施設を検索</span>'+ICON_SEARCH+'<input id="fq" type="search" placeholder="会場名・略称・地区で探す（例：FUN）" autocomplete="off"></label>'+
      '<div class="chips" style="padding-top:0">'+chip('fgroup','','すべて', state.fac.group==='')+groups.map(function(g){ return chip('fgroup', g, esc(g), state.fac.group===g); }).join('')+'</div>'+
      '<div id="flist"></div>';
    var st = state.data.facilities.stats;
    if(state.data.user.isAdmin && st){
      html += '<p class="ginfo">【管理者向け】施設 '+st.total+' 件（公開 '+st.published+'／草稿・準備中 '+st.draft+'）。深掘りの中身は、台帳「施設」シートの「状態」を「公開」にすると、学習者にも出ます（AIが調べた草稿は、出典を確認してから公開してください）。</p>';
    }
    html += '<p class="hint">内容は、公式サイトや自治体・文化庁などの公開情報をもとにしています。お客様へのご案内に使う前に、出典で最新の情報を確認してください。</p>';
    $('app').innerHTML = html;
    $('fq').value = state.fac.q || '';
    $('fq').addEventListener('input', function(e){ state.fac.q = e.target.value; renderFacList(); });
    renderFacList();
  }
  // 一覧の中身（エリアごと）。会場名・略称・エリア・地区のどれかに、入力した言葉（大文字小文字・全角半角は区別しない）が含まれるものだけ
  function facNorm(t){ return String(t||'').normalize('NFKC').toLowerCase().replace(/\s+/g,''); }
  function renderFacList(){
    var all = facAll(), q = facNorm(state.fac.q), html = '';
    var groups = facRegions(all);
    function hit(x){ return !q || facNorm([x.name, x.abbr, x.region, x.district].join(' ')).indexOf(q)!==-1; }
    var mine = state.fac.mine && facById(state.fac.mine);
    if(mine && hit(mine) && (!state.fac.group || state.fac.group===(mine.region||'その他'))){
      html += '<p class="fgroup">自分の会場</p>'+facCardHtml(mine);
    } else { mine = null; }
    groups.forEach(function(g){
      if(state.fac.group && state.fac.group!==g){ return; }
      var list = all.filter(function(x){ return (x.region||'その他')===g && x!==mine && hit(x); });
      // エリアの中は、レストラン＆パーティ → カフェ → ホテル＆レストランの順（同じ区分は台帳の並び順）
      list.sort(function(a, b){ var i = FAC_GROUPS.indexOf(a.group), j = FAC_GROUPS.indexOf(b.group); return (i<0?99:i)-(j<0?99:j); });
      if(!list.length){ return; }
      html += '<p class="fgroup">'+esc(g)+'（'+list.length+'）</p>'+list.map(facCardHtml).join('');
    });
    $('flist').innerHTML = html || '<p class="empty">見つかりませんでした。<br>会場名・略称（例：FUN、AKG）・エリア・地区（例：東山）でお試しください。</p>';
  }
  function renderFacilityDetail(f){
    var isMine = state.fac.mine===f.id;
    var html = '<button type="button" class="fback" data-act="facback">‹ 施設の一覧へ</button>'+
      '<h1 class="page-title">'+esc(f.name)+'</h1>'+
      (f.abbr||facPlace(f) ? '<p class="page-sub" style="margin-bottom:4px">'+(f.abbr ? '<span class="abbr">'+esc(f.abbr)+'</span>' : '')+esc(facPlace(f))+'</p>' : '')+
      '<p class="page-sub">'+esc([f.group, f.area].filter(Boolean).join('　／　'))+'</p>';
    if(f.draft){
      var notes = String(f.note||'').split('\n').filter(function(s){ return s.trim(); });
      html += '<div class="fnote">【草稿】AIが公開情報から作った下書きです（管理者だけに表示しています）。出典を確認して、台帳「施設」シートの「状態」を「公開」にすると、学習者にも出ます。</div>'+
        (notes.length ? '<details class="fnote"><summary>要確認メモ（'+notes.length+'件）をひらく</summary><ul>'+notes.map(function(n){ return '<li>'+esc(n)+'</li>'; }).join('')+'</ul></details>' : '');
    }
    if(f.ready || f.draft){
      if(f.summary){ html += '<p style="margin:10px 2px 0;font-size:15px;line-height:1.8">'+esc(f.summary)+'</p>'; }
    }
    var acts = facLink(f.url, '公式サイトを開く ↗', 'btn')+

  function copyText(text){
    return new Promise(function(resolve){
      try{
        if(navigator.clipboard && navigator.clipboard.writeText){ navigator.clipboard.writeText(text).then(function(){ resolve(true); }, function(){ resolve(fallbackCopy(text)); }); return; }
      }catch(e){}
      resolve(fallbackCopy(text));
    });
  }
  function fallbackCopy(text){
    try{
      var ta = document.createElement('textarea'); ta.value = text; ta.setAttribute('readonly','');
      ta.style.position = 'fixed'; ta.style.opacity = '0'; document.body.appendChild(ta); ta.select();
      var ok = document.execCommand('copy'); document.body.removeChild(ta); return !!ok;
    }catch(e){ return false; }
  }

  function rolePass(roles){ var pos = mePos(); return !(state.mine && pos) || !roles.length || roles.indexOf(pos)!==-1; }
  function haystack(p){
    return norm([p.action,p.moment,p.stage,p.places.join(' '),p.lines.map(function(l){return l.text;}).join(' ')].join(' '));
  }
  function searchProcedures(){
    var terms = norm(state.pq).split(/\s+/).filter(Boolean), out = [], pos = mePos();
    meSet().procedures.forEach(function(p, i){
      if(state.pstage && p.stage!==state.pstage) return;
      if(state.mine && pos && p.roles.indexOf(pos)===-1) return;
      var h = haystack(p), score = 0, ok = true;
      for(var k=0;k<terms.length;k++){
        if(h.indexOf(terms[k])===-1){ ok=false; break; }
        if(norm(p.action).indexOf(terms[k])!==-1){ score += 3; }
      }
      if(ok){ out.push({p:p, score:score, i:i}); }
    });
    if(terms.length){ out.sort(function(a,b){ return b.score-a.score || a.i-b.i; }); }
    return {items:out.map(function(x){return x.p;}), terms:terms};
  }
  function hl(text, terms){
    var s = esc(text);
    terms.forEach(function(t){
      if(!t) return;
      var re = new RegExp(esc(t).replace(/[.*+?^${}()|[\]\\]/g,'\\$&'),'gi');
      s = s.replace(re, function(m){ return '<mark>'+m+'</mark>'; });
    });
    return s;
  }
  function procCard(p, terms){

    var shown = expanded ? lines : lines.slice(0,3);
    var meta = [p.stage,p.moment].filter(Boolean).join('・') + (p.places.length===1 ? ' ／ '+p.places[0] : '');
    var vids = (p.videoIds||[]).map(function(id){
      return '<button type="button" data-act="open" data-id="'+esc(id)+'">'+ICON_PLAY+esc(state.titles[id]||'動画')+'</button>';
    }).join('');
    var more = (!expanded && lines.length>3) ? '<button type="button" class="more" data-act="ptoggle" data-id="'+esc(key)+'">残り '+(lines.length-3)+' 件を見る '+ICON_DOWN+'</button>' : '';
    var less = (expanded && lines.length>3 && !terms.length) ? '<button type="button" class="more" data-act="ptoggle" data-id="'+esc(key)+'">たたむ '+ICON_UP+'</button>' : '';
    return '<article class="card pcard"><div class="card-in"><p class="p-meta">'+esc(meta)+'</p><h3>'+hl(p.action,terms)+'</h3>'+
      (p.roles.length?'<p class="p-who">担当：'+esc(p.roles.join('・'))+'</p>':'')+
      '<ul class="p-lines">'+shown.map(function(l){

      }).join('')+'</ul>'+(vids?'<div class="vbtns">'+vids+'</div>':'')+'</div>'+more+less+'</article>';
  }
  function renderResults(){
    var r = searchProcedures(), total = r.items.length, shown = r.items.slice(0, state.plimit);

    if(!svc || svc.status!=='ok'){
      $('app').innerHTML = head+'<p class="empty">'+(svc && svc.status==='pending'
        ? 'このサービスのガイドは準備中です。<br><small>台帳の「可視化_」で始まるシートで、可視化まとめへのアクセスが許可されているかを確認してください。</small>'
        : (svc ? '読み込めませんでした。時間をおいて再読み込みしてください。' : '担当別ガイドは準備中です。'))+'</p>';
      return;
    }
    var stages = [];
    svc.items.forEach(function(it){ if(blockOf(it) && it.timeline && stages.indexOf(it.timeline)===-1){ stages.push(it.timeline); } });
    if(state.g.stage && stages.indexOf(state.g.stage)===-1){ state.g.stage = ''; }
    var modeSeg = '<div class="seg" role="group" aria-label="対応の種類">'+
      '<button type="button" data-act="gmode" data-v="hm" aria-pressed="'+(state.g.mode==='hm')+'">HM標準</button>'+
      '<button type="button" data-act="gmode" data-v="vip" aria-pressed="'+(state.g.mode==='vip')+'">VIP対応</button></div>';
    $('app').innerHTML = head + '<div class="finder">'+modeSeg+
      '<label class="search-big" style="margin-top:12px"><span class="sr">ガイドの中を検索</span>'+ICON_SEARCH+
      '<input id="gq" type="search" placeholder="例：クローク、乾杯、白手袋" autocomplete="off" enterkeyhint="search"></label>'+
      '<div class="chips">'+mineChip()+chip('gstage','','すべての時間', state.g.stage==='')+stages.map(function(s){ return chip('gstage', s, esc(s), state.g.stage===s); }).join('')+'</div></div>'+
      guideInfo(svc)+
      '<div class="row" style="align-items:center;justify-content:space-between;margin:8px 0 0"><p class="count" id="gcount" style="margin:0"></p>'+
      '<button type="button" class="chip" id="gall" data-act="gall" aria-pressed="'+state.g.allOpen+'">すべて開く</button></div>'+
      '<div id="glist"></div>'+
      '<p class="hint">担当はマスター表の担当列がもとです。「担当 暫定」は割り当てを確認中、「確認中」は元資料に書きかけの記載がある項目です。</p>';
    $('gq').value = state.g.q;
    $('gq').addEventListener('input', function(e){ state.g.q = e.target.value; renderGuideList(); });
    $('gq').addEventListener('change', function(e){ addRecentQ(e.target.value); });
    renderGuideList();
  }
  function guideHay(it){
    var b = blockOf(it);
    return norm([it.timeline, it.section, it.rule, b.action, b.moves, b.detail, b.phrase||'', b.check].join(' '));
  }
  /* 1番上に目立たせる一文は「チェックポイント → 詳細 → サービスの動き」の順で選ぶ */
  function guideParts(it){
    var b = blockOf(it), defs = [['check','チェックポイント'],['detail','詳細'],['moves','サービスの動き'],['phrase','文言例']];
    var key = null, rest = [];
    defs.forEach(function(d){
      if(d[0]==='phrase' && state.g.mode==='vip'){ return; }
      var text = b[d[0]]; if(!text){ return; }
      if(!key && d[0]!=='phrase'){ key = {label:d[1], text:text}; } else { rest.push({label:d[1], text:text, cls:d[0]}); }
    });
    var order = {moves:0, detail:1, phrase:2, check:3};
    rest.sort(function(a,c){ return order[a.cls]-order[c.cls]; });
    return {key:key, rest:rest, rule:it.rule};
  }
  function guideCard(it, svc, terms, shown){
    var b = blockOf(it), parts = guideParts(it);
    var more = parts.rest.length>0 || !!parts.rule;
    var open = !more || state.g.allOpen || state.g.open[it.id] || terms.length>0;
    var tags = (it.provisional ? '<span class="tag warn">担当 暫定</span>' : '')+(it.draft ? '<span class="tag warn">確認中</span>' : '');
    var who = !it.roles.length ? '担当未定' : (it.roles.length===svc.positions.length ? '全員' : it.roles.join('・'));
    var vids = (it.videoIds||[]).map(function(id){
      return '<button type="button" data-act="open" data-id="'+esc(id)+'">'+ICON_PLAY+esc(state.titles[id]||'動画')+'</button>';
    }).join('');
    var keyHtml = parts.key ? '<div class="gkey'+(open?'':' clamp')+'"><span class="glabel">'+parts.key.label+'</span><p>'+hl(parts.key.text,terms)+'</p></div>' : '';
    var restHtml = '';
    if(open){
      restHtml = parts.rest.map(function(r){
        return '<div class="gblk'+(r.cls==='phrase'?' phrase':'')+'"><span class="glabel">'+r.label+'</span><p>'+hl(r.text,terms)+'</p></div>';
      }).join('')+(parts.rule ? '<p class="grule"><b>統一ルール</b>　'+hl(parts.rule,terms)+'</p>' : '');
    }
    var toggle = (more && !state.g.allOpen && !terms.length)
      ? '<button type="button" class="more" data-act="gtoggle" data-id="'+esc(it.id)+'" aria-expanded="'+open+'">'+(open?'たたむ '+ICON_UP:'くわしく見る '+ICON_DOWN)+'</button>' : '';
    var faved = !!state.fav[svc.key+':'+it.id];
    return '<article class="card gcard"><div class="card-in"><div class="g-top"><div class="g-tags">'+tags+'</div>'+
      '<button type="button" class="star" data-act="gfav" data-id="'+esc(it.id)+'" aria-pressed="'+faved+'" aria-label="'+(faved?'保存を外す':'あとで見る項目として保存')+'">'+(faved?'★':'☆')+'</button></div>'+
      '<h3>'+hl(b.action,terms)+'</h3><p class="g-who">担当：'+esc(who)+'</p>'+keyHtml+figuresHtml(it, svc, shown)+restHtml+
      (vids?'<div class="vbtns">'+vids+'</div>':'')+'</div>'+toggle+'</article>';
  }
  function renderGuideList(){
    var svc = guideSvc(); if(!svc || svc.status!=='ok' || !$('glist')){ return; }
    var pos = mePos(), terms = norm(state.g.q).split(/\s+/).filter(Boolean);
    var items = svc.items.filter(function(it){
      if(!blockOf(it)){ return false; }
      if(state.mine && pos && it.roles.indexOf(pos)===-1){ return false; }
      if(state.g.stage && it.timeline!==state.g.stage){ return false; }
      if(terms.length){
        var h = guideHay(it);
        for(var k=0;k<terms.length;k++){ if(h.indexOf(terms[k])===-1){ return false; } }
      }
      return true;
    });
    $('gcount').textContent = '該当 '+items.length+' 件';
    var html = '', lastT = null, lastS = '', shown = {};
    items.forEach(function(it){
      if(it.timeline!==lastT){ html += '<h2 class="gh">'+esc(it.timeline||'（時間軸なし）')+'</h2>'; lastT = it.timeline; lastS = ''; }
      if(it.section && it.section!==lastS){ html += '<h3 class="gs">'+esc(it.section)+'</h3>'; }
      lastS = it.section;
      html += guideCard(it, svc, terms, shown);
    });
    $('glist').innerHTML = html || '<p class="empty">該当する項目がありません。<br>絞り込みを外すか、言葉を変えてお試しください。</p>';
  }

  /* ---------- 送信前の関所（個人情報・社外に出せない内容・危ない質問） ----------
     規則はサーバー（16_AiGuard.gs）が配る。ここは親切のための先回りで、守りの本体はサーバー側。
     中身は表示せず、見つかった「種類」だけを伝える。GUARD_BEGIN〜END は、サーバー側と同じ判定になることをテストで確かめている */
  /*GUARD_BEGIN*/
  var guardCache = null;
  function guardRules(){
    var rules = state.data && state.data.ai && state.data.ai.guard;
    if(!rules){ return []; }
    if(!guardCache || guardCache.src!==rules){
      guardCache = {src:rules, list:rules.map(function(r){ return {id:r.id, on:r.on, label:r.label, tip:r.tip, re:new RegExp(r.src, r.flags)}; })};
    }
    return guardCache.list;
  }
  function guardCheck(text){
    var plain = String(text||'').normalize('NFKC').replace(/[​-‍⁠﻿]/g,'').replace(/(\d)[ー‐‑–—―−]+(?=\d)/g,'$1-');
    var digits = plain.replace(/(\d)[\s\-.]+(?=\d)/g,'$1');
    return guardRules().filter(function(r){ return r.re.test(r.on==='digits' ? digits : plain); });
  }
  /*GUARD_END*/
  function guardMessage(hits){
    var tips = [];
    hits.forEach(function(h){ if(tips.indexOf(h.tip)===-1){ tips.push(h.tip); } });
    return {title:'送信をストップしました', body:'含まれていたもの：'+hits.map(function(h){ return h.label; }).join('、')+'\n'+tips.join('\n')+'\n書き換えてから、もう一度送ってください。'};
  }
  function guardBoxHtml(hits){
    var m = guardMessage(hits);
    return '<b>'+esc(m.title)+'</b>'+esc(m.body);
  }
  function showGuard(boxId, btnId, hits){
    var box = $(boxId), btn = btnId ? $(btnId) : null;
    if(box){ box.hidden = !hits.length; box.innerHTML = hits.length ? guardBoxHtml(hits) : ''; }
    if(btn){ btn.disabled = !!hits.length; }
  }

  /* ---------- AIに聞く ----------
     まずマニュアル（手順・担当別ガイド）から答える。載っていない一般的な質問は、「一般的な説明」と分けて答える。
     やり取りは画面の中だけに置き、どこにも保存しない */
  var ASK_EXAMPLES = {
    res:['ハンドクリームは使ってもいい？','離席されたお客様が戻られたときは？','ソムリエとは？'],
    banquet:['親族紹介の順番は？','乾杯酒を注ぐ順番は？','ご祝儀とは？']
  };
  function askItemHtml(it, i){
    var h = '<div class="bubble q">'+esc(it.q)+'</div>';
    if(it.status==='busy'){ return h+'<div class="bubble a"><span class="dots3"><i></i><i></i><i></i></span> 探しています…</div>'; }
    if(it.status==='err'){ return h+'<div class="bubble a err">'+esc(it.message)+'</div>'; }
    if(it.type==='decline'){ return h+'<div class="bubble a nf"><p>'+esc(it.message)+'</p></div>'; }
    var src = (it.sources||[]).map(function(s, k){
      return '<button type="button" class="chip" data-act="asrc" data-i="'+i+'" data-s="'+k+'">'+esc(s.title)+'</button>';
    }).join('');
    var body = '';
    if(it.manual){
      body += '<div class="part"><span class="part-l man">マニュアルの内容</span><p>'+esc(it.manual)+'</p>'+
        (src ? '<span class="srcs-l">もとになった手順（タップで開く）</span><div class="srcs">'+src+'</div>' : '')+'</div>';
    }
    if(it.general){
      body += '<div class="part"><span class="part-l gen">一般的な説明</span>'+
        (it.manual ? '' : '<p class="gen-note" style="margin:0 0 6px!important">マニュアルには載っていないため、一般的な知識からお答えします。</p>')+
        '<p>'+esc(it.general)+'</p>'+
        '<p class="gen-note">これは一般的な説明です。会社の基準や、会場ごとのルールとは違うことがあります。実際の対応は、マニュアルやOJT担当に確認してください。</p></div>';
    }
    return h+'<div class="bubble a'+(it.manual?'':' gen')+'">'+body+'<p class="ai-foot">AIの答えは目安です。大事なことは、元の手順で確かめましょう。</p></div>';
  }
  function renderAsk(){
    var set = meSet(), items = state.ask.items;
    var ex = (ASK_EXAMPLES[set.key]||[]).map(function(q){ return '<button type="button" class="chip" data-act="askex" data-q="'+esc(q)+'">'+esc(q)+'</button>'; }).join('');
    $('app').innerHTML = '<h1 class="page-title">AIに聞く</h1><p class="page-sub">'+esc(shortLabel(set))+'のマニュアルから答えます。載っていないことは、「一般的な説明」として分けてお答えします。</p>'+
      '<div class="ai-note">入力した内容は、AI（Google Gemini）に送られます。お客様・従業員の個人情報や、社外に出せないことは入力しないでください（電話番号・メール・住所・名前などは、自動で送信をストップします）。</div>'+
      (items.length ? '' : '<p class="mlabel" style="margin-top:18px">こんなことを聞けます</p><div class="chips" style="padding-top:0;flex-wrap:wrap;overflow:visible;margin:0;padding-left:0;padding-right:0">'+ex+'</div>')+
      '<div id="asklist">'+items.map(askItemHtml).join('')+'</div>'+
      '<div class="composer"><div class="guard-box" id="askGuard" role="alert" hidden></div><div class="composer-in"><textarea id="askq" rows="1" maxlength="300" placeholder="わからないことを入力（例：ワインの量は？）" enterkeyhint="send"></textarea>'+
      '<button type="button" class="send" id="askSend" data-act="asksend"'+(state.ask.busy?' disabled':'')+'>送る</button></div></div>';
    var ta = $('askq'); ta.value = state.ask.draft || '';
    function fit(){ ta.style.height = 'auto'; ta.style.height = Math.min(ta.scrollHeight, 120)+'px'; }
    function check(){ showGuard('askGuard', state.ask.busy ? '' : 'askSend', guardCheck(ta.value)); }
    ta.addEventListener('input', function(){ state.ask.draft = ta.value; fit(); check(); });
    fit(); check();
    if(items.length){ window.scrollTo(0, document.body.scrollHeight); }
  }
  function askSend(){
    var ta = $('askq'), q = ta ? ta.value.trim() : '';
    if(!q || state.ask.busy){ return; }
    var hits = guardCheck(q);
    if(hits.length){ showGuard('askGuard', 'askSend', hits); return; }  // 送らない。入力はそのまま残し、直してもらう
    var it = {q:q, status:'busy'};
    state.ask.items.push(it); state.ask.busy = true; state.ask.draft = '';
    markActive(); renderAsk();
    api.askFaq(q, meSet().key).then(function(r){
      if(r && r.ok){ it.status = 'ok'; it.type = r.type; it.manual = r.manual||''; it.general = r.general||''; it.sources = r.sources||[]; it.message = r.message||''; }
      else if(r && r.code==='guard'){
        /* サーバーが止めた：質問は画面に残さず、入力欄へ戻す */
        state.ask.items.pop(); state.ask.draft = q; it.status = 'guard'; it.message = r.message;
      }
      else { it.status = 'err'; it.message = (r && r.message) || '答えを作れませんでした。'; }
    }).catch(function(){
      it.status = 'err'; it.message = '通信に失敗しました。時間をおいて、もう一度お試しください。';
    }).then(function(){
      state.ask.busy = false;
      if(state.view==='ask'){
        renderAsk();
        if(it.status==='guard'){ var gb = $('askGuard'); if(gb){ gb.hidden = false; gb.textContent = it.message; } }
      }
    });
  }
  function openSource(s){
    state.mine = false;
    if(s.kind==='facility'){ openFacility(s.itemId); return; }
    if(s.kind==='guide'){ state.g.q = s.title; state.g.stage = ''; state.g.mode = 'hm'; saveG(); showView('guide'); }
    else { state.pq = s.title; state.pstage = ''; state.plimit = 20; showView('procedures'); }
  }

  /* ---------- 確認テスト ---------- */
  var Q_TYPE = {tf:'○×', choice:'選択', text:'記述'};
  function quizAll(){ return (state.data.quiz && state.data.quiz.questions) || []; }
  function quizById(id){ var a = quizAll(), i; for(i=0;i<a.length;i++){ if(a[i].id===id){ return a[i]; } } return null; }
  function quizPool(){
    var set = meSet(), pos = mePos();
    return quizAll().filter(function(q){ return q.service===set.key && (!pos || !q.roles.length || q.roles.indexOf(pos)!==-1); });
  }
  function shuffle(a){
    var b = a.slice(), i, j, t;
    for(i=b.length-1;i>0;i--){ j = Math.floor(Math.random()*(i+1)); t=b[i]; b[i]=b[j]; b[j]=t; }
    return b;
  }
  function quizCfg(){ var z = state.data.quiz || {}; return {pass: z.passPercent || 90, size: z.size || 10}; }
  function quizNeed(n){ return Math.ceil(quizCfg().pass * n / 100); }
  function quizScope(){ return meSet().key+'|'+(mePos()||'all'); }
  function qMark(q){
    var r = state.qz.res[q.id];
    return r===true ? '<span class="qmark ok">✓ 正解</span>' : (r===false ? '<span class="qmark ng">✗ 要復習</span>' : '<span class="qmark">未回答</span>');
  }

  function renderQuiz(){
    if(state.qz.run){ renderQuizRun(); return; }
    document.body.classList.remove('running');
    var pool = quizPool(), cfg = quizCfg(), n = Math.min(cfg.size, pool.length), rec = state.qz.pass[quizScope()];
    var done = pool.filter(function(q){ return state.qz.res[q.id]!==undefined; }).length;
    var ok = pool.filter(function(q){ return state.qz.res[q.id]===true; }).length;
    var wrong = pool.filter(function(q){ return state.qz.res[q.id]===false; });
    var st = state.data.quiz && state.data.quiz.stats;
    var adminInfo = (state.data.user.isAdmin && st) ? '<p class="ginfo">【管理者向け】設問 '+st.total+' 件（公開 '+st.published+'／草稿 '+st.draft+'）／読み込めなかった設問 '+st.invalid+
      '。草稿は管理者にだけ表示されます。公開するには、台帳の「設問」シートの状態を「公開」にしてください。</p>' : '';
    var head = '<h1 class="page-title">確認テスト</h1><p class="page-sub">'+esc(meText())+' の設問から、毎回ランダムに出ます。</p>';
    if(!pool.length){ $('app').innerHTML = head+'<p class="empty">この担当の設問は、まだありません。</p>'; return; }
    var status = rec ? (rec.passed ? '<span class="tag ok">✓ 合格済み '+esc(rec.passedAt)+'</span>' : '<span class="tag">未合格</span>') : '';
    $('app').innerHTML = head+adminInfo+
      '<div class="hero"><p class="sub">合格ライン</p><p class="big">正答率 '+cfg.pass+'%</p>'+
      '<p class="sub">今回は '+n+'問中 '+quizNeed(n)+'問以上の正解で合格です</p>'+
      '<button type="button" class="btn block" data-act="qstart">テストを始める（'+n+'問）</button></div>'+
      '<div class="stat"><div><b>'+pool.length+'</b><span>設問数</span></div><div><b>'+ok+'</b><span>正解した設問</span></div>'+
      '<div><b>'+(rec?rec.score+'/'+rec.n:'―')+'</b><span>直近の結果</span></div></div>'+
      (status?'<p style="margin:0 2px">'+status+'</p>':'')+
      (wrong.length?'<div class="row"><button type="button" class="btn" data-act="qretry" style="flex:1">間違えた '+wrong.length+'問だけやり直す</button></div>':'')+
      '<details class="qd"><summary>設問の一覧（'+pool.length+'）<span style="color:var(--subtext);font-weight:400">'+done+'問 回答済み</span></summary><ul class="qlist">'+pool.map(function(q){
        return '<li>'+qMark(q)+'<button type="button" data-act="qone" data-id="'+esc(q.id)+'">'+esc(q.text)+'</button>'+(q.draft?' <span class="tag warn">草稿</span>':'')+'</li>';
      }).join('')+'</ul></details>'+
      '<p class="hint">成績は評価には使われません。結果はこの端末のブラウザにだけ保存されます。</p>';
  }

  function quizStart(ids, scored, kind){
    if(!ids.length){ return; }
    var from = state.view==='quiz' ? 'quiz' : state.view;
    state.view = 'quiz'; setTabs('quiz');
    state.qz.run = {from:from, ids:ids, i:0, phase:'ask', sel:null, right:[], wrong:[], order:{}, scored:!!scored, kind:kind||'', scope:quizScope(), done:false, text:''};
    document.body.classList.add('running');
    renderQuizRun(); window.scrollTo(0,0);
  }
  function quizOrder(q){
    var run = state.qz.run;
    if(!run.order[q.id]){ run.order[q.id] = shuffle(q.choices.map(function(c, k){ return k; })); }
    return run.order[q.id];
  }
  function renderQuizRun(){
    var run = state.qz.run, total = run.ids.length;
    document.body.classList.add('running');
    if(run.i>=total){ renderQuizEnd(); return; }
    var q = quizById(run.ids[run.i]);
    if(!q){ run.i++; renderQuizRun(); return; }
    var fb = run.phase==='fb', body = '', dock = '';
    if(q.type==='tf'){
      body = '<div class="qbtns qgrid2">'+[true,false].map(function(v){
        var cls = 'qopt tf';
        if(fb){ if(v===q.answer){ cls += ' ok'; } else if(run.sel===v){ cls += ' ng'; } }
        return '<button type="button" class="'+cls+'" data-act="qans" data-v="'+v+'"'+(fb?' disabled':'')+'>'+(v?'○':'×')+'</button>';
      }).join('')+'</div>';
    } else if(q.type==='choice'){
      body = '<div class="qbtns">'+quizOrder(q).map(function(orig, pos){
        var cls = 'qopt';
        if(fb){ if(orig===q.answer){ cls += ' ok'; } else if(run.sel===orig){ cls += ' ng'; } }
        return '<button type="button" class="'+cls+'" data-act="qans" data-v="'+orig+'"'+(fb?' disabled':'')+'><span class="lt">'+String.fromCharCode(65+pos)+'</span><span>'+esc(q.choices[orig])+'</span></button>';
      }).join('')+'</div>';
    } else {
      body = '<textarea id="qa" class="qans" placeholder="自分の言葉で書いてみましょう（書いた内容は保存されません）"'+(fb?' readonly':'')+'></textarea>';
      if(!fb){
        if(run.aiBusy){ dock = '<button type="button" class="btn primary" disabled>AIが判定しています…</button>'; }
        else if(aiOn()){ dock = '<button type="button" class="btn" data-act="qshow">模範解答を見る</button><button type="button" class="btn primary" data-act="qai">AIで判定する</button>'; }
        else { dock = '<button type="button" class="btn primary" data-act="qshow">模範解答を見る</button>'; }
        if(run.aiMsg){ body += '<p class="qexp" style="color:var(--danger);white-space:pre-line">'+esc(run.aiMsg)+'</p>'; }

          body += '<div class="aijudge '+ai.verdict+'"><div class="vd"><span class="ic">'+ic+'</span>AIの判定：'+tt+'</div>'+

        }
        body += '<div class="qbanner info">模範解答</div><p class="qexp">'+esc(q.model)+'</p>'+
          (q.explain?'<p class="qexp"><b>採点の観点</b>　'+esc(q.explain)+'</p>':'');
        if(!run.done){
          body += '<p class="qexp">自分の答えと見比べて、できたかどうかを選んでください。</p>';
          var sugg = run.ai ? run.ai.verdict==='ok' : null;
          dock = '<button type="button" class="btn'+(sugg===false?' primary':'')+'" data-act="qself" data-v="0">もう少し</button><button type="button" class="btn'+(sugg===true?' primary':'')+'" data-act="qself" data-v="1">できた</button>';

      }
      if(q.keyword){ body += '<div class="row"><button type="button" class="btn" data-act="qguide" data-id="'+esc(q.id)+'">担当別ガイドで確認する</button></div>'; }
      if(run.done){ dock = '<button type="button" class="btn primary" data-act="qnext">'+(run.i+1<total?'次の問題へ':'結果を見る')+'</button>'; }

      '<div class="qcard"><span class="qtype">'+Q_TYPE[q.type]+'</span>'+(q.draft?' <span class="tag warn">草稿</span>':'')+'<p class="qtext">'+esc(q.text)+'</p>'+body+'</div>'+
      (dock?'<div class="qdock"><div class="qdock-in">'+dock+'</div></div>':'');

  function quizRecord(q, good){
    var run = state.qz.run;
    state.qz.res[q.id] = good; saveQ(); markActive();
    (good ? run.right : run.wrong).push(q.id);
    buzz(good ? 15 : [30,40,30]);
  }
  function quizAnswer(v){
    var run = state.qz.run, q = quizById(run.ids[run.i]);
    if(!q || run.phase!=='ask'){ return; }
    run.sel = v; run.phase = 'fb'; run.done = true;

  }
  function quizShow(){

  /* 記述のAI判定。結果は「目安」で、できた／もう少し は自分で選ぶ */
  function quizAi(){
    var run = state.qz.run, q = run && quizById(run.ids[run.i]), ta = $('qa');
    if(!q || q.type!=='text' || run.aiBusy){ return; }
    run.text = ta ? ta.value : '';
    if(!run.text.trim()){ run.aiMsg = 'まず、自分の言葉で書いてみましょう。'; renderQuizRun(); return; }
    var hits = guardCheck(run.text);
    if(hits.length){ var gm = guardMessage(hits); run.aiMsg = gm.title+'。\n'+gm.body; renderQuizRun(); return; }  // AIには送らない
    run.aiMsg = ''; run.aiBusy = true; renderQuizRun();
    api.gradeAnswer(q.id, run.text.trim()).then(function(r){
      if(state.qz.run!==run || run.ids[run.i]!==q.id){ return; }
      run.aiBusy = false;
      if(r && r.ok){ run.ai = r; run.phase = 'fb'; run.sel = null; run.done = false; window.scrollTo(0,0); }
      else if(r && r.code==='guard'){ run.aiMsg = r.message; }
      else { run.aiMsg = ((r && r.message) || 'AIで判定できませんでした。')+' 模範解答を見て、自分で判定できます。'; }
      renderQuizRun();
    }).catch(function(){
      if(state.qz.run!==run){ return; }
      run.aiBusy = false; run.aiMsg = '通信に失敗しました。模範解答を見て、自分で判定できます。'; renderQuizRun();
    });
  }
  function quizSelf(good){
    var run = state.qz.run, q = quizById(run.ids[run.i]);

    renderQuizRun();
  }
  function quizNext(){
    var run = state.qz.run;
    run.i++; run.phase = 'ask'; run.sel = null; run.done = false; run.text = ''; run.ai = null; run.aiBusy = false; run.aiMsg = '';
    renderQuizRun(); window.scrollTo(0,0);
  }
  function today(){ var d = new Date(); return d.getFullYear()+'-'+('0'+(d.getMonth()+1)).slice(-2)+'-'+('0'+d.getDate()).slice(-2); }
  function renderQuizEnd(){
    var run = state.qz.run, n = run.ids.length, r = run.right.length, verdict = '', passed = false;
    if(run.scored){
      var need = quizNeed(n), prev = state.qz.pass[run.scope] || {};
      passed = r >= need;
      if(!run.saved){
        state.qz.pass[run.scope] = {score:r, n:n, at:today(), passed: !!(prev.passed || passed), passedAt: passed ? today() : (prev.passedAt || '')};
        saveP(); run.saved = true;
      }
      verdict = '<p class="verdict '+(passed?'pass':'fail')+'">'+(passed?'合格です！おめでとうございます':'あと '+(need-r)+'問で合格です')+'</p>'+
        '<p class="vsub">'+(passed ? '合格ライン '+quizCfg().pass+'%を超えました。' : '惜しい！下の設問を見直して、もう一度チャレンジしましょう。')+'（'+n+'問中 '+need+'問以上で合格）</p>';
    } else if(run.kind==='daily'){
      if(!run.saved){
        state.daily = {date:today(), n:(state.daily.date===today() ? state.daily.n : 0)+1}; lsSet('a01-daily', state.daily); run.saved = true;
      }
      verdict = '<p class="verdict pass">今日の3問、完了です</p><p class="vsub">'+(r===n?'全問正解！':'続けるほど、身についていきます。')+'</p>';
    }
    var pct = n ? r/n : 0, C = 2*Math.PI*52;
    var ring = '<svg class="ring'+(passed?' pass':'')+'" width="140" height="140" viewBox="0 0 140 140" role="img" aria-label="'+r+'問正解"><circle class="tr" cx="70" cy="70" r="52"/>'+
      '<circle class="pr" cx="70" cy="70" r="52" stroke-dasharray="'+C.toFixed(1)+'" stroke-dashoffset="'+(C*(1-pct)).toFixed(1)+'"'+(run.scored?'':' style="stroke:var(--primary)"')+'/>'+
      '<text x="70" y="78" text-anchor="middle" font-size="32">'+r+'/'+n+'</text></svg>';
    var wrongHtml = run.wrong.length ? '<details class="qd" open><summary>もう一度確認したい設問（'+run.wrong.length+'）</summary><ul class="qlist">'+run.wrong.map(function(id){
      var q = quizById(id);
      return q ? '<li><span class="qmark ng">✗</span><div><button type="button" data-act="qguide" data-id="'+esc(q.id)+'">'+esc(q.text)+'</button>'+
        '<p class="qexp" style="margin:4px 0 0;font-size:13px">'+esc(q.type==='text' ? q.model : (q.explain||''))+'</p></div></li>' : '';
    }).join('')+'</ul></details>' : '<p class="qbanner ok"><span class="ic">✓</span>全問、できました</p>';
    var confetti = '';
    if(passed || (run.kind==='daily' && r===n)){
      var cols = ['#c9a063','#e8d3a6','#26334d','#b86b77','#7aa58a'];
      for(var ci=0; ci<26; ci++){
        confetti += '<i style="left:'+Math.round(Math.random()*100)+'%;background:'+cols[ci%cols.length]+';animation-delay:'+(Math.random()*0.6).toFixed(2)+'s;animation-duration:'+(1.6+Math.random()*1.4).toFixed(2)+'s"></i>';
      }
      buzz([20,30,20,30,40]);
    }
    $('app').innerHTML = (confetti?'<div class="confetti" aria-hidden="true">'+confetti+'</div>':'')+'<div class="qtop"><span class="qcount" style="flex:1">結果</span></div>'+ring+verdict+wrongHtml+
      '<div class="qdock"><div class="qdock-in">'+(run.wrong.length?'<button type="button" class="btn" data-act="qredo">間違いをもう一度</button>':'')+
      '<button type="button" class="btn primary" data-act="qquit">一覧に戻る</button></div></div>';
    window.scrollTo(0,0);
  }

  function matches(g,v){

    if(idx<0) return;
    state.current = id;
    var g = all[idx].g, v = all[idx].v;
    state.recent.v = [id].concat((state.recent.v||[]).filter(function(x){ return x!==id; })).slice(0,4); lsSet('a01-recent', state.recent);

      case 'fgroup': state.fac.group = v; renderFacilities(); break;
      case 'fmine': state.fac.mine = state.fac.mine===id ? '' : id; lsSet('a01-venue', {id:state.fac.mine}); renderFacilities(); break;
      case 'fask': var fq = facById(id); if(fq){ state.ask.draft = fq.name+'の歴史と見どころを教えて'; showView('ask'); } break;
      case 'fcopy': var tk = $('ftalk'+(t.getAttribute('data-i')||'0')); if(tk){ copyText(tk.textContent).then(function(ok){ t.textContent = ok ? 'コピーしました ✓' : 'コピーできませんでした。長押しで選んでコピーしてください'; }); } break;
      case 'asrc': var ai_ = state.ask.items[parseInt(t.getAttribute('data-i'),10)]; if(ai_ && ai_.sources){ openSource(ai_.sources[parseInt(t.getAttribute('data-s'),10)]); } break;
    }
  });
  $('dlg').addEventListener('click', function(e){ if(e.target===$('dlg')){ $('dlg').close(); } });
  $('dlg').addEventListener('close', function(){ $('player').innerHTML = ''; });
  $('meDlg').addEventListener('click', function(e){ if(e.target===$('meDlg')){ closeMe(); } });
  $('meDlg').addEventListener('cancel', function(){ state.me.set = true; saveMe(); updateHeader(); setTimeout(render, 0); });

  readEdition(function(ed){
    EDITION = ed; loadPrefs();
    api.getBootstrap(ed).then(init).catch(showError);
  });
})();
</script>
